; PlatformIO — T-Weigh (plan)
; board = esp32dev
; framework = arduino

[env:t-weigh]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; koloni-243: SHT41 kütüphanesiz (Wire); DS18B20 giriş sıcaklığı için:
lib_deps =
  paulstoffregen/OneWire
  milesburton/DallasTemperature

; koloni önizleme: donanım düzeni derleme bayrağı (src/duzen.h). TEST EDİLMEDİ.
[env:t-weigh-yedek]
extends = env:t-weigh
build_flags = -DDUZEN=2
