<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SüperArı · Notlar</title>
  <link rel="stylesheet" href="panels.css" />
  <style>
    .notes-page { max-width: 720px; margin: 0 auto; padding: 1rem; }
    .notes-card { background:#fff; border:1px solid #e4e6ea; border-radius:14px; padding:1rem; margin-bottom:1rem; }
    .notes-card h2 { margin:0 0 .65rem; }
    .notes-card li { margin:.5rem 0; line-height:1.45; }
  </style>
</head>
<body>
  <main class="notes-page wrap">
    <div class="nav">
      <a class="chip" href="ana.html">← Ana</a>
      <a class="chip" href="ayarlar.html">Ayarlar</a>
    </div>
    <div class="brand">
      <div class="brand-badge">🐝</div>
      <div><h1>SüperArı</h1><p>Notlar</p></div>
    </div>
    <h1 style="margin:.5rem 0 1rem;">Notlar</h1>
    <div id="notes-list"></div>
  </main>
  <script src="ana-notes.js"></script>
  <script>
    (function () {
      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      };
      var notes = window.SuperAriNotes.ensureDefault();
      document.getElementById('notes-list').innerHTML = notes.map(function (n) {
        return '<article class="notes-card"><h2>' + esc(n.title) + '</h2><ul>' +
          (n.body || []).map(function (line) { return '<li>' + esc(line) + '</li>'; }).join('') +
          '</ul></article>';
      }).join('');
    })();
  </script>
</body>
</html>
