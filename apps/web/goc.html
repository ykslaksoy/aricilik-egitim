<style>
  .hv-list{display:grid;gap:6px;max-height:260px;overflow:auto;border:1px solid var(--border,#eadfbe);border-radius:12px;padding:8px;background:#fff;}
  .form-grid .hv-item{display:flex !important;flex-direction:row !important;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--text,#2b2410);}
  .form-grid .hv-item input{width:18px !important;height:18px;flex:0 0 auto;padding:0;margin:0;}
  .hv-item small{margin-left:auto;color:var(--muted);font-weight:600;white-space:nowrap;}
  .hv-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;}
  .hv-top button{font:inherit;font-size:12px;font-weight:750;border:1px solid var(--border,#eadfbe);background:#fff;border-radius:9px;padding:4px 8px;color:#5c4813;}
  .chk{display:flex !important;flex-direction:row !important;align-items:flex-start;gap:8px;font-weight:600 !important;}
  .chk input{width:18px !important;height:18px;flex:0 0 auto;margin-top:1px;}
  .demo-chip{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:#e7f5ff;color:#1864ab;margin-left:4px;}
</style>

<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <div data-bk-clock aria-live="polite">9:41</div>
    <div class="status-icons"><span>●●●●</span><span>Wi‑Fi</span><span>▮</span></div>
  </div>
  <div class="screen">
    <section class="card-block">
      <h2>Yeni göç kaydı</h2>
      <form class="form-grid" id="gocForm" novalidate>
        <label>Nereden
          <select id="gFrom"></select>
        </label>
        <label>Nereye
          <select id="gTo"></select>
        </label>
        <div class="pair">
          <label>Tarih
            <input type="date" id="gDate" required />
          </label>
          <label>Mesafe (km)
            <input type="text" id="gKm" inputmode="decimal" placeholder="ör. 120" />
          </label>
        </div>
        <div class="pair">
          <label>Planlanan varış
            <input type="date" id="gVaris" required />
          </label>
          <label>Planlanan ayrılış
            <input type="date" id="gAyrilis" required />
          </label>
        </div>
        <label>Sebep
          <select id="gReason"></select>
        </label>
        <div>
          <div class="hv-top"><span id="hvCount">Kovanlar</span><button type="button" id="hvAll">Tümünü seç</button></div>
          <div class="hv-list" id="hvList" style="margin-top:6px;"></div>
        </div>
        <label>Not
          <input type="text" id="gNote" maxlength="160" placeholder="ör. Gece yüklendi, kamyon ile" />
        </label>
        <label class="chk"><input type="checkbox" id="gTasks" checked /> <span>Göç sonrası kontrol görevleri oluştur (ertesi gün ve 7. gün)</span></label>
        <button type="submit" class="btn" id="gSave">Göçü kaydet ve kovanları taşı</button>
        <p class="form-msg" id="gMsg" aria-live="polite"></p>
      </form>
    </section>
    <section class="card-block" id="planCard">
      <h2>Konaklama planı</h2>
      <div id="planList"></div>
    </section>
    <section class="card-block">
      <h2 id="histTitle">Göç geçmişi</h2>
      <div id="histList"></div>
    </section>
    <p class="hint" id="modeHint"></p>
    <nav class="bk-links" aria-label="Bağlantılar"><a href="ariliklar.html">📍 Arılıklar</a></nav>
  </div>
  <nav class="tabbar" aria-label="Alt menü">

  <script>
(function () {
  var D = window.SuperAriDemo, G = D.goc;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  function fmt(d) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? Number(m[3]) + ' ' + AY[Number(m[2]) - 1] + ' ' + m[1] : (d || ''); }
  function live() { try { return localStorage.getItem('superari.workMode') === 'live'; } catch (e) { return false; } }
  var q = new URLSearchParams(location.search), apFilter = q.get('ap') || q.get('from') || q.get('apiary') || ''; /* apiary = Bakım ile ortak kapsam */
  function aps() { try { return D.loadApiaries() || []; } catch (e) { return []; } }
  function msg(t, err) { var m = $('gMsg'); m.textContent = t || ''; m.className = 'form-msg' + (err ? ' err' : ''); }
  function fillSelects() {
    var list = aps(), from = $('gFrom').value || apFilter || (list[0] && String(list[0].id)) || '';
    $('gFrom').innerHTML = list.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.name) + ' (' + D.hivesForApiary(a.id).length + ' kovan)</option>'; }).join('');
    if (from) $('gFrom').value = from;
    var to = $('gTo').value;
    $('gTo').innerHTML = '<option value="">Hedef arılığı seçin</option>' + list.filter(function (a) { return String(a.id) !== String($('gFrom').value); })
      .map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join('');
    if (to && to !== $('gFrom').value) $('gTo').value = to;
    if (list.length < 2) msg('Göç için en az iki arılık gerekir. Hedef yer için önce Arılıklar’dan yeni arılık ekleyin.', true);
  }
  function fillHives() {
    var hs = $('gFrom').value ? D.hivesForApiary($('gFrom').value) : [];
    $('hvList').innerHTML = hs.map(function (h) {
      return '<label class="hv-item"><input type="checkbox" value="' + esc(h.id) + '"> ' + esc(h.name || ('Kovan ' + h.id)) + (h.strength ? '<small>' + esc(h.strength) + '</small>' : '') + '</label>';
    }).join('') || '<p class="hint" style="margin:0;">Bu arılıkta kovan yok.</p>';
    count();
  }
  function count() {
    var all = $('hvList').querySelectorAll('input'), n = $('hvList').querySelectorAll('input:checked').length;
    $('hvCount').textContent = 'Kovanlar · ' + n + ' / ' + all.length + ' seçili';
    $('hvAll').textContent = n && n === all.length ? 'Seçimi kaldır' : 'Tümünü seç';
  }
  function kmHint() {
    var k = $('gTo').value ? G.airKm($('gFrom').value, $('gTo').value) : null;
    $('gKm').placeholder = k != null ? 'kuş uçuşu ≈ ' + k + ' km' : 'ör. 120';
  }
  function renderHist() {
    var list = apFilter ? G.forApiary(apFilter) : G.list();
    var ap = apFilter ? aps().filter(function (a) { return String(a.id) === String(apFilter); })[0] : null;
    $('histTitle').textContent = ap ? 'Göç geçmişi · ' + ap.name : 'Göç geçmişi';
    $('histList').innerHTML = list.map(function (g) {
      return '<div class="row-item"><div class="left"><div class="title">' + esc(fmt(g.date)) + ' · ' + esc(g.fromName) + ' → ' + esc(g.toName) + (g.demo ? '<span class="demo-chip">Demo</span>' : '') + '</div>' +
        '<div class="meta">' + (g.hiveIds || []).length + ' kovan · ' + esc(G.reasonLabel(g.reason)) + (g.km != null ? ' · ' + String(g.km).replace('.', ',') + ' km' : '') +
        '<br>' + esc((g.hiveNames || []).join(', ')) + (g.note ? '<br>' + esc(g.note) : '') + '</div></div>' +
        '<div class="right"><button type="button" class="del" data-del="' + esc(g.id) + '">Sil</button></div></div>';
    }).join('') || '<p class="hint" style="margin:0;">Henüz göç kaydı yok.</p>';
    if (ap) $('histList').insertAdjacentHTML('beforeend', '<p class="hint" style="margin:8px 0 0;"><a href="goc.html">Tüm göçleri göster</a></p>');
  }
  $('gReason').innerHTML = G.REASONS.map(function (r) { return '<option value="' + r.key + '">' + esc(r.label) + '</option>'; }).join('');
  $('gDate').value = D.records.todayLocal();
  $('modeHint').textContent = live() ? 'Canlı mod · göç kayıtları hedef arılık üzerinden buluta eşitlenir. Kovan geçmişine «Göç» olarak yazılır; Bakım listesinde 7 gün «Göç sonrası kontrol» görünür.' : 'Demo mod · kayıtlar örnek veriye yazılır, buluta gitmez.';
  fillSelects(); fillHives(); kmHint(); renderHist();
  $('gFrom').addEventListener('change', function () { fillSelects(); fillHives(); kmHint(); msg(''); });
  $('gTo').addEventListener('change', function () { kmHint(); msg(''); });
  $('hvList').addEventListener('change', count);
  $('hvAll').addEventListener('click', function () {
    var all = $('hvList').querySelectorAll('input'), n = $('hvList').querySelectorAll('input:checked').length, on = !(n && n === all.length);
    all.forEach(function (i) { i.checked = on; }); count();
  });
  $('gocForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var ids = Array.prototype.map.call($('hvList').querySelectorAll('input:checked'), function (i) { return Number(i.value); });
    /* k160: planlanan varış + ayrılış zorunlu */
    var vV = $('gVaris').value, vA = $('gAyrilis').value;
    if (!vV || !vA) { msg('Planlanan varış ve ayrılış tarihini gir.', true); return; }
    if (vA <= vV) { msg('Ayrılış tarihi varıştan sonra olmalı.', true); return; }
    try {
      var rec = G.add({ fromApiaryId: $('gFrom').value, toApiaryId: $('gTo').value, date: $('gDate').value, hiveIds: ids,
        reason: $('gReason').value, km: $('gKm').value.trim(), note: $('gNote').value, tasks: $('gTasks').checked });
      if (window.SuperAriPlan2) SuperAriPlan2.konSet($('gTo').value, { varis: vV, ayrilis: vA });
      renderPlan();
      msg(rec.hiveIds.length + ' kovan ' + rec.toName + ' arılığına taşındı.' + ($('gTasks').checked ? ' Kontrol görevleri eklendi.' : ''));
      $('gNote').value = ''; $('gKm').value = '';
      fillSelects(); fillHives(); kmHint(); renderHist();
    } catch (err) { msg(err.message || String(err), true); }
  });
  $('histList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]'); if (!b) return;
    if (!confirm('Göç kaydı silinsin mi? Kovanlar geri taşınmaz; gerekirse ters yönde yeni göç kaydı girin.')) return;
    G.remove(b.getAttribute('data-del')); renderHist();
  });
  /* k160: konaklama planı — arılık başına varış/ayrılış (düzenlenebilir) + nektar değerlendirmesi önerisi (onaylı) */
  function renderPlan() {
    var P2 = window.SuperAriPlan2, el = $('planList'); if (!P2 || !el) return;
    var aps = D.loadApiaries ? D.loadApiaries() : [];
    el.innerHTML = aps.map(function (a) {
      var k = P2.konGet(a.id) || {}, o = P2.tasinmaOneri(a.id), card = '';
      if (o.durum === 'erken' || o.durum === 'ertele') card = '<div class="tp-card" style="margin-top:6px;padding:8px 10px;border-radius:10px;background:#fff3bf;"><b>' + esc(o.metin) + '</b><div class="meta" style="margin:2px 0 6px;">Tahmin güveni: %' + Math.round(o.guven * 100) + '</div><button type="button" class="btn" data-tp-ok="' + esc(a.id) + '" data-tp-date="' + esc(o.tarih) + '">Onayla</button> <button type="button" class="btn" data-tp-no>Hayır</button></div>';
      var R = window.SuperAriRota, ext = '';
      if (R) {
        var rk = R.rakimHazir(a); if (rk == null) R.rakim(a).then(function (v) { if (v != null) renderPlan(); });
        var rp = R.rotaPuan(a.il, a.ilce);
        ext = '<div class="meta" style="margin-top:2px;">' + (rk != null ? 'Rakım ' + rk + ' m · ' : '') + 'Rota puanı: ' + (rp.puan == null ? esc(rp.metin) : rp.puan + '/100') + '</div>';
        var CV = window.SuperAriCevre, cu = CV ? CV.uyarilar(a) : null;
        if (cu) ext += cu.veriYok ? '<div class="meta">Su ve toplama alanı: Veri yok</div>' : (cu.suVeriYok ? '<div class="meta">Su kaynağı: Veri yok</div>' : '') + cu.liste.map(function (x) { return '<div class="meta" style="color:#b35c00;font-weight:700;">' + esc(x.metin) + '</div>'; }).join('');
        if (!card && o.durum !== 'erken') { var y = R.yonlendir(a.id); if (y.durum === 'kayitli' || y.durum === 'harici') card = '<div class="tp-card" style="margin-top:6px;padding:8px 10px;border-radius:10px;background:#fff3bf;"><b>' + esc(y.metin) + '</b><div style="margin-top:6px;"><button type="button" class="btn" data-tp-git="1">Planla</button> <button type="button" class="btn" data-tp-no>Hayır</button></div></div>'; }
      }
      if (card) card = ext + card; else card = ext;
      if (o.durum === 'veri_yok' && k.ayrilis) card += '<div class="meta" style="margin-top:4px;">Nektar değerlendirmesi: Veri yok</div>';
      return '<div class="tp-row" style="padding:8px 0;border-top:1px solid #f0e6c8;"><b>' + esc(a.name) + '</b><div class="pair" style="margin-top:4px;"><label>Varış <input type="date" data-tp-v="' + esc(a.id) + '" value="' + esc(k.varis || '') + '"></label><label>Arılıkta kalma bitişi <input type="date" data-tp-a="' + esc(a.id) + '" value="' + esc(k.ayrilis || '') + '"></label></div>' + card + '</div>';
    }).join('');
  }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  $('planList').addEventListener('change', function (e) {
    var t = e.target, P2 = window.SuperAriPlan2; if (!P2) return;
    if (t.hasAttribute('data-tp-v')) P2.konSet(t.getAttribute('data-tp-v'), { varis: t.value });
    if (t.hasAttribute('data-tp-a')) P2.konSet(t.getAttribute('data-tp-a'), { ayrilis: t.value });
    renderPlan();
  });
  $('planList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tp-ok],[data-tp-no],[data-tp-git]'); if (!b) return;
    if (b.hasAttribute('data-tp-git')) { var f = $('gocForm'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'start' }); return; }
    if (b.hasAttribute('data-tp-no')) { b.closest('.tp-card').innerHTML = '<span class="meta">Plan değişmedi.</span>'; return; }
    SuperAriPlan2.tasinmaOnayla(b.getAttribute('data-tp-ok'), b.getAttribute('data-tp-date')); renderPlan();
  });
  window.addEventListener('superari-cevre', renderPlan);
  renderPlan();
  window.__saGocScope = function (sc) { apFilter = sc === 'all' ? '' : String(sc); if (apFilter) $('gFrom').value = apFilter; fillSelects(); fillHives(); kmHint(); renderHist(); };
  window.addEventListener('superari-cloud-pulled', function () { fillSelects(); fillHives(); renderHist(); renderPlan(); });
})();
</script>
<script>
(function () {
  var D = window.SuperAriDemo, P = window.SuperAriKsSayfa, G = D && D.goc; if (!D || !P || !G) return;
  P.init({
    redraw: function (sc) { if (window.__saGocScope) window.__saGocScope(sc); },
    title: 'Göç',
    topEnd: '<a class="ks-end ks-end-chip" href="#gocForm" title="Yeni göç formu" aria-label="Yeni göç formu">Yeni</a>', icon: '<svg class="ks-ico" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="10" width="17" height="12" rx="2" fill="#e8c48e" stroke="#8a6030"/><path d="M20 14h5l4 4v4h-9z" fill="#f7b731" stroke="#b8860b"/><circle cx="9" cy="24" r="2.6" fill="#495057"/><circle cx="24" cy="24" r="2.6" fill="#495057"/></svg>',
    stats: function (hs, scope, sm) {
      var list = scope !== 'all' ? G.forApiary(scope) : G.list(), y = String(D.records.todayLocal()).slice(0, 4);
      var yr = list.filter(function (g) { return String(g.date || '').slice(0, 4) === y; });
      var km = yr.reduce(function (a, g) { return a + (Number(g.km) || 0); }, 0), last = list.map(function (g) { return g.date; }).sort().pop() || '';
      return [
        { k: 'kovan', v: sm.hives, l: 'Kovan', href: 'kovanlar.html' },
        { k: 'muayene', v: list.length, l: 'Göç kaydı', href: '#histList' },
        { k: 'saat', v: yr.length, l: 'Bu yıl göç', href: '#histList' },
        { k: 'uyari', v: km ? Math.round(km) + ' km' : '—', l: 'Bu yıl yol', href: '#histList' },
        { k: 'sorun', v: window.SuperAriKapsam.fmtAgo(last, D.records.todayLocal()), l: 'Son göç', href: '#histList' }
      ];
    },
    note: function (hs, scope) {
      return { t: '🚚 Yeni göç: nereden, nereye, kovanları seçin', b: 'Forma git', href: '#gocForm', k: 'form' };
    }
  });
})();
</script>
<script>
/* k94 · ＋ Kayıt bu sayfanın kayıtlarını açar (nav.js alt sayfası; en altta «Tüm kayıtlar»). */

window.SuperAriQuickActions = function () { return [{ ic: '🚚', t: 'Yeni göç kaydı', d: 'Nereden · nereye · kovanlar', run: window.SuperAriNav.focusEl('#gocForm') }]; };
</script>
