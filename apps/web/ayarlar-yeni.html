<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ayarlar · SüperArı</title>
<link rel="stylesheet" href="panels.css" />
<style>
  body { background:#f6efe2; margin:0; font-family:-apple-system,system-ui,sans-serif; color:#2b2116; overflow-anchor:none; }
  .wrap { max-width:560px; margin:0 auto; padding:56px 14px 110px; }
  h1 { font-size:1.35rem; margin:0 0 4px; } .sub { color:#7a6650; font-size:.9rem; margin:0 0 14px; }
  .rol-seg { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 14px; }
  .rol-seg button { font:inherit; font-weight:800; padding:10px 6px; border-radius:12px; border:1.5px solid #d8c48a; background:#fff; color:#5c4a2a; }
  .rol-seg button.on { background:linear-gradient(180deg,#fff6df,#f5e6b8); border-color:#c9a84a; }
  .ak { background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(60,40,10,.08); overflow:hidden; }
  .ak-i + .ak-i { border-top:1px solid #efe4cf; }
  .ak-h { display:flex; align-items:center; gap:12px; width:100%; min-height:58px; padding:10px 14px; border:0; background:none; font:inherit; text-align:left; cursor:pointer; color:inherit; }
  .ak-ic { width:34px; height:34px; border-radius:10px; background:#fbf1d9; display:grid; place-items:center; font-size:18px; flex:none; }
  .ak-t { flex:1; min-width:0; } .ak-t b { display:block; font-size:1rem; } .ak-t span { display:block; font-size:.82rem; color:#7a6650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ak-ok { color:#b39a6a; font-size:18px; transition:transform .15s; } .ak-i.acik .ak-ok { transform:rotate(90deg); }
  .ak-b { padding:4px 14px 14px 60px; } .ak-b[hidden] { display:none; }
  .sat { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px dashed #efe4cf; }
  .sat:last-child { border-bottom:0; }
  .sat label { flex:1; } select, input[type=text], input[type=email], input[type=password] { font:inherit; padding:8px 10px; border:1.5px solid #e1d3b5; border-radius:10px; background:#fffdf8; max-width:100%; }
  .btn { font:inherit; font-weight:800; padding:9px 14px; border-radius:12px; border:0; background:#c98a12; color:#fff; cursor:pointer; }
  .btn.ikincil { background:#fff; color:#5c4a2a; border:1.5px solid #d8c48a; }
  .uyari { background:#fff4d6; border:1.5px solid #e8c25a; border-radius:12px; padding:10px 12px; margin:0 0 12px; font-weight:600; }
  .uye { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed #efe4cf; } .uye:last-child { border-bottom:0; }
  .uye { flex-wrap:wrap; } .uye .ad { flex:1 1 200px; min-width:0; } .uye .ad small { display:block; color:#7a6650; }
  .rozet { font-size:.75rem; font-weight:800; padding:2px 8px; border-radius:99px; background:#f1e6c9; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#2b2116; color:#fff; padding:8px 16px; border-radius:99px; font-weight:700; pointer-events:none; opacity:0; transition:opacity .2s; }
  .toast.on { opacity:1; }
  .onz { font-size:.75rem; font-weight:800; color:#8a5a00; background:#fff0c2; border-radius:8px; padding:2px 8px; margin-left:6px; }
  .sw { position:relative; width:46px; height:28px; flex:none; } .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; background:#d9cdb4; border-radius:99px; transition:.15s; } .sw span:before { content:""; position:absolute; width:22px; height:22px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .sw input:checked + span { background:#3c8d4a; } .sw input:checked + span:before { transform:translateX(18px); }
</style>
</head>
<body>
<main class="wrap">
  <h1>Ayarlar</h1>
  <p class="sub">Arıcının kendi seçtiği ayarlar. Değişiklik anında kaydedilir.</p>
  <div id="onayUyari" class="uyari" hidden>E-postanı onayla. Gelen kutundaki bağlantıya dokun. <button type="button" class="btn ikincil" id="btnTekrar" style="margin-left:6px;">Tekrar gönder</button></div>
  <div class="rol-seg" role="group" aria-label="Rolüm" id="rolSeg"><button type="button" data-rol="owner">Sahip</button><button type="button" data-rol="arici">Arıcı</button><button type="button" data-rol="bakici">Bakıcı</button></div>
  <div class="ak" id="ak"></div>
</main>
<div class="toast" id="toast" role="status">Kaydedildi</div>
<script src="demo-data.js?v=koloni-161"></script>
<script src="nav.js?v=koloni-161"></script>
<script src="bulut.js?v=koloni-161"></script>
<script>
(function () {
  'use strict';
  var KEY = 'superari.ayar.kullanici.v1', q = new URLSearchParams(location.search), ORNEK = q.get('onizleme') === '1';
  function rj() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
  var A = Object.assign({ bildirim: true, kritikSes: true, gunluk: true, sesliMuayene: true, sesGeri: true, birim: 'kg', dil: 'tr', tarih: 'gg.aa.yyyy', rol: 'owner' }, rj());
  function kaydet(k, v) { A[k] = v; localStorage.setItem(KEY, JSON.stringify(A)); var t = document.getElementById('toast'); t.classList.add('on'); clearTimeout(t.__t); t.__t = setTimeout(function () { t.classList.remove('on'); }, 1400); ciz(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sw(k) { return '<label class="sw"><input type="checkbox" data-k="' + k + '"' + (A[k] ? ' checked' : '') + '><span></span></label>'; }
  function sec(k, ops) { return '<select data-k="' + k + '">' + ops.map(function (o) { return '<option value="' + o[0] + '"' + (A[k] === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>'; }
  var D = window.SuperAriDemo, aps = []; try { aps = D.loadApiaries(); } catch (e) { aps = []; }
  var hesap = { email: null, onayli: null }, ekip = null;
  var R = { owner: 'Sahip', arici: 'Arıcı', bakici: 'Bakıcı' };
  function ekipHtml() {
    if (!ekip) return '<p class="sub">Ekip için giriş yap.</p><a class="btn ikincil" href="hesap.html">Giriş yap</a>';
    var sahip = A.rol === 'owner';
    return (ekip.ornek ? '<p><span class="onz">Önizleme örneği</span></p>' : '') +
      '<div>' + ekip.uyeler.map(function (u) {
        return '<div class="uye"><div class="ad"><b>' + esc(u.ad || u.email) + '</b><small>' + esc(u.email) + '</small></div>' +
          (sahip && u.role !== 'owner' ? '<select data-uye="' + esc(u.id) + '"><option value="arici"' + (u.role === 'arici' ? ' selected' : '') + '>Arıcı</option><option value="bakici"' + (u.role === 'bakici' ? ' selected' : '') + '>Bakıcı</option></select> <button type="button" class="btn ikincil" data-cikar="' + esc(u.id) + '" aria-label="Üyeyi çıkar">Çıkar</button>' : '<span class="rozet">' + R[u.role] + '</span>') + '</div>';
      }).join('') + ekip.davetler.map(function (d) { return '<div class="uye"><div class="ad"><b>' + esc(d.email) + '</b><small>Davet bekliyor · ' + R[d.role] + '</small></div></div>'; }).join('') + '</div>' +
      (sahip ? '<div class="sat" style="flex-wrap:wrap;"><input type="email" id="davetEp" placeholder="E-posta" style="flex:1;min-width:150px;"> ' + '<select id="davetRol"><option value="arici">Arıcı</option><option value="bakici">Bakıcı</option></select> <button type="button" class="btn" id="btnDavet">Davet et</button></div>' : '') +
      '<p class="sub" style="margin-top:8px;">Arıcı: muayene, besleme, hasat, tartı ve taşınma kaydı girer, arılık ayarlarını düzenler. Bakıcı: görür; kendisine atanan görevi, gözlemi ve besleme kaydını girer.</p>';
  }
  var KONU = [
    { id: 'hesap', ic: '👤', t: 'Hesap ve üyelik', d: function () { return hesap.email ? hesap.email + (hesap.onayli === false ? ' · onay bekliyor' : '') : 'Giriş yapılmadı'; },
      b: function () { return hesap.email ? '<div class="sat"><label>E-posta</label><b>' + esc(hesap.email) + '</b></div>' +
        '<form id="sifreForm"><div class="sat"><label>Mevcut şifre</label><input type="password" name="m" autocomplete="current-password" required></div><div class="sat"><label>Yeni şifre</label><input type="password" name="y" minlength="8" autocomplete="new-password" required></div><div class="sat"><label>Yeni şifre (tekrar)</label><input type="password" name="y2" minlength="8" autocomplete="new-password" required></div><div class="sat"><span class="sub" id="sifreDurum" style="margin:0;">En az 8 karakter.</span><button class="btn">Şifreyi değiştir</button></div></form>' +
        '<div class="sat"><label>Oturum</label><button type="button" class="btn ikincil" id="btnCikis">Çıkış yap</button></div>'
        : '<div class="sat"><label>Giriş yap ya da üye ol</label><a class="btn" href="hesap.html">Giriş</a></div><div class="sat"><label>Şifreni mi unuttun?</label><a class="btn ikincil" href="hesap.html?unuttum=1">Şifremi unuttum</a></div>'; } },
    { id: 'ekip', ic: '👥', t: 'Ekip', d: function () { return ekip ? ekip.uyeler.length + ' üye' + (ekip.davetler.length ? ' · ' + ekip.davetler.length + ' davet' : '') : 'Giriş gerekli'; }, b: ekipHtml },
    { id: 'arilik', ic: '🏡', t: 'Arılıklar', d: function () { return aps.length + ' arılık'; }, b: function () { return aps.map(function (a) { return '<div class="sat"><label>' + esc(a.name) + '</label><a class="btn ikincil" href="arilik.html?id=' + encodeURIComponent(a.id) + '">Aç</a></div>'; }).join('') + '<div class="sat"><label>Yeni arılık</label><a class="btn" href="ariliklar.html">Ekle</a></div>'; } },
    { id: 'bildirim', ic: '🔔', t: 'Bildirimler', d: function () { return A.bildirim ? 'Açık' : 'Kapalı'; }, b: function () { return '<div class="sat"><label>Bildirimler</label>' + sw('bildirim') + '</div><div class="sat"><label>Kritik ses alarmları</label>' + sw('kritikSes') + '</div><div class="sat"><label>Günlük özet</label>' + sw('gunluk') + '</div>'; } },
    { id: 'ses', ic: '🎙️', t: 'Ses ve sesli muayene', d: function () { return A.sesliMuayene ? 'Sesli muayene açık' : 'Kapalı'; }, b: function () { return '<div class="sat"><label>Sesli muayene</label>' + sw('sesliMuayene') + '</div><div class="sat"><label>Sesli geri bildirim</label>' + sw('sesGeri') + '</div>'; } },
    { id: 'birim', ic: '📏', t: 'Birimler ve dil', d: function () { return (A.birim === 'kg' ? 'Kilogram' : 'Gram') + ' · Türkçe'; }, b: function () { return '<div class="sat"><label>Ağırlık</label>' + sec('birim', [['kg', 'Kilogram'], ['g', 'Gram']]) + '</div><div class="sat"><label>Tarih</label>' + sec('tarih', [['gg.aa.yyyy', '15.10.2026'], ['gg ay', '15 Eki']]) + '</div><div class="sat"><label>Dil</label>' + sec('dil', [['tr', 'Türkçe']]) + '</div>'; } },
    { id: 'cihaz', ic: '📡', t: 'Cihazlar', d: function () { return 'Kovan ve gateway cihazları'; }, b: function () { return '<div class="sat"><label>Cihazları yönet</label><a class="btn" href="cihazlar.html">Cihazlar</a></div>'; } },
    { id: 'hakkinda', ic: 'ℹ️', t: 'Hakkında', d: function () { return 'SüperArı · koloni-161'; }, b: function () { return '<div class="sat"><label>Sürüm</label><b>koloni-161</b></div><div class="sat"><label>Kullanım şartları</label><a class="btn ikincil" href="sartlar.html">Aç</a></div>'; } }
  ];
  var acik = q.get('konu') || null;
  function ciz() {
    var el = document.getElementById('ak');
    el.innerHTML = KONU.map(function (k) { var a = acik === k.id; return '<div class="ak-i' + (a ? ' acik' : '') + '" data-id="' + k.id + '"><button type="button" class="ak-h" aria-expanded="' + a + '"><span class="ak-ic">' + k.ic + '</span><span class="ak-t"><b>' + k.t + '</b><span>' + esc(k.d()) + '</span></span><span class="ak-ok">›</span></button><div class="ak-b"' + (a ? '' : ' hidden') + '>' + (a ? k.b() : '') + '</div></div>'; }).join('');
    [].forEach.call(document.querySelectorAll('#rolSeg button'), function (b) { b.classList.toggle('on', b.getAttribute('data-rol') === A.rol); });
  }
  /* Tek konu açık; açılırken tıklanan başlığın ekrandaki yeri sabit (yukarıdaki konu kapanınca kayma telafisi) */
  document.getElementById('ak').addEventListener('click', function (e) {
    var h = e.target.closest('.ak-h'); if (!h) return;
    var id = h.parentNode.getAttribute('data-id'), y0 = h.getBoundingClientRect().top;
    var wr = document.querySelector('.wrap'); wr.style.minHeight = (wr.offsetHeight) + 'px'; /* çökme yok: kaydırma telafisi sınırlanmasın */
    acik = acik === id ? null : id; ciz();
    var h2 = document.querySelector('.ak-i[data-id="' + id + '"] .ak-h'), dy = h2.getBoundingClientRect().top - y0; if (dy) window.scrollBy(0, dy);
    /* fazla boşluğu, görünür alanın altında kalan kısmı kadar bırak */
    var need = window.scrollY + window.innerHeight; wr.style.minHeight = Math.max(need, 0) + 'px';
  });
  document.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-k');
    if (k) { kaydet(k, t.type === 'checkbox' ? t.checked : t.value); return; }
    var u = t.getAttribute('data-uye'); if (u && ekip) { if (!ekip.ornek && window.SuperAriBulut) SuperAriBulut.setMemberRole(aps[0] && aps[0].id, u, t.value); ekip.uyeler.forEach(function (x) { if (x.id === u) x.role = t.value; }); kaydet('_', Date.now()); }
  });
  document.addEventListener('click', function (e) {
    var r = e.target.closest('#rolSeg button'); if (r) { kaydet('rol', r.getAttribute('data-rol')); return; }
    var c = e.target.closest('[data-cikar]'); if (c && ekip && confirm('Üye ekipten çıkarılsın mı?')) { var id = c.getAttribute('data-cikar'); if (!ekip.ornek) SuperAriBulut.removeMember(aps[0] && aps[0].id, id); ekip.uyeler = ekip.uyeler.filter(function (x) { return x.id !== id; }); ciz(); return; }
    if (e.target.id === 'btnDavet') { var ep = document.getElementById('davetEp').value, rl = document.getElementById('davetRol').value; (ekip.ornek ? Promise.resolve() : SuperAriBulut.invite(aps[0] && aps[0].id, ep, rl)).then(function () { ekip.davetler.push({ email: ep, role: rl }); kaydet('_', Date.now()); }).catch(function (er) { alert(er.message); }); }
    if (e.target.id === 'btnCikis') SuperAriBulut.signOut().then(function () { location.href = 'hesap.html'; });
    if (e.target.id === 'btnTekrar') SuperAriBulut.resendConfirm(hesap.email).then(function () { e.target.textContent = 'Gönderildi'; }).catch(function () { e.target.textContent = 'Gönderilemedi'; });
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'sifreForm') return; e.preventDefault(); var f = e.target, d = document.getElementById('sifreDurum');
    SuperAriBulut.changePassword(f.m.value, f.y.value, f.y2.value).then(function () { d.textContent = 'Şifre değişti.'; f.reset(); }).catch(function (er) { d.textContent = er.message || 'Değiştirilemedi.'; });
  });
  function ornek() {
    hesap = { email: 'yuksel@ornek.com', onayli: false };
    ekip = { ornek: true, uyeler: [{ id: 'u1', ad: 'Yüksel Aksoy', email: 'yuksel@ornek.com', role: 'owner' }, { id: 'u2', ad: 'Mehmet', email: 'mehmet@ornek.com', role: 'arici' }, { id: 'u3', ad: 'Ayşe', email: 'ayse@ornek.com', role: 'bakici' }], davetler: [{ email: 'ali@ornek.com', role: 'bakici' }] };
  }
  ciz();
  if (ORNEK) { ornek(); document.getElementById('onayUyari').hidden = false; ciz(); return; }
  var B = window.SuperAriBulut; if (!B) return;
  B.client().then(function (c) { return c.auth.getUser(); }).then(function (u) {
    var us = u && u.data && u.data.user; if (!us) return;
    hesap = { email: us.email, onayli: !!us.email_confirmed_at }; document.getElementById('onayUyari').hidden = hesap.onayli;
    return aps[0] && B.team(aps[0].id).then(function (t) { ekip = { uyeler: (t.members || []).map(function (m) { return { id: m.user_id, ad: m.name || m.email, email: m.email, role: m.role === 'owner' ? 'owner' : (m.role === 'bakici' || m.role === 'izleyici' ? 'bakici' : 'arici') }; }), davetler: (t.invites || []).map(function (d) { return { email: d.email, role: d.role === 'bakici' || d.role === 'izleyici' ? 'bakici' : 'arici' }; }) }; }).catch(function () { ekip = null; });
  }).then(ciz).catch(function () { /* çevrimdışı */ });
})();
</script>
</body>
</html>
