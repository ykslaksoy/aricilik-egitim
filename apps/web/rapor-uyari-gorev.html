<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Uyarı & görev</h1>
        <p id="pageSub">Geçmiş özeti</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2>Uyarı türleri</h2>
      <div id="typeList"></div>
    </section>
    <section class="card-block">
      <h2>Son uyarılar</h2>
      <div id="alertList"></div>
    </section>
    <section class="card-block">
      <h2>Son görevler</h2>
      <div id="taskList"></div>
    </section>
    <p class="hint">Açık uyarılar <a href="uyarilar.html" style="color:var(--brown);font-weight:700">Uyarılar</a>, görevler <a href="gorevler.html" style="color:var(--brown);font-weight:700">Görevler</a> sayfalarında da listelenir.</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">

  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-1"></script>
<script src="rapor-store.js"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  var D = window.SuperAriDemo;
  if (!R) return;
  var s = R.alertTaskSummary();
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">Açık uyarı</div><div class="v warn">' + s.openAlerts + '</div></div>' +
    '<div class="stat"><div class="k">Çözülen</div><div class="v pos">' + s.resolvedAlerts + '</div></div>' +
    '<div class="stat"><div class="k">Açık görev</div><div class="v">' + s.openTasks + '</div></div>' +
    '<div class="stat"><div class="k">Tamamlanan</div><div class="v pos">' + s.doneTasks + '</div></div>';
  var typeLabels = { ogul: 'Oğul', saglik: 'Sağlık', tarti: 'Tartı', hava: 'Hava', petek: 'Petek', diger: 'Diğer' };
  document.getElementById('typeList').innerHTML = Object.keys(s.byType).map(function (k) {
    return '<div class="row-item"><div class="left"><div class="title">' + (typeLabels[k] || k) + '</div></div>' +
      '<div class="right">' + s.byType[k] + '</div></div>';
  }).join('') || '<p class="meta">Uyarı yok.</p>';
  function hiveName(id) {
    if (!D) return 'Kovan ' + id;
    var h = D.hiveById(id);
    return h ? h.name : ('Kovan ' + id);
  }
  function sevBadge(sev) {
    if (sev === 'high') return 'bad';
    if (sev === 'medium') return 'warn';
    return 'info';
  }
  function shortDate(iso) {
    if (!iso) return '—';
    return String(iso).slice(0, 10) + ' ' + String(iso).slice(11, 16);
  }
  document.getElementById('alertList').innerHTML = s.recentAlerts.map(function (a) {
    var st = a.status === 'resolved' ? '<span class="badge ok">çözüldü</span>' : '<span class="badge warn">açık</span>';
    return '<div class="row-item"><div class="left"><div class="title">' + a.title + ' ' + st + '</div>' +
      '<div class="meta">' + shortDate(a.createdAt) + ' · ' + hiveName(a.hiveId) +
      ' · <span class="badge ' + sevBadge(a.severity) + '">' + (a.type || '') + '</span></div></div></div>';
  }).join('') || '<p class="meta">Uyarı yok.</p>';
  document.getElementById('taskList').innerHTML = s.recentTasks.map(function (t) {
    var st = t.status === 'done' ? '<span class="badge ok">bitti</span>' : '<span class="badge warn">açık</span>';
    return '<div class="row-item"><div class="left"><div class="title">' + t.title + ' ' + st + '</div>' +
      '<div class="meta">' + shortDate(t.createdAt) + ' · ' + hiveName(t.hiveId) +
      ' · öncelik ' + t.priority + (t.doneAt ? ' · bitti ' + shortDate(t.doneAt) : '') + '</div></div></div>';
  }).join('') || '<p class="meta">Görev yok.</p>';
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
