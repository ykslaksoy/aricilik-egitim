</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Uyarı & görev</h1>
        <p id="pageSub">Geçmiş özeti</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2>Uyarı türleri</h2>
      <div id="typeList"></div>
    </section>
    <section class="card-block">
      <h2>Son uyarılar</h2>
      <div id="alertList"></div>
    </section>
    <section class="card-block">
      <h2>Son görevler</h2>
      <div id="taskList"></div>
    </section>
    <p class="hint" id="modeHint"></p>
    <p class="hint">Açık uyarılar <a href="uyarilar.html" style="color:var(--brown);font-weight:700">Uyarılar</a>, görevler <a href="gorevler.html" style="color:var(--brown);font-weight:700">Görevler</a> sayfalarında da listelenir.</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-6v-5H10v5H4z"/></svg>Ana</a><a class="tab" href="bakim.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="12" height="15.5" rx="2"/><path d="M9.5 4.5V3.6h5v.9"/><path d="M9 11l2 2 4-4.2M9 16.5h6"/></svg>Bakım</a><button type="button" class="tab tab-plus" data-quick-record aria-label="Hızlı kayıt"><span class="plus-c" aria-hidden="true">＋</span><span class="plus-l">Kayıt</span></button><a class="tab" href="bugun.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6" width="15" height="13.5" rx="2"/><path d="M4.5 10h15M9 4v3.5M15 4v3.5"/><circle cx="12" cy="14.6" r="1.8"/></svg>Bugün</a><a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 4.5v2.2M12 17.3V19.5M4.5 12h2.2M17.3 12H19.5M7 7l1.6 1.6M15.4 15.4 17 17M17 7l-1.6 1.6M8.6 15.4 7 17"/></svg>Ayarlar</a>

  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-87"></script>
<script src="rapor-store.js?v=koloni-87"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  var D = window.SuperAriDemo;
  if (!R) return;
  var s = R.alertTaskSummary();
  var MAX = 30;
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  document.getElementById('modeHint').textContent = s.live
    ? 'Canlı mod: uyarılar kayıtlarınızdan, stoktan ve oğul riskinden anlık üretilir (çözülen uyarı geçmişi tutulmaz). Görevler: sizin eklediğiniz ve otomatik görevler; tamamlananlar tarihiyle.'
    : 'Demo mod: örnek uyarı ve görev geçmişi «Demo» etiketlidir; canlı moda geçince görünmez.';
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">Açık uyarı</div><div class="v warn">' + s.openAlerts + '</div></div>' +
    '<div class="stat"><div class="k">Çözülen</div><div class="v pos">' + (s.resolvedAlerts == null ? '—' : s.resolvedAlerts) + '</div></div>' +
    '<div class="stat"><div class="k">Açık görev</div><div class="v">' + s.openTasks + '</div></div>' +
    '<div class="stat"><div class="k">Tamamlanan</div><div class="v pos">' + s.doneTasks + '</div></div>';
  var typeLabels = { ogul: 'Oğul', saglik: 'Sağlık', tarti: 'Tartı', hava: 'Hava', petek: 'Petek', koloni: 'Koloni', 'hastalık': 'Hastalık', besleme: 'Besleme', stok: 'Stok', diger: 'Diğer' };
  function typeLabel(k) { return typeLabels[k] || (k ? k.charAt(0).toLocaleUpperCase('tr') + k.slice(1) : 'Diğer'); }
  document.getElementById('typeList').innerHTML = Object.keys(s.byType).sort(function (a, b) { return s.byType[b] - s.byType[a]; }).map(function (k) {
    return '<div class="row-item"><div class="left"><div class="title">' + esc(typeLabel(k)) + '</div></div>' +
      '<div class="right">' + s.byType[k] + '</div></div>';
  }).join('') || '<p class="meta">Uyarı yok.</p>';
  function hiveName(id) {
    if (id == null || id === '') return 'Genel';
    if (!D) return 'Kovan ' + id;
    var h = D.hiveById(id);
    return h ? h.name : ('Kovan ' + id);
  }
  function sevBadge(sev) {
    if (sev === 'high') return 'bad';
    if (sev === 'medium') return 'warn';
    return 'info';
  }
  var demoTag = ' <span class="meta" style="font-weight:700">· Demo</span>';
  function more(n) { return n > MAX ? '<p class="meta">+' + (n - MAX) + ' kayıt daha — tümü için Dışa aktarma › CSV</p>' : ''; }
  document.getElementById('alertList').innerHTML = s.recentAlerts.slice(0, MAX).map(function (a) {
    var st = a.status === 'resolved' ? '<span class="badge ok">çözüldü</span>' : '<span class="badge warn">açık</span>';
    return '<div class="row-item"><div class="left"><div class="title">' + esc(a.title) + ' ' + st + (a.demo ? demoTag : '') + '</div>' +
      '<div class="meta">' + (a.createdAt ? esc(R.trDate(a.createdAt)) + ' · ' : '') + esc(hiveName(a.hiveId)) +
      ' · <span class="badge ' + sevBadge(a.severity) + '">' + esc(typeLabel(a.type)) + '</span></div></div></div>';
  }).join('') + more(s.recentAlerts.length) || '<p class="meta">Uyarı yok.</p>';
  document.getElementById('taskList').innerHTML = s.recentTasks.slice(0, MAX).map(function (t) {
    var st = t.status === 'done' ? '<span class="badge ok">bitti</span>' : '<span class="badge warn">açık</span>';
    return '<div class="row-item"><div class="left"><div class="title">' + esc(t.title) + ' ' + st + (t.demo ? demoTag : '') + '</div>' +
      '<div class="meta">' + (t.createdAt ? esc(R.trDate(t.createdAt)) + ' · ' : '') + esc(hiveName(t.hiveId)) +
      ' · öncelik ' + t.priority + (t.doneAt ? ' · bitti ' + esc(R.trDate(t.doneAt)) : '') + '</div></div></div>';
  }).join('') + more(s.recentTasks.length) || '<p class="meta">Görev yok.</p>';
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
