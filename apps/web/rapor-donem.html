<html lang="tr">
<head>

</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Dönem karşılaştırma</h1>
        <p id="pageSub">Bu sezon / geçen sezon</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2 id="compareTitle">Sezon karşılaştırması</h2>
      <div id="compareBlock"></div>
    </section>
    <section class="card-block">
      <h2>Arılık bazlı bal</h2>
      <div id="apiaryList"></div>
    </section>
    <p class="hint">Hasat ve gelir demo kayıtlardan; giderler Giderler deposundan (aynı sezon filtresi) alınır.</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">

    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js"></script>
<script src="gider-store.js"></script>
<script src="rapor-store.js"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  if (!R) return;
  var c = R.periodCompare();
  document.getElementById('pageSub').textContent = c.currentYear + ' vs ' + c.previousYear;
  document.getElementById('compareTitle').textContent = c.currentYear + ' / ' + c.previousYear;
  function deltaCls(p) { return p > 0 ? 'pos' : (p < 0 ? 'neg' : ''); }
  function deltaTxt(p) { return (p > 0 ? '+' : '') + p + '%'; }
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">Bal ' + c.currentYear + '</div><div class="v">' + R.fmtKg(c.harvest.current) + '</div></div>' +
    '<div class="stat"><div class="k">Bal farkı</div><div class="v ' + deltaCls(c.harvest.deltaPct) + '">' + deltaTxt(c.harvest.deltaPct) + '</div></div>' +
    '<div class="stat"><div class="k">Gelir ' + c.currentYear + '</div><div class="v">' + R.fmtMoney(c.income.current) + '</div></div>' +
    '<div class="stat"><div class="k">Kâr farkı</div><div class="v ' + deltaCls(c.profit.deltaPct) + '">' + deltaTxt(c.profit.deltaPct) + '</div></div>';
  function row(label, cur, prev, fmt) {
    var d = prev ? Math.round(((cur - prev) / Math.abs(prev)) * 1000) / 10 : (cur ? 100 : 0);
    return '<div class="compare-grid"><div class="lab">' + label + '</div>' +
      '<div class="num">' + fmt(cur) + '</div><div class="mid ' + deltaCls(d) + '">' + deltaTxt(d) + '</div>' +
      '<div class="num" style="text-align:right">' + fmt(prev) + '</div></div>';
  }
  document.getElementById('compareBlock').innerHTML =
    row('Bal (kg)', c.harvest.current, c.harvest.previous, R.fmtKg) +
    row('Gelir', c.income.current, c.income.previous, R.fmtMoney) +
    row('Gider', c.expense.current, c.expense.previous, R.fmtMoney) +
    row('Kâr / zarar', c.profit.current, c.profit.previous, R.fmtMoney);
  document.getElementById('apiaryList').innerHTML = c.byApiary.map(function (a) {
    var d = a.honeyPrevious ? Math.round(((a.honeyCurrent - a.honeyPrevious) / Math.abs(a.honeyPrevious)) * 1000) / 10 : (a.honeyCurrent ? 100 : 0);
    return '<div class="row-item"><div class="left"><div class="title">' + a.apiaryName + '</div>' +
      '<div class="meta">' + c.previousYear + ': ' + R.fmtKg(a.honeyPrevious) + ' → ' + c.currentYear + ': ' + R.fmtKg(a.honeyCurrent) +
      ' · kâr ' + R.fmtMoney(a.profit) + '</div></div>' +
      '<div class="right ' + deltaCls(d) + '">' + deltaTxt(d) + '</div></div>';
  }).join('') || '<p class="meta">Veri yok.</p>';
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
