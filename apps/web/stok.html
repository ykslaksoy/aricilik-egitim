<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7b731" />
<title>Stok · SüperArı</title>
<!-- ANA-CSS:BEGIN — ana.html stil bloğunun birebir kopyası; elle düzenlemeyin: node scripts/sync-bakim-ana.js -->
<style>
  :root {
    --bg: #f0f1f3;
    --card: #f4f5f7;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --green: #2f9e44;
    --green-bg: #d8f3dc;
    --tan-bg: #efe2cb;
    --tan-fg: #7a5a32;
    --blue: #1c7ed6;
    --blue-bg: #d0ebff;
    --red: #e03131;
    --red-bg: #ffe3e3;
    --purple: #7048e8;
    --purple-bg: #e5dbff;
    --orange: #f08c00;
    /* Restored warmer yakma-era wood (pre-Grok 0a61b12): was --wood-1/#e8c48e + --wood-2/#c99755 */
    --wood: #d9ae6a;
    --wood-hi: #e8c48e;
    --wood-lo: #c99755;
    --wood-edge: #8a6030;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top-align phone so Hardal brand strip stays on-screen when viewport < 844px
     (center alignment previously clipped the strip to a mustard sliver). */
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0 28px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .02em; }

  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow: hidden; display: flex; flex-direction: column; background: var(--bg);
    padding: 2px 12px 6px;
   position: relative;
  }

  /* Hardal işletme şeridi — 3D bee logo + brand + lock; location lives in weather card below */
  .brand-strip {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 5px 10px 5px 6px;
    margin-bottom: 4px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
    overflow: visible;
  }
  .brand-logo-btn {
    flex: 0 0 auto;
    width: auto;
    height: auto;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
  }
  .brand-logo-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.45);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .brand-logo-btn .bee-3d,
  .brand-logo-btn .bee-logo-img {
    width: 40px;
    height: auto;
    max-height: 30px;
    display: block;
    object-fit: contain;
    /* Daha çizim: kenar vurgusu + kontrast */
    filter:
      contrast(1.12) saturate(1.08)
      drop-shadow(0 0 0.4px #3d2616)
      drop-shadow(0 0 0.4px #3d2616)
      drop-shadow(0 1px 1.5px rgba(61, 38, 22, 0.28));
    transform: none;
  }
  .brand-logo-btn .bee-emoji {
    font-size: 22px;
    line-height: 1;
    display: block;
    transform: perspective(120px) rotateX(8deg) rotateY(-6deg) translateZ(2px);
    filter: drop-shadow(0 2px 2px rgba(61, 38, 22, 0.3));
    user-select: none;
  }
  .brand-strip .brand-name {
    flex: 0 1 auto;
    text-align: left;
    line-height: 1.2;
    color: var(--brown);
    margin-left: 2px;
  }
  .brand-strip .brand-lock-btn {
    margin-left: auto;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    padding: 5px 11px;
    border: 1px solid rgba(176, 140, 60, 0.35);
    border-radius: 999px;
    background: rgba(255, 252, 244, 0.72);
    color: var(--brown-mid, #5c3a1f);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .015em;
    line-height: 1.2;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    box-shadow: none;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .brand-strip .brand-lock-btn:hover {
    background: rgba(255, 248, 230, 0.95);
    border-color: rgba(176, 140, 60, 0.55);
  }
  .brand-strip .brand-lock-btn:active {
    background: rgba(244, 227, 176, 0.85);
  }
  .brand-strip .brand-lock-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
  }
  .brand-strip .brand-lock-btn[aria-pressed="true"] {
    background: rgba(240, 196, 58, 0.28);
    border-color: rgba(184, 134, 11, 0.55);
    color: var(--brown, #3d2616);
    font-weight: 600;
  }
  .weather-loc-label.is-fading {
    opacity: 0;
  }
  .weather-loc-label {
    transition: opacity 0.35s ease;
  }

  .weather-loc {
    position: relative;
  }
  /* Invisible exit marker: bees emerge just right of the arılık label (pre-flex stretch) */
  .bee-exit {
    position: absolute;
    left: 100%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin-left: 10px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* Breed name under bee exit point */
  .bee-podium {
    position: absolute;
    left: 100%;
    top: calc(50% + 10px);
    transform: translateY(0);
    margin-left: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 9;
    pointer-events: none;
  }
  .bee-podium.is-hidden { display: none; }
  .bee-podium .podium-stage {
    flex: 0 0 10px;
    width: 22px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(90,60,30,.22) 0%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .bee-podium.is-ready .podium-stage { opacity: 1; }
  .bee-podium .podium-name {
    font-size: 8px; font-weight: 800; color: var(--brown-mid);
    background: rgba(255,248,238,.96); border: 1px solid #e8dcc8;
    border-radius: 999px; padding: 1px 6px; line-height: 1.35;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0; white-space: nowrap; max-width: 148px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .bee-podium .podium-name.is-on {
    opacity: 1; transform: translateY(0);
  }

  /* Butonlar %5 kısaldı; açılan alan hava kartına verildi */
  .weather {
    flex: 0 0 auto; background: #fff; border: 1px solid #e6e8ec; border-radius: 14px;
    padding: 10px 10px 10px; margin-top: 0; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    overflow: hidden; /* breed podium taşmasın, kart büyümüş gibi görünmesin */
  }
  .weather-top {
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 0;
    min-height: 0;
    padding: 0;
  }
  .weather-icon { width: 24px; height: 24px; flex: 0 0 auto; }
  /* Content-sized (not flex:1) so #beeExit stays at end of short label — restores d6cf379 exit */
  .weather-loc { font-size: 14px; font-weight: 650; color: var(--text); flex: 0 1 auto; max-width: 52%; }
  .arilik-loc-controls {
    display: inline-flex;
    align-items: center;
    gap: 0;
    max-width: 100%;
    min-width: 0;
  }
  /* Şık kibar prev/next — light tap targets, quiet chevrons, warm ink */
  .arilik-nav {
    flex: 0 0 auto;
    box-sizing: content-box;
    width: 1em;
    height: 1em;
    min-width: 24px;
    min-height: 24px;
    padding: 4px;
    margin: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #8a7358;
    font-size: 15px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .18s ease, background .18s ease;
  }
  .arilik-nav:hover {
    color: var(--brown-mid, #5c3a1f);
    background: rgba(232, 220, 200, 0.45);
  }
  .arilik-nav:active {
    color: var(--brown, #3d2616);
    background: rgba(224, 208, 180, 0.55);
  }
  .arilik-nav:focus-visible {
    outline: 1.5px solid rgba(184, 134, 11, 0.55);
    outline-offset: 1px;
  }
  .arilik-nav:disabled {
    opacity: 0.28;
    cursor: default;
    background: transparent;
  }
  .arilik-nav svg {
    width: 12px;
    height: 12px;
    display: block;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .weather-loc-label {
    display: block;
    max-width: 7.2em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 1px;
    text-align: center;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--text);
  }
  /* Live °C from Open-Meteo (see liveWeather) — far right of weather-top */
  .weather-temp {
    margin-left: auto; font-size: 25px; font-weight: 700; color: var(--text); line-height: 1; flex: 0 0 auto;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .weather-temp:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
    border-radius: 6px;
  }
  .bee-toggle {
    flex: 0 0 auto;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-toggle:hover { background: #f3ebe0; }
  .bee-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-toggle-ico {
    width: 14px;
    height: 14px;
    display: block;
    flex: 0 0 auto;
  }
  .bee-sound-toggle {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-left: 4px;
    padding: 4px 7px;
    /* «Sessiz» ve «Ses» aynı kutuda — metin değişince boyut oynasın */
    box-sizing: border-box;
    width: 68px;
    min-width: 68px;
    max-width: 68px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-sound-text {
    display: inline-block;
    min-width: 0;
    text-align: center;
    white-space: nowrap;
  }
  .bee-sound-toggle:hover { background: #f3ebe0; }
  .bee-sound-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-sound-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-sound-toggle-ico {
    width: 13px;
    height: 13px;
    display: block;
    flex: 0 0 auto;
  }
  .bee-controls {
    display: contents; /* children participate in hint flex row */
  }
  .bee-toggle { margin-left: 0; }
  .bee-sound-toggle { margin-left: 0; }
  .muayene-hint .bee-toggle,
  .muayene-hint .bee-sound-toggle {
    flex: 0 0 auto;
    padding: 3px 7px;
    font-size: 10px;
    z-index: 12;
  }
  .muayene-hint .bee-sound-toggle {
    width: 64px;
    min-width: 64px;
    max-width: 64px;
    justify-content: center;
    box-sizing: border-box;
  }
  .muayene-hint-mid {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    position: relative;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 28px !important;
    min-height: 28px !important;
    max-height: 28px !important;
    overflow: hidden;
  }
  .muayene-hint.is-idle .muayene-hint-mid {
    height: 28px !important;
    min-height: 28px !important;
    max-height: 28px !important;
  }
  .muayene-hint.is-active .muayene-hint-mid {
    justify-content: flex-start;
  }
  .forecast {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 0;
    text-align: center;
    margin-top: 1px;
  }
  .day { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; }
  .day-name { font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.1; }
  .day-date { font-size: 12px; font-weight: 800; color: var(--text); line-height: 1.05; }
  .day.is-today .day-name,
  .day.is-today .day-date { color: var(--hardal-lo, #b8860b); }
  .day-ico { width: 17px; height: 17px; margin: 0; }
  .day-temps { font-size: 11px; font-weight: 800; color: var(--text); line-height: 1.1; white-space: nowrap; }
  .day-temps .lo { font-weight: 600; color: #8a8278; }
  .day-hi { font-size: 10px; font-weight: 700; color: var(--text); }
  .day-lo { font-size: 9px; color: #8a8278; }
  .muayene-hint {
    position: relative;
    margin-top: 2px; padding: 4px 6px; border-radius: 10px;
    background: #fff8df; border: 1px solid #e0c56a;
    color: var(--brown, #4a2f1a); font-size: 11px; font-weight: 650; line-height: 1.2;
    display: flex; flex-wrap: nowrap; align-items: center; gap: 6px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    /* Not gelince ASLA büyümesin */
    height: 36px !important;
    min-height: 36px !important;
    max-height: 36px !important;
    overflow: hidden !important;
    box-sizing: border-box;
  }
  /* Idle = bee dock under forecast; active = reminder text */
  .muayene-hint.is-idle {
    background: transparent;
    border-color: transparent;
    cursor: default;
    justify-content: center;
    padding: 4px 6px;
    height: 36px !important;
    min-height: 36px !important;
    max-height: 36px !important;
  }
  .muayene-hint.is-idle .muayene-hint-text,
  .muayene-hint.is-idle .muayene-hint-ok { display: none !important; }
  .muayene-hint.is-active .bee-exit,
  .muayene-hint.is-active .bee-podium { display: none !important; }
  .muayene-hint-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint-text:active { opacity: .75; }
  .muayene-hint-ok {
    flex: 0 0 auto;
    height: 26px;
    min-height: 26px;
    max-height: 26px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(176, 140, 60, 0.45);
    border-radius: 8px;
    background: rgba(255, 252, 244, 0.95);
    color: var(--brown, #4a2f1a);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .01em;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint-ok:active {
    background: rgba(240, 196, 58, 0.28);
  }
  /* Exit + breed label live in dock mid (between Arılar / Ses) */
  .muayene-hint-mid .bee-exit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .muayene-hint-mid .bee-podium {
    position: absolute;
    left: 50%;
    top: calc(50% + 11px);
    transform: translateX(-50%);
    margin: 0;
    z-index: 2;
  }

  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 5px; min-height: 0;
  }
  /* LOCKED: centered hive+text (PR #16) — do not regress */
  .tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    position: relative; overflow: hidden; min-height: 0; height: 100%;
    /* Center hive + label + badge as one group in the button */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 3px;
    box-sizing: border-box;
  }
  .hive-area {
    position: relative; flex: 0 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-top: 0;
  }

  /* ===== Shared hive: EQUAL tiers, FLUSH sides ===== */
  .hive {
    width: 58px; height: 54px; position: relative; flex: 0 0 auto; margin-top: 0;
  }
  .hive-stack {
    position: absolute; left: 50%; top: 1px; transform: translateX(-50%);
    width: 44px; display: flex; flex-direction: column; align-items: stretch;
  }
  .hive-lid {
    width: 50px; height: 6px; margin-left: -3px; margin-bottom: 0;
    /* Brighter lid from pre-Grok ana.css (4994d59) */
    background: linear-gradient(180deg, #f4f5f7 0%, #c8ccd2 48%, #9aa1aa 100%);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 1px 0 #7c828a;
    position: relative; z-index: 1;
  }
  .hive-lid::after {
    content: ""; position: absolute; left: 50%; top: 2.5px; transform: translateX(-50%);
    width: 14px; height: 1.5px; border-radius: 1px; background: rgba(60,60,70,.45);
  }
  /* Two boxes: IDENTICAL height & width → equal + flush */
  .hive-box {
    height: 18px; /* EQUAL */
    width: 100%;
    /* Warmer fill + highlight wash from 4994d59 .hive-box */
    background-color: var(--wood-hi);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(90, 52, 16, 0.07) 0 1px,
        transparent 1px 6px
      ),
      linear-gradient(180deg, rgba(255, 248, 230, 0.35), transparent 42%, rgba(90, 50, 14, 0.16));
    border-left: 1px solid var(--wood-edge);
    border-right: 1px solid var(--wood-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    position: relative;
    box-sizing: border-box;
  }
  .hive-box.top {
    border-top: 1px solid var(--wood-edge);
  }
  .hive-box.bottom {
    border-bottom: 1px solid var(--wood-edge);
    border-top: 1px solid var(--wood-edge); /* seam matches wood edge (a16661d) */
  }
  /* finger joints INSIDE edges — warm #e0b87a accents from 4994d59 */
  .hive-box::before,
  .hive-box::after {
    content: ""; position: absolute; top: 2px; bottom: 2px; width: 4px;
    background: repeating-linear-gradient(
      180deg,
      #7a5224 0 3px,
      #e0b87a 3px 7px
    );
    pointer-events: none;
  }
  .hive-box::before { left: 0; }
  .hive-box::after { right: 0; }
  .hive-entrance {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 10px; height: 2px; background: #2a1a0c; border-radius: 0 0 1px 1px; z-index: 1;
  }
  /* Invisible landing target centered on the entrance slit (kapı) */
  .hive-door {

      transform .45s ease,

  }
  .mascot-bee.is-flying {
    transform: translate(-50%, -50%) scale(var(--bee-scale)) rotate(var(--bee-rot));

    transition:
      left 1.45s cubic-bezier(.45,.05,.25,1),
      top 1.45s cubic-bezier(.35,.8,.25,1),
      transform .85s cubic-bezier(.35,.2,.2,1),

    transition:

  @keyframes bee-hover {

    if ((b = t.closest('[data-ask-delete]'))) { confirmAct = 'sil'; rerender(); return; }
    if ((b = t.closest('[data-confirm-no]'))) { confirmAct = null; rerender(); return; }
    if ((b = t.closest('[data-do-cancel]')) && cur) { confirmAct = null; var ct = TQ.cancelTalep(cur.id), mr = ct && ct.mevcutReverted ? ct.mevcutReverted.items || [] : []; toast('Talep iptal edildi' + (mr.length ? ' · Mevcut geri döndü: ' + mevList(mr) : '')); return; }
    if ((b = t.closest('[data-do-delete]')) && cur) { confirmAct = null; if (TQ.deleteTalep(cur.id)) { toast('Talep silindi'); backToNeed(); } return; }
    if ((b = t.closest('[data-del]'))) {
      var it = S.list().filter(function (x) { return x.id === b.getAttribute('data-del'); })[0];
      if (!it || !confirm(it.name + ' silinsin mi?')) return;
      S.remove(it.id); form = null; changed(); return;
    }
  });
  function backToNeed() {
    buyEdit = false; confirmAct = null;
    if (detailPushed) { detailPushed = false; history.back(); return; }
    try { history.replaceState(null, '', location.pathname + location.search + '#alinacak'); } catch (e) { /* ignore */ }
    view = 'alinacak'; needKey = ''; $('stPanel').scrollTop = 0; rerender(); refreshRef();
  }
  /* Canlı talepte birim fiyat alanı: değişince kaydet (boş → sizin fiyatınız silinir, kaynak ortalamasına döner) */
  /* Açık talepte tahmini fiyat alanı boşaltıldı: kayıttaki tahmini fiyata dön (ödenen fiyatlar korunur) */
  function revertTpf(tpf) {
    if (tpf.__cleared || view.indexOf('talep-') !== 0) return; tpf.__cleared = true;
    var ti = Number(tpf.getAttribute('data-tpf')), r = TQ.clearTalepLinePrice(view.slice(6), ti);
    setTimeout(function () { if (r) toast('Kayıttaki tahmini fiyata dönüldü'); rerender(); }, 0);
  }
  /* Boş alan + blur: change olmasa da (ör. öneri fiyatı silinip çıkılınca) aynı geri dönüş */
  document.getElementById('stScreen').addEventListener('focusout', function (e) {
    var inp = e.target; if (!inp || inp.tagName !== 'INPUT' || String(inp.value).trim()) return;
    var pf = inp.closest('[data-pf]'); if (pf) { if (String(inp.defaultValue).trim() || TQ.userPrice(pf.getAttribute('data-key'))) savePriceField(pf); return; }
    var tpf = inp.closest('[data-tpf]'); if (tpf) { if (String(inp.defaultValue).trim()) revertTpf(tpf); return; }
    var mf = inp.closest('[data-mev]'); if (mf) { saveMev(mf, false); return; }
    /* alım kaydı: ödenen fiyat boş → talebin tahmini birim fiyatı */
    if (/^p\d+$/.test(inp.name) && inp.closest('[data-buy-form]') && inp.getAttribute('data-est')) inp.value = inp.getAttribute('data-est');
  });
  /* Mevcut alanı: yazarken kısa gecikmeyle, Enter / dışarı dokununca hemen uygulanır; odak ve imleç korunur */
  var mevTimer = null;
  function saveMev(f, keepFocus) {
    clearTimeout(mevTimer);
    var key = f.getAttribute('data-key'), id = f.getAttribute('data-mev'), raw = String(f.elements.m.value).trim();
    var n = raw ? TQ.parseNum(raw) : 0;
    if (raw && !(n >= 0)) return; /* yarım yazılmış sayı: bekle */
    if (keepFocus && /[.,]$/.test(raw)) return;
    var cur = Number((TQ.mevcut()[key]) || 0);
    if (Math.abs((n || 0) - cur) < 1e-9) return;
    TQ.setMevcut(key, n > 0 ? n : 0);
    rerender();
    if (keepFocus) {
      var inp = document.querySelector('[data-mev="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"] input');
      if (inp) { inp.focus(); try { var L = inp.value.length; inp.setSelectionRange(L, L); } catch (e2) { /* ignore */ } }
    }
  }
  /* −/+ dokunuşu yazılan alanın odağını almasın (önce «change» ile yeniden çizim olup dokunuş kaybolmasın) */
  document.getElementById('stScreen').addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('[data-mev-step]')) e.preventDefault(); });
  document.getElementById('stScreen').addEventListener('input', function (e) {
    var mf = e.target.closest && e.target.closest('[data-mev]');
    if (!mf) return;
    clearTimeout(mevTimer);
    mevTimer = setTimeout(function () { if (document.activeElement === mf.elements.m) saveMev(mf, true); }, 450);
  });
  function savePriceField(f) {
    var key = f.getAttribute('data-key'), inp = f.elements.p, raw = String(inp.value).trim(), had = !!TQ.userPrice(key);
    /* Boş bırakıldı (change veya blur): sizin fiyatınız silinir, satır önerilen (kaynak ortalaması) fiyatla yeniden çizilir */
    if (!raw) { if (f.__cleared) return; f.__cleared = true; if (had) { TQ.setPrice(key, ''); toast('Fiyatınız silindi · kaynak ortalaması kullanılır'); } }
    else {
      var v = TQ.parseNum(raw);
      if (!(v > 0)) { alert('Geçerli bir birim fiyat girin (ör. 42,50).'); needKey = ''; rerender(); return; }
      var cur = TQ.priceFor(key);
      if (cur.v != null && Math.abs(cur.v - v) < 0.005) return; /* değişmedi */
      TQ.setPrice(key, v); toast('Fiyat kaydedildi · ' + money2(v));
    }
    setTimeout(function () {
      var ae = document.activeElement, nxt = ae && ae.closest && ae.closest('[data-pf]') ? ae.closest('[data-pf]').getAttribute('data-pf') : null;
      needKey = ''; changed();
      if (nxt) { var el = document.querySelector('[data-pf="' + nxt.replace(/"/g, '') + '"] input'); if (el) el.focus(); }
    }, 0);
  }
  function focusForm() {
    /* Yalnız paneli kaydır (sayfa / telefon çerçevesi yerinde kalsın); form yapışkan başlığın hemen altında */
    var f = $('stForm'), pn = $('stPanel'), hd = pn.querySelector('.st-head'); if (!f) return;
    pn.scrollTop += f.getBoundingClientRect().top - pn.getBoundingClientRect().top - (hd ? hd.offsetHeight + 6 : 0);
  }
  document.getElementById('stScreen').addEventListener('change', function (e) {
    var pf = e.target.closest && e.target.closest('[data-pf]');
    if (pf) { savePriceField(pf); return; }
    var mf = e.target.closest && e.target.closest('[data-mev]');
    if (mf) { saveMev(mf, false); return; }
    var tpf = e.target.closest && e.target.closest('[data-tpf]');
    if (tpf && view.indexOf('talep-') === 0) {
      var tv = TQ.parseNum(tpf.elements.p.value), ti = Number(tpf.getAttribute('data-tpf')), tl0 = TQ.talepById(view.slice(6));
      if (!tl0) return;
      if (!String(tpf.elements.p.value).trim()) { revertTpf(tpf); return; }
      if (!(tv > 0)) { alert('Geçerli bir birim fiyat girin (ör. 42,50).'); rerender(); return; }
      if (tl0.lines[ti] && tl0.lines[ti].price != null && Math.abs(tl0.lines[ti].price - tv) < 0.005) return;
      setTimeout(function () { TQ.setTalepLinePrice(tl0.id, ti, tv); toast('Tahmini fiyat güncellendi · sizin fiyatınız: ' + money2(tv)); }, 0);
      return;
    }
    if (e.target.name === 'category' && e.target.form) {
      var nc = e.target.form.querySelector('[data-newcat]');
      if (nc) { nc.hidden = e.target.value !== '__new'; if (!nc.hidden) { nc.querySelector('input').focus(); return; } }
      if (e.target.form.id === 'stKalem') { kalem.cat = e.target.value; var un = e.target.form.elements.unit; if (un && DEF_UNIT[e.target.value]) un.value = DEF_UNIT[e.target.value]; return; }
    }
    var f = $('stForm'); if (!f || e.target !== f.elements.category || form.id || e.target.value === '__new') return;
    /* Yeni kalemde tür değişince şablonlar / varsayılan birim güncellensin (girilen değerler korunur) */
    var keep = { name: f.elements.name.value, qty: f.elements.qty.value, threshold: f.elements.threshold.value, feedType: f.elements.feedType.value, note: f.elements.note.value };
    form.catSel = f.elements.category.value; rerender();
    f = $('stForm'); if (!f) return;
    f.elements.unit.value = DEF_UNIT[form.catSel] || 'adet';
    Object.keys(keep).forEach(function (k) { f.elements[k].value = keep[k]; });
  });
  document.getElementById('stScreen').addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'stForm') {
      e.preventDefault();
      var rc = resolveCat(f); if (!rc.ok) return;
      var saved = S.save({ id: form && form.id ? form.id : undefined, name: f.elements.name.value, category: rc.cat, unit: f.elements.unit.value,
        qty: f.elements.qty.value, threshold: f.elements.threshold.value, feedType: f.elements.feedType.value, note: f.elements.note.value, skt: f.elements.skt ? f.elements.skt.value : '', opened: f.elements.opened ? f.elements.opened.value : '' });
      if (!saved) return;
      toast('Kaydedildi · ' + saved.name);
      form = null;
      if (view !== 'c-' + saved.category) { location.hash = 'c-' + saved.category; }
      changed(); return;
    }
    if (f.hasAttribute('data-kalem-form')) {
      e.preventDefault();
      var kc = resolveCat(f); if (!kc.ok) return;
      var ko = { name: f.elements.name.value, cat: kc.cat, q: f.elements.q.value, unit: f.elements.unit.value, p: String(f.elements.p.value).trim() };
      var kr = kalem && kalem.tid ? TQ.addTalepLine(kalem.tid, ko) : TQ.addManual(curScope(), ko);
      if (!kr.ok) { alert(kr.error); return; }
      kalem = null; needKey = ''; toast('Kalem eklendi · ' + String(ko.name).trim()); changed(); return;
    }
    if (f.hasAttribute('data-giris-form')) {
      e.preventDefault();
      var gq = TQ.parseNum(f.elements.q.value); if (!(gq > 0)) { alert('Geçerli bir miktar girin.'); return; }
      var gr = S.adjust(f.elements.id.value, gq, 'Giriş (elle)');
      if (gr) { toast('Giriş · ' + gr.name + ': ' + n1(gr.qty) + ' ' + gr.unit); form = null; location.hash = 'c-' + gr.category; changed(); }
      return;
    }
    if (f.hasAttribute('data-cat-rename')) {
      e.preventDefault();
      var rr = S.renameCat(f.getAttribute('data-cat-rename'), f.elements.label.value);
      if (!rr.ok) { alert(rr.error); return; }
      catEdit = false; toast('Kategori adı · ' + rr.label); changed(); return;
    }
    if (f.hasAttribute('data-pf') || f.hasAttribute('data-tpf')) { e.preventDefault(); f.elements.p.blur(); return; }
    if (f.hasAttribute('data-mev')) { e.preventDefault(); f.elements.m.blur(); return; }
    if (f.hasAttribute('data-buy-form')) {
      e.preventDefault();
      var tid = f.getAttribute('data-buy-form'), tl = TQ.talepById(tid); if (!tl) return;
      var entries = [], bad = null;
      tl.lines.forEach(function (l, i) {
        var qe = f.elements['q' + i], pe = f.elements['p' + i]; if (!qe) return;
        var qs = String(qe.value).trim(), ps = String(pe.value).trim();
        var qn = qs ? TQ.parseNum(qs) : 0, pn = ps ? TQ.parseNum(ps) : null;
        if (qs && !(qn >= 0)) bad = bad || qe; if (ps && !(pn > 0)) bad = bad || pe;
        var ske = f.elements['skt' + i];
        entries.push({ i: i, q: qn > 0 ? qn : 0, p: pn > 0 ? pn : null, skt: ske ? ske.value : '' });
      });
      if (bad) { alert('Geçerli bir sayı girin (ör. 12 veya 42,50).'); bad.focus(); return; }
      buyEdit = false;
      var res = TQ.recordPurchase(tid, entries, { stock: f.elements.stock.checked, savePrice: f.elements.price.checked });
      if (!res) { rerender(); return; }
      needKey = '';
      toast('Alım kaydedildi' + (res.skt ? ' · SKT ' + res.skt + ' kalemde' : '') + (res.moves.length ? ' · stoğa ' + res.moves.length + ' hareket' : '') + (res.created.length ? ' · ' + res.created.length + ' yeni stok kalemi' : '') + (res.prices ? ' · ' + res.prices + ' fiyat' : ''));
      changed(); $('stPanel').scrollTop = 0; return;
    }
    if (f.hasAttribute('data-amt-form')) {
      e.preventDefault();
      var qv = Number(String(f.elements.q.value).replace(',', '.'));
      if (!(qv > 0)) { alert('Geçerli bir miktar girin.'); return; }
      var r = S.adjust(amt.id, amt.inn ? qv : -qv, amt.inn ? 'Giriş (elle)' : 'Kullanım (elle)');
      if (r) toast((amt.inn ? 'Giriş' : 'Kullanım') + ' · ' + r.name + ': ' + n1(r.qty) + ' ' + r.unit);
      amt = null; changed();
    }
  });
  /* Alt ＋ (Kayıt) yalnız bu sayfada bağlama göre: ana döşemeler / Hareketler → «Stoğa giriş / Yeni malzeme»; kategori → o türde yeni kalem;
     Alım talebi → «Kalem ekle» (taslak talebe); açık talep ayrıntısı → o talebe «Kalem ekle». nav.js diğer sayfalarda varsayılanı (Hızlı kayıt) korur. */
  window.SuperAriQuickHandler = function () {
    if (view === 'alinacak') { kalem = { tid: '' }; rerender(); focusKalem(); return true; }
    if (view.indexOf('talep-') === 0) {
      var tq = TQ.talepById(view.slice(6)), sq = tq ? TQ.statusOf(tq) : '';
      if (tq && (sq === 'acik' || sq === 'kismen')) { buyEdit = false; kalem = { tid: tq.id }; rerender(); focusKalem(); return true; }
    }
    if (view.indexOf('c-') === 0) { form = { cat: view.slice(2) }; amt = null; rerender(); focusForm(); return true; }
    if (view === 'yeni') { focusForm(); return true; }
    go('yeni'); return true;
  };
  /* Açılışta (ve Alınacaklar her açıldığında) fiyatlar ağdan taze okunur; çevrimdışıyken son başarılı dosya (superari.stok.fiyatcache.v1) */
  refreshRef();
  window.addEventListener('online', function () { refreshRef(); });
  window.addEventListener('superari-records-changed', function () { needKey = ''; rerender(); });
  window.addEventListener('superari-cloud-pulled', function () { needKey = ''; rerender(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { needKey = ''; rerender(); } });
})();
</script>
