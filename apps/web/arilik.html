<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Arılık</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --orange: #f08c00;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    min-height: 100vh; padding: 20px 0 28px;
    overflow-x: hidden; overflow-y: auto;
  }
  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar { flex-shrink: 0;
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  .screen {
    flex: 1 1 auto; min-height: 0; height: auto;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; background: var(--bg);
    padding: 0 14px 16px; position: relative;
  }
  .brand-strip {
    flex: 0 0 auto; min-height: 36px;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 10px; margin-bottom: 10px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a; border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    color: var(--brown); font-size: 13px; font-weight: 800; letter-spacing: .03em;
  }
  .brand-strip::before {
    content: ""; flex: 0 0 4px; align-self: stretch; margin: -2px 0; border-radius: 3px;
    background: linear-gradient(180deg, var(--hardal-hi), var(--hardal) 40%, var(--hardal-lo));
  }
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .page-head h1 {
    font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em;
  }
  .page-head p { margin-top: 2px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .nav-chips { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .back-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 11px; border-radius: 10px;
    background: #fff; border: 1px solid var(--card-border);
    color: var(--text); font-size: 12px; font-weight: 700; text-decoration: none;
  }
  .hero-card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 18px;
    padding: 16px 14px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(40, 30, 10, .05);
  }
  .hero-top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .hero-ico {
    width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center; flex: 0 0 auto;
    background: linear-gradient(145deg, #ffe08a, var(--hardal));
    color: var(--brown);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
  }
  .hero-ico svg { width: 26px; height: 26px; }
  .hero-title { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.25; }
  .hero-place { margin-top: 3px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .stat {
    padding: 12px; border-radius: 14px;
    background: #f7f8fa; border: 1px solid var(--card-border);
  }
  .stat .k { font-size: 11px; font-weight: 700; color: var(--muted); }
  .stat .v { margin-top: 4px; font-size: 16px; font-weight: 800; color: var(--text); }
  a.stat-link {
    display: block; text-decoration: none; color: inherit;
    transition: transform .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  a.stat-link:active { transform: scale(.98); }
  a.stat-link .v { color: var(--brown); }
  a.stat-link .k::after { content: " ›"; color: #b0aaa3; font-weight: 800; }
  .map-card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 18px;
    padding: 12px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(40, 30, 10, .05);
  }
  .map-card h2 {
    font-size: 14px; font-weight: 800; color: var(--text);
    margin: 0 2px 10px;
  }
  .map-search-row {
    display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 6px;
  }
  .map-search-row input {
    width: 100%; border: 1px solid var(--card-border); border-radius: 12px;
    padding: 10px 12px; font-size: 14px; font-weight: 600; color: var(--text);
    background: #f7f8fa; font-family: inherit;
  }
  .map-search-row .btn-ara {
    min-height: 42px; min-width: 64px; padding: 0 12px;
    border: 0; border-radius: 12px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 800;
    background: linear-gradient(145deg, var(--hardal-hi), var(--hardal));
    color: #3b2b00;
  }
  .map-search-results {
    list-style: none; margin: 0 0 8px; padding: 0;
    max-height: 132px; overflow-y: auto;
    border: 1px solid var(--card-border); border-radius: 12px;
    background: #fff; display: none;
  }
  .map-search-results.is-on { display: block; }
  .map-search-results li button {
    width: 100%; text-align: left; border: 0; border-bottom: 1px solid #f0f1f3;
    background: #fff; padding: 10px 12px; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 650; color: var(--text); line-height: 1.3;
  }
  .map-search-results li:last-child button { border-bottom: 0; }
  .map-search-results li button:active { background: #fff8df; }
  .map-search-results .meta {
    display: block; margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--muted);
  }
  .ymap-host { position: relative; }
  #detailMap {
    height: 200px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--card-border); background: #e8ece8;
  }
  .ymap-host .ymap-geri {
    display: none; position: absolute; top: 10px; left: 10px; z-index: 2500;
    min-height: 32px; padding: 6px 12px; border-radius: 999px; border: 0; cursor: pointer;
    font-size: 12px; font-weight: 800; font-family: inherit;
    background: rgba(255,255,255,.94); color: var(--text);
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    -webkit-tap-highlight-color: transparent;
  }
  .ymap-host.is-fullscreen .ymap-geri { display: inline-flex; align-items: center; }
  .ymap-tap-hint {
    display: none; position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    z-index: 500; padding: 5px 10px; border-radius: 999px;
    background: rgba(20,16,10,.72); color: #fff; font-size: 11px; font-weight: 700;
    pointer-events: none; white-space: nowrap;
  }
  .ymap-tap-hint.is-on { display: block; }
  .ymap-host.is-fullscreen {
    position: absolute; inset: 0; z-index: 120; margin: 0;
    border-radius: 0; border: 0; background: #f7f8fa;
    display: flex; flex-direction: column;
  }
  .ymap-host.is-fullscreen #detailMap {
    flex: 1 1 auto; height: 100% !important;
    border-radius: 0 !important; border: 0 !important;
  }
  .ymap-host.is-fullscreen .ymap-tap-hint { display: none !important; }
  .map-actions { flex-wrap: wrap; }
  .map-tool-row { flex-wrap: wrap; }
  .ymap-bookmarks { margin-top: 6px; }
  #detailMap { width: 100%; min-height: 220px; border-radius: 14px; overflow: hidden; background: #eef1f4; }

  .map-missing {
    padding: 12px; border-radius: 14px;
    background: #fff8df; border: 1px dashed #e0c56a;
    color: var(--muted); font-size: 13px; line-height: 1.4; margin-bottom: 10px;
  }
  .map-hint-inline {
    margin: 6px 0 0; font-size: 11px; color: var(--muted); line-height: 1.35;
  }
  .map-actions { display: grid; gap: 8px; margin-top: 10px; }
  .map-tool-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
  }
  .map-btn {
    min-height: 42px; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 13px; font-weight: 800; font-family: inherit;
    background: linear-gradient(145deg, var(--hardal-hi), var(--hardal));
    color: #3b2b00;
  }
  .map-coords-line {
    margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--brown);
    font-variant-numeric: tabular-nums;
  }
  button.map-coords-line {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; padding: 8px 2px; cursor: pointer;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  button.map-coords-line:active { opacity: .75; }
  button.stat-tap {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  button.stat-tap:active { transform: scale(.98); }
  button.stat-tap .k::after { content: " ›"; color: #b0aaa3; font-weight: 800; }
  .loc-actions {
    display: none !important; /* default clean: actions live in Konum sheet */
  }
  .map-tool-row {
    display: none !important; /* hidden unless editing — use #mapEditTools.is-on */
  }
  #mapEditTools.is-on.map-tool-row,
  #mapEditTools.is-on {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .map-loc-bar {
    display: flex; gap: 8px; margin-top: 8px; align-items: center;
  }
  .map-loc-bar .map-btn { flex: 1; }
  .map-btn.ghost {
    background: #fff; border: 1px solid #e0c56a; color: var(--brown);
  }
  .map-btn:disabled { opacity: .45; cursor: not-allowed; }
  .map-paste {
    margin-top: 8px; display: grid; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .map-paste .map-paste-row { margin-bottom: 0; }
  .map-paste input {
    width: 100%; border: 1px solid var(--card-border); border-radius: 12px;
    padding: 10px 12px; font-size: 13px; font-weight: 560; color: var(--text);
    background: #f7f8fa; font-family: inherit;
  }
  .sheet {
    position: absolute; inset: 0; z-index: 80;
    background: rgba(20, 16, 10, .45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .sheet.is-open { opacity: 1; pointer-events: auto; }
  .sheet-card {
    width: 100%; background: #fff; border-radius: 22px 22px 0 0;
    padding: 16px 14px 26px;
    transform: translateY(24px); transition: transform .22s ease;
    max-height: 78%; overflow-y: auto;
  }
  .sheet.is-open .sheet-card { transform: translateY(0); }
  .sheet-card h2 { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  .sheet-card .sheet-sub {
    font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 12px;
  }
  .sheet-list { display: grid; gap: 8px; }
  .sheet-item {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 48px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--card-border); background: #f7f8fa;
    color: var(--text); font-size: 14px; font-weight: 750;
    text-decoration: none; cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .sheet-item:active { transform: scale(.98); }
  .sheet-item .chev { color: #b0aaa3; font-size: 18px; }
  .sheet-cancel {
    margin-top: 10px; width: 100%; min-height: 46px; border-radius: 12px;
    border: 0; background: #f0f1f3; color: var(--text);
    font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .section-title {
    font-size: 14px; font-weight: 800; color: var(--text);
    margin: 4px 2px 10px;
  }
  .action-row { display: grid; gap: 8px; margin-bottom: 16px; }
  .action-link, button.action-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 14px; border-radius: 14px;
    background: #fff; border: 1px solid var(--card-border);
    text-decoration: none; color: var(--text);
    font-size: 14px; font-weight: 750; font-family: inherit;
    width: 100%; cursor: pointer; text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .action-link span { color: #b0aaa3; font-size: 18px; }
  .action-link:active { transform: scale(.98); }
  .move-list { display: grid; gap: 8px; margin-bottom: 16px; }
  .move-item {
    display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start;
    padding: 12px; border-radius: 14px;
    background: #fff; border: 1px solid var(--card-border);
  }
  .move-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
  .move-item h3 { font-size: 13px; font-weight: 750; color: var(--text); }
  .move-item .meta { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .move-item .amt {
    font-size: 13px; font-weight: 800; color: var(--text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .mode-field { margin-bottom: 12px; }
  .mode-field .mode-label {
    display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px;
  }
  .mode-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mode-chip {
    min-height: 42px; border-radius: 12px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--card-border); background: #f7f8fa;
    color: var(--text); font-size: 13px; font-weight: 750;
  }
  .mode-chip.is-on {
    border-color: #e0c56a;
    background: linear-gradient(145deg, #fff6df, var(--hardal-soft));
    color: var(--brown);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
  }
  .fuel-hint {
    margin: 0 0 12px; padding: 10px 12px; border-radius: 12px;
    background: #fff8df; border: 1px dashed #e0c56a;
    color: var(--muted); font-size: 12px; line-height: 1.4; font-weight: 600;
  }
  .sheet-card label {
    display: grid; gap: 5px; margin-bottom: 12px;
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .sheet-card input, .sheet-card textarea {
    width: 100%; border: 1px solid var(--card-border); border-radius: 12px;
    padding: 11px 12px; font-size: 15px; font-weight: 600; color: var(--text);
    background: #f7f8fa; font-family: inherit;
  }
  .sheet-card textarea { min-height: 64px; resize: vertical; font-weight: 500; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .btn {
    min-height: 44px; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 14px; font-weight: 800; font-family: inherit;
  }
  .btn.cancel { background: #f0f1f3; color: var(--text); }
  .btn.save {
    background: linear-gradient(145deg, var(--hardal-hi), var(--hardal));
    color: #3b2b00;
  }
  .hive-list { display: grid; gap: 8px; }
  .hive-item {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
    padding: 12px; border-radius: 14px;
    background: #fff; border: 1px solid var(--card-border);
    text-decoration: none; color: inherit;
  }
  .hive-item h3 { font-size: 13px; font-weight: 750; color: var(--text); }
  .hive-item .meta { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .hive-item .badge {
    font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px;
    background: #fff8df; color: var(--brown); white-space: nowrap;
  }
  .empty {
    padding: 14px; border-radius: 14px;
    background: #fff8df; border: 1px dashed #e0c56a;
    color: var(--muted); font-size: 13px; line-height: 1.4;
  }
  .missing {
    padding: 18px 14px; border-radius: 16px;
    background: #fff; border: 1px solid var(--card-border);
    text-align: center;
  }
  .missing h2 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .missing p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  .btn-delete-apiary {
    display: block; width: 100%; margin: 8px 0 4px;
    padding: 12px 14px; border-radius: 12px;
    border: 1px solid #e8c4bc; background: #fdf3f0;
    color: #8a3b2a; font-size: 14px; font-weight: 750;
    font-family: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-delete-apiary:active { transform: scale(.99); background: #f8e6e0; }
  .delete-hint {
    margin: 0 2px 18px; font-size: 11px; font-weight: 600;
    color: var(--muted); line-height: 1.35;
  }
  .tabbar {
    flex-shrink: 0;
    height: 72px; background: #fff; border-top: 1px solid #e6e8ec;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 0 4px 10px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #8b8680; font-size: 10px; font-weight: 600;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--orange); }
  .tab svg { width: 22px; height: 22px; }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }
  @media (max-width: 420px) {
    body { padding: 0; background: #f7f8fa; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .phone-notch, .home-indicator { display: none; }
    .screen { flex: 1 1 auto; min-height: 0; height: auto; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen" id="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1 id="pageTitle">Arılık</h1>
        <p id="pageSub">Detay</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ariliklar.html">← Arılıklar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab active" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler
    </a>
    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>

  <div class="sheet" id="locSheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="locSheetTitle">
      <h2 id="locSheetTitle">Konum</h2>
      <p class="sheet-sub" id="locSheetSub"></p>
      <div class="sheet-list" id="locSheetList"></div>
      <button type="button" class="sheet-cancel" id="locSheetCancel">Vazgeç</button>
    </div>
  </div>

  <div class="sheet" id="moveSheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="moveSheetTitle">
      <h2 id="moveSheetTitle">Taşıma kaydet</h2>
      <p class="sheet-sub" id="moveSheetSub">Nakliye veya kendi araç</p>
      <form id="moveForm">
        <div class="mode-field">
          <span class="mode-label">Taşıma şekli</span>
          <div class="mode-chips" role="group" aria-label="Taşıma şekli">
            <button type="button" class="mode-chip is-on" data-mode="nakliye" id="arModeNakliye">Nakliye</button>
            <button type="button" class="mode-chip" data-mode="kendi_arac" id="arModeKendi">Kendi araç</button>
          </div>
          <input type="hidden" name="mode" id="arTransportMode" value="nakliye" />
        </div>
        <p class="fuel-hint" id="arFuelHint" hidden>
          Kendi araç seçildi — yakıt tutarı zorunlu; Giderler’de Yakıt kaydı oluşur.
        </p>
        <label id="arAmountLabel"><span id="arAmountLabelText">Nakliye ücreti (₺)</span>
          <input name="amount" type="number" inputmode="decimal" min="1" step="1" required placeholder="0" />
        </label>
        <label>Tarih
          <input name="date" type="date" required />
        </label>
        <label>Not
          <textarea name="note" maxlength="160" placeholder="Örn. Yaylaya çıkış"></textarea>
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn cancel" id="moveSheetCancel">Vazgeç</button>
          <button type="submit" class="btn save">Kaydet</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="admin-notify.js"></script>
<script src="yandex-config.js"></script>
<script src="yandex-map.js"></script>
<script src="demo-data.js"></script>
<script src="forage-analysis.js"></script>
<script src="gider-store.js?v=reconcile-1"></script>
<script>
(function () {
  var D = window.SuperAriDemo;
  var G = window.SuperAriGider;
  var F = window.SuperAriForage;
  if (!D) return;

  var DEFAULT_CENTER = [39.92, 41.27];
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || params.get('apiary') || '';
  var content = document.getElementById('content');
  var titleEl = document.getElementById('pageTitle');
  var subEl = document.getElementById('pageSub');
  var locSheet = document.getElementById('locSheet');
  var locSheetTitle = document.getElementById('locSheetTitle');
  var locSheetSub = document.getElementById('locSheetSub');
  var locSheetList = document.getElementById('locSheetList');
  var moveSheet = document.getElementById('moveSheet');
  var moveForm = document.getElementById('moveForm');
  var arModeInput = document.getElementById('arTransportMode');
  var arFuelHint = document.getElementById('arFuelHint');
  var arAmountLabelText = document.getElementById('arAmountLabelText');
  var detailMapCtrl = null;
  var detailPlacemark = null;
  var pickMode = false;
  var activeApiary = null;
  var radar = null;
  var analyzeTimer = null;
  var pendingSearchName = '';
  var searchResultsCache = [];
  var forageRadiusKm = (F && F.DEFAULT_RADIUS_KM) || 3;
  var forageManual = false;
  var Y = window.SuperAriYandexMap;
  var detailMapFs = null;
  var detailMapReady = null;

  function forageOptsFor(apiary) {
    var list = (D && D.loadApiaries) ? D.loadApiaries() : [];
    return {
      apiaries: list,
      excludeId: apiary && apiary.id != null ? apiary.id : null,
      ownHiveCount: apiary && apiary.hiveCount != null ? apiary.hiveCount : 0
    };
  }

  function applyAutoForage(lat, lon, apiary) {
    if (!F || !F.recommendRadiusKm || forageManual) return forageRadiusKm;
    if (!isFinite(lat) || !isFinite(lon)) return forageRadiusKm;
    var rec = F.recommendRadiusKm(lat, lon, forageOptsFor(apiary || activeApiary));
    forageRadiusKm = rec.km;
    var radiusInput = document.getElementById('forageRadius');
    var radiusVal = document.getElementById('forageRadiusVal');
    if (radiusInput) radiusInput.value = String(forageRadiusKm);
    if (radiusVal) radiusVal.textContent = forageRadiusKm + ' km';
    return forageRadiusKm;
  }


  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtCoord(n) {
    if (n == null || !isFinite(n)) return '—';
    return Number(n).toFixed(4);
  }

  function hasCoords(a) {
    return a && isFinite(Number(a.lat)) && isFinite(Number(a.lon));
  }

  function formatTRY(n) {
    return '₺' + Math.round(Number(n) || 0).toLocaleString('tr-TR');
  }

  function formatDate(iso) {
    if (!iso) return '—';
    var p = String(iso).split('-');
    if (p.length !== 3) return iso;
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  function closeLocSheet() {
    locSheet.classList.remove('is-open');
    setTimeout(function () { locSheet.hidden = true; }, 220);
  }

  function openLocSheet(title, sub, items) {
    locSheetTitle.textContent = title;
    locSheetSub.textContent = sub || '';
    locSheetList.innerHTML = items.map(function (it) {
      return (
        '<button type="button" class="sheet-item" data-action="' + escapeHtml(it.action) + '">' +
          '<span>' + escapeHtml(it.label) + '</span>' +
          '<span class="chev" aria-hidden="true">›</span>' +
        '</button>'
      );
    }).join('');
    locSheet.hidden = false;
    requestAnimationFrame(function () { locSheet.classList.add('is-open'); });
  }

  function setArTransportMode(mode) {
    mode = mode === 'kendi_arac' ? 'kendi_arac' : 'nakliye';
    arModeInput.value = mode;
    moveSheet.querySelectorAll('.mode-chip').forEach(function (btn) {
      btn.classList.toggle('is-on', (btn.getAttribute('data-mode') || '') === mode);
    });
    arFuelHint.hidden = mode !== 'kendi_arac';
    arAmountLabelText.textContent = mode === 'kendi_arac' ? 'Yakıt tutarı (₺)' : 'Nakliye ücreti (₺)';
  }

  function closeMoveSheet() {
    moveSheet.classList.remove('is-open');
    setTimeout(function () { moveSheet.hidden = true; }, 220);
  }

  function openMoveSheet() {
    if (!activeApiary || !G) return;
    document.getElementById('moveSheetSub').textContent =
      (activeApiary.place || activeApiary.name) + ' · gider listesine yazılır';
    moveForm.reset();
    moveForm.elements.date.value = G.todayIso();
    setArTransportMode('nakliye');
    moveSheet.hidden = false;
    requestAnimationFrame(function () { moveSheet.classList.add('is-open'); });
    setTimeout(function () { moveForm.elements.amount.focus(); }, 220);
  }

  moveSheet.querySelectorAll('.mode-chip').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setArTransportMode(btn.getAttribute('data-mode') || 'nakliye');
    });
  });
  document.getElementById('moveSheetCancel').addEventListener('click', closeMoveSheet);
  moveSheet.addEventListener('click', function (e) {
    if (e.target === moveSheet) closeMoveSheet();
  });
  moveForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!activeApiary || !G) return;
    var mode = arModeInput.value === 'kendi_arac' ? 'kendi_arac' : 'nakliye';
    var amount = Number(moveForm.elements.amount.value);
    var date = moveForm.elements.date.value;
    var note = String(moveForm.elements.note.value || '').trim();
    if (mode === 'kendi_arac' && !(amount > 0)) {
      alert('Kendi araçta yakıt tutarı zorunludur.');
      moveForm.elements.amount.focus();
      return;
    }
    if (!(amount > 0) || !date) return;
    try {
      G.recordTransport({
        mode: mode,
        amount: amount,
        date: date,
        note: note,
        apiaryId: activeApiary.id,
        apiaryName: activeApiary.name || activeApiary.place || ''
      });
    } catch (err) {
      alert((err && err.message) || 'Kayıt başarısız.');
      return;
    }
    closeMoveSheet();
    render();
  });

  function mapsLabel(a) {
    return (a.place || a.name || 'Arılık') + '';
  }

  function shareText(a) {
    var lat = Number(a.lat);
    var lon = Number(a.lon);
    var yUrl = D.yandexMapsUrl ? D.yandexMapsUrl(lat, lon, 15) :
      ('https://yandex.com/maps/?pt=' + lon + ',' + lat + '&z=15&l=map');
    return (
      mapsLabel(a) + ' — Hardal Arıcılık\n' +
      lat.toFixed(5) + ', ' + lon.toFixed(5) + '\n' +
      yUrl
    );
  }

  function navApps(a) {
    var lat = Number(a.lat);
    var lon = Number(a.lon);
    var q = encodeURIComponent(mapsLabel(a));
    return [
      {
        label: 'Yandex Haritalar',
        url: D.yandexMapsUrl ? D.yandexMapsUrl(lat, lon, 15) :
          ('https://yandex.com/maps/?pt=' + lon + ',' + lat + '&z=15&l=map')
      },
      {
        label: 'Yandex Navigasyon',
        url: 'yandexnavi://build_route_on_map?lat_to=' + lat + '&lon_to=' + lon
      },
      {
        label: 'Google Maps',
        url: 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lon + '&travelmode=driving'
      },
      {
        label: 'Apple Haritalar',
        url: 'https://maps.apple.com/?daddr=' + lat + ',' + lon + '&q=' + q
      },
      {
        label: 'OpenStreetMap',
        url: 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=15/' + lat + '/' + lon
      },
      {
        label: 'Bing Maps',
        url: 'https://www.bing.com/maps?cp=' + lat + '~' + lon + '&lvl=15&sp=point.' + lat + '_' + lon
      },
      {
        label: 'geo: (sistem)',
        url: 'geo:' + lat + ',' + lon + '?q=' + lat + ',' + lon + '(' + q + ')'
      }
    ];
  }

  function openNavChooser() {
    if (!activeApiary || !hasCoords(activeApiary)) return;
    var a = activeApiary;
    var apps = navApps(a);
    openLocSheet(
      'Navigasyon uygulaması',
      mapsLabel(a) + ' · ' + fmtCoord(a.lat) + ', ' + fmtCoord(a.lon),
      apps.map(function (app, i) {
        return { label: app.label, action: 'nav:' + i };
      })
    );
    locSheetList.querySelectorAll('.sheet-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-action') || '';
        var idx = Number(act.replace('nav:', ''));
        var app = apps[idx];
        if (!app) return;
        closeLocSheet();
        window.open(app.url, '_blank', 'noopener');
      });
    });
  }

  function shareLocation() {
    if (!activeApiary || !hasCoords(activeApiary)) return;
    var a = activeApiary;
    var text = shareText(a);
    var lat = Number(a.lat);
    var lon = Number(a.lon);
    var url = D.yandexMapsUrl ? D.yandexMapsUrl(lat, lon, 15) :
      ('https://yandex.com/maps/?pt=' + lon + ',' + lat + '&z=15&l=map');
    closeLocSheet();
    if (navigator.share) {
      navigator.share({ title: mapsLabel(a), text: text, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        alert('Konum panoya kopyalandı.');
      }).catch(function () {
        prompt('Konumu kopyalayın:', text);
      });
      return;
    }
    prompt('Konumu kopyalayın:', text);
  }

  function currentDetailPin() {
    var c = Y && detailPlacemark ? Y.placemarkCoords(detailPlacemark) : null;
    if (c) return c;
    if (activeApiary && hasCoords(activeApiary)) {
      return { lat: Number(activeApiary.lat), lon: Number(activeApiary.lon) };
    }
    return null;
  }

  function startPickMode() {
    pickMode = true;
    var btnSave = document.getElementById('btnSaveLoc');
    var btnPick = document.getElementById('btnPickLoc');
    var editTools = document.getElementById('mapEditTools');
    if (btnSave) {
      btnSave.hidden = false;
      btnSave.textContent = 'Bu konumu kaydet';
    }
    if (btnPick) btnPick.hidden = true;
    if (editTools) editTools.classList.add('is-on');
    try {
      if (detailPlacemark) detailPlacemark.options.set('draggable', true);
    } catch (eDrag) {}
  }

  function openOtherMapsSheet() {
    var pin = currentDetailPin();
    if (!pin || !Y) {
      alert('Önce haritadan veya aramadan bir konum seçin.');
      return;
    }
    var providers = [
      { label: 'Google Maps', action: 'ext:google' },
      { label: 'Apple Haritalar', action: 'ext:apple' },
      { label: 'OpenStreetMap', action: 'ext:osm' },
      { label: 'Bing Maps', action: 'ext:bing' }
    ];
    openLocSheet('Diğer haritalar', fmtCoord(pin.lat) + ', ' + fmtCoord(pin.lon), providers);
    locSheetList.querySelectorAll('.sheet-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-action') || '';
        if (act.indexOf('ext:') === 0) {
          closeLocSheet();
          Y.openExternal(act.slice(4), pin.lat, pin.lon, 15);
        }
      });
    });
  }

  function openLocMenu() {
    if (!activeApiary || !hasCoords(activeApiary)) return;
    var a = activeApiary;
    openLocSheet(
      'Konum',
      mapsLabel(a) + ' · ' + fmtCoord(a.lat) + ', ' + fmtCoord(a.lon),
      [
        { label: 'Konuma git (yol tarifi)', action: 'goto' },
        { label: 'Konumu gönder', action: 'share' },
        { label: 'Yandex’te aç', action: 'yandex' },
        { label: 'Diğer haritalarda aç', action: 'other' },
        { label: 'Konumu değiştir', action: 'pick' }
      ]
    );
    locSheetList.querySelectorAll('.sheet-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var act = btn.getAttribute('data-action');
        if (act === 'goto') openNavChooser();
        else if (act === 'share') shareLocation();
        else if (act === 'yandex') {
          closeLocSheet();
          var pin = currentDetailPin();
          if (pin && Y) Y.openExternal('yandex', pin.lat, pin.lon, 14);
        } else if (act === 'other') openOtherMapsSheet();
        else if (act === 'pick') {
          closeLocSheet();
          startPickMode();
        }
      });
    });
  }

  document.getElementById('locSheetCancel').addEventListener('click', closeLocSheet);
  locSheet.addEventListener('click', function (e) {
    if (e.target === locSheet) closeLocSheet();
  });

  function placeDetailMarker(lat, lon, name) {
    if (!detailMapCtrl) return;
    var la = typeof lat === 'object' ? lat.lat : lat;
    var lo = typeof lat === 'object' ? (lat.lng != null ? lat.lng : lat.lon) : lon;
    detailPlacemark = Y.upsertPlacemark(detailMapCtrl, detailPlacemark, la, lo, {
      draggable: !!pickMode,
      onDrag: function (a, b) {
        if (!pickMode || !radar) return;
        radar.setCenter(a, b);
      },
      onDragEnd: function (a, b) {
        if (!pickMode) return;
        var line = document.getElementById('pickCoords');
        if (line) line.textContent = a.toFixed(4) + ', ' + b.toFixed(4) + ' (sürükle · kaydet)';
        var saveBtn = document.getElementById('btnSaveLoc');
        if (saveBtn) saveBtn.hidden = false;
        updateRadarAndAnalyze(a, b);
      },
      onClick: function () {
        if (!pickMode && activeApiary && hasCoords(activeApiary)) openLocMenu();
      }
    });
    try {
      if (detailPlacemark) detailPlacemark.options.set('draggable', !!pickMode);
    } catch (e0) {}
    var line = document.getElementById('pickCoords');
    if (line) {
      line.textContent = Number(la).toFixed(4) + ', ' + Number(lo).toFixed(4) +
        (pickMode ? ' (sürükle · kaydet)' : '');
    }
    if (name) pendingSearchName = name;
    updateRadarAndAnalyze(la, lo);
  }

  function updateRadarAndAnalyze(lat, lon) {
    if (isFinite(lat) && isFinite(lon) && !forageManual) {
      applyAutoForage(lat, lon, activeApiary);
    }
    if (radar && isFinite(lat) && isFinite(lon)) {
      radar.setRadiusKm(forageRadiusKm);
      radar.setCenter(lat, lon);
    }
    var host = document.getElementById('forageHost');
    if (!F || !host || !isFinite(lat) || !isFinite(lon)) return;
    if (analyzeTimer) clearTimeout(analyzeTimer);
    host.innerHTML = '<div class="forage-panel"><p class="forage-sub">Yer analizi güncelleniyor…</p></div>';
    analyzeTimer = setTimeout(function () {
      F.analyze(lat, lon, forageRadiusKm)
        .then(function (a) {
          host.innerHTML = F.renderPanelHtml(a, escapeHtml);
        })
        .catch(function () {
          host.innerHTML =
            '<div class="forage-panel is-empty"><p>Analiz alınamadı — konum yine kaydedilebilir.</p></div>';
        });
    }, 280);
  }

  function hideSearchResults() {
    var el = document.getElementById('mapSearchResults');
    if (!el) return;
    el.classList.remove('is-on');
    el.hidden = true;
    el.innerHTML = '';
  }

  function showSearchResults(items) {
    var el = document.getElementById('mapSearchResults');
    if (!el) return;
    searchResultsCache = items || [];
    if (!items || !items.length) {
      el.innerHTML = '<li><button type="button" disabled>Sonuç yok — Yandex’te aç veya haritaya dokun</button></li>';
      el.hidden = false;
      el.classList.add('is-on');
      return;
    }
    el.innerHTML = items.map(function (it, i) {
      return (
        '<li><button type="button" data-idx="' + i + '">' +
          escapeHtml(it.name) +
          (it.label && it.label !== it.name
            ? '<span class="meta">' + escapeHtml(it.label) + '</span>'
            : '') +
        '</button></li>'
      );
    }).join('');
    el.hidden = false;
    el.classList.add('is-on');
    el.querySelectorAll('button[data-idx]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        var hit = searchResultsCache[idx];
        if (!hit || !detailMapCtrl) return;
        pickMode = true;
        placeDetailMarker(hit.lat, hit.lon, hit.name);
        detailMapCtrl.setView(hit.lat, hit.lon, 13);
        var saveBtn = document.getElementById('btnSaveLoc');
        var pickBtn = document.getElementById('btnPickLoc');
        if (saveBtn) {
          saveBtn.hidden = false;
          saveBtn.textContent = 'Bu konumu kaydet';
        }
        if (pickBtn) pickBtn.hidden = true;
        hideSearchResults();
      });
    });
  }

  function runDetailSearch() {
    var input = document.getElementById('mapSearch');
    var btn = document.getElementById('mapSearchBtn');
    if (!input) return;
    var q = String(input.value || '').trim();
    if (!q) {
      alert('Aramak için yer adı yazın.');
      return;
    }
    if (btn) {
      btn.disabled = true;
      btn.textContent = '…';
    }
    var searchPromise =
      Y && Y.hasApiKey()
        ? Y.searchPlaces(q).catch(function (err) {
            if (
              (Y && Y.isBusyOrQuotaError && Y.isBusyOrQuotaError(err)) ||
              (err && String(err.message || '').indexOf('yandex_quota') >= 0)
            ) {
              return Promise.reject(err);
            }
            return D.geocodeSearch ? D.geocodeSearch(q) : [];
          })
        : D.geocodeSearch
          ? D.geocodeSearch(q)
          : Promise.resolve([]);
    searchPromise
      .then(function (items) {
        showSearchResults(items);
        if (items.length === 1 && detailMapCtrl) {
          pickMode = true;
          var hit = items[0];
          placeDetailMarker(hit.lat, hit.lon, hit.name);
          detailMapCtrl.setView(hit.lat, hit.lon, 13);
          var saveBtn = document.getElementById('btnSaveLoc');
          var pickBtn = document.getElementById('btnPickLoc');
          if (saveBtn) {
            saveBtn.hidden = false;
            saveBtn.textContent = 'Bu konumu kaydet';
          }
          if (pickBtn) pickBtn.hidden = true;
        }
      })
      .catch(function (err) {
        if (
          (Y && Y.isBusyOrQuotaError && Y.isBusyOrQuotaError(err)) ||
          (err && String(err.message || '').indexOf('yandex_quota') >= 0) ||
          (window.SuperAriAdminNotify && SuperAriAdminNotify.isBusyOrQuotaError(err))
        ) {
          var msg =
            (Y && Y.USER_BUSY_MSG) ||
            (window.SuperAriAdminNotify && SuperAriAdminNotify.USER_MSG) ||
            'Talep yoğunluğundan dolayı lütfen yarın deneyiniz.';
          if (window.SuperAriAdminNotify) {
            SuperAriAdminNotify.warnUserBusyAndNotify({ source: 'arilik_search', reason: String(err && err.message || 'search') });
          } else if (Y && Y.notifyAdminsBusy) {
            Y.notifyAdminsBusy({ source: 'arilik_search' });
          }
          alert(msg);
        } else {
          alert('Arama başarısız. Yandex’te açıp link yapıştırabilirsiniz.');
        }
        hideSearchResults();
      })
      .then(function () {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Ara';
        }
      });
  }

  function mountMap(apiary) {
    var el = document.getElementById('detailMap');
    if (!el) return;
    if (radar) {
      try { radar.clear(); } catch (eR) {}
      radar = null;
    }
    if (detailMapFs) {
      try { detailMapFs.destroy(); } catch (e0) { /* ignore */ }
      detailMapFs = null;
    }
    if (detailMapCtrl) {
      try { detailMapCtrl.destroy(); } catch (e1) {}
      detailMapCtrl = null;
      detailPlacemark = null;
    }
    detailMapReady = null;

    if (!Y) {
      el.innerHTML = '<div class="ymap-key-needed"><strong>Yandex harita modülü yok</strong></div>';
      return;
    }
    if (!Y.hasApiKey()) {
      Y.showKeyRequired(el);
      return;
    }

    var center = hasCoords(apiary) ? [Number(apiary.lat), Number(apiary.lon)] : DEFAULT_CENTER;
    var zoom = hasCoords(apiary) ? 12 : 9;
    detailMapReady = Y.createMap(el, { center: center, zoom: zoom }).then(function (ctrl) {
      detailMapCtrl = ctrl;
      radar = Y.attachRadar(ctrl, { radiusKm: forageRadiusKm });
      var host = document.getElementById('detailMapHost');
      if (host) {
        detailMapFs = Y.attachFullscreen(host, el, ctrl, {
          root: document.getElementById('phone')
        });
      }
      if (hasCoords(apiary)) {
        placeDetailMarker(Number(apiary.lat), Number(apiary.lon));
      }
      ctrl.map.events.add('click', function (e) {
        var c = e.get('coords');
        var la = c[0];
        var lo = c[1];
        var wasClosed = detailMapFs && detailMapFs.isOpen && !detailMapFs.isOpen();
        if (wasClosed) detailMapFs.open();
        /* Any tap places/moves pin, enters pick mode, shows Save — no menu-only zoom. */
        if (!pickMode) startPickMode();
        var z = ctrl.getZoom();
        if (z < 14) ctrl.setView(la, lo, Math.min(16, z + 2));
        placeDetailMarker(la, lo, pendingSearchName);
        var saveBtn = document.getElementById('btnSaveLoc');
        if (saveBtn) saveBtn.hidden = false;
        if (Y && Y.reverseGeocode) {
          Y.reverseGeocode(la, lo).then(function (geo) {
            var nm = (geo && (geo.name || geo.label)) || '';
            if (nm) pendingSearchName = nm;
            placeDetailMarker(la, lo, nm || pendingSearchName);
            var line = document.getElementById('pickCoords');
            if (line) {
              line.textContent =
                (nm ? nm + ' · ' : '') +
                Number(la).toFixed(4) + ', ' + Number(lo).toFixed(4) +
                ' (sürükle · kaydet)';
            }
          });
        }
        if (wasClosed) {
          setTimeout(function () {
            if (ctrl.invalidateSize) ctrl.invalidateSize();
          }, 100);
          setTimeout(function () {
            if (ctrl.invalidateSize) ctrl.invalidateSize();
          }, 320);
        }
      });
      setTimeout(function () { ctrl.invalidateSize(); }, 60);
      return ctrl;
    }).catch(function (err) {
      detailMapReady = null;
      if (err && String(err.message || '').indexOf('yandex_api_key') >= 0) {
        Y.showKeyRequired(el);
      } else if (
        (Y && Y.isBusyOrQuotaError && Y.isBusyOrQuotaError(err)) ||
        (err && String(err.message || '').indexOf('yandex_quota') >= 0)
      ) {
        if (Y && Y.showBusyMessage) Y.showBusyMessage(el, { source: 'arilik_detailMap' });
        else {
          var msg = (Y && Y.USER_BUSY_MSG) || 'Talep yoğunluğundan dolayı lütfen yarın deneyiniz.';
          if (window.SuperAriAdminNotify) SuperAriAdminNotify.warnUserBusyAndNotify({ source: 'arilik_detailMap' });
          el.innerHTML = '<div class="ymap-key-needed" role="alert"><strong>' + msg + '</strong></div>';
        }
      } else {
        el.innerHTML = '<div class="ymap-key-needed"><strong>Yandex harita yüklenemedi</strong><p>API anahtarını kontrol edin.</p></div>';
      }
    });
  }

  function moveLogHtml(apiary) {
    if (!G) return '';
    var moves = G.transportsForApiary(apiary.id).slice(0, 6);
    var rows = moves.map(function (t) {
      var isFuel = t.mode === 'kendi_arac';
      var color = isFuel ? '#e8590c' : '#2f9e44';
      var kind = isFuel ? 'Kendi araç · Yakıt' : 'Nakliye';
      return (
        '<article class="move-item">' +
          '<span class="move-dot" style="background:' + color + '"></span>' +
          '<div>' +
            '<h3>' + escapeHtml(t.title || kind) + '</h3>' +
            '<div class="meta">' + escapeHtml(kind) + ' · ' + formatDate(t.date) +
              (t.note ? ' · ' + escapeHtml(t.note) : '') +
            '</div>' +
          '</div>' +
          '<div class="amt">' + formatTRY(t.amount) + '</div>' +
        '</article>'
      );
    }).join('');
    return (
      '<h2 class="section-title">Taşıma kayıtları</h2>' +
      (rows
        ? '<div class="move-list">' + rows + '</div>'
        : '<p class="empty" style="margin-bottom:16px;">Henüz taşıma yok. Nakliye veya kendi araç kaydı ekleyin.</p>')
    );
  }

  function render() {
    var apiary = id ? D.apiaryById(id) : null;
    activeApiary = apiary;
    if (!apiary) {
      titleEl.textContent = 'Arılık bulunamadı';
      subEl.textContent = 'Kayıt yok';
      content.innerHTML =
        '<div class="missing">' +
          '<h2>Bu arılık yok</h2>' +
          '<p>Listeye dönüp bir arılık seçin veya yeni ekleyin.</p>' +
          '<a class="back-chip" href="ariliklar.html">← Arılıklar</a>' +
        '</div>';
      return;
    }

    document.title = 'SüperArı · ' + apiary.name;
    titleEl.textContent = apiary.place || apiary.name;
    subEl.textContent = 'Arılık detayı';
    var linked = D.hivesForApiary(apiary.id);
    var hiveN = linked.length;
    var filterHref = 'kovanlar.html?apiary=' + encodeURIComponent(apiary.id);
    var hiveRows = linked.map(function (h) {
      return (
        '<a class="hive-item" href="kovanlar.html?id=' + encodeURIComponent(h.id) + '&amp;apiary=' + encodeURIComponent(apiary.id) + '">' +
          '<div>' +
            '<h3>' + escapeHtml(h.name) + '</h3>' +
            '<div class="meta">' + escapeHtml(h.health) + ' · ' + h.weightKg.toFixed(1) + ' kg · oğul ' + escapeHtml(h.swarmRisk) + '</div>' +
          '</div>' +
          '<span class="badge">' + h.healthScore + '</span>' +
        '</a>'
      );
    }).join('');

    var coordsOk = hasCoords(apiary);

    var mapBlock =
      '<section class="map-card">' +
        '<h2>Konum</h2>' +
        (coordsOk
          ? ''
          : '<p class="map-missing">Konum henüz seçilmemiş. Ara veya haritaya dokunup iğneyi kaydırın.</p>') +
        '<div class="map-search-row">' +
          '<input type="search" id="mapSearch" maxlength="80" placeholder="Yer ara — örn. Balığındüzü" autocomplete="off" />' +
          '<button type="button" class="btn-ara" id="mapSearchBtn">Ara</button>' +
        '</div>' +
        '<ul class="map-search-results" id="mapSearchResults" hidden></ul>' +
        '<div class="ymap-host" id="detailMapHost">' +
          '<button type="button" class="ymap-geri" hidden aria-label="Geri">Geri</button>' +
          '<div id="detailMap" role="application" aria-label="Arılık konumu"></div>' +
          '<div class="ymap-tap-hint is-on">Büyütmek için dokun</div>' +
        '</div>' +
        (coordsOk
          ? '<button type="button" class="map-coords-line" id="pickCoords" aria-label="Konum işlemleri">' +
              fmtCoord(apiary.lat) + ', ' + fmtCoord(apiary.lon) +
            '</button>'
          : '<div class="map-coords-line" id="pickCoords">Konum seçilmedi</div>') +
        (coordsOk
          ? '<div class="map-loc-bar">' +
              '<button type="button" class="map-btn ghost" id="btnKonumMenu">Konum ▾</button>' +
            '</div>'
          : '') +
        '<div class="map-tool-row" id="mapEditTools">' +
          '<button type="button" class="map-btn ghost" id="btnPickLoc" hidden>' +
            (coordsOk ? 'Konumu değiştir' : 'Haritadan seç') +
          '</button>' +
        '</div>' +
        '<div class="map-actions">' +
          '<button type="button" class="map-btn" id="btnSaveLoc"' +
            (coordsOk ? ' hidden' : '') + '>Bu konumu kaydet</button>' +
        '</div>' +
        '<div id="mapBookmarks" class="ymap-bookmarks" hidden></div>' +
        '<div class="forage-radius">' +
          '<label for="forageRadius">Foraj</label>' +
          '<input type="range" id="forageRadius" min="' + ((F && F.MIN_RADIUS_KM) || 0.5) + '" max="' + ((F && F.MAX_RADIUS_KM) || 10) + '" step="' + ((F && F.RADIUS_STEP_KM) || 0.5) + '" value="' + forageRadiusKm + '" />' +
          '<span class="val" id="forageRadiusVal">' + forageRadiusKm + ' km</span>' +
        '</div>' +
        '<p class="forage-auto-hint" id="forageAutoHint">' + escapeHtml((F && F.AUTO_HINT_TR) || '') + '</p>' +
        '<label class="map-paste">Koordinat — tek satır (enlem, boylam)' +
          '<div class="map-search-row map-paste-row">' +
            '<input type="text" id="mapPaste" maxlength="240" placeholder="39.92, 41.27  ·  39.92 41.27  ·  Yandex linki" autocomplete="off" inputmode="decimal" />' +
            '<button type="button" class="btn-ara" id="mapPasteBtn">Uygula</button>' +
          '</div>' +
        '</label>' +
        '<p class="map-hint-inline">Tek satır + Enter/Uygula: pin koyar, kaydı açar. Haritada da ara / iğne / sürükle · kaydet (tam ekran Geri). Google · Apple · OSM · Bing. Sarı çember = foraj.</p>' +
        '<div id="forageHost"></div>' +
      '</section>';

    content.innerHTML =
      '<section class="hero-card">' +
        '<div class="hero-top">' +
          '<div class="hero-ico" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.7 2 6 4.9 6 8.4c0 4.6 6 11.6 6 11.6s6-7 6-11.6C18 4.9 15.3 2 12 2zm0 8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>' +
          '</div>' +
          '<div>' +
            '<div class="hero-title">' + escapeHtml(apiary.name) + '</div>' +
            '<div class="hero-place">' + escapeHtml(apiary.place) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="stat-grid">' +
          '<a class="stat stat-link" href="' + filterHref + '" aria-label="' + hiveN + ' kovanı listele">' +
            '<div class="k">Kovan</div><div class="v">' + hiveN + '</div>' +
          '</a>' +
          '<div class="stat"><div class="k">Konum</div><div class="v">' + escapeHtml(apiary.place) + '</div></div>' +
          (coordsOk
            ? (
                '<button type="button" class="stat stat-tap" id="statLat">' +
                  '<div class="k">Enlem</div><div class="v">' + fmtCoord(apiary.lat) + '</div>' +
                '</button>' +
                '<button type="button" class="stat stat-tap" id="statLon">' +
                  '<div class="k">Boylam</div><div class="v">' + fmtCoord(apiary.lon) + '</div>' +
                '</button>'
              )
            : (
                '<div class="stat"><div class="k">Enlem</div><div class="v">—</div></div>' +
                '<div class="stat"><div class="k">Boylam</div><div class="v">—</div></div>'
              )) +
        '</div>' +
      '</section>' +
      mapBlock +
      '<div class="action-row">' +
        '<button type="button" class="action-link" id="btnMoveSave">' +
          'Taşıma kaydet <span aria-hidden="true">›</span>' +
        '</button>' +
        '<a class="action-link" href="' + filterHref + '">' +
          hiveN + ' kovanı gör <span aria-hidden="true">›</span>' +
        '</a>' +
      '</div>' +
      moveLogHtml(apiary) +
      '<button type="button" class="btn-delete-apiary" id="btnDeleteApiary">Arılığı sil</button>' +
      '<p class="delete-hint">Arılık ve kovanlar silinir. Masraflar Giderler’de kalır.</p>' +
      '<h2 class="section-title" id="kovanlar">Kovanlar (' + hiveN + ')</h2>' +
      (hiveRows
        ? '<div class="hive-list">' + hiveRows + '</div>'
        : '<p class="empty">Bu arılıkta henüz kovan yok. Arılık eklerken kovan sayısı girerseniz burada listelenir.</p>');

    pickMode = !coordsOk;
    forageManual = false;
    if (coordsOk) applyAutoForage(Number(apiary.lat), Number(apiary.lon), apiary);
    mountMap(apiary);

    var btnPick = document.getElementById('btnPickLoc');
    var btnSave = document.getElementById('btnSaveLoc');
    var coordsBtn = document.getElementById('pickCoords');
    var statLat = document.getElementById('statLat');
    var statLon = document.getElementById('statLon');
    var btnMove = document.getElementById('btnMoveSave');
    var btnKonum = document.getElementById('btnKonumMenu');

    if (btnMove) btnMove.addEventListener('click', openMoveSheet);
    var btnDelete = document.getElementById('btnDeleteApiary');
    if (btnDelete) {
      btnDelete.addEventListener('click', function () {
        var label = (apiary.place && apiary.place !== '—')
          ? (apiary.place + ' · ' + apiary.name)
          : (apiary.name || 'Arılık');
        var ok = window.confirm(
          'Arılık ve kovanlar silinsin. Masraflar Giderler’de kalır.\n\n«' + label + '»'
        );
        if (!ok) return;
        if (!D || typeof D.removeApiary !== 'function') {
          alert('Silme desteklenmiyor. Sayfayı yenileyip tekrar deneyin.');
          return;
        }
        D.removeApiary(apiary.id);
        window.location.href = 'ariliklar.html';
      });
    }
    if (btnKonum) btnKonum.addEventListener('click', openLocMenu);
    if (coordsBtn && coordsBtn.tagName === 'BUTTON') {
      coordsBtn.addEventListener('click', openLocMenu);
    }
    if (statLat) statLat.addEventListener('click', openLocMenu);
    if (statLon) statLon.addEventListener('click', openLocMenu);

    if (!coordsOk) {
      pickMode = true;
      if (btnSave) {
        btnSave.hidden = false;
        btnSave.textContent = 'Bu konumu kaydet';
      }
      var editTools0 = document.getElementById('mapEditTools');
      if (editTools0) editTools0.classList.add('is-on');
    }
    if (btnPick) {
      btnPick.addEventListener('click', startPickMode);
    }
    if (btnSave) {
      btnSave.addEventListener('click', function () {
        var c = Y && detailPlacemark ? Y.placemarkCoords(detailPlacemark) : null;
        if (!c) {
          alert('Önce ara veya haritaya dokunarak konum seçin.');
          return;
        }
        D.updateApiary(apiary.id, { lat: c.lat, lon: c.lon });
        pickMode = false;
        render();
      });
    }

    var searchBtn = document.getElementById('mapSearchBtn');
    var searchInput = document.getElementById('mapSearch');
    var radiusInput = document.getElementById('forageRadius');
    var radiusVal = document.getElementById('forageRadiusVal');
    var pasteInput = document.getElementById('mapPaste');
    var bmHost = document.getElementById('mapBookmarks');
    if (searchBtn) searchBtn.addEventListener('click', runDetailSearch);
    if (searchInput) {
      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          runDetailSearch();
        }
      });
    }
    function currentPin() {
      return currentDetailPin() || (hasCoords(apiary) ? { lat: Number(apiary.lat), lon: Number(apiary.lon) } : null);
    }
    if (bmHost && Y) {
      Y.renderBookmarksList(bmHost, function (hit) {
        pickMode = true;
        placeDetailMarker(hit.lat, hit.lon, hit.name);
        if (detailMapCtrl) detailMapCtrl.setView(hit.lat, hit.lon, 13);
        if (btnSave) {
          btnSave.hidden = false;
          btnSave.textContent = 'Bu konumu kaydet';
        }
        if (btnPick) btnPick.hidden = true;
      });
    }
    if (radiusInput) {
      radiusInput.addEventListener('input', function () {
        forageManual = true;
        forageRadiusKm = F ? F.clampRadius(radiusInput.value) : Number(radiusInput.value) || 3;
        if (radiusVal) radiusVal.textContent = forageRadiusKm + ' km';
        var pin = currentPin();
        if (pin) updateRadarAndAnalyze(pin.lat, pin.lon);
      });
    }
    if (pasteInput && D.parseCoordsFromText) {
      function applyPaste() {
        var raw = pasteInput.value;
        var parsed = D.parseCoordsFromText(raw);
        if (!parsed) {
          if (String(raw || '').trim()) {
            alert('Geçersiz koordinat. Tek satır: 39.92, 41.27 veya 39.92 41.27 veya Yandex linki.');
          }
          return;
        }
        pickMode = true;
        function afterMap() {
          placeDetailMarker(parsed.lat, parsed.lon, pendingSearchName);
          if (detailMapCtrl) detailMapCtrl.setView(parsed.lat, parsed.lon, 14);
          if (btnSave) {
            btnSave.hidden = false;
            btnSave.textContent = 'Bu konumu kaydet';
          }
          if (btnPick) btnPick.hidden = true;
        }
        if (detailMapCtrl) {
          afterMap();
        } else if (detailMapReady) {
          detailMapReady.then(afterMap).catch(function () {
            alert('Harita henüz hazır değil. Biraz bekleyip tekrar Uygula’ya basın.');
          });
        } else {
          alert('Harita henüz hazır değil. Biraz bekleyip tekrar Uygula’ya basın.');
        }
      }
      var pasteBtn = document.getElementById('mapPasteBtn');
      if (pasteBtn) pasteBtn.addEventListener('click', applyPaste);
      pasteInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          applyPaste();
        }
      });
      pasteInput.addEventListener('change', applyPaste);
      pasteInput.addEventListener('paste', function () { setTimeout(applyPaste, 0); });
    }

  }

  render();

  var clock = document.getElementById('clock');
  function tick() {
    var d = new Date();
    clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
