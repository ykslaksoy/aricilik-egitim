<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Arılık</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --orange: #f08c00;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    min-height: 100vh; padding: 20px 0 28px;
    overflow-x: hidden; overflow-y: auto;
  }
  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; background: var(--bg);
    padding: 0 14px 16px; position: relative;
  }
  .brand-strip {
    flex: 0 0 auto; min-height: 36px;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 10px; margin-bottom: 10px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a; border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    color: var(--brown); font-size: 13px; font-weight: 800; letter-spacing: .03em;
  }
  .brand-strip::before {
    content: ""; flex: 0 0 4px; align-self: stretch; margin: -2px 0; border-radius: 3px;
    background: linear-gradient(180deg, var(--hardal-hi), var(--hardal) 40%, var(--hardal-lo));
  }
  .page-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .page-head h1 {
    font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em;
  }
  .page-head p { margin-top: 2px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .nav-chips { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .back-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 11px; border-radius: 10px;
    background: #fff; border: 1px solid var(--card-border);
    color: var(--text); font-size: 12px; font-weight: 700; text-decoration: none;
  }
  .hero-card {
    background: #fff; border: 1px solid var(--card-border); border-radius: 18px;
    padding: 16px 14px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(40, 30, 10, .05);
  }
  .hero-top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
  }
  .hero-ico {
    width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center; flex: 0 0 auto;
    background: linear-gradient(145deg, #ffe08a, var(--hardal));
    color: var(--brown);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
  }
  .hero-ico svg { width: 26px; height: 26px; }
  .hero-title { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.25; }
  .hero-place { margin-top: 3px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .stat {
    padding: 12px; border-radius: 14px;
    background: #f7f8fa; border: 1px solid var(--card-border);
  }
  .stat .k { font-size: 11px; font-weight: 700; color: var(--muted); }
  .stat .v { margin-top: 4px; font-size: 16px; font-weight: 800; color: var(--text); }
  a.stat-link {
    display: block; text-decoration: none; color: inherit;
    transition: transform .12s ease, border-color .12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  a.stat-link:active { transform: scale(.98); }
  a.stat-link .v { color: var(--brown); }
  a.stat-link .k::after { content: " ›"; color: #b0aaa3; font-weight: 800; }
  .section-title {
    font-size: 14px; font-weight: 800; color: var(--text);
    margin: 4px 2px 10px;
  }
  .action-row { display: grid; gap: 8px; margin-bottom: 16px; }
  .action-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 14px; border-radius: 14px;
    background: #fff; border: 1px solid var(--card-border);
    text-decoration: none; color: var(--text);
    font-size: 14px; font-weight: 750;
  }
  .action-link span { color: #b0aaa3; font-size: 18px; }
  .hive-list { display: grid; gap: 8px; }
  .hive-item {
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
    padding: 12px; border-radius: 14px;
    background: #fff; border: 1px solid var(--card-border);
    text-decoration: none; color: inherit;
  }
  .hive-item h3 { font-size: 13px; font-weight: 750; color: var(--text); }
  .hive-item .meta { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .hive-item .badge {
    font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px;
    background: #fff8df; color: var(--brown); white-space: nowrap;
  }
  .empty {
    padding: 14px; border-radius: 14px;
    background: #fff8df; border: 1px dashed #e0c56a;
    color: var(--muted); font-size: 13px; line-height: 1.4;
  }
  .missing {
    padding: 18px 14px; border-radius: 16px;
    background: #fff; border: 1px solid var(--card-border);
    text-align: center;
  }
  .missing h2 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .missing p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .tabbar {
    height: 72px; background: #fff; border-top: 1px solid #e6e8ec;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 0 4px 10px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #8b8680; font-size: 10px; font-weight: 600;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--orange); }
  .tab svg { width: 22px; height: 22px; }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }
  @media (max-width: 420px) {
    body { padding: 0; background: #f7f8fa; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .phone-notch, .home-indicator { display: none; }
    .screen { height: calc(100dvh - 48px - 72px); }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen" id="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1 id="pageTitle">Arılık</h1>
        <p id="pageSub">Detay</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ariliklar.html">← Arılıklar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab active" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler
    </a>
    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js"></script>
<script>
(function () {
  var D = window.SuperAriDemo;
  if (!D) return;

  var params = new URLSearchParams(location.search);
  var id = params.get('id') || params.get('apiary') || '';
  var content = document.getElementById('content');
  var titleEl = document.getElementById('pageTitle');
  var subEl = document.getElementById('pageSub');

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtCoord(n) {
    if (n == null || !isFinite(n)) return '—';
    return Number(n).toFixed(2);
  }

  var apiary = id ? D.apiaryById(id) : null;
  if (!apiary) {
    titleEl.textContent = 'Arılık bulunamadı';
    subEl.textContent = 'Kayıt yok';
    content.innerHTML =
      '<div class="missing">' +
        '<h2>Bu arılık yok</h2>' +
        '<p>Listeye dönüp bir arılık seçin veya yeni ekleyin.</p>' +
        '<a class="back-chip" href="ariliklar.html">← Arılıklar</a>' +
      '</div>';
  } else {
    document.title = 'SüperArı · ' + apiary.name;
    titleEl.textContent = apiary.place || apiary.name;
    subEl.textContent = 'Arılık detayı';
    var linked = D.hivesForApiary(apiary.id);
    var hiveN = linked.length;
    var filterHref = 'kovanlar.html?apiary=' + encodeURIComponent(apiary.id);
    var hiveRows = linked.map(function (h) {
      return (
        '<a class="hive-item" href="kovanlar.html?id=' + encodeURIComponent(h.id) + '&amp;apiary=' + encodeURIComponent(apiary.id) + '">' +
          '<div>' +
            '<h3>' + escapeHtml(h.name) + '</h3>' +
            '<div class="meta">' + escapeHtml(h.health) + ' · ' + h.weightKg.toFixed(1) + ' kg · oğul ' + escapeHtml(h.swarmRisk) + '</div>' +
          '</div>' +
          '<span class="badge">' + h.healthScore + '</span>' +
        '</a>'
      );
    }).join('');

    content.innerHTML =
      '<section class="hero-card">' +
        '<div class="hero-top">' +
          '<div class="hero-ico" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.7 2 6 4.9 6 8.4c0 4.6 6 11.6 6 11.6s6-7 6-11.6C18 4.9 15.3 2 12 2zm0 8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>' +
          '</div>' +
          '<div>' +
            '<div class="hero-title">' + escapeHtml(apiary.name) + '</div>' +
            '<div class="hero-place">' + escapeHtml(apiary.place) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="stat-grid">' +
          '<a class="stat stat-link" href="' + filterHref + '" aria-label="' + hiveN + ' kovanı listele">' +
            '<div class="k">Kovan</div><div class="v">' + hiveN + '</div>' +
          '</a>' +
          '<div class="stat"><div class="k">Konum</div><div class="v">' + escapeHtml(apiary.place) + '</div></div>' +
          '<div class="stat"><div class="k">Enlem</div><div class="v">' + fmtCoord(apiary.lat) + '</div></div>' +
          '<div class="stat"><div class="k">Boylam</div><div class="v">' + fmtCoord(apiary.lon) + '</div></div>' +
        '</div>' +
      '</section>' +
      '<div class="action-row">' +
        '<a class="action-link" href="' + filterHref + '">' +
          hiveN + ' kovanı gör <span aria-hidden="true">›</span>' +
        '</a>' +
      '</div>' +
      '<h2 class="section-title" id="kovanlar">Kovanlar (' + hiveN + ')</h2>' +
      (hiveRows
        ? '<div class="hive-list">' + hiveRows + '</div>'
        : '<p class="empty">Bu arılıkta henüz kovan yok. Arılık eklerken kovan sayısı girerseniz burada listelenir.</p>');
  }

  var clock = document.getElementById('clock');
  function tick() {
    var d = new Date();
    clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
