  <script>
  (function () {
    var D = window.SuperAriDemo, K = window.SuperAriKoloni, E = window.SuperAriKoloniEk, P = window.SuperAriKsSayfa;
    if (!D || !K || !E || !P) return;
    var q = new URLSearchParams(location.search), key = q.get('ek') || 'larva';
    if (E.KEYS.indexOf(key) < 0) key = 'larva';
    var ap = P.scope(), title = E.LABEL[key] || 'Koloni';
    document.title = title + ' · SüperArı';
    document.getElementById('pageSub').textContent = title;
    var back = document.getElementById('backKoloni');
    back.href = 'kovanlar.html?view=koloni' + (ap !== 'all' ? '&mode=apiary&apiary=' + encodeURIComponent(ap) : '&mode=all');
    if (K.ensureCss) K.ensureCss();
    E.render(key, document.getElementById('keView'), ap);
    P.init({
      title: title,
      icon: '<svg class="ks-ico" viewBox="0 0 24 24" fill="none" stroke="#7a4f1d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ((K.TOPIC_ICONS || {})[key] || '') + '</svg>',
      stats: function () { return E.stats(key, ap); },
      note: function () { return E.note(key, ap); }
    });
  })();
  </script>
