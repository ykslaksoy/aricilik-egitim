<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Sağlık</title>
<link rel="stylesheet" href="rapor-common.css" />
<style>
  .screen-fill {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
  }
  .card-fill {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    margin-bottom: 0 !important;
  }
  .band-grid {
    flex: 1 1 auto; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
  }
  .band-card {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
    height: 100%; min-height: 0; padding: 14px 12px; border-radius: 16px; text-decoration: none;
    border: 1.5px solid #e4e6ea; font-family: inherit; color: inherit;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .band-card:active { transform: scale(.985); }
  .band-card .count {
    font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .band-card .title { margin-top: 8px; font-size: 16px; font-weight: 800; }
  .band-card .meta { margin-top: 4px; font-size: 12px; font-weight: 700; line-height: 1.3; opacity: .9; }
  .band-card .note {
    margin-top: 8px; font-size: 11px; font-weight: 650; line-height: 1.35;
    opacity: .88; flex: 1 1 auto;
  }
  .band-card.tone-green {
    border-color: #8ce99a;
    background: linear-gradient(165deg, #fff 0%, #ebfbee 100%);
    color: #2b8a3e;
  }
  .band-card.tone-yellow {
    border-color: #ffe066;
    background: linear-gradient(165deg, #fff 0%, #fff9db 100%);
    color: #e67700;
  }
  .band-card.tone-orange {
    border-color: #ffc078;
    background: linear-gradient(165deg, #fff 0%, #fff4e6 100%);
    color: #d9480f;
  }
  .band-card.tone-red {
    border-color: #ffa8a8;
    background: linear-gradient(165deg, #fff 0%, #fff5f5 100%);
    color: #c92a2a;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen screen-fill">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Sağlık</h1>
        <p id="pageSub">Kovan durumu</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ana.html">← Ana</a>
        <a class="back-chip" href="rapor-saglik.html">Rapor</a>
      </div>
    </div>

    <section class="card-block card-fill">
      <h2>Durum</h2>
      <p class="meta" id="avgLine" style="margin-bottom:10px"></p>
      <div class="band-grid" id="bandGrid"></div>
    </section>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>Ana</a>
    <a class="tab" href="kovanlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>Kovanlar</a>
    <a class="tab" href="uyarilar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>Uyarılar</a>
    <a class="tab" href="gorevler.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Görevler</a>
    <a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-2"></script>
<script src="sensor-health.js"></script>
<script>
(function () {
  var H = window.SuperAriSensorHealth;
  var D = window.SuperAriDemo;
  if (!H || !D) return;
  var all = H.evaluateAll(D.loadHives ? D.loadHives() : []);

  var NOTES = {
    ok: 'Rutin dışında müdahale gerekmez. Takvimli varroa ve sezon işleri ayrı sürer.',
    watch: 'Kısa süre izleyin. Tekrarlayan düşüşte Kontrol’e inebilir; saha notu düşünün.',
    check: 'Sahada bakın. Oğul, besleme veya yavru şüphesi olabilir; malzeme listesine bakın.',
    act: 'Öncelikli müdahale. Gerekçe (oğul, varroa, besleme, malzeme) ve arılık malzemesini açın.'
  };

  var bands = [
    { key: 'ok', label: 'Sağlıklı', meta: 'Rutin dışı işlem yok', tone: 'green', count: all.counts.ok },
    { key: 'watch', label: 'İzle', meta: 'Kısa süre takip', tone: 'yellow', count: all.counts.watch },
    { key: 'check', label: 'Kontrol', meta: 'Sahada bakın', tone: 'orange', count: all.counts.check },
    { key: 'act', label: 'Müdahale', meta: 'Öncelikli kovan', tone: 'red', count: all.counts.act }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('avgLine').textContent = 'Ort. skor ' + all.avg + ' · ' + all.hives.length + ' kovan';
  document.getElementById('pageSub').textContent = 'Ort. ' + all.avg;
  document.getElementById('bandGrid').innerHTML = bands.map(function (b) {
    return '<a class="band-card tone-' + b.tone + '" href="saglik-detay.html?band=' + encodeURIComponent(b.key) + '">' +
      '<div class="count">' + b.count + '</div>' +
      '<div style="width:100%">' +
        '<div class="title">' + esc(b.label) + '</div>' +
        '<div class="meta">' + esc(b.meta) + '</div>' +
        '<div class="note">' + esc(NOTES[b.key]) + '</div>' +
      '</div></a>';
  }).join('');
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
