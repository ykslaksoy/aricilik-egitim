<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Sağlık</title>
<link rel="stylesheet" href="rapor-common.css" />
<style>
  .screen-fill {
    flex: 1 0 auto; min-height: 0;
    display: flex; flex-direction: column;
  }
  .card-fill {
    flex: 1 0 auto; min-height: 0;
    display: flex; flex-direction: column;
    margin-bottom: 0 !important;
  }
  .band-grid {
    flex: 1 0 auto; min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(2, minmax(min-content, 1fr)); /* kısa ekranda kart metni kesilmez, sayfa kayar */
    gap: 10px;
  }
  .band-card {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
    height: 100%; min-height: min-content; padding: 14px 12px; border-radius: 16px; text-decoration: none;
    border: 1.5px solid #e4e6ea; font-family: inherit; color: inherit;
    -webkit-tap-highlight-color: transparent;
    overflow: visible; overflow-wrap: anywhere;
  }
  .band-card:active { transform: scale(.985); }
  .band-card .count {
    font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .band-card .title { margin-top: 8px; font-size: 16px; font-weight: 800; }
  .band-card .meta { margin-top: 4px; font-size: 12px; font-weight: 700; line-height: 1.3; opacity: .9; }
  .band-card .note {
    margin-top: 8px; font-size: 11px; font-weight: 650; line-height: 1.35;
    opacity: .88; flex: 1 1 auto;
  }
  .band-card.tone-green {
    border-color: #8ce99a;
    background: linear-gradient(165deg, #fff 0%, #ebfbee 100%);
    color: #2b8a3e;
  }
  .band-card.tone-yellow {
    border-color: #ffe066;
    background: linear-gradient(165deg, #fff 0%, #fff9db 100%);
    color: #e67700;
  }
  .band-card.tone-orange {
    border-color: #ffc078;
    background: linear-gradient(165deg, #fff 0%, #fff4e6 100%);
    color: #d9480f;
  }
  .band-card.tone-red {
    border-color: #ffa8a8;
    background: linear-gradient(165deg, #fff 0%, #fff5f5 100%);
    color: #c92a2a;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen screen-fill">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Sağlık</h1>
        <p id="pageSub">Kovan durumu</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ana.html">← Ana</a>
        <a class="back-chip" href="rapor-saglik.html">Rapor</a>
      </div>
    </div>

    <section class="card-block card-fill">
      <h2>Durum</h2>
      <p class="meta" id="avgLine" style="margin-bottom:10px"></p>
      <div id="winterNote"></div>
      <div class="band-grid" id="bandGrid"></div>
      <div id="liveList" style="margin-top:12px;"></div>
    </section>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-6v-5H10v5H4z"/></svg>Ana</a><a class="tab" href="bakim.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="12" height="15.5" rx="2"/><path d="M9.5 4.5V3.6h5v.9"/><path d="M9 11l2 2 4-4.2M9 16.5h6"/></svg>Bakım</a><button type="button" class="tab tab-plus" data-quick-record aria-label="Hızlı kayıt"><span class="plus-c" aria-hidden="true">＋</span><span class="plus-l">Kayıt</span></button><a class="tab" href="bugun.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6" width="15" height="13.5" rx="2"/><path d="M4.5 10h15M9 4v3.5M15 4v3.5"/><circle cx="12" cy="14.6" r="1.8"/></svg>Bugün</a><a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 4.5v2.2M12 17.3V19.5M4.5 12h2.2M17.3 12H19.5M7 7l1.6 1.6M15.4 15.4 17 17M17 7l-1.6 1.6M8.6 15.4 7 17"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-86"></script>
<script src="sensor-health.js?v=koloni-86"></script>
<script src="saglik-canli.js?v=koloni-86"></script>
<script src="ilac-katalog.js?v=koloni-86"></script>
<script src="bakim-plan.js?v=koloni-86"></script>
<script>
(function () {
  var H = window.SuperAriSensorHealth;
  var D = window.SuperAriDemo;
  if (!H || !D) return;
  var all = H.evaluateAll(D.loadHives ? D.loadHives() : []);

  var NOTES = {
    ok: 'Rutin dışında müdahale gerekmez. Takvimli varroa ve sezon işleri ayrı sürer.',
    watch: 'Kısa süre izleyin. Tekrarlayan düşüşte Kontrol’e inebilir; saha notu düşünün.',
    check: 'Sahada bakın. Oğul, besleme veya yavru şüphesi olabilir; malzeme listesine bakın.',
    act: 'Öncelikli müdahale. Gerekçe (oğul, varroa, besleme, malzeme) ve arılık malzemesini açın.'
  };

  var bands = [
    { key: 'ok', label: 'Sağlıklı', meta: 'Rutin dışı işlem yok', tone: 'green', count: all.counts.ok },
    { key: 'watch', label: 'İzle', meta: 'Kısa süre takip', tone: 'yellow', count: all.counts.watch },
    { key: 'check', label: 'Kontrol', meta: 'Sahada bakın', tone: 'orange', count: all.counts.check },
    { key: 'act', label: 'Müdahale', meta: 'Öncelikli kovan', tone: 'red', count: all.counts.act }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var un = (all.unscored || []).length;
  document.getElementById('avgLine').textContent = (all.avg == null ? 'Skor için veri az' : 'Ort. skor ' + all.avg) + ' · ' + all.hives.length + ' kovan' + (un ? ' · ' + un + ' kovanda veri az' : '') + (all.live ? ' · Canlı' : '');
  document.getElementById('pageSub').textContent = all.avg == null ? 'Veri az' : 'Ort. ' + all.avg;
  /* Canlı: skoru en düşük kovanlar, eğilim (↑/↓) ve sade gerekçe */
  if (all.live) {
    var rows = all.hives.slice(0, 8).map(function (x) {
      var tr = x.trend === 'up' ? '<span style="color:#2b8a3e" title="Yükseliyor">↑</span>' : x.trend === 'down' ? '<span style="color:#c92a2a" title="Düşüyor">↓</span>' : '';
      return '<a href="kovan.html?id=' + encodeURIComponent(x.hiveId) + '" style="display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid #eee2cc;border-radius:12px;margin-top:6px;text-decoration:none;color:inherit;background:#fff;">' +
        '<span style="flex:1;min-width:0;"><b>' + esc(x.name) + '</b> <small style="color:#6b5a48">' + esc(x.band.label) + '</small><br><small style="color:#6b5a48">' + esc((x.reasons && x.reasons[0]) || (x.positives && x.positives[0]) || '') + (x.hint ? ' · ' + esc(x.hint) : '') + '</small></span>' +
        '<span style="flex:none;font-weight:800;">' + x.score + ' ' + tr + '</span></a>';
    }).join('');
    var unl = (all.unscored || []).slice(0, 3).map(function (x) { return esc(x.name); }).join(', ');
    document.getElementById('liveList').innerHTML = (rows ? '<div style="font-weight:800;font-size:.95rem;">Öncelikli kovanlar</div>' + rows : '') +
      (un ? '<p class="meta" style="margin-top:8px;">Veri az: ' + unl + (un > 3 ? ' +' + (un - 3) : '') + ' — skor için bir muayene yapın.</p>' : '');
  }
  /* Kışlık stok bilgi notu (Eylül–Şubat, stok az/kritikse) — sağlık puanını etkilemez */
  try { if (window.SuperAriPlan && window.SuperAriPlan.winterNoteHtml) document.getElementById('winterNote').innerHTML = window.SuperAriPlan.winterNoteHtml(D.loadHives()); } catch (eW) { /* ignore */ }
  document.getElementById('bandGrid').innerHTML = bands.map(function (b) {
    return '<a class="band-card tone-' + b.tone + '" href="saglik-detay.html?band=' + encodeURIComponent(b.key) + '">' +
      '<div class="count">' + b.count + '</div>' +
      '<div style="width:100%">' +
        '<div class="title">' + esc(b.label) + '</div>' +
        '<div class="meta">' + esc(b.meta) + '</div>' +
        '<div class="note">' + esc(NOTES[b.key]) + '</div>' +
      '</div></a>';
  }).join('');
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
<script src="nav.js?v=koloni-86"></script>
<script src="pwa.js?v=koloni-86"></script>
</body>
</html>
