<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Sağlık</title>
<link rel="stylesheet" href="rapor-common.css" />
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Sağlık</h1>
        <p id="pageSub">Kovan durumu</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ana.html">← Ana</a>
        <a class="back-chip" href="rapor-saglik.html">Rapor</a>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <section class="card-block">
      <h2>Durum özeti</h2>
      <div id="statusList"></div>
    </section>

    <section class="card-block">
      <h2>Kovanlar</h2>
      <div id="hiveList"></div>
    </section>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>Ana</a>
    <a class="tab" href="kovanlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>Kovanlar</a>
    <a class="tab" href="uyarilar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>Uyarılar</a>
    <a class="tab" href="gorevler.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Görevler</a>
    <a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js"></script>
<script src="sensor-health.js"></script>
<script>
(function () {
  var H = window.SuperAriSensorHealth;
  var D = window.SuperAriDemo;
  if (!H || !D) return;
  var hives = D.loadHives ? D.loadHives() : (D.hives || []);
  var all = H.evaluateAll(hives);
  var b = all.band;

  /* Silent telemetry for product improvement — not shown in UI */
  try {
    var key = 'superari.saglik.telemetry.v1';
    var log = [];
    try { log = JSON.parse(localStorage.getItem(key) || '[]') || []; } catch (e1) { log = []; }
    if (!Array.isArray(log)) log = [];
    log.push({
      at: new Date().toISOString(),
      avg: all.avg,
      counts: all.counts,
      hives: all.hives.map(function (x) {
        return { id: x.hiveId, score: x.score, band: x.band.key };
      })
    });
    if (log.length > 200) log = log.slice(-200);
    localStorage.setItem(key, JSON.stringify(log));
  } catch (e2) { /* ignore */ }

  document.getElementById('pageSub').textContent = 'Ort. ' + all.avg + ' · ' + b.label;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">Ort. sağlık</div><div class="v">' + all.avg + '</div></div>' +
    '<div class="stat"><div class="k">Sağlıklı</div><div class="v">' + all.counts.ok + '</div></div>' +
    '<div class="stat"><div class="k">İzle / kontrol</div><div class="v">' + (all.counts.watch + all.counts.check) + '</div></div>' +
    '<div class="stat"><div class="k">Müdahale</div><div class="v">' + all.counts.act + '</div></div>';

  document.getElementById('statusList').innerHTML =
    '<div class="row-item"><div class="left"><div class="title">Sağlıklı</div><div class="meta">Rutin dışında müdahale gerekmez</div></div><div class="right"><span class="badge ok">' + all.counts.ok + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">İzle</div><div class="meta">Kısa süre takip</div></div><div class="right"><span class="badge warn">' + all.counts.watch + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Kontrol</div><div class="meta">Sahada bakılması iyi olur</div></div><div class="right"><span class="badge warn">' + all.counts.check + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Müdahale</div><div class="meta">Öncelikli kovan</div></div><div class="right"><span class="badge bad">' + all.counts.act + '</span></div></div>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('hiveList').innerHTML = all.hives.map(function (x) {
    return '<a class="row-item" href="kovan.html?id=' + encodeURIComponent(x.hiveId) + '" style="text-decoration:none;color:inherit;display:flex;">' +
      '<div class="left"><div class="title">' + esc(x.name) + '</div>' +
      '<div class="meta">' + esc(x.band.label) + (x.band.hint ? (' · ' + esc(x.band.hint)) : '') + '</div></div>' +
      '<div class="right"><span class="badge ' + x.band.tone + '">' + x.score + '</span></div></a>';
  }).join('') || '<p class="meta">Kovan yok.</p>';
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
