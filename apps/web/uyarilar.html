<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="stylesheet" href="sa-early.css?v=koloni-261">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uyarılar · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
  <style>
    .og-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:0 0 auto; }
    /* koloni-254: Ana döşemeleri — Mevsim dışı rozeti gri-mavi; seçili döşeme (sa-tile-select .on) ana-hive-tiles.css'ten */
    .ana-hive-grid.og-ana { margin:6px 0 6px; }
    #ogulPanel .grid.ana-hive-grid.og-ana .tile { min-height:122px; } /* seçili kenar 2px olunca satır büyümesin (zıplama yok) */
    .ana-hive-grid .badge.mdblue { background:#e3e9f0; color:#3b4a5c; }
    .og-season { font-size:13px; color:#6b5a48; margin:2px 0 6px; }
    /* k244: oğul görünümünde süzgeç boş — boş kutu yer kaplamasın */
    #filterChips:empty { display:none; }
    .og-row { display:block; padding:10px 12px; border:1px solid #eadfcd; border-radius:12px; background:#fff; margin-bottom:8px; color:inherit; text-decoration:none; }
    .og-row b { display:flex; align-items:center; gap:6px; }
    .og-row small { display:block; color:#6b5a48; margin-top:3px; line-height:1.35; }
    .og-pill { margin-left:auto; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; white-space:nowrap; }
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .mode-switch a {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 10px; border-radius: 12px; text-decoration: none;
      font-size: 13px; font-weight: 800; border: 1.5px solid var(--card-border, #e4e6ea);
      background: #fff; color: var(--text, #1a1b1e);
    }
    .mode-switch a.active {
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      border-color: #e0c56a; color: var(--brown, #5c4813);
    }
    .choice-grid { display: grid; gap: 10px; }
    .choice-btn {
      display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
      padding: 14px 14px; border-radius: 14px; text-decoration: none;
      border: 1.5px solid #e0c56a;
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      color: var(--brown, #5c4813); font-family: inherit;
    }
    .choice-btn strong { font-size: 15px; font-weight: 800; color: var(--brown, #5c4813); }
    .choice-btn span { font-size: 12px; font-weight: 650; color: var(--muted, #868e96); }
    /* koloni-261 önizleme: kategori döşemeleri (Oğul sayfasıyla aynı Ana döşemesi) + gruplu uyarılar + sığan düğmeler */
    #katPanel:empty { display:none; }
    #katPanel .grid.ana-hive-grid.og-ana .tile { min-height:122px; }
    .ua-card { display:block; padding:12px 12px 10px; }
    .ua-head { display:flex; align-items:flex-start; gap:8px; }
    .ua-head h3 { flex:1 1 auto; min-width:0; margin:0; font-size:15px; line-height:1.3; overflow-wrap:anywhere; }
    .ua-head .badge { flex:0 0 auto; }
    .ua-txt { margin:5px 0 0; font-size:13px; line-height:1.4; color:#2b2f33; }
    .ua-foot { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-top:8px; }
    .ua-hv { font-size:13px; color:var(--muted,#6b5a48); flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
    .ua-acts { display:flex; flex-wrap:wrap; gap:6px; flex:0 0 auto; max-width:100%; }
    .ua-btn { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 12px; border:1px solid #e0c56a; border-radius:11px; background:#fff8e6; color:#5c4813; font-size:13px; font-weight:800; text-decoration:none; white-space:nowrap; box-sizing:border-box; }
    .ks-glove .ua-btn { min-height:52px; }
    .ua-grp { border:1px solid #eadfbe; border-radius:16px; background:#fff; padding:10px 12px 4px; margin-bottom:10px; }
    .ua-grp-h { display:flex; align-items:flex-start; gap:8px; }
    .ua-grp-h h3 { flex:1 1 auto; min-width:0; margin:0; font-size:15px; line-height:1.3; }
    .ua-grp-n { font-size:12px; font-weight:800; color:#7a5a00; background:#fff3bf; border-radius:999px; padding:2px 8px; white-space:nowrap; }
    .ua-it { border-top:1px solid #f0e6c8; padding:8px 0; margin-top:8px; }
    .ua-it:first-of-type { margin-top:6px; }
    .ua-it .ua-foot { margin-top:4px; }
    .ua-it-t { font-size:13.5px; font-weight:750; color:#2b2410; line-height:1.35; overflow-wrap:anywhere; }
    .filter-chips {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .filter-chips a {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 12px; border-radius: 999px; text-decoration: none;
      font-size: 12px; font-weight: 750;
      border: 1.5px solid var(--card-border, #e4e6ea);
      background: #fff; color: var(--text, #1a1b1e);
    }
    .filter-chips a.active {
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      border-color: #e0c56a; color: var(--brown, #5c4813);
    }
  </style>
  <link rel="stylesheet" href="kapsam.css?v=koloni-261" />
  <link rel="stylesheet" href="bk-kabuk.css?v=koloni-261" />
  <link rel="stylesheet" href="ana-hive-tiles.css?v=koloni-261" />
  <style>/* k89: uzun başlık («Oğul Eğilimi ve Takibi») → arılık seçici alt satıra iner, adı kısalmaz */.ks-card .ks-top{flex-wrap:wrap;row-gap:2px;}.ks-card .ks-sel{max-width:100%;}</style>
</head>
<body>
  <main class="wrap">
    <div id="saKritik" aria-live="assertive" style="overflow-anchor:none;"></div>

    <section class="card stack">
      <h2 style="margin:0;" id="pageTitle">Uyarılar</h2>
      <p class="muted" id="summary">Demo uyarı listesi…</p>
      <div id="ogulPanel"></div>
      <div class="filter-chips" id="filterChips" role="group" aria-label="Uyarı filtresi"></div>
      <div id="katPanel"></div>
      <div class="mode-switch" id="modeSwitch"></div>
      <div class="list" id="alert-list"></div>
      <div class="note" id="pageNote">Statik demo uyarılar. Canlı veriler bağlandığında burada listelenir.</div>
    </section>
  </main>
  <script src="bk-kabuk.js?v=koloni-261"></script>
  <script src="sensor-ham.js?v=koloni-261"></script>
<script src="demo-data.js?v=koloni-261"></script>
  <script src="ogul.js?v=koloni-261"></script>
  <script src="kapsam.js?v=koloni-261"></script>
  <script src="ks-sayfa.js?v=koloni-261"></script>
  <script>SuperAriKsSayfa.ensureScope({ mode: true });</script>
  <script>
    (function () {
      var D = window.SuperAriDemo;
      if (!D) return;
      var SENSOR_TYPES = ['tarti', 'saglik', 'ogul', 'sensor', 'isi', 'nem', 'titresim', 'ir', 'batarya'];
      var params = new URLSearchParams(location.search);
      var view = (params.get('view') || '').toLowerCase();
      /* Prefer filter=sensor; also accept legacy view=sensor when no ogul view */
      var filterParam = (params.get('filter') || '').toLowerCase();
      if (!filterParam && view === 'sensor') filterParam = 'sensor';
      var sensorFilter = filterParam === 'sensor';
      var hasMode = params.has('mode');
      var modeParam = params.get('mode');
      var mode = modeParam === 'all' ? 'all' : (modeParam === 'apiary' ? 'apiary' : null);
      var apiaryFilter = params.get('apiary') || '';
      var listEl = document.getElementById('alert-list');
      var titleEl = document.getElementById('pageTitle');
      var subEl = (document.getElementById('pageSub') || document.createElement('p'));
      var summaryEl = document.getElementById('summary');
      var noteEl = document.getElementById('pageNote');
      var modeSwitchEl = document.getElementById('modeSwitch');
      var filterChipsEl = document.getElementById('filterChips');

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function pageHref(extra) {
        var parts = [];
        /* Keep view=ogul; drop view=sensor in favor of filter=sensor */
        if (view && view !== 'sensor') parts.push('view=' + encodeURIComponent(view));
        if (sensorFilter) parts.push('filter=sensor');
        if (extra) parts.push(extra);
        return 'uyarilar.html' + (parts.length ? '?' + parts.join('&') : '');
      }

      function filterHref(wantSensor) {
        var parts = [];
        if (view && view !== 'sensor') parts.push('view=' + encodeURIComponent(view));
        if (wantSensor) parts.push('filter=sensor');
        /* Preserve mode/apiary when switching filter */
        if (hasMode && mode === 'all') parts.push('mode=all');
        else if (hasMode && mode === 'apiary' && apiaryFilter) {
          parts.push('mode=apiary');
          parts.push('apiary=' + encodeURIComponent(apiaryFilter));
        } else if (!hasMode && apiaryFilter) {
          parts.push('apiary=' + encodeURIComponent(apiaryFilter));
        }
        return 'uyarilar.html' + (parts.length ? '?' + parts.join('&') : '');
      }

      function choiceBtn(href, title, meta) {
        return '<a class="choice-btn" href="' + href + '">' +
          '<strong>' + esc(title) + '</strong>' +
          '<span>' + esc(meta) + '</span></a>';
      }

      function isSensorAlert(a) {
        var t = String(a && a.type != null ? a.type : '').toLowerCase().trim();
        if (!t) return false; /* missing type: not assumed sensor */
        return SENSOR_TYPES.indexOf(t) !== -1;
      }

      function alertApiaryId(a) {
        var hive = a.hiveId != null ? D.hiveById(a.hiveId) : null;
        if (hive && hive.apiaryId) return String(hive.apiaryId);
        return a.apiaryId ? String(a.apiaryId) : 'none';
      }

      function groupAlertsByApiary(alerts) {
        var map = {};
        var order = [];
        alerts.forEach(function (a) {
          var aid = alertApiaryId(a);
          if (!map[aid]) {
            map[aid] = [];
            order.push(aid);
          }
          map[aid].push(a);
        });
        return order.map(function (aid) {
          var ap = D.apiaryById(aid);
          return {
            apiaryId: aid,
            apiaryName: ap ? (ap.name || ap.place || 'Arılık') : 'Arılık',
            alerts: map[aid]
          };
        });
      }

      /* koloni-261: kategoriler — mevcut uyarı türlerinden (type) türetilir; yalnız listede olanlar döşeme olur */
      var KAT = [
        { k: 'besleme', l: 'Besleme', svg: '<path d="M12 6.4c2.6 3.2 4 5.4 4 7.3a4 4 0 0 1-8 0c0-1.9 1.4-4.1 4-7.3z"/>' },
        { k: 'ana', l: 'Ana', svg: '<path d="M6.6 15.8 5.8 9l3.4 2.6L12 7.2l2.8 4.4L18.2 9l-.8 6.8z"/><path d="M6.8 17.6h10.4"/>' },
        { k: 'saglik', l: 'Sağlık', svg: '<path d="M10.2 6.8h3.6v3.4h3.4v3.6h-3.4v3.4h-3.6v-3.4H6.8v-3.6h3.4z"/>' },
        { k: 'koloni', l: 'Koloni', svg: '<path d="M7.6 16.4v-3.2M10.5 16.4V11M13.4 16.4V8.6M16.3 16.4V6.8"/>' },
        { k: 'ogul', l: 'Oğul', svg: '<circle cx="12" cy="9" r="2.4"/><path d="M8 16.6c.6-2.6 2.1-4 4-4s3.4 1.4 4 4"/>' },
        { k: 'tarti', l: 'Tartı', svg: (window.SuperAriKapsam && SuperAriKapsam.BURN && SuperAriKapsam.BURN.tarti) || '' },
        { k: 'stok', l: 'Stok', svg: '<path d="M6.6 9.2 12 6.6l5.4 2.6v6L12 17.8l-5.4-2.6z"/><path d="M6.6 9.2 12 11.8l5.4-2.6M12 11.8v6"/>' },
        { k: 'sensor', l: 'Sensör', svg: '<path d="M5.6 12h2.6l1.6-3.6 2.6 7.2 1.8-4.8 1.2 1.2h2.8"/>' },
        { k: 'arilik', l: 'Arılık', svg: '<path d="M12 17.6s-4.4-4.2-4.4-7.4a4.4 4.4 0 0 1 8.8 0c0 3.2-4.4 7.4-4.4 7.4z"/><circle cx="12" cy="10.2" r="1.5"/>' },
        { k: 'diger', l: 'Diğer', svg: '<path d="M7.4 8h9.2M7.4 12h9.2M7.4 16h9.2"/>' }
      ];
      var KAT_BY = {}; KAT.forEach(function (c) { KAT_BY[c.k] = c; });
      function katOf(a) {
        var t = String(a && a.type || '').toLocaleLowerCase('tr').trim();
        /* Anasız koloni bir ana sorunudur → Ana */
        if (t === 'koloni' && /anas[ıi]z/i.test(String(a.title || '') + ' ' + String(a.code || ''))) return 'ana';
        if (t === 'hastalık' || t === 'hastalik' || t === 'saglik' || t === 'sağlık' || t === 'ilac') return 'saglik';
        if (t === 'isi' || t === 'nem' || t === 'titresim' || t === 'ir' || t === 'batarya' || t === 'sensor' || t === 'ses') return 'sensor';
        if (t === 'cevre' || t === 'hava' || t === 'su' || t === 'arilik') return 'arilik';
        return KAT_BY[t] ? t : 'diger';
      }
      function sevRank(a) { return a.severity === 'critical' ? 0 : a.severity === 'high' ? 1 : a.severity === 'medium' ? 2 : 3; }
      function hiveLabel(a) {
        var hive = a.hiveId != null ? D.hiveById(a.hiveId) : null;
        return hive ? hive.name : (a.hiveId != null ? 'Kovan ' + a.hiveId : (a.type === 'ana' ? 'Ana arı' : 'Genel'));
      }
      function actsHtml(a) {
        var o = [];
        if (a.hiveId != null) {
          o.push('<a class="ua-btn" href="kovanlar.html?id=' + encodeURIComponent(a.hiveId) + '">Kovana git</a>');
          if (a.type === 'ogul' && a.href) o.push('<a class="ua-btn" href="' + esc(a.href) + '">' + esc(a.hrefLabel || 'Aç') + '</a>');
          if (a.type === 'ogul') o.push('<a class="ua-btn" href="#" data-ogul-open="' + esc(a.hiveId) + '">Ayrıntı</a>');
        } else if (a.href) o.push('<a class="ua-btn" href="' + esc(a.href) + '">' + (a.queen === 'bilinmiyor' ? 'Ana yılını gir' : 'Aç') + '</a>');
        return o.length ? '<span class="ua-acts">' + o.join('') + '</span>' : '';
      }
      function txtHtml(a) {
        return (a.body ? '<p class="ua-txt">' + esc(a.body) + '</p>' : '') + (a.action ? '<p class="ua-txt"><b>👉 ' + esc(a.action) + '</b></p>' : '') +
          (a.type === 'ana' && a.queen && a.queen !== 'bilinmiyor' ? '<p class="ua-txt"><small>🌱 En iyi değişim: ilkbahar – yaz başı</small></p>' : '');
      }
      function badgeHtml(a) {
        var pri = (a.severity === 'critical' || a.severity === 'high') ? 1 : (a.severity === 'medium' ? 2 : 3);
        return '<span class="badge priority-' + pri + '">' + esc((KAT_BY[katOf(a)] || {}).l || a.type || 'uyarı') + '</span>';
      }
      function chips(a) { return (a.severity === 'critical' ? '<span class="badge" style="background:#b3001b;color:#fff">Kritik</span> ' : ''); }
      function renderAlertCard(a) {
        return '<article class="item-card ua-card">' +
          '<div class="ua-head"><h3>' + chips(a) + esc(a.title) + (a.demo ? ' <span class="badge cevrimdisi">Demo</span>' : '') + '</h3>' + badgeHtml(a) + '</div>' +
          txtHtml(a) +
          '<div class="ua-foot"><span class="ua-hv">' + esc(hiveLabel(a)) + '</span>' + actsHtml(a) + '</div>' +
        '</article>';
      }
      /* Aynı tür uyarılar (başlığın « — » öncesi aynı) tek kartta: her kovan kendi satırı + «Kovana git» */
      function stemOf(a) { var t = String(a.title || ''), i = t.indexOf(' — '); return i > 0 ? t.slice(0, i) : t; }
      function restOf(a) { var t = String(a.title || ''), i = t.indexOf(' — '); return i > 0 ? t.slice(i + 3) : ''; }
      function renderGrouped(list) {
        var map = {}, order = [];
        list.slice().sort(function (x, y) { return sevRank(x) - sevRank(y); }).forEach(function (a) {
          var key = katOf(a) + '|' + stemOf(a);
          if (!map[key]) { map[key] = []; order.push(key); }
          map[key].push(a);
        });
        return order.map(function (key) {
          var g = map[key];
          if (g.length === 1 || !restOf(g[0])) return g.map(renderAlertCard).join('');
          var f = g[0], same = g.every(function (x) { return (x.body || '') === (f.body || '') && (x.action || '') === (f.action || ''); });
          var crit = g.some(function (x) { return x.severity === 'critical'; }) ? f : null;
          return '<section class="ua-grp" aria-label="' + esc(stemOf(f)) + '">' +
            '<div class="ua-grp-h"><h3>' + (crit ? chips(crit) : '') + esc(stemOf(f)) + '</h3><span class="ua-grp-n">' + g.length + ' uyarı</span>' + badgeHtml(f) + '</div>' +
            (same ? txtHtml(f) : '') +
            g.map(function (a) {
              return '<div class="ua-it"><div class="ua-it-t">' + esc(restOf(a)) + (a.demo ? ' <span class="badge cevrimdisi">Demo</span>' : '') + '</div>' + (same ? '' : txtHtml(a)) +
                '<div class="ua-foot">' + (a.hiveId != null ? '' : '<span class="ua-hv"></span>') + actsHtml(a) + '</div></div>';
            }).join('') +
          '</section>';
        }).join('');
      }
      var kat = (params.get('kat') || '').toLowerCase();
      function katTiles(list) {
        var KS = window.SuperAriKapsam; if (!KS || !KS.anaModuleTile) return '';
        var cnt = {}, worst = {};
        list.forEach(function (a) { var k = katOf(a); cnt[k] = (cnt[k] || 0) + 1; worst[k] = Math.min(worst[k] == null ? 9 : worst[k], sevRank(a)); });
        function tone(r) { return r <= 1 ? 'red' : r === 2 ? 'orange' : 'yellow'; }
        var allW = list.reduce(function (m, a) { return Math.min(m, sevRank(a)); }, 9);
        var h = KS.anaModuleTile({ href: '#', label: 'Tümü', badge: list.length + ' uyarı', tone: list.length ? tone(allW) : 'tan', svg: '<path d="M12 6.4 17.6 16.6H6.4z"/><path d="M12 10.2v3.2M12 15.2v.2"/>', extraClass: !kat ? 'on' : '', dataKey: 'kat-', aria: 'Tümü, ' + list.length + ' uyarı' });
        KAT.forEach(function (c) {
          if (!cnt[c.k]) return;
          h += KS.anaModuleTile({ href: '#', label: c.l, badge: cnt[c.k] + ' uyarı', tone: tone(worst[c.k]), svg: c.svg, extraClass: kat === c.k ? 'on' : '', dataKey: 'kat-' + c.k, aria: c.l + ', ' + cnt[c.k] + ' uyarı' });
        });
        return '<div class="grid ana-hive-grid og-ana" data-sa-no-align="1" role="group" aria-label="Uyarı kategorisi">' + h + '</div>';
      }
      document.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('#katPanel [data-key^="kat-"]') : null; if (!t) return;
        e.preventDefault();
        var k = t.getAttribute('data-key').slice(4);
        kat = (k && kat !== k) ? k : '';
        try { var u = new URL(location.href); if (kat) u.searchParams.set('kat', kat); else u.searchParams.delete('kat'); history.replaceState(null, '', u); } catch (e2) { /* */ }
        var y = window.scrollY; drawUyari(); window.scrollTo(0, y);
      });

      document.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('[data-ogul-open]') : null;
        if (t && window.SuperAriOgul) { e.preventDefault(); SuperAriOgul.open(t.getAttribute('data-ogul-open')); }
      });
      /* ---- Oğul sayfası: 5 düzey, izleme listesi (formül gösterilmez) ---- */
      var duzey = (params.get('duzey') || '').toLowerCase();
      /* k161: arılık değişince sayfa yenilenmez — liste yerinde çizilir */
      function drawUyari() {
      if (view === 'ogul' && D.colony && D.colony.swarm) {
        var LV = D.colony.SWARM_LEVELS;
        var allH = D.loadHives ? D.loadHives() : D.hives;
        if (apiaryFilter) allH = allH.filter(function (h) { return String(h.apiaryId) === String(apiaryFilter); });
        var rows = allH.map(function (h) { return { h: h, a: D.colony.swarm(h) }; });
        var cnt = {}; LV.forEach(function (l) { cnt[l.key] = 0; });
        rows.forEach(function (r) { cnt[r.a.key]++; });
        var nAlert = (cnt['kritik'] || 0) + (cnt['yuksek'] || 0);
        /* önizleme: «Mevsim dışı» — bölgesi şu an oğul mevsimi dışında olan kovanlar (risk düzeyi değil; Orta'nın solunda, sakin gri-mavi) */
        var MD_COLOR = '#7b8fa6', nMd = rows.filter(function (r) { return r.a.season && r.a.season.phase === 'disi'; }).length;
        var apQ = apiaryFilter ? '&apiary=' + encodeURIComponent(apiaryFilter) : '';
        /* k244: mevsim notu bölge başına bir kez; «Oğul mevsimi dışı» gibi ortak baş tek sefer yazılır */
        var seasonGrp = {}, seasonOrd = [], seasonSeen = {};
        rows.forEach(function (r) {
          var se = r.a.season || {}, ph0 = se.phase === 'disi' ? 'Oğul mevsimi dışı' : (se.phase === 'zirve' ? 'Oğul mevsimi' : 'Oğul mevsimine yakın');
          var item = se.profileLabel ? se.profileLabel + (se.window ? ' (' + se.window + ')' : '') : '';
          if (!item) { item = r.a.seasonNote; ph0 = ''; }
          if (seasonSeen[ph0 + '|' + item]) return; seasonSeen[ph0 + '|' + item] = 1;
