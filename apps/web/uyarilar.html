<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="stylesheet" href="sa-early.css?v=koloni-252">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uyarılar · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
  <style>
    .og-dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:0 0 auto; }
    /* koloni-252: Ana döşemeleri — Mevsim dışı rozeti gri-mavi; seçili döşeme (sa-tile-select .on) ana-hive-tiles.css'ten */
    .ana-hive-grid.og-ana { margin:6px 0 6px; }
    #ogulPanel .grid.ana-hive-grid.og-ana .tile { min-height:122px; } /* seçili kenar 2px olunca satır büyümesin (zıplama yok) */
    .ana-hive-grid .badge.mdblue { background:#e3e9f0; color:#3b4a5c; }
    .og-season { font-size:13px; color:#6b5a48; margin:2px 0 6px; }
    /* k244: oğul görünümünde süzgeç boş — boş kutu yer kaplamasın */
    #filterChips:empty { display:none; }
    .og-row { display:block; padding:10px 12px; border:1px solid #eadfcd; border-radius:12px; background:#fff; margin-bottom:8px; color:inherit; text-decoration:none; }
    .og-row b { display:flex; align-items:center; gap:6px; }
    .og-row small { display:block; color:#6b5a48; margin-top:3px; line-height:1.35; }
    .og-pill { margin-left:auto; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; color:#fff; white-space:nowrap; }
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .mode-switch a {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 10px; border-radius: 12px; text-decoration: none;
      font-size: 13px; font-weight: 800; border: 1.5px solid var(--card-border, #e4e6ea);
      background: #fff; color: var(--text, #1a1b1e);
    }
    .mode-switch a.active {
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      border-color: #e0c56a; color: var(--brown, #5c4813);
    }
    .choice-grid { display: grid; gap: 10px; }
    .choice-btn {
      display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
      padding: 14px 14px; border-radius: 14px; text-decoration: none;
      border: 1.5px solid #e0c56a;
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      color: var(--brown, #5c4813); font-family: inherit;
    }
    .choice-btn strong { font-size: 15px; font-weight: 800; color: var(--brown, #5c4813); }
    .choice-btn span { font-size: 12px; font-weight: 650; color: var(--muted, #868e96); }
    .filter-chips {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .filter-chips a {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 8px 12px; border-radius: 999px; text-decoration: none;
      font-size: 12px; font-weight: 750;
      border: 1.5px solid var(--card-border, #e4e6ea);
      background: #fff; color: var(--text, #1a1b1e);
    }
    .filter-chips a.active {
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      border-color: #e0c56a; color: var(--brown, #5c4813);
    }
  </style>
  <link rel="stylesheet" href="kapsam.css?v=koloni-252" />
  <link rel="stylesheet" href="bk-kabuk.css?v=koloni-252" />
  <link rel="stylesheet" href="ana-hive-tiles.css?v=koloni-252" />
  <style>/* k89: uzun başlık («Oğul Eğilimi ve Takibi») → arılık seçici alt satıra iner, adı kısalmaz */.ks-card .ks-top{flex-wrap:wrap;row-gap:2px;}.ks-card .ks-sel{max-width:100%;}</style>
</head>
<body>
  <main class="wrap">
    <div id="saKritik" aria-live="assertive" style="overflow-anchor:none;"></div>

    <section class="card stack">
      <h2 style="margin:0;" id="pageTitle">Uyarılar</h2>
      <p class="muted" id="summary">Demo uyarı listesi…</p>
      <div id="ogulPanel"></div>
      <div class="filter-chips" id="filterChips" role="group" aria-label="Uyarı filtresi"></div>
      <div class="mode-switch" id="modeSwitch"></div>
      <div class="list" id="alert-list"></div>
      <div class="note" id="pageNote">Statik demo uyarılar. Canlı veriler bağlandığında burada listelenir.</div>
    </section>
  </main>
  <script src="bk-kabuk.js?v=koloni-252"></script>
  <script src="sensor-ham.js?v=koloni-252"></script>
<script src="demo-data.js?v=koloni-252"></script>
  <script src="ogul.js?v=koloni-252"></script>
  <script src="kapsam.js?v=koloni-252"></script>
  <script src="ks-sayfa.js?v=koloni-252"></script>
  <script>SuperAriKsSayfa.ensureScope({ mode: true });</script>
  <script>
    (function () {
      var D = window.SuperAriDemo;
      if (!D) return;
      var SENSOR_TYPES = ['tarti', 'saglik', 'ogul', 'sensor', 'isi', 'nem', 'titresim', 'ir', 'batarya'];
      var params = new URLSearchParams(location.search);
      var view = (params.get('view') || '').toLowerCase();
      /* Prefer filter=sensor; also accept legacy view=sensor when no ogul view */
      var filterParam = (params.get('filter') || '').toLowerCase();
      if (!filterParam && view === 'sensor') filterParam = 'sensor';
      var sensorFilter = filterParam === 'sensor';
      var hasMode = params.has('mode');
      var modeParam = params.get('mode');
      var mode = modeParam === 'all' ? 'all' : (modeParam === 'apiary' ? 'apiary' : null);
      var apiaryFilter = params.get('apiary') || '';
      var listEl = document.getElementById('alert-list');
      var titleEl = document.getElementById('pageTitle');
      var subEl = (document.getElementById('pageSub') || document.createElement('p'));
      var summaryEl = document.getElementById('summary');
      var noteEl = document.getElementById('pageNote');
      var modeSwitchEl = document.getElementById('modeSwitch');
      var filterChipsEl = document.getElementById('filterChips');

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function pageHref(extra) {
        var parts = [];
        /* Keep view=ogul; drop view=sensor in favor of filter=sensor */
        if (view && view !== 'sensor') parts.push('view=' + encodeURIComponent(view));
        if (sensorFilter) parts.push('filter=sensor');
        if (extra) parts.push(extra);
        return 'uyarilar.html' + (parts.length ? '?' + parts.join('&') : '');
      }

      function filterHref(wantSensor) {
        var parts = [];
        if (view && view !== 'sensor') parts.push('view=' + encodeURIComponent(view));
        if (wantSensor) parts.push('filter=sensor');
        /* Preserve mode/apiary when switching filter */
        if (hasMode && mode === 'all') parts.push('mode=all');
        else if (hasMode && mode === 'apiary' && apiaryFilter) {
          parts.push('mode=apiary');
          parts.push('apiary=' + encodeURIComponent(apiaryFilter));
        } else if (!hasMode && apiaryFilter) {
          parts.push('apiary=' + encodeURIComponent(apiaryFilter));
        }
        return 'uyarilar.html' + (parts.length ? '?' + parts.join('&') : '');
      }

      function choiceBtn(href, title, meta) {
        return '<a class="choice-btn" href="' + href + '">' +
          '<strong>' + esc(title) + '</strong>' +
          '<span>' + esc(meta) + '</span></a>';
      }

      function isSensorAlert(a) {
        var t = String(a && a.type != null ? a.type : '').toLowerCase().trim();
        if (!t) return false; /* missing type: not assumed sensor */
        return SENSOR_TYPES.indexOf(t) !== -1;
      }

      function alertApiaryId(a) {
        var hive = a.hiveId != null ? D.hiveById(a.hiveId) : null;
        if (hive && hive.apiaryId) return String(hive.apiaryId);
        return a.apiaryId ? String(a.apiaryId) : 'none';
      }

      function groupAlertsByApiary(alerts) {
        var map = {};
        var order = [];
        alerts.forEach(function (a) {
          var aid = alertApiaryId(a);
          if (!map[aid]) {
            map[aid] = [];
            order.push(aid);
          }
          map[aid].push(a);
        });
        return order.map(function (aid) {
          var ap = D.apiaryById(aid);
          return {
            apiaryId: aid,
            apiaryName: ap ? (ap.name || ap.place || 'Arılık') : 'Arılık',
            alerts: map[aid]
          };
        });
      }

      function renderAlertCard(a) {
        var hive = a.hiveId != null ? D.hiveById(a.hiveId) : null;
        var hiveName = hive ? hive.name : (a.hiveId != null ? 'Kovan ' + a.hiveId : (a.type === 'ana' ? 'Ana arı' : 'Genel'));
        var pri = (a.severity === 'critical' || a.severity === 'high') ? 1 : (a.severity === 'medium' ? 2 : 3);
        return (
          '<article class="item-card">' +
            '<div class="row">' +
              '<h3>' + (a.severity === 'critical' ? '<span class="badge" style="background:#b3001b;color:#fff">Kritik</span> ' : '') + esc(a.title) + (a.demo ? ' <span class="badge cevrimdisi">Demo</span>' : '') + '</h3>' + (a.body ? '<p style="margin:4px 0">' + esc(a.body) + '</p>' : '') + (a.action ? '<p style="margin:4px 0"><b>👉 ' + esc(a.action) + '</b></p>' : '') +
              '<span class="badge priority-' + pri + '">' + esc(a.type || 'uyarı') + '</span>' +
            '</div>' +
            '<div class="meta">' + esc(hiveName) +
              (a.hiveId != null ? ' · <a href="kovanlar.html?id=' + encodeURIComponent(a.hiveId) + '">Kovana git</a>' + (a.type === 'ogul' && a.href ? ' · <a href="' + esc(a.href) + '">' + esc(a.hrefLabel || 'Aç') + '</a>' : '') : (a.href ? ' · <a href="' + esc(a.href) + '">' + (a.queen === 'bilinmiyor' ? 'Ana yılını gir' : 'Aç') + '</a>' : '')) +
              (a.type === 'ana' && a.queen !== 'bilinmiyor' ? '<br><small>🌱 En iyi değişim: ilkbahar – yaz başı</small>' : '') +
              (a.type === 'ogul' && a.hiveId != null ? ' · <a href="#" data-ogul-open="' + esc(a.hiveId) + '">Ayrıntı ve öneriler</a>' : '') + '</div>' +
          '</article>'
        );
      }

      document.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('[data-ogul-open]') : null;
        if (t && window.SuperAriOgul) { e.preventDefault(); SuperAriOgul.open(t.getAttribute('data-ogul-open')); }
      });
      /* ---- Oğul sayfası: 5 düzey, izleme listesi (formül gösterilmez) ---- */
      var duzey = (params.get('duzey') || '').toLowerCase();
      /* k161: arılık değişince sayfa yenilenmez — liste yerinde çizilir */
      function drawUyari() {
      if (view === 'ogul' && D.colony && D.colony.swarm) {
        var LV = D.colony.SWARM_LEVELS;
        var allH = D.loadHives ? D.loadHives() : D.hives;
        if (apiaryFilter) allH = allH.filter(function (h) { return String(h.apiaryId) === String(apiaryFilter); });
        var rows = allH.map(function (h) { return { h: h, a: D.colony.swarm(h) }; });
        var cnt = {}; LV.forEach(function (l) { cnt[l.key] = 0; });
        rows.forEach(function (r) { cnt[r.a.key]++; });
        var nAlert = (cnt['kritik'] || 0) + (cnt['yuksek'] || 0);
        /* önizleme: «Mevsim dışı» — bölgesi şu an oğul mevsimi dışında olan kovanlar (risk düzeyi değil; Orta'nın solunda, sakin gri-mavi) */
        var MD_COLOR = '#7b8fa6', nMd = rows.filter(function (r) { return r.a.season && r.a.season.phase === 'disi'; }).length;
        var apQ = apiaryFilter ? '&apiary=' + encodeURIComponent(apiaryFilter) : '';
        /* k244: mevsim notu bölge başına bir kez; «Oğul mevsimi dışı» gibi ortak baş tek sefer yazılır */
        var seasonGrp = {}, seasonOrd = [], seasonSeen = {};
        rows.forEach(function (r) {
          var se = r.a.season || {}, ph0 = se.phase === 'disi' ? 'Oğul mevsimi dışı' : (se.phase === 'zirve' ? 'Oğul mevsimi' : 'Oğul mevsimine yakın');
          var item = se.profileLabel ? se.profileLabel + (se.window ? ' (' + se.window + ')' : '') : '';
          if (!item) { item = r.a.seasonNote; ph0 = ''; }
          if (seasonSeen[ph0 + '|' + item]) return; seasonSeen[ph0 + '|' + item] = 1;
          if (!seasonGrp[ph0]) { seasonGrp[ph0] = []; seasonOrd.push(ph0); }
          seasonGrp[ph0].push(item);
        });
        var seasonTxt = seasonOrd.map(function (k) { return (k ? k + ': ' : '') + seasonGrp[k].join(' · '); }).join(' — ');
        /* koloni-252: Ana sayfa döşemeleri (ana-hive-tiles.css + SuperAriKapsam.anaModuleTile — Cihazlar/Koloni ile aynı) sabit 3×2:
           Uyarılar · Mevsim dışı · Düşük / Orta · Yüksek · Kritik; seçili = .on (sa-tile-select: yeşil kenar), yükseklik sabit (min-height) */
        var KS = window.SuperAriKapsam, base = 'uyarilar.html?view=ogul';
        var LVK = {}; LV.forEach(function (l) { LVK[l.key] = l; });
        function bars(n) { var x = [7.6, 10.5, 13.4, 16.3], y = [13.2, 11, 8.6, 6.8], o = ''; for (var i = 0; i < n; i++) o += 'M' + x[i] + ' 16.4V' + y[i]; return '<path d="' + o + '"/>'; }
        var OG_ICO = { uyari: '<path d="M12 6.4 17.6 16.6H6.4z"/><path d="M12 10.2v3.2M12 15.2v.2"/>', md: null, dusuk: bars(1), orta: bars(2), yuksek: bars(3), kritik: bars(4) };
        var OG_TONE = { dusuk: 'green', orta: 'yellow', yuksek: 'orange', kritik: 'red' };
        function ogTile(on, href, label, badge, tone, svg, burn, key) {
          return KS.anaModuleTile({ href: href, label: label, badge: badge, tone: tone, svg: svg, burn: burn, extraClass: on ? 'on' : '', dataKey: 'og-' + key, aria: label + ', ' + badge });
        }
        var ph = ((KS && KS.anaModuleTile) ? '<div class="grid ana-hive-grid og-ana" data-sa-no-align="1" role="group" aria-label="Oğul riski düzeyi">' +
          ogTile(!duzey, base + apQ, 'Uyarılar', nAlert + ' uyarı', nAlert ? 'red' : 'tan', OG_ICO.uyari, null, 'uyari') +
          ogTile(duzey === 'mevsimdisi', base + '&duzey=mevsimdisi' + apQ, 'Mevsim dışı', nMd + ' kovan', 'mdblue', null, 'plan', 'md') +
          ['dusuk', 'orta', 'yuksek', 'kritik'].map(function (k) { var l = LVK[k] || { label: k };
            /* k244: duzey=izleme eski bağlantısı Orta'yı açar */
            return ogTile(duzey === k || (duzey === 'izleme' && k === 'orta'), base + '&duzey=' + k + apQ, l.label, (cnt[k] || 0) + ' kovan', OG_TONE[k], OG_ICO[k], null, k); }).join('') +
          '</div>' : '') +
          '<div class="og-season">' + esc(seasonTxt) + '</div>';
        document.getElementById('ogulPanel').innerHTML = ph; document.body.classList.add('sa-tile-select');
        if (duzey) {
          var want = duzey === 'izleme' ? 'orta' : duzey, mdV = want === 'mevsimdisi';
          var lvObj = LV.filter(function (l) { return l.key === want; })[0];
          var sel = rows.filter(function (r) { return mdV ? (r.a.season && r.a.season.phase === 'disi') : r.a.key === want; }).sort(function (x, y) { return y.a.score - x.a.score || x.h.id - y.h.id; });
          var izl = want === 'orta';
          titleEl.textContent = mdV ? 'Oğul mevsimi dışı' : izl ? 'Oğul riski: Orta (izleme)' : 'Oğul riski: ' + (lvObj ? lvObj.label : '');
          subEl.textContent = 'Oğul';
          summaryEl.textContent = sel.length + ' kovan' + (izl ? ' izlemede (orta risk)' : '');
          if (filterChipsEl) filterChipsEl.innerHTML = '';
          modeSwitchEl.innerHTML = '';
          noteEl.textContent = mdV ? 'Bölgesi şu an oğul mevsimi dışında olan kovanlar; oğul riski düzeyleri yanlarında.' : izl
            ? 'Orta riskli kovanlar izlemededir. Oğul mevsiminde Bakım planına 7–10 günde bir «Oğul izleme» görevi eklenir; mevsim dışında görev açılmaz.'
            : 'Son muayenede oğul yüksüğü görüldüyse risk Kritik sayılır.';
          var apN = {}; (D.loadApiaries ? D.loadApiaries() : []).forEach(function (a) { apN[a.id] = a.name || a.place; });
          listEl.innerHTML = sel.map(function (r) {
            return '<a class="og-row" href="kovan.html?id=' + encodeURIComponent(r.h.id) + '" data-ogul-open="' + esc(r.h.id) + '"><b><span class="og-dot" style="background:' + r.a.color + '"></span>' + esc(r.h.name) +
              '<span class="og-pill" style="background:' + r.a.color + '">' + esc(r.a.display || r.a.level) + '</span></b>' +
              /* k244: ırk «Ana arı karakteri: …» nedeninde zaten yazıyorsa arılık satırında tekrar edilmez */
              '<small>' + esc((apN[r.h.apiaryId] || '') + (r.a.breed && !r.a.reasons.some(function (t) { return t.indexOf('Ana arı karakteri:') === 0; }) ? ' · ' + r.a.breed : '')) + '</small>' +
              '<small>' + esc(r.a.seasonNote + (r.a.reasons.length ? ' — ' + r.a.reasons.join(', ') : '')) + '</small></a>';
          }).join('') || '<p class="muted">Bu düzeyde kovan yok.</p>';
          return;
        }
      }

      var alerts = D.alerts.slice();
      var allLabel = 'Tüm uyarılar';
      var itemWord = 'uyarı';

      /* view=ogul first, then optional sensor filter (can combine) */
      if (view === 'ogul') {
        alerts = alerts.filter(function (a) { return a.type === 'ogul'; });
        titleEl.textContent = 'Oğul uyarıları';
        subEl.textContent = 'Oğul';
        allLabel = 'Tüm oğul uyarıları';
        itemWord = 'oğul uyarısı';
      } else if (sensorFilter) {
        titleEl.textContent = 'Sensör kaynaklı';
        subEl.textContent = 'Sensör';
        allLabel = 'Tüm sensör uyarıları';
        itemWord = 'sensör uyarısı';
      } else {
        titleEl.textContent = 'Uyarılar';
        subEl.textContent = 'Uyarılar';
      }

      /* Filter applies to alert set before grouping / chooser */
      if (sensorFilter) {
        alerts = alerts.filter(isSensorAlert);
      }

      if (filterChipsEl && view === 'ogul') {
        /* k244: oğul uyarılarının hepsi sensör türü ('ogul' ∈ SENSOR_TYPES) — «Tümü» ile «Sensör kaynaklı» aynı listeyi verirdi; oğul görünümünde gösterilmez */
        filterChipsEl.innerHTML = '';
      } else if (filterChipsEl) {
        filterChipsEl.innerHTML =
          '<a class="' + (!sensorFilter ? 'active' : '') + '" href="' + filterHref(false) + '">Tümü</a>' +
          '<a class="' + (sensorFilter ? 'active' : '') + '" href="' + filterHref(true) + '">Sensör kaynaklı</a>';
      }

      var groups = groupAlertsByApiary(alerts);
      var alertCountByApiary = {};
      groups.forEach(function (g) {
        alertCountByApiary[String(g.apiaryId)] = g.alerts.length;
      });

      var effectiveMode = mode;
      if (!hasMode && apiaryFilter) {
        effectiveMode = 'apiary';
      }

      /* Chooser — tüm arılıklar (uyarısızlar da «0 uyarı») */
      if (!hasMode && !apiaryFilter) {
        summaryEl.textContent = alerts.length + ' açık ' + itemWord + ' · görünüm seçin';
        noteEl.textContent = allLabel + ' veya bir arılık seçin.';
        modeSwitchEl.innerHTML = '';
        var html = '<div class="choice-grid">' +
          choiceBtn(pageHref('mode=all'), allLabel, alerts.length + ' ' + itemWord + ' tek listede');
        var apiaryList = (D.loadApiaries && D.loadApiaries()) || D.apiaries || [];
        apiaryList = apiaryList.slice().sort(function (a, b) {
          var ca = alertCountByApiary[String(a.id)] || 0;
          var cb = alertCountByApiary[String(b.id)] || 0;
          if (cb !== ca) return cb - ca;
          var na = String(a.name || a.place || '');
          var nb = String(b.name || b.place || '');
          return na.localeCompare(nb, 'tr');
        });
        apiaryList.forEach(function (ap) {
          var aid = String(ap.id);
          var n = alertCountByApiary[aid] || 0;
          html += choiceBtn(
            pageHref('mode=apiary&apiary=' + encodeURIComponent(aid)),
            ap.name || ap.place || 'Arılık',
            n + ' ' + itemWord
          );
        });
        if (!apiaryList.length) {
          html += '<p class="muted">Kayıtlı arılık yok.</p>';
        }
        html += '</div>';
        listEl.innerHTML = html;
        return;
      }

      if (effectiveMode === 'apiary' && apiaryFilter) {
        alerts = alerts.filter(function (a) {
          return alertApiaryId(a) === String(apiaryFilter);
        });
      }

      var filterApiary = apiaryFilter ? D.apiaryById(apiaryFilter) : null;
      var apName = filterApiary ? (filterApiary.name || filterApiary.place) : '';

      summaryEl.textContent = alerts.length + ' açık ' + itemWord + ' · ' +
        (effectiveMode === 'all' ? allLabel : (apName || 'Arılık'));
      noteEl.textContent = sensorFilter
        ? 'Sensör kaynaklı demo uyarılar (tarti, sağlık, oğul…).'
        : ((D.records && D.records.workMode() === 'live') ? 'Canlı mod: kayıtlarınızdan ve malzeme stokundan üretilen uyarılar.' : 'Demo mod: örnek uyarılar «Demo» etiketlidir; kayıtlardan ve stoktan üretilen uyarılar da listelenir.');

      modeSwitchEl.innerHTML =
        '<a class="' + (effectiveMode === 'all' ? 'active' : '') + '" href="' + pageHref('mode=all') + '">' + esc(allLabel) + '</a>' +
        '<a class="' + (effectiveMode === 'apiary' ? 'active' : '') + '" href="' + pageHref('') + '">Arılıklar</a>';

      listEl.innerHTML = alerts.map(renderAlertCard).join('') || '<p class="muted">Açık uyarı yok.</p>';
      }
      drawUyari();
      window.__saUyariScope = function (sc) { hasMode = true; mode = sc === 'all' ? 'all' : 'apiary'; apiaryFilter = sc === 'all' ? '' : String(sc); drawUyari(); };
    })();
  </script>
