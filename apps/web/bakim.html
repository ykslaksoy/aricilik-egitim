<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Bakım</title>
<!-- ANA-CSS:BEGIN — ana.html stil bloğunun birebir kopyası; elle düzenlemeyin: node scripts/sync-bakim-ana.js -->
<style>
  :root {
    --bg: #f0f1f3;
    --card: #f4f5f7;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --green: #2f9e44;
    --green-bg: #d8f3dc;
    --tan-bg: #efe2cb;
    --tan-fg: #7a5a32;
    --blue: #1c7ed6;
    --blue-bg: #d0ebff;
    --red: #e03131;
    --red-bg: #ffe3e3;
    --purple: #7048e8;
    --purple-bg: #e5dbff;
    --orange: #f08c00;
    /* Restored warmer yakma-era wood (pre-Grok 0a61b12): was --wood-1/#e8c48e + --wood-2/#c99755 */
    --wood: #d9ae6a;
    --wood-hi: #e8c48e;
    --wood-lo: #c99755;
    --wood-edge: #8a6030;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top-align phone so Hardal brand strip stays on-screen when viewport < 844px
     (center alignment previously clipped the strip to a mustard sliver). */
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0 28px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .02em; }

  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow: hidden; display: flex; flex-direction: column; background: var(--bg);
    padding: 2px 12px 6px;
   position: relative;
  }

  /* Hardal işletme şeridi — 3D bee logo + brand + lock; location lives in weather card below */
  .brand-strip {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 5px 10px 5px 6px;
    margin-bottom: 4px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
    overflow: visible;
  }
  .brand-logo-btn {
    flex: 0 0 auto;
    width: auto;
    height: auto;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
  }
  .brand-logo-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.45);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .brand-logo-btn .bee-3d,
  .brand-logo-btn .bee-logo-img {
    width: 40px;
    height: auto;
    max-height: 30px;
    display: block;
    object-fit: contain;
    /* Daha çizim: kenar vurgusu + kontrast */
    filter:
      contrast(1.12) saturate(1.08)
      drop-shadow(0 0 0.4px #3d2616)
      drop-shadow(0 0 0.4px #3d2616)
      drop-shadow(0 1px 1.5px rgba(61, 38, 22, 0.28));
    transform: none;
  }
  .brand-logo-btn .bee-emoji {
    font-size: 22px;
    line-height: 1;
    display: block;
    transform: perspective(120px) rotateX(8deg) rotateY(-6deg) translateZ(2px);
    filter: drop-shadow(0 2px 2px rgba(61, 38, 22, 0.3));
    user-select: none;
  }
  .brand-strip .brand-name {
    flex: 0 1 auto;
    text-align: left;
    line-height: 1.2;
    color: var(--brown);
    margin-left: 2px;
  }
  .brand-strip .brand-lock-btn {
    margin-left: auto;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    padding: 5px 11px;
    border: 1px solid rgba(176, 140, 60, 0.35);
    border-radius: 999px;
    background: rgba(255, 252, 244, 0.72);
    color: var(--brown-mid, #5c3a1f);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .015em;
    line-height: 1.2;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    box-shadow: none;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .brand-strip .brand-lock-btn:hover {
    background: rgba(255, 248, 230, 0.95);
    border-color: rgba(176, 140, 60, 0.55);
  }
  .brand-strip .brand-lock-btn:active {
    background: rgba(244, 227, 176, 0.85);
  }
  .brand-strip .brand-lock-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
  }
  .brand-strip .brand-lock-btn[aria-pressed="true"] {
    background: rgba(240, 196, 58, 0.28);
    border-color: rgba(184, 134, 11, 0.55);
    color: var(--brown, #3d2616);
    font-weight: 600;
  }
  .weather-loc-label.is-fading {
    opacity: 0;
  }
  .weather-loc-label {
    transition: opacity 0.35s ease;
  }

  .weather-loc {
    position: relative;
  }
  /* Invisible exit marker: bees emerge just right of the arılık label (pre-flex stretch) */
  .bee-exit {
    position: absolute;
    left: 100%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin-left: 10px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* Breed name under bee exit point */
  .bee-podium {
    position: absolute;
    left: 100%;
    top: calc(50% + 10px);
    transform: translateY(0);
    margin-left: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 9;
    pointer-events: none;
  }
  .bee-podium.is-hidden { display: none; }
  .bee-podium .podium-stage {
    flex: 0 0 10px;
    width: 22px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(90,60,30,.22) 0%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .bee-podium.is-ready .podium-stage { opacity: 1; }
  .bee-podium .podium-name {
    font-size: 8px; font-weight: 800; color: var(--brown-mid);
    background: rgba(255,248,238,.96); border: 1px solid #e8dcc8;
    border-radius: 999px; padding: 1px 6px; line-height: 1.35;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0; white-space: nowrap; max-width: 148px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .bee-podium .podium-name.is-on {
    opacity: 1; transform: translateY(0);
  }

  /* Butonlar %5 kısaldı; açılan alan hava kartına verildi */
  .weather {
    flex: 0 0 auto; background: #fff; border: 1px solid #e6e8ec; border-radius: 14px;
    padding: 10px 10px 10px; margin-top: 0; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    overflow: hidden; /* breed podium taşmasın, kart büyümüş gibi görünmesin */
  }
  .weather-top {
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 0;
    min-height: 0;
    padding: 0;
  }
  .weather-icon { width: 24px; height: 24px; flex: 0 0 auto; }
  /* Content-sized (not flex:1) so #beeExit stays at end of short label — restores d6cf379 exit */
  .weather-loc { font-size: 14px; font-weight: 650; color: var(--text); flex: 0 1 auto; max-width: 52%; }
  .arilik-loc-controls {
    display: inline-flex;
    align-items: center;
    gap: 0;
    max-width: 100%;
    min-width: 0;
  }
  /* Şık kibar prev/next — light tap targets, quiet chevrons, warm ink */
  .arilik-nav {
    flex: 0 0 auto;
    box-sizing: content-box;
    width: 1em;
    height: 1em;
    min-width: 24px;
    min-height: 24px;
    padding: 4px;
    margin: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #8a7358;
    font-size: 15px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .18s ease, background .18s ease;
  }
  .arilik-nav:hover {
    color: var(--brown-mid, #5c3a1f);
    background: rgba(232, 220, 200, 0.45);
  }
  .arilik-nav:active {
    color: var(--brown, #3d2616);
    background: rgba(224, 208, 180, 0.55);
  }
  .arilik-nav:focus-visible {
    outline: 1.5px solid rgba(184, 134, 11, 0.55);
    outline-offset: 1px;
  }
  .arilik-nav:disabled {
    opacity: 0.28;
    cursor: default;
    background: transparent;
  }
  .arilik-nav svg {
    width: 12px;
    height: 12px;
    display: block;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .weather-loc-label {
    display: block;
    max-width: 7.2em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 1px;
    text-align: center;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--text);
  }
  /* Live °C from Open-Meteo (see liveWeather) — far right of weather-top */
  .weather-temp {
    margin-left: auto; font-size: 25px; font-weight: 700; color: var(--text); line-height: 1; flex: 0 0 auto;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .weather-temp:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
    border-radius: 6px;
  }
  .bee-toggle {
    flex: 0 0 auto;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-toggle:hover { background: #f3ebe0; }
  .bee-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-toggle-ico {
    width: 14px;
    height: 14px;
    display: block;
    flex: 0 0 auto;
  }
  .bee-sound-toggle {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    margin-left: 4px;
    padding: 4px 7px;
    /* «Sessiz» ve «Ses» aynı kutuda — metin değişince boyut oynasın */
    box-sizing: border-box;
    width: 68px;
    min-width: 68px;
    max-width: 68px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-sound-text {
    display: inline-block;
    min-width: 0;
    text-align: center;
    white-space: nowrap;
  }
  .bee-sound-toggle:hover { background: #f3ebe0; }
  .bee-sound-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-sound-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-sound-toggle-ico {
    width: 13px;
    height: 13px;
    display: block;
    flex: 0 0 auto;
  }
  .bee-controls {
    display: contents; /* children participate in hint flex row */
  }
  .bee-toggle { margin-left: 0; }
  .bee-sound-toggle { margin-left: 0; }
  .muayene-hint .bee-toggle,
  .muayene-hint .bee-sound-toggle {
    flex: 0 0 auto;
    padding: 3px 7px;
    font-size: 10px;
    z-index: 12;
  }
  .muayene-hint .bee-sound-toggle {
    width: 64px;
    min-width: 64px;
    max-width: 64px;
    justify-content: center;
    box-sizing: border-box;
  }
  .muayene-hint-mid {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    position: relative;
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 28px !important;
    min-height: 28px !important;
    max-height: 28px !important;
    overflow: hidden;
  }
  .muayene-hint.is-idle .muayene-hint-mid {
    height: 28px !important;
    min-height: 28px !important;
    max-height: 28px !important;
  }
  .muayene-hint.is-active .muayene-hint-mid {
    justify-content: flex-start;
  }
  .forecast {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 0;
    text-align: center;
    margin-top: 1px;
  }
  .day { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 0; }
  .day-name { font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.1; }
  .day-date { font-size: 12px; font-weight: 800; color: var(--text); line-height: 1.05; }
  .day.is-today .day-name,
  .day.is-today .day-date { color: var(--hardal-lo, #b8860b); }
  .day-ico { width: 17px; height: 17px; margin: 0; }
  .day-temps { font-size: 11px; font-weight: 800; color: var(--text); line-height: 1.1; white-space: nowrap; }
  .day-temps .lo { font-weight: 600; color: #8a8278; }
  .day-hi { font-size: 10px; font-weight: 700; color: var(--text); }
  .day-lo { font-size: 9px; color: #8a8278; }
  .muayene-hint {
    position: relative;
    margin-top: 2px; padding: 4px 6px; border-radius: 10px;
    background: #fff8df; border: 1px solid #e0c56a;
    color: var(--brown, #4a2f1a); font-size: 11px; font-weight: 650; line-height: 1.2;
    display: flex; flex-wrap: nowrap; align-items: center; gap: 6px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    /* Not gelince ASLA büyümesin */
    height: 36px !important;
    min-height: 36px !important;
    max-height: 36px !important;
    overflow: hidden !important;
    box-sizing: border-box;
  }
  /* Idle = bee dock under forecast; active = reminder text */
  .muayene-hint.is-idle {
    background: transparent;
    border-color: transparent;
    cursor: default;
    justify-content: center;
    padding: 4px 6px;
    height: 36px !important;
    min-height: 36px !important;
    max-height: 36px !important;
  }
  .muayene-hint.is-idle .muayene-hint-text,
  .muayene-hint.is-idle .muayene-hint-ok { display: none !important; }
  .muayene-hint.is-active .bee-exit,
  .muayene-hint.is-active .bee-podium { display: none !important; }
  .muayene-hint-text {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint-text:active { opacity: .75; }
  .muayene-hint-ok {
    flex: 0 0 auto;
    height: 26px;
    min-height: 26px;
    max-height: 26px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(176, 140, 60, 0.45);
    border-radius: 8px;
    background: rgba(255, 252, 244, 0.95);
    color: var(--brown, #4a2f1a);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .01em;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint-ok:active {
    background: rgba(240, 196, 58, 0.28);
  }
  /* Exit + breed label live in dock mid (between Arılar / Ses) */
  .muayene-hint-mid .bee-exit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .muayene-hint-mid .bee-podium {
    position: absolute;
    left: 50%;
    top: calc(50% + 11px);
    transform: translateX(-50%);
    margin: 0;
    z-index: 2;
  }

  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 5px; min-height: 0;
  }
  /* LOCKED: centered hive+text (PR #16) — do not regress */
  .tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    position: relative; overflow: hidden; min-height: 0; height: 100%;
    /* Center hive + label + badge as one group in the button */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4px 3px;
    box-sizing: border-box;
  }
  .hive-area {
    position: relative; flex: 0 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-top: 0;
  }

  /* ===== Shared hive: EQUAL tiers, FLUSH sides ===== */
  .hive {
    width: 58px; height: 54px; position: relative; flex: 0 0 auto; margin-top: 0;
  }
  .hive-stack {
    position: absolute; left: 50%; top: 1px; transform: translateX(-50%);
    width: 44px; display: flex; flex-direction: column; align-items: stretch;
  }
  .hive-lid {
    width: 50px; height: 6px; margin-left: -3px; margin-bottom: 0;
    /* Brighter lid from pre-Grok ana.css (4994d59) */
    background: linear-gradient(180deg, #f4f5f7 0%, #c8ccd2 48%, #9aa1aa 100%);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 1px 0 #7c828a;
    position: relative; z-index: 1;
  }
  .hive-lid::after {
    content: ""; position: absolute; left: 50%; top: 2.5px; transform: translateX(-50%);
    width: 14px; height: 1.5px; border-radius: 1px; background: rgba(60,60,70,.45);
  }
  /* Two boxes: IDENTICAL height & width → equal + flush */
  .hive-box {
    height: 18px; /* EQUAL */
    width: 100%;
    /* Warmer fill + highlight wash from 4994d59 .hive-box */
    background-color: var(--wood-hi);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(90, 52, 16, 0.07) 0 1px,
        transparent 1px 6px
      ),
      linear-gradient(180deg, rgba(255, 248, 230, 0.35), transparent 42%, rgba(90, 50, 14, 0.16));
    border-left: 1px solid var(--wood-edge);
    border-right: 1px solid var(--wood-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    position: relative;
    box-sizing: border-box;
  }
  .hive-box.top {
    border-top: 1px solid var(--wood-edge);
  }
  .hive-box.bottom {
    border-bottom: 1px solid var(--wood-edge);
    border-top: 1px solid var(--wood-edge); /* seam matches wood edge (a16661d) */
  }
  /* finger joints INSIDE edges — warm #e0b87a accents from 4994d59 */
  .hive-box::before,
  .hive-box::after {
    content: ""; position: absolute; top: 2px; bottom: 2px; width: 4px;
    background: repeating-linear-gradient(
      180deg,
      #7a5224 0 3px,
      #e0b87a 3px 7px
    );
    pointer-events: none;
  }
  .hive-box::before { left: 0; }
  .hive-box::after { right: 0; }
  .hive-entrance {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 10px; height: 2px; background: #2a1a0c; border-radius: 0 0 1px 1px; z-index: 1;
  }
  /* Invisible landing target centered on the entrance slit (kapı) */
  .hive-door {
    position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
