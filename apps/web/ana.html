<!DOCTYPE html>
<html lang="tr">
<head>
  <script>
    /* Role home: yonetici/bakici visiting / or ana → their shell */
    (function () {
      try {
        var tip = localStorage.getItem('superari.hesapTipi');
        if (!tip) return;
        var s = String(tip).toLowerCase()
          .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
          .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
        if (/yonetici|admin/.test(s)) { location.replace('yonetici.html'); return; }
        if (/bakici|isci|worker|caretaker/.test(s)) { location.replace('bakici.html'); return; }
      } catch (e) { /* ignore */ }
    })();
  </script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Ana</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card: #f4f5f7;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --green: #2f9e44;
    --green-bg: #d8f3dc;
    --tan-bg: #efe2cb;
    --tan-fg: #7a5a32;
    --blue: #1c7ed6;
    --blue-bg: #d0ebff;
    --red: #e03131;
    --red-bg: #ffe3e3;
    --purple: #7048e8;
    --purple-bg: #e5dbff;
    --orange: #f08c00;
    /* Restored warmer yakma-era wood (pre-Grok 0a61b12): was --wood-1/#e8c48e + --wood-2/#c99755 */
    --wood: #d9ae6a;
    --wood-hi: #e8c48e;
    --wood-lo: #c99755;
    --wood-edge: #8a6030;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top-align phone so Hardal brand strip stays on-screen when viewport < 844px
     (center alignment previously clipped the strip to a mustard sliver). */
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0 28px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .02em; }

  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow: hidden; display: flex; flex-direction: column; background: var(--bg);
    padding: 0 12px 8px;
   position: relative;
  }

  /* Hardal işletme şeridi — 3D bee logo + brand + lock; location lives in weather card below */
  .brand-strip {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 12px 7px 8px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
    overflow: visible;
  }
  .brand-logo-btn {
    flex: 0 0 auto;
    width: auto;
    height: auto;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
  }
  .brand-logo-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.45);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .brand-logo-btn .bee-3d,
  .brand-logo-btn .bee-logo-img {
    width: 40px;
    height: auto;
    max-height: 30px;
    display: block;
    object-fit: contain;
    /* Daha çizim: kenar vurgusu + kontrast */
    filter:
      contrast(1.12) saturate(1.08)
      drop-shadow(0 0 0.4px #3d2616)
      drop-shadow(0 0 0.4px #3d2616)
      drop-shadow(0 1px 1.5px rgba(61, 38, 22, 0.28));
    transform: none;
  }
  .brand-logo-btn .bee-emoji {
    font-size: 22px;
    line-height: 1;
    display: block;
    transform: perspective(120px) rotateX(8deg) rotateY(-6deg) translateZ(2px);
    filter: drop-shadow(0 2px 2px rgba(61, 38, 22, 0.3));
    user-select: none;
  }
  .brand-strip .brand-name {
    flex: 0 1 auto;
    text-align: left;
    line-height: 1.2;
    color: var(--brown);
    margin-left: 2px;
  }
  .brand-strip .brand-lock-btn {
    margin-left: auto;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    padding: 5px 11px;
    border: 1px solid rgba(176, 140, 60, 0.35);
    border-radius: 999px;
    background: rgba(255, 252, 244, 0.72);
    color: var(--brown-mid, #5c3a1f);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .015em;
    line-height: 1.2;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    box-shadow: none;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .brand-strip .brand-lock-btn:hover {
    background: rgba(255, 248, 230, 0.95);
    border-color: rgba(176, 140, 60, 0.55);
  }
  .brand-strip .brand-lock-btn:active {
    background: rgba(244, 227, 176, 0.85);
  }
  .brand-strip .brand-lock-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
  }
  .brand-strip .brand-lock-btn[aria-pressed="true"] {
    background: rgba(240, 196, 58, 0.28);
    border-color: rgba(184, 134, 11, 0.55);
    color: var(--brown, #3d2616);
    font-weight: 600;
  }
  .weather-loc-label.is-fading {
    opacity: 0;
  }
  .weather-loc-label {
    transition: opacity 0.35s ease;
  }

  .weather-loc {
    position: relative;
  }
  /* Invisible exit marker: bees emerge just right of the arılık label (pre-flex stretch) */
  .bee-exit {
    position: absolute;
    left: 100%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin-left: 10px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* Breed name under bee exit point */
  .bee-podium {
    position: absolute;
    left: 100%;
    top: calc(50% + 10px);
    transform: translateY(0);
    margin-left: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 9;
    pointer-events: none;
  }
  .bee-podium.is-hidden { display: none; }
  .bee-podium .podium-stage {
    flex: 0 0 10px;
    width: 22px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(90,60,30,.22) 0%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .bee-podium.is-ready .podium-stage { opacity: 1; }
  .bee-podium .podium-name {
    font-size: 9px; font-weight: 800; color: var(--brown-mid);
    background: rgba(255,248,238,.96); border: 1px solid #e8dcc8;
    border-radius: 999px; padding: 1px 7px; line-height: 1.35;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0; white-space: nowrap;
  }
  .bee-podium .podium-name.is-on {
    opacity: 1; transform: translateY(0);
  }

  .weather {
    flex: 0 0 auto; background: #fff; border: 1px solid #e6e8ec; border-radius: 16px;
    padding: 6px 12px 8px; margin-top: 0; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .weather-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; /* dense: header row → weekday strip */
    min-height: 32px;
  }
  .weather-icon { width: 28px; height: 28px; flex: 0 0 auto; }
  /* Content-sized (not flex:1) so #beeExit stays at end of short label — restores d6cf379 exit */
  .weather-loc { font-size: 13px; font-weight: 600; color: var(--text); flex: 0 1 auto; max-width: 52%; }
  .arilik-loc-controls {
    display: inline-flex;
    align-items: center;
    gap: 0;
    max-width: 100%;
    min-width: 0;
  }
  /* Şık kibar prev/next — light tap targets, quiet chevrons, warm ink */
  .arilik-nav {
    flex: 0 0 auto;
    box-sizing: content-box;
    width: 1em;
    height: 1em;
    min-width: 28px;
    min-height: 28px;
    padding: 6px;
    margin: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #8a7358;
    font-size: 15px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .18s ease, background .18s ease;
  }
  .arilik-nav:hover {
    color: var(--brown-mid, #5c3a1f);
    background: rgba(232, 220, 200, 0.45);
  }
  .arilik-nav:active {
    color: var(--brown, #3d2616);
    background: rgba(224, 208, 180, 0.55);
  }
  .arilik-nav:focus-visible {
    outline: 1.5px solid rgba(184, 134, 11, 0.55);
    outline-offset: 1px;
  }
  .arilik-nav:disabled {
    opacity: 0.28;
    cursor: default;
    background: transparent;
  }
  .arilik-nav svg {
    width: 12px;
    height: 12px;
    display: block;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .weather-loc-label {
    display: block;
    max-width: 7.2em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 1px;
    text-align: center;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--text);
  }
  /* Live °C from Open-Meteo (see liveWeather) — far right of weather-top */
  .weather-temp {
    margin-left: auto; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; flex: 0 0 auto;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .weather-temp:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
    border-radius: 6px;
  }
  .bee-toggle {
    flex: 0 0 auto;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-toggle:hover { background: #f3ebe0; }
  .bee-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-toggle-ico {
    width: 14px;
    height: 14px;
    display: block;
    flex: 0 0 auto;
  }
  .bee-sound-toggle {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-left: 4px;
    padding: 4px 7px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-sound-toggle:hover { background: #f3ebe0; }
  .bee-sound-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-sound-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-sound-toggle-ico {
    width: 13px;
    height: 13px;
    display: block;
    flex: 0 0 auto;
  }
  .bee-controls {
    display: contents; /* children participate in hint flex row */
  }
  .bee-toggle { margin-left: 0; }
  .bee-sound-toggle { margin-left: 0; }
  .muayene-hint .bee-toggle,
  .muayene-hint .bee-sound-toggle {
    flex: 0 0 auto;
    padding: 3px 7px;
    font-size: 10px;
    z-index: 12;
  }
  .muayene-hint-mid {
    flex: 1 1 auto;
    min-width: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 28px;
  }
  .muayene-hint.is-idle .muayene-hint-mid {
    min-height: 32px;
  }
  .muayene-hint.is-active .muayene-hint-mid {
    justify-content: flex-start;
  }
  .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .day-name { font-size: 10px; font-weight: 600; color: var(--muted); }
  .day-date { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .day.is-today .day-name,
  .day.is-today .day-date { color: var(--hardal-lo, #b8860b); }
  .day-ico { width: 18px; height: 18px; }
  .day-hi { font-size: 11px; font-weight: 700; color: var(--text); }
  .day-lo { font-size: 10px; color: #8a8278; }
  .muayene-hint {
    position: relative;
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: #fff8df; border: 1px solid #e0c56a;
    color: var(--brown, #4a2f1a); font-size: 11px; font-weight: 650; line-height: 1.35;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    min-height: 34px;
    box-sizing: border-box;
  }
  /* Idle = bee dock under forecast; active = reminder text */
  .muayene-hint.is-idle {
    background: transparent;
    border-color: transparent;
    cursor: default;
    justify-content: center;
    padding: 6px 8px;
    min-height: 36px;
  }
  .muayene-hint.is-idle .muayene-hint-text,
  .muayene-hint.is-idle .muayene-hint-ok { display: none !important; }
  .muayene-hint.is-active .bee-exit,
  .muayene-hint.is-active .bee-podium { display: none !important; }
  .muayene-hint-text { flex: 1 1 auto; min-width: 0; }
  .muayene-hint-ok {
    flex: 0 0 auto;
    min-height: 28px;
    padding: 4px 11px;
    border: 1px solid rgba(176, 140, 60, 0.45);
    border-radius: 8px;
    background: rgba(255, 252, 244, 0.95);
    color: var(--brown, #4a2f1a);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .01em;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint-ok:active {
    background: rgba(240, 196, 58, 0.28);
  }
  /* Exit + breed label live in dock mid (between Arılar / Ses) */
  .muayene-hint-mid .bee-exit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .muayene-hint-mid .bee-podium {
    position: absolute;
    left: 50%;
    top: calc(50% + 14px);
    transform: translateX(-50%);
    margin: 0;
    z-index: 2;
  }

  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 8px; min-height: 0;
  }
  /* LOCKED: centered hive+text (PR #16) — do not regress */
  .tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    position: relative; overflow: hidden; min-height: 0; height: 100%;
    /* Center hive + label + badge as one group in the button */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 4px;
    box-sizing: border-box;
  }
  .hive-area {
    position: relative; flex: 0 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-top: 0;
  }

  /* ===== Shared hive: EQUAL tiers, FLUSH sides ===== */
  .hive {
    width: 72px; height: 68px; position: relative; flex: 0 0 auto; margin-top: 0;
  }
  .hive-stack {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    width: 56px; display: flex; flex-direction: column; align-items: stretch;
  }
  .hive-lid {
    width: 64px; height: 8px; margin-left: -4px; margin-bottom: 0;
    /* Brighter lid from pre-Grok ana.css (4994d59) */
    background: linear-gradient(180deg, #f4f5f7 0%, #c8ccd2 48%, #9aa1aa 100%);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 1px 0 #7c828a;
    position: relative; z-index: 1;
  }
  .hive-lid::after {
    content: ""; position: absolute; left: 50%; top: 2.5px; transform: translateX(-50%);
    width: 18px; height: 2px; border-radius: 1px; background: rgba(60,60,70,.45);
  }
  /* Two boxes: IDENTICAL height & width → equal + flush */
  .hive-box {
    height: 24px; /* EQUAL */
    width: 100%;
    /* Warmer fill + highlight wash from 4994d59 .hive-box */
    background-color: var(--wood-hi);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(90, 52, 16, 0.07) 0 1px,
        transparent 1px 6px
      ),
      linear-gradient(180deg, rgba(255, 248, 230, 0.35), transparent 42%, rgba(90, 50, 14, 0.16));
    border-left: 1px solid var(--wood-edge);
    border-right: 1px solid var(--wood-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    position: relative;
    box-sizing: border-box;
  }
  .hive-box.top {
    border-top: 1px solid var(--wood-edge);
  }
  .hive-box.bottom {
    border-bottom: 1px solid var(--wood-edge);
    border-top: 1px solid var(--wood-edge); /* seam matches wood edge (a16661d) */
  }
  /* finger joints INSIDE edges — warm #e0b87a accents from 4994d59 */
  .hive-box::before,
  .hive-box::after {
    content: ""; position: absolute; top: 3px; bottom: 3px; width: 5px;
    background: repeating-linear-gradient(
      180deg,
      #7a5224 0 3px,
      #e0b87a 3px 7px
    );
    pointer-events: none;
  }
  .hive-box::before { left: 0; }
  .hive-box::after { right: 0; }
  .hive-entrance {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 12px; height: 3px; background: #2a1a0c; border-radius: 0 0 1px 1px; z-index: 1;
  }
  /* Invisible landing target centered on the entrance slit (kapı) */
  .hive-door {
    position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
    width: 18px; height: 8px; z-index: 2; pointer-events: none;
  }
  .hive-feet {
    display: flex; justify-content: space-between; padding: 0 2px; margin-top: 2px;
  }
  .hive-feet span {
    width: 9px; height: 5px; background: var(--wood-lo); border-radius: 1px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .hive-shadow {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 48px; height: 4px; background: radial-gradient(ellipse, rgba(0,0,0,.12), transparent 70%);
  }

  /* Burned (yakma) emblem — branded into wood, not flat dark disc */
  .hive-icon {
    position: absolute;
    left: 50%;
    top: 34px; /* lid(8)+half of equal boxes(24) from stack top+2 */
    transform: translate(-50%, -50%);
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    box-shadow: none;
    overflow: hidden; /* clip fringe; PNG stamps are transparent circles */
    z-index: 3;
    pointer-events: none;
  }
  .hive-icon img {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    object-fit: contain; /* keep circular stamp geometry */
    /* multiply so wood grain reads through — burned branding look */
    mix-blend-mode: multiply;
    background: transparent;
  }
  .hive-icon svg { width: 18px; height: 18px; display: block; }
  /* Tartı yakma damga — restored from 17d44cf/4994d59 ana.js + ana.css */
  .hive-icon.hive-icon-burn {
    width: 36px; height: 36px;
    border-radius: 0;
    overflow: visible;
    background: none;
    display: grid;
    place-items: center;
  }
  .hive-icon.hive-icon-burn svg {
    width: 100%; height: 100%;
    display: block;
    fill: none;
    stroke: #1a0c06;
    stroke-width: 1.35;
    stroke-linecap: round;
    stroke-linejoin: round;
    mix-blend-mode: multiply;
    background: none;
  }
  .hive-icon .burn-ring {
    fill: none;
    stroke: #160a05;
    stroke-width: 1.55;
  }

  .tile-label {
    /* Flow under hive; centered with the tile group */
    position: relative; left: auto; right: auto; bottom: auto;
    flex: 0 0 auto; width: 100%; margin-top: 2px;
    font-size: 12px; font-weight: 700; color: var(--brown-mid); line-height: 1.1;
    text-align: center;
  }
  .badge {
    /* Keep prior label↔badge gap (~4px): was bottom 28px vs 5px + badge height */
    position: relative; left: auto; bottom: auto; transform: none;
    flex: 0 0 auto; margin-top: 4px;
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; line-height: 1.35; white-space: nowrap;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.tan { background: var(--tan-bg); color: var(--tan-fg); }
  .badge.blue { background: var(--blue-bg); color: var(--blue); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.purple { background: var(--purple-bg); color: var(--purple); }

  .tile {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .tile:active { transform: scale(.985); }

  /* In-phone “yakında” sheet — last resort when no real route */
  .tile-sheet {

    background: rgba(20, 16, 12, .35);

  .tabbar {
    height: 72px;

  /* Restored warm remake nav (4994d59 .nav-btn) — şık kibar, not loud orange chrome */
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  .tab.active {
    color: #e56f1c;
    background: transparent;

    width: 20px;
    height: 20px;

    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;

  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }

  body.shot, html.shot { background: #f7f8fa !important; width: 390px; height: 844px; overflow: hidden; }
  body.shot { display: block; margin: 0; padding: 0; }
  body.shot .phone { box-shadow: none !important; border-radius: 0 !important; width: 390px; height: 844px; }
  body.shot .phone-notch, body.shot .home-indicator { display: none !important; }

  .screen { position: relative; }
  .mascot-bee {
    position: absolute; z-index: 10;
    left: 0; top: 0;
    width: 48px; height: 48px; pointer-events: none;
    --bee-scale: 0.55;
    --bee-rot: 0deg; /* 6-frame sheet picks facing; no upside-down CSS yaw */
    transform: translate(-50%, -50%) scale(var(--bee-scale)) rotate(var(--bee-rot));
    opacity: 0;
    transition:
      left 1.45s cubic-bezier(.45,.05,.25,1),
      top 1.45s cubic-bezier(.35,.8,.25,1),
      transform .45s ease,
      opacity .4s ease;
    will-change: left, top, transform, opacity;
  }
  .mascot-bee.is-off {
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none;
  }
  .mascot-bee.is-shown {
    opacity: 1;
    transform: translate(-50%, -50%) scale(var(--bee-scale)) rotate(var(--bee-rot));
  }
  .mascot-bee.is-flying {
    transform: translate(-50%, -50%) scale(var(--bee-scale)) rotate(var(--bee-rot));
    /* Flight: position eases fully; scale stays near depth until door-mouth enter */
    transition:
      left 1.45s cubic-bezier(.45,.05,.25,1),
      top 1.45s cubic-bezier(.35,.8,.25,1),
      transform .85s cubic-bezier(.35,.2,.2,1),
      opacity .4s ease;
  }
  .mascot-bee.is-entering {
    transform: translate(-50%, -50%) scale(var(--bee-scale)) rotate(var(--bee-rot));

    /* Slow ease-in into the hole — avoid snap/throw feel */
    transition:
      left 1.8s cubic-bezier(.45,.05,.25,1),
      top 1.8s cubic-bezier(.45,.05,.25,1),
      transform 2.4s cubic-bezier(.55,.02,.35,1),
      opacity 1.5s ease .55s;

  .mascot-bee canvas {

    animation: bee-hover 0.28s ease-in-out infinite;
  }
  .mascot-bee img.bee-sheet { display: none !important; }
  @keyframes bee-hover {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(0, -2.5px); }
  }

  // Status-bar clock: live local HH:MM (updates every second)
  (function liveStatusClock() {
    var el = document.getElementById('statusClock');
    if (!el) return;
    function pad2(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var now = new Date();
      el.textContent = now.getHours() + ':' + pad2(now.getMinutes());
    }
    tick();
    setInterval(tick, 1000);
  })();

  // Weekday strip: live Mon–Sun dates for the current calendar week
  (function fillForecastDates() {
    var root = document.getElementById('forecast');
    if (!root) return;
    var days = root.querySelectorAll('.day');
    if (!days.length) return;
    var labels = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt']; // JS getDay() order
    var trShort = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz']; // Mon→Sun display
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    // Monday of this week (Mon=0 … Sun=6 in trShort)
    var monday = new Date(todayY, todayM, todayD);
    var dow = monday.getDay(); // 0 Sun … 6 Sat
    var offsetToMon = dow === 0 ? -6 : 1 - dow;

          '-' +

      muayeneEl.classList.remove('is-idle');
      muayeneEl.classList.add('is-active');

    function nextRotatingTip() {
      if (pendingMuayeneTip && !isMuayeneDismissed(pendingMuayeneTip.date)) {
        activeMuayeneTipDate = pendingMuayeneTip.date;
        return {
          text: 'Uygun muayene: ' + pendingMuayeneTip.dayLabel + ' — ' + pendingMuayeneTip.reason,
          sticky: false,
          fromMuayene: true
        };

    function syncNavBtns() {

    function stopCycle() {

            return;
          }

        idx = saved.idx % Math.max(apiaries.length, 1);
      }
    }

    function normalizeList(list) {
      if (!list || !list.length) return null;
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var row = list[i];
        if (!row) continue;
        /* Prefer short place names so weather-row label + bee-exit stay compact */
        var label =
          row.place || row.shortLabel || row.label || row.etiket || row.name || row.konumEtiket || null;
        if (!label) continue;
        var lat = Number(row.lat != null ? row.lat : row.latitude);
        var lon = Number(row.lon != null ? row.lon : row.longitude);
        out.push({
          id: row.id || ('a' + (i + 1)),
          label: String(label),
          lat: isFinite(lat) ? lat : DEMO_APIARIES[i % DEMO_APIARIES.length].lat,
          lon: isFinite(lon) ? lon : DEMO_APIARIES[i % DEMO_APIARIES.length].lon
        });
      }
      return out.length ? out : null;
    }

    function fromLocalStore() {
      var D = window.SuperAriDemo;
      if (!D || typeof D.loadApiaries !== 'function') return null;
      var list = D.loadApiaries();
      if (!list || !list.length) return null;
      return normalizeList(list.map(function (a) {
        return {
          id: a.id,
          place: a.place,
          label: a.place || a.name,
          name: a.name,
          lat: a.lat,
          lon: a.lon
        };
      }));
    }

    /**
     * Same source as Arılıklar list: localStorage via SuperAriDemo.
     * Do not prefer /api/locations — that is a 3-item server seed and
     * hides user-added apiaries (e.g. Balığındüzü).
     */
    function loadApiaries() {
      var fromStore = fromLocalStore();
      if (fromStore && fromStore.length) {
        return Promise.resolve(fromStore);
      }
      return Promise.resolve(DEMO_APIARIES.slice());
    }

      var prevId = currentApiary() && currentApiary().id;
      apiaries = list && list.length ? list : DEMO_APIARIES.slice();
      if (keepIndex && prevId) {
        for (var i = 0; i < apiaries.length; i++) {

            break;

      lockBtn.addEventListener('click', function () {
        setLocked(!locked);
      });
    }
    if (prevBtn) {
      prevBtn.addEventListener('click', function () { stepApiary(-1); });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', function () { stepApiary(1); });

      if (key && e && e.key === key) {

      }
    });

    loadApiaries().then(function (list) {
      apiaries = list && list.length ? list : DEMO_APIARIES.slice();
      if (window.SuperAriHava) {
        try { window.SuperAriHava.ensureSeed(); } catch (e) { /* ignore */ }

      try { localStorage.removeItem(LOCK_KEY); } catch (e) { /* ignore */ }

      syncLockBtn();
      syncNavBtns();
      startCycle();
      bootDone = true;
      setInterval(function () { refreshWeather(true); }, WEATHER_REFRESH_MS);

    });

      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          if (!pos || !pos.coords) return;
          var lat = pos.coords.latitude;
          var lon = pos.coords.longitude;
          var best = 0;
          var bestD = Infinity;
          for (var i = 0; i < apiaries.length; i++) {
            var a = apiaries[i];
            var dlat = (a.lat - lat);
            var dlon = (a.lon - lon);
            var d = dlat * dlat + dlon * dlon;
            if (d < bestD) { bestD = d; best = i; }
          }
          idx = best;
          showApiary(idx, false);
          refreshWeather(true);
        },
        function () { /* izin yok / hata — mevcut arılık döngüsü devam */ },
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
      );
    }
  })();

      beeView = viewFromHeading(heading);
      beeRoot.style.setProperty('--bee-rot', '0deg');
      if (beeCanvas) beeCanvas.style.transform = '';
      drawBeeFrame();
    }

    function setBeeScale(s, allowTiny) {
      /* Normal flight stays in a subtle depth range; door entry may shrink fully. */
      var min = allowTiny ? 0.02 : 0.72;
      var v = Math.max(min, Math.min(1.08, s));
      beeRoot.style.setProperty('--bee-scale', v.toFixed(3));
    }

    /* Lower on screen = nearer = slightly larger */
    function depthScaleFromY(y) {
      var h = screenEl.clientHeight || 600;
      var t = Math.max(0, Math.min(1, y / Math.max(h, 1)));
      return 0.78 + t * 0.22;
    }

    function placeAt(pt, scaleOpt, allowTiny) {
      beePos.x = pt.x;
      beePos.y = pt.y;
      beeRoot.style.left = pt.x + 'px';
      beeRoot.style.top = pt.y + 'px';
      if (scaleOpt != null) setBeeScale(scaleOpt, allowTiny);
      else setBeeScale(depthScaleFromY(pt.y));
    }

    /** Straight flight; faces dest; scale grows on approach / shrinks when leaving */
    function flyTo(dest, durationMs, opts) {
      opts = opts || {};
      var allowTiny = !!opts.allowTiny;
      var from = { x: beePos.x, y: beePos.y };
      var curScale = parseFloat(getComputedStyle(beeRoot).getPropertyValue('--bee-scale')) || depthScaleFromY(from.y);
      var fromScale = curScale;
      var bob = opts.flat ? 4 : 7;
      var mid = {
        x: (from.x + dest.x) / 2,
        y: Math.min(from.y, dest.y) - bob
      };
      var midScale = depthScaleFromY(mid.y);
      var destScale = opts.scale != null ? opts.scale : depthScaleFromY(dest.y);
      if (opts.approach) {
        midScale = Math.max(midScale, fromScale) * 1.04;
        destScale = Math.max(destScale, midScale) * 1.03;
      }
      if (opts.away) {
        /* Mild depth retreat only — do NOT shrink for door entry during flight. */
        midScale = Math.min(midScale, fromScale) * 0.96;
        destScale = opts.scale != null ? opts.scale : Math.min(destScale, midScale) * 0.88;
      }
      /* faceDest: keep nose on the door (enter) — do not yaw toward bob mid first. */
      if (opts.faceDest) faceToward(from, dest);
      else faceToward(from, mid);
      placeAt(mid, midScale, allowTiny);
      later(function () {
        faceToward(mid, dest);
        placeAt(dest, destScale, allowTiny);
      }, Math.max(280, Math.floor((durationMs || 1400) * 0.48)));
    }

    /** Face the hive mouth; if already on the lip, look into the slit (önü kovana dönük). */
    function faceIntoDoor(door) {
      if (!door) return;
      var dx = door.x - beePos.x;
      var dy = door.y - beePos.y;
      if (Math.abs(dx) < 1.2 && Math.abs(dy) < 1.2) {
        /* Already at mouth — aim slightly into the entrance (down the slit). */
        faceToward(beePos, { x: door.x, y: door.y + 10 });
      } else {
        faceToward(beePos, door);
      }
    }

    function hivePoint(tileIndex, mode) {
      var list = gridEl.querySelectorAll('.tile');
      if (!list.length) return exitPoint();
      var i = ((tileIndex % list.length) + list.length) % list.length;
      var tile = list[i];
      var s = screenEl.getBoundingClientRect();
      var el;
      var yNudge = 0;
      if (mode === true || mode === 'door') {
        // Landing on hive door / entrance opening — not hive body center
        el = tile.querySelector('.hive-door') ||
          tile.querySelector('.hive-entrance') ||
          tile.querySelector('.hive') ||
          tile;
        yNudge = -1; // sit on the slit
      } else if (mode === 'hover') {
        // Tour: hover just above the door (not emblem mid-hive)
        el = tile.querySelector('.hive-door') ||
          tile.querySelector('.hive-entrance') ||
          tile.querySelector('.hive') ||
          tile;
        yNudge = -14;
      } else {
        el = tile.querySelector('.hive-door') ||
          tile.querySelector('.hive-entrance') ||
          tile.querySelector('.hive') ||
          tile;
        yNudge = -10;
      }
      var b = el.getBoundingClientRect();
      return {
        x: b.left - s.left + b.width / 2,
        y: b.top - s.top + b.height / 2 + yNudge,
        index: i
      };
    }

    function resetVisual() {
      beeRoot.classList.remove('is-shown', 'is-flying', 'is-entering');
      podium.classList.remove('is-ready');
      if (podiumName) {
        podiumName.classList.remove('is-on');
        podiumName.textContent = '';
      }
    }

    function stopBees() {
      clearTimers();
      stopWingLoop();
      setBuzz(false);
      resetVisual();
      beeRoot.classList.add('is-off');
      beeRoot.classList.remove('is-shown', 'is-flying', 'is-entering');
      podium.classList.add('is-hidden');
    }

    function clearClosedHint() {
      if (closedHintTimer) {
        clearTimeout(closedHintTimer);
        closedHintTimer = null;
      }
    }

    function scheduleClosedHint() {
      clearClosedHint();
      if (!beeToggle || beesEnabled) return;
      closedHintTimer = setTimeout(function () {
        if (beesEnabled) return;
        var txt = beeToggle.querySelector('.bee-toggle-text');
        if (txt) txt.textContent = 'Kapıyı aç';
        beeToggle.setAttribute('aria-label', 'Arıları dışarı çıkarmak için kapıyı aç');
        beeToggle.setAttribute('title', 'Kapıyı aç — arıları dışarı çıkar');
      }, 4500);
    }

    function syncToggleUi() {
      if (!beeToggle) return;
      clearClosedHint();
      beeToggle.setAttribute('aria-pressed', beesEnabled ? 'true' : 'false');
      if (beesEnabled) {
        beeToggle.setAttribute('aria-label', 'Arıları kapat');
        beeToggle.setAttribute('title', 'Arıları aç/kapat');
        var txtOn = beeToggle.querySelector('.bee-toggle-text');
        if (txtOn) txtOn.textContent = 'Arılar';
      } else {
        beeToggle.setAttribute('aria-label', 'Arılar kapalı');
        beeToggle.setAttribute('title', 'Arılar kapalı');
        var txtOff = beeToggle.querySelector('.bee-toggle-text');
        if (txtOff) txtOff.textContent = 'Kapalı';
        scheduleClosedHint();
      }
    }

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    var hintBlockingBees = false;

    function pauseBeesForHint() {
      hintBlockingBees = true;
      /* Mid-flight interrupt: keep beeIdx; do not treat as completed. */
      if (cycleActive) cycleCompleted = false;
      clearTimers();
      stopWingLoop();
      setBuzz(false);
      resetVisual();
      beeRoot.classList.add('is-off');
      beeRoot.classList.remove('is-shown', 'is-flying', 'is-entering');
      if (podium) podium.classList.add('is-hidden');
    }

    function resumeBeesAfterHint() {
      hintBlockingBees = false;
      if (beesEnabled) runCycle(breedForResume());
    }

    window.addEventListener('superari:hint', function (e) {
      var show = e && e.detail && e.detail.show;
      if (show) pauseBeesForHint();
      else if (beesEnabled) resumeBeesAfterHint();
    });

    function runCycle(startBreed) {
      if (!beesEnabled || hintBlockingBees) {
        stopBees();
        return;
      }
      clearTimers();
      resetVisual();
      beeRoot.classList.remove('is-off');
      podium.classList.remove('is-hidden');
      cycleActive = true;
      cycleCompleted = false;
      var name = setBreed(startBreed == null ? beeIdx : startBreed);
      /* Plan next in fixed order (applied when this cycle fully completes). */
      nextBreedIdx = (beeIdx + 1) % breedKeys.length;

      var order = shuffle([0,1,2,3,4,5,6,7,8]);
      var tourStops = order.slice(0, 3);
      var enterTile = tileParam != null
        ? (parseInt(tileParam, 10) || 0)
        : order[3];

      var t = 0;
      later(function () {
        if (!beesEnabled) return;
        if (podiumName) {
          podiumName.textContent = name;
          podiumName.classList.add('is-on');
        }
        podium.classList.add('is-ready');
      }, t);
      t += 900;

      // Emerge on Arılık Kuzey / °C row
      later(function () {
        if (!beesEnabled) return;
        var pt = exitPoint();
        beeRoot.style.transition = 'none';
        placeAt(pt, 0.76);
        beeRoot.classList.remove('is-flying', 'is-entering');
        void beeRoot.offsetWidth;
        beeRoot.style.transition = '';
        beeRoot.classList.add('is-shown');
        /* emerge: grow toward camera */
        setBeeScale(depthScaleFromY(pt.y));
        startWingLoop();
        drawBeeFrame();
        /* Buzz as soon as bees appear (idempotent continuous loop while flying) */
        setBuzz(true);
      }, t);
      t += 1100;

      // Tour: approach doors (grow as approaching)
      tourStops.forEach(function (tileI, n) {
        var hop = n === 0 ? 1600 : 1400;
        later(function () {
          if (!beesEnabled) return;
          beeRoot.classList.add('is-flying');
          beeRoot.classList.remove('is-entering');
          startWingLoop();
          setBuzz(true);
          flyTo(hivePoint(tileI, 'hover'), hop, { approach: true });
        }, t);
        t += hop;
      });

      // Final: fly to door mouth at near-normal size; shrink ONLY after lip linger.
      later(function () {
        if (!beesEnabled) return;
        beeRoot.classList.add('is-flying');
        beeRoot.classList.remove('is-entering');
        setBuzz(true);
        var doorAim = hivePoint(enterTile, 'door');
        /* Önü kovana dönük: face the mouth for the whole final approach (not last tour yaw). */
        faceIntoDoor(doorAim);
        /* Keep depth-scale (no allowTiny / no early shrink) until at the door lip. */
        flyTo(doorAim, 1500, {
          flat: true,
          approach: true,
          faceDest: true
        });
      }, t);
      t += 1500;

      // Linger briefly at the lip at near-normal size (reads as arriving, not thrown).
      later(function () {
        if (!beesEnabled) return;
        var lip = hivePoint(enterTile, 'door');
        beeRoot.classList.add('is-flying');
        beeRoot.classList.remove('is-entering');
        faceIntoDoor(lip);
        placeAt(lip, depthScaleFromY(lip.y));
      }, t);
      t += 480;

      // Then slowly shrink into the hole (multi-step) — not a snap/throw.
      later(function () {
        if (!beesEnabled) return;
        beeRoot.classList.remove('is-flying');
        beeRoot.classList.add('is-entering');
        stopWingLoop();
        setBuzz(false);
        var door = hivePoint(enterTile, 'door');
        /* Keep front-into-mouth facing while shrinking into the kapı. */
        faceIntoDoor(door);
        /* Step slightly into the slit while starting a gentle shrink. */
        placeAt({ x: door.x, y: door.y + 1 }, 0.42, true);
        later(function () {
          if (!beesEnabled) return;
          faceIntoDoor(door);
          setBeeScale(0.18, true);
          placeAt({ x: door.x, y: door.y + 2 }, 0.18, true);
        }, 550);
        later(function () {
          if (!beesEnabled) return;
          faceIntoDoor(door);
          setBeeScale(0.06, true);
          placeAt({ x: door.x, y: door.y + 3 }, 0.06, true);
        }, 1200);
        later(function () {
          if (!beesEnabled) return;
          faceIntoDoor(door);
          setBeeScale(0.02, true);
        }, 1850);
        /* Remove after the slow enter finishes. */
        later(function () {
          if (!beesEnabled) return;
          beeRoot.classList.add('is-off');
          /* Cycle visually done — persist next breed NOW so hint/toggle in the gap advances. */
          markCycleCompleted();
        }, 2600);
      }, t);
      t += 3000;

      if (!freeze) {
        later(function () {
          if (!beesEnabled) return;
          /* nextBreedIdx already set by markCycleCompleted at enter-end. */
          if (!cycleCompleted) markCycleCompleted();
          runCycle(nextBreedIdx);
        }, t);
      }
    }

    function setBeesEnabled(on) {
      beesEnabled = !!on;
      writeBeesOn(beesEnabled);
      syncToggleUi();
      if (beesEnabled) {
        runCycle(breedForResume());
      } else {
        /* Toggle off mid-flight = interrupt; keep same breed on re-enable. */
        if (cycleActive) cycleCompleted = false;
        cycleActive = false;
        stopBees();
      }
    }

    var audioGestureDone = false;
    function unlockAudioOnce() {
      /* Browser autoplay: AudioContext stays suspended until a user gesture */
      audioGestureDone = true;
      ensureBuzzCtx();
      Promise.all([loadBuzzBuffers(), resumeBuzzCtx()]).then(function () {
        if (buzzWanted && soundEnabled) setBuzz(true);
      });
    }

    function armFirstGestureUnlock() {
      if (audioGestureDone) return;
      var once = function () {
        document.removeEventListener('pointerdown', once, true);
        document.removeEventListener('touchstart', once, true);
        document.removeEventListener('keydown', once, true);
        unlockAudioOnce();
      };
      document.addEventListener('pointerdown', once, true);
      document.addEventListener('touchstart', once, true);
      document.addEventListener('keydown', once, true);
    }

    if (beeToggle) {
      beeToggle.addEventListener('click', function () {
        unlockAudioOnce();
        setBeesEnabled(!beesEnabled);
      });
    }
    if (beeSoundToggle) {
      beeSoundToggle.addEventListener('click', function () {
        unlockAudioOnce();
        setSoundEnabled(!soundEnabled);
      });
    }
    syncToggleUi();
    syncSoundUi();
    armFirstGestureUnlock();
    /* Prefetch buzz buffers early so first fly is not silent waiting on decode */
    if (soundEnabled) {
      try { ensureBuzzCtx(); loadBuzzBuffers(); } catch (e) { /* ignore */ }
    }

    function boot() {
      drawBeeFrame();
      if (beesEnabled) runCycle(beeIdx);
      else stopBees();
    }
    Object.keys(beeSheets).forEach(function (k) {
      var pack = beeSheets[k];
      if (!pack) return;
      VIEW_KEYS.forEach(function (v) {
        var im = pack[v];
        if (!im) return;
        if (im.complete) drawBeeFrame();
        else im.addEventListener('load', function () { drawBeeFrame(); });
      });
    });
    requestAnimationFrame(function () { requestAnimationFrame(boot); });
    later(boot, 100);

    window.addEventListener('resize', function () {
      if (!beesEnabled) return;
      if (beeRoot.classList.contains('is-shown') && !beeRoot.classList.contains('is-entering') && !beeRoot.classList.contains('is-flying')) {
        placeAt(exitPoint());
      }
    });
  }

})();
</script>
</body>
</html>
