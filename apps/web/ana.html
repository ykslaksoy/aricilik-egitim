<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Ana</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card: #f4f5f7;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --green: #2f9e44;
    --green-bg: #d8f3dc;
    --tan-bg: #efe2cb;
    --tan-fg: #7a5a32;
    --blue: #1c7ed6;
    --blue-bg: #d0ebff;
    --red: #e03131;
    --red-bg: #ffe3e3;
    --purple: #7048e8;
    --purple-bg: #e5dbff;
    --orange: #f08c00;
    --wood: #d7ae78;
    --wood-hi: #e8c9a0;
    --wood-lo: #c9965a;
    --wood-edge: #a8743f;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top-align phone so Hardal brand strip stays on-screen when viewport < 844px
     (center alignment previously clipped the strip to a mustard sliver). */
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0 28px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .02em; }

  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow: hidden; display: flex; flex-direction: column; background: var(--bg);
    padding: 0 12px 8px;
   position: relative;
  }

  /* Hardal işletme şeridi — mustard brand signal; left brand, right live location */
  .brand-strip {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 12px 7px 10px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
    overflow: hidden;
  }
  .brand-strip::before {
    content: "";
    flex: 0 0 4px;
    align-self: stretch;
    margin: -2px 0;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--hardal-hi), var(--hardal) 40%, var(--hardal-lo));
  }
  .brand-strip .brand-name {
    flex: 0 1 auto;
    text-align: left;
    line-height: 1.2;
    color: var(--brown);
  }
  .brand-strip .brand-loc {
    margin-left: auto;
    flex: 0 1 auto;
    max-width: 46%;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--brown-mid, #6b4f2a);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand-strip .brand-loc-pin {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    display: block;
    color: var(--brown, #3d2616);
  }
  .brand-strip .brand-loc-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .weather-loc {
    position: relative;
  }
  /* Invisible exit marker: bees emerge on the Arılık Kuzey ↔ °C row */
  .bee-exit {
    position: absolute;
    left: 100%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin-left: 8px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* Breed name on the Arılık Kuzey ↔ °C row (right of exit marker) */
  .bee-podium {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: 16px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    z-index: 9;
    pointer-events: none;
  }
  .bee-podium.is-hidden { display: none; }
  .bee-podium .podium-stage {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center bottom, rgba(90,60,30,.18) 0%, rgba(90,60,30,.05) 45%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .bee-podium.is-ready .podium-stage { opacity: 1; }
  .bee-podium .podium-name {
    font-size: 9px; font-weight: 800; color: var(--brown-mid);
    background: rgba(255,248,238,.96); border: 1px solid #e8dcc8;
    border-radius: 999px; padding: 1px 7px; line-height: 1.35;
    opacity: 0; transform: translateX(-4px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0; white-space: nowrap;
  }
  .bee-podium .podium-name.is-on {
    opacity: 1; transform: translateX(0);
  }

  .weather {
    flex: 0 0 auto; background: #fff; border: 1px solid #e6e8ec; border-radius: 16px;
    padding: 6px 12px 8px; margin-top: 0; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .weather-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; /* dense: header row → weekday strip */
    min-height: 32px;
  }
  .weather-icon { width: 28px; height: 28px; flex: 0 0 auto; }
  .weather-loc { font-size: 13px; font-weight: 600; color: var(--text); }
  /* Live °C from Open-Meteo (see liveWeather) — far right of weather-top */
  .weather-temp { margin-left: 6px; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; flex: 0 0 auto; }
  .bee-toggle {
    flex: 0 0 auto;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-toggle:hover { background: #f3ebe0; }
  .bee-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-toggle-ico {
    width: 14px;
    height: 14px;
    display: block;
    flex: 0 0 auto;
  }
  .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .day-name { font-size: 10px; font-weight: 600; color: var(--muted); }
  .day-date { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .day.is-today .day-name,
  .day.is-today .day-date { color: var(--hardal-lo, #b8860b); }
  .day-ico { width: 18px; height: 18px; }
  .day-hi { font-size: 11px; font-weight: 700; color: var(--text); }
  .day-lo { font-size: 10px; color: #8a8278; }

  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 8px; min-height: 0;
  }
  .tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    position: relative; overflow: hidden; min-height: 0; height: 100%;
    /* footer: compact so Tartı/Sağlık/… + badge sit nearer hive */
    padding: 0 0 36px;
  }
  .hive-area {
    position: absolute; left: 0; right: 0; top: 0; bottom: 36px;
    display: flex; align-items: center; justify-content: center;
    /* optical nudge: drop hive toward label/badge block */
    padding-top: 40px;
  }

  /* ===== Shared hive: EQUAL tiers, FLUSH sides ===== */
  .hive {
    width: 72px; height: 68px; position: relative; flex: 0 0 auto; margin-top: 0;
  }
  .hive-stack {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    width: 56px; display: flex; flex-direction: column; align-items: stretch;
  }
  .hive-lid {
    width: 64px; height: 8px; margin-left: -4px; margin-bottom: 0;
    background: linear-gradient(180deg, #d5d5da 0%, #9a9aa3 100%);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,.12);
    position: relative; z-index: 1;
  }
  .hive-lid::after {
    content: ""; position: absolute; left: 50%; top: 2.5px; transform: translateX(-50%);
    width: 18px; height: 2px; border-radius: 1px; background: rgba(60,60,70,.45);
  }
  /* Two boxes: IDENTICAL height & width → equal + flush */
  .hive-box {
    height: 24px; /* EQUAL */
    width: 100%;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(160,110,60,.12) 3px, rgba(160,110,60,.12) 4px),
      linear-gradient(180deg, var(--wood-hi) 0%, var(--wood) 55%, var(--wood-lo) 100%);
    border-left: 1px solid var(--wood-edge);
    border-right: 1px solid var(--wood-edge);
    position: relative;
    box-sizing: border-box;
  }
  .hive-box.top {
    border-top: 1px solid var(--wood-edge);
  }
  .hive-box.bottom {
    border-bottom: 1px solid var(--wood-edge);
    border-top: 1px solid #8a6238; /* seam */
  }
  /* finger joints INSIDE edges so outer sides stay flush */
  .hive-box::before,
  .hive-box::after {
    content: ""; position: absolute; top: 3px; bottom: 3px; width: 3px;
    background:
      repeating-linear-gradient(
        180deg,
        var(--wood-edge) 0 4px,
        transparent 4px 7px
      );
    opacity: .85;
    pointer-events: none;
  }
  .hive-box::before { left: 1px; }
  .hive-box::after { right: 1px; }
  .hive-entrance {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 12px; height: 3px; background: #2a1a0c; border-radius: 0 0 1px 1px; z-index: 1;
  }
  /* Invisible landing target centered on the entrance slit (kapı) */
  .hive-door {
    position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
    width: 18px; height: 8px; z-index: 2; pointer-events: none;
  }
  .hive-feet {
    display: flex; justify-content: space-between; padding: 0 2px; margin-top: 2px;
  }
  .hive-feet span {
    width: 9px; height: 5px; background: var(--wood-lo); border-radius: 1px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .hive-shadow {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 48px; height: 4px; background: radial-gradient(ellipse, rgba(0,0,0,.12), transparent 70%);
  }

  /* Burned (yakma) emblem — branded into wood, not flat dark disc */
  .hive-icon {
    position: absolute;
    left: 50%;
    top: 34px; /* lid(8)+half of equal boxes(24) from stack top+2 */
    transform: translate(-50%, -50%);
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    box-shadow: none;
    overflow: hidden; /* clip fringe; PNG stamps are transparent circles */
    z-index: 3;
    pointer-events: none;
  }
  .hive-icon img {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    object-fit: contain; /* keep circular stamp geometry */
    /* multiply so wood grain reads through — burned branding look */
    mix-blend-mode: multiply;
    background: transparent;
  }
  .hive-icon svg { width: 18px; height: 18px; display: block; }

  .tile-label {
    /* Slightly above badge (+1.2kg, İyi, …); nearer hive via compact footer */
    position: absolute; left: 0; right: 0; bottom: 28px;
    font-size: 12px; font-weight: 700; color: var(--brown-mid); line-height: 1.1;
    text-align: center;
  }
  .badge {
    position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; line-height: 1.35; white-space: nowrap;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.tan { background: var(--tan-bg); color: var(--tan-fg); }
  .badge.blue { background: var(--blue-bg); color: var(--blue); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.purple { background: var(--purple-bg); color: var(--purple); }

  .tile {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .tile:active { transform: scale(.985); }

  /* In-phone “yakında” sheet — last resort when no real route */
  .tile-sheet {
    position: absolute; inset: 0; z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(20, 16, 12, .35);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .tile-sheet.is-open { opacity: 1; pointer-events: auto; }
  .tile-sheet-card {
    width: 100%;
    background: #fff;
    border-radius: 18px 18px 0 0;
    padding: 16px 18px 28px;
    box-shadow: 0 -8px 28px rgba(0,0,0,.12);
    transform: translateY(12px);
    transition: transform .22s ease;
  }
  .tile-sheet.is-open .tile-sheet-card { transform: translateY(0); }
  .tile-sheet-title {
    font-size: 17px; font-weight: 800; color: var(--brown); margin: 0 0 6px;
  }
  .tile-sheet-body {
    font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0 0 14px;
  }
  .tile-sheet-close {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 36px; padding: 0 14px;
    border: 1px solid #e4e6ea; border-radius: 10px;
    background: #f7f8fa; color: var(--text);
    font-size: 13px; font-weight: 700; cursor: pointer;
  }

  .tabbar {
    height: 72px; background: #fff; border-top: 1px solid #e6e8ec;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 0 4px 10px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #8b8680; font-size: 10px; font-weight: 600;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--orange); }
  .tab svg { width: 22px; height: 22px; }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }

  body.shot, html.shot { background: #f7f8fa !important; width: 390px; height: 844px; overflow: hidden; }
  body.shot { display: block; margin: 0; padding: 0; }
  body.shot .phone { box-shadow: none !important; border-radius: 0 !important; width: 390px; height: 844px; }
  body.shot .phone-notch, body.shot .home-indicator { display: none !important; }

  .screen { position: relative; }
  .mascot-bee {
    position: absolute; z-index: 10;
    left: 0; top: 0;
    width: 48px; height: 48px; pointer-events: none;
    transform: translate(-50%, -50%) scale(.55);
    opacity: 0;
    transition:
      left 1.45s cubic-bezier(.45,.05,.25,1),
      top 1.45s cubic-bezier(.35,.8,.25,1),
      transform .55s cubic-bezier(.34,1.4,.64,1),
      opacity .4s ease;
    will-change: left, top, transform, opacity;
  }
  .mascot-bee.is-off {
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none;
  }
  .mascot-bee.is-shown {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .mascot-bee.is-flying {
    transform: translate(-50%, -50%) scale(.85);
  }
  .mascot-bee.is-entering {
    transform: translate(-50%, -50%) scale(.35);
    opacity: 0;
    transition:
      left 1.1s cubic-bezier(.4,.05,.2,1),
      top 1.1s cubic-bezier(.4,.05,.2,1),
      transform .9s ease,
      opacity .7s ease .25s;
  }
  .mascot-bee img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0;
    transition: opacity .35s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
    /* Idle hover: gentle bob + tilt */
    animation: bee-hover 1.6s ease-in-out infinite;
  }
  .mascot-bee img.is-on { opacity: 1; }
  /* In flight: faster buzz + wing-like tilt */
  .mascot-bee.is-flying img.is-on {
    animation: bee-buzz 0.22s ease-in-out infinite;
  }
  .mascot-bee.is-entering img.is-on {
    animation: bee-buzz 0.16s linear infinite;
  }
  @keyframes bee-hover {
    0%, 100% { transform: translate(0, 0) rotate(-5deg); }
    35% { transform: translate(1px, -4px) rotate(4deg); }
    70% { transform: translate(-1px, -2px) rotate(-3deg); }
  }
  @keyframes bee-buzz {
    0%, 100% { transform: translate(0, 0) rotate(-10deg) scale(1); }
    25% { transform: translate(1.5px, -3px) rotate(8deg) scale(1.03); }
    50% { transform: translate(-1px, 1px) rotate(-6deg) scale(0.98); }
    75% { transform: translate(1px, -2px) rotate(9deg) scale(1.02); }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <div>9:41</div>
    <div class="status-icons"><span>●●●●</span><span>Wi‑Fi</span><span>▮</span></div>
  </div>

  <div class="screen">
    <header class="brand-strip" id="brand-strip" aria-label="İşletme">
      <span class="brand-name">Hardal Arıcılık</span>
      <span class="brand-loc" id="brandLoc" title="Konum">
        <svg class="brand-loc-pin" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>
        </svg>
        <span class="brand-loc-text" id="brandLocText">Erzurum</span>
      </span>
    </header>
    <div class="mascot-bee" id="mascotBee" aria-hidden="true">
      <img src="assets/bees/italyan.png" alt="" data-breed="İtalyan">
      <img src="assets/bees/karniyol.png" alt="" data-breed="Karniyol">
      <img src="assets/bees/kafkas.png" alt="" data-breed="Kafkas">
    </div>

    <section class="weather">
      <div class="weather-top">
        <svg class="weather-icon" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="12" cy="12" r="6" fill="#f7b731"/>
          <path d="M18 18c0-2.5 2-4.5 4.5-4.5 1.4 0 2.6.6 3.4 1.6A5 5 0 0 1 27 24H10a4.5 4.5 0 0 1 0-9c.5 0 1 .1 1.5.2" fill="#cfd8e3" stroke="#9aa8b8" stroke-width="1"/>
        </svg>
        <div class="weather-loc" id="weatherLoc">
          Arılık Kuzey
          <span class="bee-exit" id="beeExit" aria-hidden="true"></span>
          <div class="bee-podium" id="beePodium">
            <div class="podium-stage" id="podiumStage"></div>
            <span class="podium-name" id="podiumName"></span>
          </div>
        </div>
        <button type="button" class="bee-toggle" id="beeToggle" aria-pressed="true" aria-label="Arıları kapat" title="Arıları aç/kapat">
          <svg class="bee-toggle-ico" viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="14" rx="3.2" ry="4.2" fill="currentColor"/>
            <circle cx="12" cy="8.2" r="1.8" fill="currentColor"/>
            <path d="M9.2 11.2C6.2 9 5.4 12.8 8.6 13.4M14.8 11.2C17.8 9 18.6 12.8 15.4 13.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span class="bee-toggle-text">Arılar</span>
        </button>
        <div class="weather-temp" id="weatherTemp">—°</div>
      </div>

<script>
(function () {
  if (location.search.indexOf('shot=1') !== -1) {
    document.documentElement.classList.add('shot');
    document.body.classList.add('shot');

  // Weekday strip: live Mon–Sun dates for the current calendar week
  (function fillForecastDates() {
    var root = document.getElementById('forecast');
    if (!root) return;
    var days = root.querySelectorAll('.day');
    if (!days.length) return;
    var labels = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt']; // JS getDay() order
    var trShort = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz']; // Mon→Sun display
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    // Monday of this week (Mon=0 … Sun=6 in trShort)
    var monday = new Date(todayY, todayM, todayD);
    var dow = monday.getDay(); // 0 Sun … 6 Sat
    var offsetToMon = dow === 0 ? -6 : 1 - dow;
    monday.setDate(monday.getDate() + offsetToMon);
    for (var i = 0; i < days.length && i < 7; i++) {
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      var nameEl = days[i].querySelector('.day-name');
      var dateEl = days[i].querySelector('.day-date');
      if (nameEl) nameEl.textContent = trShort[i];
      if (dateEl) dateEl.textContent = String(d.getDate());
      var isToday = d.getFullYear() === todayY && d.getMonth() === todayM && d.getDate() === todayD;
      days[i].classList.toggle('is-today', isToday);
      days[i].setAttribute('aria-label', trShort[i] + ' ' + d.getDate());
    }
    // silence unused (kept for clarity of JS day index)
    void labels;
  })();

  // Live place (band right) + live °C (weather card). Keeps “Arılık Kuzey” + bee-exit.
  // Source: Open-Meteo (same as apps/api openMeteoService). Default Ev lat/lon (Erzurum).
  (function liveWeather() {
    var DEFAULT = { lat: 39.92, lon: 41.27, place: 'Erzurum' };
    var REFRESH_MS = 15 * 60 * 1000;
    var tempEl = document.getElementById('weatherTemp');
    var brandLoc = document.getElementById('brandLoc');
    var brandLocText = document.getElementById('brandLocText');
    if (tempEl) {
      tempEl.removeAttribute('data-locked');
      tempEl.removeAttribute('data-temp');
    }
    if (brandLocText && !brandLocText.textContent.trim()) brandLocText.textContent = DEFAULT.place;

    function roundC(v) {
      var n = Math.round(Number(v));
      return isFinite(n) ? n : null;
    }

    function setTemp(c) {
      if (!tempEl) return;
      var n = roundC(c);
      if (n == null) return;
      tempEl.textContent = n + '°';
    }

    function setPlace(name) {
      if (!name) return;
      if (brandLocText) brandLocText.textContent = name;
      else if (brandLoc) brandLoc.textContent = name;
      if (brandLoc) brandLoc.setAttribute('title', name);
    }

    function updateForecastDaily(daily) {
      if (!daily || !daily.time) return;
      var root = document.getElementById('forecast');
      if (!root) return;
      var days = root.querySelectorAll('.day');
      var now = new Date();
      var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var dow = monday.getDay();
      monday.setDate(monday.getDate() + (dow === 0 ? -6 : 1 - dow));
      var byDate = {};
      for (var i = 0; i < daily.time.length; i++) {
        byDate[daily.time[i]] = {
          hi: roundC(daily.temperature_2m_max && daily.temperature_2m_max[i]),
          lo: roundC(daily.temperature_2m_min && daily.temperature_2m_min[i])
        };
      }
      for (var d = 0; d < days.length && d < 7; d++) {
        var dt = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + d);
        var key =
          dt.getFullYear() + '-' +
          String(dt.getMonth() + 1).padStart(2, '0') + '-' +
          String(dt.getDate()).padStart(2, '0');
        var row = byDate[key];
        if (!row) continue;
        var hiEl = days[d].querySelector('.day-hi');
        var loEl = days[d].querySelector('.day-lo');
        if (hiEl && row.hi != null) hiEl.textContent = row.hi + '°';
        if (loEl && row.lo != null) loEl.textContent = row.lo + '°';
      }
    }

    function reversePlace(lat, lon) {
      var url =
        'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
        encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lon) +
        '&localityLanguage=tr';
      return fetch(url)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j) return null;
          return j.locality || j.city || j.principalSubdivision || null;
        })
        .catch(function () { return null; });
    }

    function fetchMeteo(lat, lon) {
      var url =
        'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
        '&longitude=' + lon +
        '&current=temperature_2m,weather_code' +
        '&daily=temperature_2m_max,temperature_2m_min' +
        '&timezone=auto&forecast_days=7';
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error('meteo_' + r.status);
        return r.json();
      });
    }

    function applyCoords(lat, lon, fallbackPlace) {
      return Promise.all([fetchMeteo(lat, lon), reversePlace(lat, lon)])
        .then(function (pair) {
          var meteo = pair[0];
          var place = pair[1] || fallbackPlace;
          if (meteo && meteo.current && meteo.current.temperature_2m != null) {
            setTemp(meteo.current.temperature_2m);
          }
          if (place) setPlace(place);
          if (meteo && meteo.daily) updateForecastDaily(meteo.daily);
        })
        .catch(function () {
          if (fallbackPlace) setPlace(fallbackPlace);
        });
    }

    function refresh() {
      if (!navigator.geolocation) {
        applyCoords(DEFAULT.lat, DEFAULT.lon, DEFAULT.place);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          applyCoords(pos.coords.latitude, pos.coords.longitude, DEFAULT.place);
        },
        function () {
          applyCoords(DEFAULT.lat, DEFAULT.lon, DEFAULT.place);
        },
        { enableHighAccuracy: false, timeout: 6000, maximumAge: 10 * 60 * 1000 }
      );
    }

    setPlace(DEFAULT.place);
    refresh();
    setInterval(refresh, REFRESH_MS);
  })();

    ariliklar: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><path d="M12 2C8.7 2 6 4.9 6 8.4c0 4.6 6 11.6 6 11.6s6-7 6-11.6C18 4.9 15.3 2 12 2zm0 8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
    gorevler: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3e2c8" stroke-width="1.7"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
    uyarilar: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3e2c8" stroke-width="1.7"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/><circle cx="18" cy="6" r="2" fill="#f3e2c8" stroke="none"/></svg>',
    raporlar: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><rect x="4" y="13" width="4" height="7" rx="0.5"/><rect x="10" y="8" width="4" height="12" rx="0.5"/><rect x="16" y="4" width="4" height="16" rx="0.5"/></svg>'
  };

  var tiles = [
    { key: 'tarti', label: 'Tartı', badge: '+1.2kg', tone: 'green', href: 'kovanlar.html?view=tarti' },
    { key: 'saglik', label: 'Sağlık', badge: 'İyi', tone: 'green', href: 'kovanlar.html?view=saglik' },
    { key: 'ogul', label: 'Oğul', badge: 'Düşük', tone: 'green', href: 'uyarilar.html?view=ogul' },
    { key: 'kovanlar', label: 'Kovanlar', badge: '100', tone: 'tan', href: 'kovanlar.html' },
    { key: 'koloni', label: 'Koloni', badge: '12 grup', tone: 'tan', href: 'kovanlar.html?view=koloni' },
    { key: 'ariliklar', label: 'Arılıklar', badge: '3', tone: 'tan', href: 'kovanlar.html?view=ariliklar' },

    { key: 'uyarilar', label: 'Uyarılar', badge: '2', tone: 'red', href: 'uyarilar.html' },
    { key: 'raporlar', label: 'Raporlar', badge: '—', tone: 'purple', href: null }
  ];

  function hiveHTML(key) {
    var emblem = 'assets/emblems/' + key + '.png';
    return (
      '<div class="hive-area">' +
        '<div class="hive">' +
          '<div class="hive-stack">' +
            '<div class="hive-lid"></div>' +
            '<div class="hive-box top"></div>' +
            '<div class="hive-box bottom">' +
              '<div class="hive-entrance"></div>' +
              '<div class="hive-door" aria-hidden="true"></div>' +
            '</div>' +
            '<div class="hive-feet"><span></span><span></span></div>' +
          '</div>' +
          '<div class="hive-shadow"></div>' +
          '<div class="hive-icon" aria-hidden="true">' +
            '<img src="' + emblem + '" alt="" width="32" height="32" />' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  var grid = document.getElementById('grid');
  grid.innerHTML = tiles.map(function (t) {
    return (
      '<article class="tile" data-key="' + t.key + '" data-href="' + (t.href || '') + '" role="link" tabindex="0" aria-label="' + t.label + '">' +
        hiveHTML(t.key) +
        '<div class="tile-label">' + t.label + '</div>' +
        '<div class="badge ' + t.tone + '">' + t.badge + '</div>' +
      '</article>'
    );
  }).join('');

  // Tile → real routes (yakında sheet only when no page exists)
  (function wireTileClicks() {
    var sheet = document.getElementById('tileSheet');
    var titleEl = document.getElementById('tileSheetTitle');
    var bodyEl = document.getElementById('tileSheetBody');
    var closeBtn = document.getElementById('tileSheetClose');
    var byKey = {};
    tiles.forEach(function (t) { byKey[t.key] = t; });

    function openSheet(label) {
      if (!sheet) return;
      if (titleEl) titleEl.textContent = label || '—';
      if (bodyEl) bodyEl.textContent = 'Bu bölüm yakında.';
      sheet.hidden = false;
      requestAnimationFrame(function () { sheet.classList.add('is-open'); });
    }
    function closeSheet() {
      if (!sheet) return;
      sheet.classList.remove('is-open');
      setTimeout(function () { sheet.hidden = true; }, 220);
    }
    function openTile(tileEl) {
      var key = tileEl.getAttribute('data-key');
      var href = tileEl.getAttribute('data-href');
      var meta = byKey[key];
      if (href) {
        location.href = href;
        return;
      }
      openSheet(meta && meta.label ? meta.label : key);
    }

    grid.querySelectorAll('.tile').forEach(function (tile) {
      tile.addEventListener('click', function () { openTile(tile); });
      tile.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openTile(tile);
        }
      });
    });
    if (closeBtn) closeBtn.addEventListener('click', closeSheet);
    if (sheet) {
      sheet.addEventListener('click', function (e) {
        if (e.target === sheet) closeSheet();
      });
    }
  })();

  // Announcement → podium → tour tiles → enter one hive (door / kapı)
  var beeRoot = document.getElementById('mascotBee');
  var podium = document.getElementById('beePodium');
  var podiumName = document.getElementById('podiumName');
  var screenEl = document.querySelector('.screen');
  var gridEl = document.getElementById('grid');
  var beeToggle = document.getElementById('beeToggle');
  var BEE_PREF_KEY = 'superari.ana.bees';

  function readBeesOn() {
    try {
      var v = localStorage.getItem(BEE_PREF_KEY);
      if (v === '0' || v === 'off' || v === 'false') return false;
      if (v === '1' || v === 'on' || v === 'true') return true;
    } catch (e) { /* ignore */ }
    return true;
  }
  function writeBeesOn(on) {
    try { localStorage.setItem(BEE_PREF_KEY, on ? '1' : '0'); } catch (e) { /* ignore */ }
  }

  if (beeRoot && podium && screenEl && gridEl) {
    var beeImgs = beeRoot.querySelectorAll('img');
    var beeIdx = 0;
    var timers = [];
    var beesEnabled = readBeesOn();
    var beeParam = (location.search.match(/[?&]bee=([^&]+)/) || [])[1];
    var tileParam = (location.search.match(/[?&]tile=(\d+)/) || [])[1];
    var beeMap = { italyan: 0, karniyol: 1, kafkas: 2 };
    if (beeParam && beeMap[beeParam] != null) beeIdx = beeMap[beeParam];
    var freeze = location.search.indexOf('shot=1') !== -1;

    function clearTimers() {
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
    function later(fn, ms) {
      timers.push(setTimeout(fn, ms));
    }

    function setBreed(i) {
      beeIdx = ((i % beeImgs.length) + beeImgs.length) % beeImgs.length;
      beeImgs.forEach(function (img, j) { img.classList.toggle('is-on', j === beeIdx); });
      return beeImgs[beeIdx].getAttribute('data-breed') || '';
    }

    function exitPoint() {
      // Same horizontal row as Arılık Kuzey ↔ temperature
      var s = screenEl.getBoundingClientRect();
      var exitEl = document.getElementById('beeExit');
      var loc = document.getElementById('weatherLoc') || document.querySelector('.weather-loc');
      var el = exitEl || loc;
      if (!el) return podiumPoint();
      var b = el.getBoundingClientRect();
      return {
        x: b.left - s.left + b.width / 2,
        y: b.top - s.top + b.height / 2
      };
    }

    function podiumPoint() {
      var s = screenEl.getBoundingClientRect();
      var stage = document.getElementById('podiumStage') || podium;
      var p = stage.getBoundingClientRect();
      return {
        x: p.left - s.left + p.width / 2,
        y: p.top - s.top + p.height / 2
      };
    }

    var beePos = { x: 0, y: 0 };

    function placeAt(pt) {
      beePos.x = pt.x;
      beePos.y = pt.y;
      beeRoot.style.left = pt.x + 'px';
      beeRoot.style.top = pt.y + 'px';
    }

    /** Curved hop; door approaches use a flatter path into the kapı */
    function flyTo(dest, durationMs, opts) {
      opts = opts || {};
      var from = { x: beePos.x, y: beePos.y };
      var bob = opts.flat
        ? (4 + Math.random() * 6)
        : (14 + Math.random() * 16);
      var sway = opts.flat
        ? ((Math.random() * 12) - 6)
        : ((Math.random() * 36) - 18);
      var mid = {
        x: (from.x + dest.x) / 2 + sway,
        y: Math.min(from.y, dest.y) - bob
      };
      placeAt(mid);
      later(function () { placeAt(dest); }, Math.max(280, Math.floor((durationMs || 1400) * 0.48)));
    }

    function hivePoint(tileIndex, mode) {
      var list = gridEl.querySelectorAll('.tile');
      if (!list.length) return exitPoint();
      var i = ((tileIndex % list.length) + list.length) % list.length;
      var tile = list[i];
      var s = screenEl.getBoundingClientRect();
      var el;
      var yNudge = 0;
      if (mode === true || mode === 'door') {
        // Landing on hive door / entrance opening — not hive body center
        el = tile.querySelector('.hive-door') ||
          tile.querySelector('.hive-entrance') ||
          tile.querySelector('.hive') ||
          tile;
        yNudge = -1; // sit on the slit
      } else if (mode === 'hover') {
        // Tour: hover just above the door (not emblem mid-hive)
        el = tile.querySelector('.hive-door') ||
          tile.querySelector('.hive-entrance') ||
          tile.querySelector('.hive') ||
          tile;
        yNudge = -14;
      } else {
        el = tile.querySelector('.hive-door') ||
          tile.querySelector('.hive-entrance') ||
          tile.querySelector('.hive') ||
          tile;
        yNudge = -10;
      }
      var b = el.getBoundingClientRect();
      return {
        x: b.left - s.left + b.width / 2,
        y: b.top - s.top + b.height / 2 + yNudge,
        index: i
      };
    }

    function resetVisual() {
      beeRoot.classList.remove('is-shown', 'is-flying', 'is-entering');
      podium.classList.remove('is-ready');
      if (podiumName) {
        podiumName.classList.remove('is-on');
        podiumName.textContent = '';
      }
    }

    function stopBees() {
      clearTimers();
      resetVisual();
      beeRoot.classList.add('is-off');
      beeRoot.classList.remove('is-shown', 'is-flying', 'is-entering');
      podium.classList.add('is-hidden');
    }

    function syncToggleUi() {
      if (!beeToggle) return;
      beeToggle.setAttribute('aria-pressed', beesEnabled ? 'true' : 'false');
      beeToggle.setAttribute('aria-label', beesEnabled ? 'Arıları kapat' : 'Arıları aç');
      var txt = beeToggle.querySelector('.bee-toggle-text');
      if (txt) txt.textContent = beesEnabled ? 'Arılar' : 'Kapalı';
    }

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function runCycle(startBreed) {
      if (!beesEnabled) {
        stopBees();
        return;
      }
      clearTimers();
      resetVisual();
      beeRoot.classList.remove('is-off');
      podium.classList.remove('is-hidden');
      var name = setBreed(startBreed == null ? beeIdx : startBreed);

      var order = shuffle([0,1,2,3,4,5,6,7,8]);
      var tourStops = order.slice(0, 5);
      var enterTile = tileParam != null
        ? (parseInt(tileParam, 10) || 0)
        : order[5];

      var t = 0;
      later(function () {
        if (!beesEnabled) return;
        if (podiumName) {
          podiumName.textContent = name;
          podiumName.classList.add('is-on');
        }
        podium.classList.add('is-ready');
      }, t);
      t += 900;

      // Emerge on Arılık Kuzey / °C row
      later(function () {
        if (!beesEnabled) return;
        var pt = exitPoint();
        beeRoot.style.transition = 'none';
        placeAt(pt);
        beeRoot.classList.remove('is-flying', 'is-entering');
        void beeRoot.offsetWidth;
        beeRoot.style.transition = '';
        beeRoot.classList.add('is-shown');
      }, t);
      t += 1100;

      // Tour: approach doors (not mid-hive emblems)
      tourStops.forEach(function (tileI, n) {
        var hop = n === 0 ? 1600 : 1400;
        later(function () {
          if (!beesEnabled) return;
          beeRoot.classList.add('is-flying');
          beeRoot.classList.remove('is-entering');
          flyTo(hivePoint(tileI, 'hover'), hop);
        }, t);
        t += hop;
      });

      // Final: fly into chosen hive door (kapı)
      later(function () {
        if (!beesEnabled) return;
        beeRoot.classList.add('is-flying');
        flyTo(hivePoint(enterTile, 'door'), 1300, { flat: true });
      }, t);
      t += 1300;

      later(function () {
        if (!beesEnabled) return;
        beeRoot.classList.remove('is-flying');
        beeRoot.classList.add('is-entering');
        // Nudge into the entrance opening while shrinking
        var door = hivePoint(enterTile, 'door');
        placeAt({ x: door.x, y: door.y - 5 });
      }, t);
      t += 1100;

      if (!freeze) {
        later(function () {
          if (!beesEnabled) return;
          runCycle((beeIdx + 1) % beeImgs.length);
        }, t);
      }
    }

    function setBeesEnabled(on) {
      beesEnabled = !!on;
      writeBeesOn(beesEnabled);
      syncToggleUi();
      if (beesEnabled) runCycle(beeIdx);
      else stopBees();
    }

    if (beeToggle) {
      beeToggle.addEventListener('click', function () {
        setBeesEnabled(!beesEnabled);
      });
    }
    syncToggleUi();

    function boot() {
      if (beesEnabled) runCycle(beeIdx);
      else stopBees();
    }
    requestAnimationFrame(function () { requestAnimationFrame(boot); });
    later(boot, 100);

    window.addEventListener('resize', function () {
      if (!beesEnabled) return;
      if (beeRoot.classList.contains('is-shown') && !beeRoot.classList.contains('is-entering') && !beeRoot.classList.contains('is-flying')) {
        placeAt(exitPoint());
      }
    });
  }

})();
</script>
</body>
</html>
