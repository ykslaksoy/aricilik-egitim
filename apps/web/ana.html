<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Ana</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card: #f4f5f7;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --green: #2f9e44;
    --green-bg: #d8f3dc;
    --tan-bg: #efe2cb;
    --tan-fg: #7a5a32;
    --blue: #1c7ed6;
    --blue-bg: #d0ebff;
    --red: #e03131;
    --red-bg: #ffe3e3;
    --purple: #7048e8;
    --purple-bg: #e5dbff;
    --orange: #f08c00;
    --wood: #d7ae78;
    --wood-hi: #e8c9a0;
    --wood-lo: #c9965a;
    --wood-edge: #a8743f;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top-align phone so Hardal brand strip stays on-screen when viewport < 844px
     (center alignment previously clipped the strip to a mustard sliver). */
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0 28px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .02em; }

  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow: hidden; display: flex; flex-direction: column; background: var(--bg);
    padding: 0 12px 8px;
   position: relative;
  }

  /* Hardal işletme şeridi — mustard brand signal, left-aligned, always above weather */
  .brand-strip {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 12px 7px 10px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
    overflow: hidden;
  }
  .brand-strip::before {
    content: "";
    flex: 0 0 4px;
    align-self: stretch;
    margin: -2px 0;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--hardal-hi), var(--hardal) 40%, var(--hardal-lo));
  }
  .brand-strip .brand-name {
    text-align: left;
    line-height: 1.2;
    color: var(--brown);
  }

  /* Bee + name: high in the mid-gap — exit aligns under right of Arılık Kuzey */
  .bee-gap {
    position: relative;
    z-index: 9;
    height: 56px;
    margin: 0 0 12px; /* keep weekdays well below the bee */
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    /* icon(28) + gap(8) + ~"Arılık Kuzey" width ≈ sit stage just right of label */
    padding: 4px 0 0 118px;
    pointer-events: none;
  }
  .weather-loc {
    position: relative;
  }
  /* Invisible exit marker: bees emerge from the right edge of Arılık Kuzey */
  .bee-exit {
    position: absolute;
    left: 100%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin-left: 10px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .bee-podium {
    position: relative;
    width: max-content;
    max-width: 100%;
    margin: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 9;
    pointer-events: none;
  }
  .bee-podium .podium-stage {
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center bottom, rgba(90,60,30,.22) 0%, rgba(90,60,30,.06) 45%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .bee-podium.is-ready .podium-stage { opacity: 1; }
  .bee-podium .podium-name {
    font-size: 9px; font-weight: 800; color: var(--brown-mid);
    background: rgba(255,248,238,.96); border: 1px solid #e8dcc8;
    border-radius: 999px; padding: 1px 8px; line-height: 1.35;
    opacity: 0; transform: translateX(-4px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0; white-space: nowrap;
  }
  .bee-podium .podium-name.is-on {
    opacity: 1; transform: translateX(0);
  }

  .weather {
    flex: 0 0 auto; background: #fff; border: 1px solid #e6e8ec; border-radius: 16px;
    /* tighter top padding — no empty white band above Arılık Kuzey */
    padding: 6px 12px 10px; margin-top: 0; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .weather-top { display: flex; align-items: center; gap: 8px; margin-bottom: 0; }
  .weather-icon { width: 28px; height: 28px; flex: 0 0 auto; }
  .weather-loc { font-size: 13px; font-weight: 600; color: var(--text); }
  /* Locked display temp — JS must not overwrite (see lockWeatherTemp) */
  .weather-temp { margin-left: auto; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
  .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .day-name { font-size: 10px; font-weight: 600; color: var(--muted); }
  .day-date { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .day.is-today .day-name,
  .day.is-today .day-date { color: var(--hardal-lo, #b8860b); }
  .day-ico { width: 18px; height: 18px; }
  .day-hi { font-size: 11px; font-weight: 700; color: var(--text); }
  .day-lo { font-size: 10px; color: #8a8278; }

  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 8px; min-height: 0;
  }
  .tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    position: relative; overflow: hidden; min-height: 0; height: 100%;
    /* footer reserved for label+badge; hive fills the rest and centers */
    padding: 0 0 46px;
  }
  .hive-area {
    position: absolute; left: 0; right: 0; top: 0; bottom: 46px;
    display: flex; align-items: center; justify-content: center;
    /* optical nudge: visual hive mass sits high inside .hive box */
    padding-top: 28px;
  }

  /* ===== Shared hive: EQUAL tiers, FLUSH sides ===== */
  .hive {
    width: 72px; height: 68px; position: relative; flex: 0 0 auto; margin-top: 0;
  }
  .hive-stack {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    width: 56px; display: flex; flex-direction: column; align-items: stretch;
  }
  .hive-lid {
    width: 64px; height: 8px; margin-left: -4px; margin-bottom: 0;
    background: linear-gradient(180deg, #d5d5da 0%, #9a9aa3 100%);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 1px 1px rgba(0,0,0,.12);
    position: relative; z-index: 1;
  }
  .hive-lid::after {
    content: ""; position: absolute; left: 50%; top: 2.5px; transform: translateX(-50%);
    width: 18px; height: 2px; border-radius: 1px; background: rgba(60,60,70,.45);
  }
  /* Two boxes: IDENTICAL height & width → equal + flush */
  .hive-box {
    height: 24px; /* EQUAL */
    width: 100%;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(160,110,60,.12) 3px, rgba(160,110,60,.12) 4px),
      linear-gradient(180deg, var(--wood-hi) 0%, var(--wood) 55%, var(--wood-lo) 100%);
    border-left: 1px solid var(--wood-edge);
    border-right: 1px solid var(--wood-edge);
    position: relative;
    box-sizing: border-box;
  }
  .hive-box.top {
    border-top: 1px solid var(--wood-edge);
  }
  .hive-box.bottom {
    border-bottom: 1px solid var(--wood-edge);
    border-top: 1px solid #8a6238; /* seam */
  }
  /* finger joints INSIDE edges so outer sides stay flush */
  .hive-box::before,
  .hive-box::after {
    content: ""; position: absolute; top: 3px; bottom: 3px; width: 3px;
    background:
      repeating-linear-gradient(
        180deg,
        var(--wood-edge) 0 4px,
        transparent 4px 7px
      );
    opacity: .85;
    pointer-events: none;
  }
  .hive-box::before { left: 1px; }
  .hive-box::after { right: 1px; }
  .hive-entrance {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 12px; height: 3px; background: #2a1a0c; border-radius: 0 0 1px 1px; z-index: 1;
  }
  .hive-feet {
    display: flex; justify-content: space-between; padding: 0 2px; margin-top: 2px;
  }
  .hive-feet span {
    width: 9px; height: 5px; background: var(--wood-lo); border-radius: 1px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .hive-shadow {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 48px; height: 4px; background: radial-gradient(ellipse, rgba(0,0,0,.12), transparent 70%);
  }

  /* Burned (yakma) emblem — branded into wood, not flat dark disc */
  .hive-icon {
    position: absolute;
    left: 50%;
    top: 34px; /* lid(8)+half of equal boxes(24) from stack top+2 */
    transform: translate(-50%, -50%);
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    box-shadow: none;
    overflow: hidden; /* clip fringe; PNG stamps are transparent circles */
    z-index: 3;
    pointer-events: none;
  }
  .hive-icon img {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    object-fit: contain; /* keep circular stamp geometry */
    /* multiply so wood grain reads through — burned branding look */
    mix-blend-mode: multiply;
    background: transparent;
  }
  .hive-icon svg { width: 18px; height: 18px; display: block; }

  .tile-label {
    position: absolute; left: 0; right: 0; bottom: 26px;
    font-size: 12px; font-weight: 700; color: var(--brown-mid); line-height: 1.1;
    text-align: center;
  }
  .badge {
    position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%);
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; line-height: 1.35; white-space: nowrap;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.tan { background: var(--tan-bg); color: var(--tan-fg); }
  .badge.blue { background: var(--blue-bg); color: var(--blue); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.purple { background: var(--purple-bg); color: var(--purple); }

  .tabbar {
    height: 72px; background: #fff; border-top: 1px solid #e6e8ec;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 0 4px 10px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #8b8680; font-size: 10px; font-weight: 600;
  }
  .tab.active { color: var(--orange); }
  .tab svg { width: 22px; height: 22px; }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }

  body.shot, html.shot { background: #f7f8fa !important; width: 390px; height: 844px; overflow: hidden; }
  body.shot { display: block; margin: 0; padding: 0; }
  body.shot .phone { box-shadow: none !important; border-radius: 0 !important; width: 390px; height: 844px; }
  body.shot .phone-notch, body.shot .home-indicator { display: none !important; }

  .screen { position: relative; }
  .mascot-bee {
    position: absolute; z-index: 10;
    left: 0; top: 0;
    width: 48px; height: 48px; pointer-events: none;
    transform: translate(-50%, -50%) scale(.55);
    opacity: 0;
    transition:
      left 1.45s cubic-bezier(.45,.05,.25,1),
      top 1.45s cubic-bezier(.35,.8,.25,1),
      transform .55s cubic-bezier(.34,1.4,.64,1),
      opacity .4s ease;
    will-change: left, top, transform, opacity;
  }
  .mascot-bee.is-shown {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .mascot-bee.is-flying {
    transform: translate(-50%, -50%) scale(.85);
  }
  .mascot-bee.is-entering {
    transform: translate(-50%, -50%) scale(.35);
    opacity: 0;
    transition:
      left 1.1s cubic-bezier(.4,.05,.2,1),
      top 1.1s cubic-bezier(.4,.05,.2,1),
      transform .9s ease,
      opacity .7s ease .25s;
  }
  .mascot-bee img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0;
    transition: opacity .35s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
    /* Idle hover: gentle bob + tilt */
    animation: bee-hover 1.6s ease-in-out infinite;
  }
  .mascot-bee img.is-on { opacity: 1; }
  /* In flight: faster buzz + wing-like tilt */
  .mascot-bee.is-flying img.is-on {
    animation: bee-buzz 0.22s ease-in-out infinite;
  }
  .mascot-bee.is-entering img.is-on {
    animation: bee-buzz 0.16s linear infinite;
  }
  @keyframes bee-hover {
    0%, 100% { transform: translate(0, 0) rotate(-5deg); }
    35% { transform: translate(1px, -4px) rotate(4deg); }
    70% { transform: translate(-1px, -2px) rotate(-3deg); }
  }
  @keyframes bee-buzz {
    0%, 100% { transform: translate(0, 0) rotate(-10deg) scale(1); }
    25% { transform: translate(1.5px, -3px) rotate(8deg) scale(1.03); }
    50% { transform: translate(-1px, 1px) rotate(-6deg) scale(0.98); }
    75% { transform: translate(1px, -2px) rotate(9deg) scale(1.02); }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <div>9:41</div>
    <div class="status-icons"><span>●●●●</span><span>Wi‑Fi</span><span>▮</span></div>
  </div>

  <div class="screen">
    <header class="brand-strip" id="brand-strip" aria-label="İşletme">

    </header>
    <div class="mascot-bee" id="mascotBee" aria-hidden="true">

          <path d="M18 18c0-2.5 2-4.5 4.5-4.5 1.4 0 2.6.6 3.4 1.6A5 5 0 0 1 27 24H10a4.5 4.5 0 0 1 0-9c.5 0 1 .1 1.5.2" fill="#cfd8e3" stroke="#9aa8b8" stroke-width="1"/>

        <div class="day"><div class="day-name">Sal</div><div class="day-date">8</div><svg class="day-ico" viewBox="0 0 20 20"><circle cx="8" cy="9" r="4" fill="#f7b731"/><ellipse cx="13" cy="13" rx="5" ry="3" fill="#cfd8e3"/></svg><div class="day-hi">22°</div><div class="day-lo">11°</div></div>
        <div class="day"><div class="day-name">Çar</div><div class="day-date">9</div><svg class="day-ico" viewBox="0 0 20 20"><ellipse cx="10" cy="11" rx="6" ry="3.5" fill="#b8c4d4"/></svg><div class="day-hi">19°</div><div class="day-lo">10°</div></div>

        <div class="day"><div class="day-name">Cmt</div><div class="day-date">12</div><svg class="day-ico" viewBox="0 0 20 20"><circle cx="8" cy="9" r="4" fill="#f7b731"/><ellipse cx="13" cy="13" rx="5" ry="3" fill="#cfd8e3"/></svg><div class="day-hi">21°</div><div class="day-lo">9°</div></div>
        <div class="day is-today"><div class="day-name">Paz</div><div class="day-date">13</div><svg class="day-ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="#f7b731"/></svg><div class="day-hi">23°</div><div class="day-lo">11°</div></div>
      </div>

    <section class="grid" id="grid" aria-label="Ana paneller"></section>
  </div>

  <nav class="tabbar" aria-label="Alt menü">
    <div class="tab active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Ayarlar

  <div class="home-indicator"></div>

<script>
(function () {
  if (location.search.indexOf('shot=1') !== -1) {
    document.documentElement.classList.add('shot');
    document.body.classList.add('shot');
  }

  // Weekday strip: live Mon–Sun dates for the current calendar week
  // Does NOT touch .weather-temp — header temperature is locked separately.
  (function fillForecastDates() {
    var root = document.getElementById('forecast');
    if (!root) return;
    var days = root.querySelectorAll('.day');
    if (!days.length) return;
    var labels = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt']; // JS getDay() order
    var trShort = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz']; // Mon→Sun display
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    // Monday of this week (Mon=0 … Sun=6 in trShort)
    var monday = new Date(todayY, todayM, todayD);
    var dow = monday.getDay(); // 0 Sun … 6 Sat
    var offsetToMon = dow === 0 ? -6 : 1 - dow;
    monday.setDate(monday.getDate() + offsetToMon);
    for (var i = 0; i < days.length && i < 7; i++) {
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      var nameEl = days[i].querySelector('.day-name');
      var dateEl = days[i].querySelector('.day-date');
      if (nameEl) nameEl.textContent = trShort[i];
      if (dateEl) dateEl.textContent = String(d.getDate());
      var isToday = d.getFullYear() === todayY && d.getMonth() === todayM && d.getDate() === todayD;
      days[i].classList.toggle('is-today', isToday);
      days[i].setAttribute('aria-label', trShort[i] + ' ' + d.getDate());
    }
    // silence unused (kept for clarity of JS day index)
    void labels;
  })();

  // Lock Ana header temperature to the live production value (22°).
  // fillForecastDates above only updates weekday dates — never this node.
  (function lockWeatherTemp() {
    var el = document.getElementById('weatherTemp');
    if (!el) return;
    var LOCKED = el.getAttribute('data-temp') || el.textContent.trim() || '22°';
    if (LOCKED.indexOf('°') === -1) LOCKED = LOCKED + '°';
    el.setAttribute('data-temp', LOCKED);
    el.setAttribute('data-locked', '1');
    el.textContent = LOCKED;
  })();

  var ICONS = {
    tarti: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3e2c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v14"/><path d="M7 7h10"/><path d="M7 7l-3 6h6L7 7z"/><path d="M17 7l-3 6h6l-3-6z"/><path d="M9 21h6"/></svg>',
    saglik: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>',
    ogul: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><ellipse cx="12" cy="13.5" rx="4.2" ry="5.5"/><circle cx="12" cy="7.2" r="2.4"/><path d="M10.6 5.2 L9.2 3.6 M13.4 5.2 L14.8 3.6" stroke="#f3e2c8" stroke-width="1.3" fill="none"/><path d="M8 11 C4 8 3 13 7 14" fill="none" stroke="#f3e2c8" stroke-width="1.4"/><path d="M16 11 C20 8 21 13 17 14" fill="none" stroke="#f3e2c8" stroke-width="1.4"/><path d="M9.5 12.5h5 M9.5 15h5" stroke="#3d2616" stroke-width="1.2"/></svg>',
    kovanlar: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3e2c8" stroke-width="1.7"><rect x="5" y="5" width="14" height="4" rx="1"/><rect x="5" y="10" width="14" height="4" rx="1"/><rect x="5" y="15" width="14" height="4" rx="1"/></svg>',
    koloni: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><g transform="translate(12,4.8) scale(0.48)"><ellipse cx="0" cy="4" rx="3.2" ry="4.2"/><circle cx="0" cy="-1.2" r="1.8"/><path d="M-2.5 1 C-6 -1 -6.5 4 -2 4.5" fill="none" stroke="#f3e2c8" stroke-width="1.5"/><path d="M2.5 1 C6 -1 6.5 4 2 4.5" fill="none" stroke="#f3e2c8" stroke-width="1.5"/><path d="M-2 3h4 M-2 5.2h4" stroke="#3d2616" stroke-width="1.1"/></g><g transform="translate(7,14) scale(0.48)"><ellipse cx="0" cy="4" rx="3.2" ry="4.2"/><circle cx="0" cy="-1.2" r="1.8"/><path d="M-2.5 1 C-6 -1 -6.5 4 -2 4.5" fill="none" stroke="#f3e2c8" stroke-width="1.5"/><path d="M2.5 1 C6 -1 6.5 4 2 4.5" fill="none" stroke="#f3e2c8" stroke-width="1.5"/><path d="M-2 3h4 M-2 5.2h4" stroke="#3d2616" stroke-width="1.1"/></g><g transform="translate(17,14) scale(0.48)"><ellipse cx="0" cy="4" rx="3.2" ry="4.2"/><circle cx="0" cy="-1.2" r="1.8"/><path d="M-2.5 1 C-6 -1 -6.5 4 -2 4.5" fill="none" stroke="#f3e2c8" stroke-width="1.5"/><path d="M2.5 1 C6 -1 6.5 4 2 4.5" fill="none" stroke="#f3e2c8" stroke-width="1.5"/><path d="M-2 3h4 M-2 5.2h4" stroke="#3d2616" stroke-width="1.1"/></g></svg>',
    ariliklar: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><path d="M12 2C8.7 2 6 4.9 6 8.4c0 4.6 6 11.6 6 11.6s6-7 6-11.6C18 4.9 15.3 2 12 2zm0 8.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
    gorevler: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3e2c8" stroke-width="1.7"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
    uyarilar: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3e2c8" stroke-width="1.7"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/><circle cx="18" cy="6" r="2" fill="#f3e2c8" stroke="none"/></svg>',
    raporlar: '<svg viewBox="0 0 24 24" fill="#f3e2c8"><rect x="4" y="13" width="4" height="7" rx="0.5"/><rect x="10" y="8" width="4" height="12" rx="0.5"/><rect x="16" y="4" width="4" height="16" rx="0.5"/></svg>'
  };

  var tiles = [
    { key: 'tarti', label: 'Tartı', badge: '+1.2kg', tone: 'green' },
    { key: 'saglik', label: 'Sağlık', badge: 'İyi', tone: 'green' },
    { key: 'ogul', label: 'Oğul', badge: 'Düşük', tone: 'green' },
    { key: 'kovanlar', label: 'Kovanlar', badge: '100', tone: 'tan' },
    { key: 'koloni', label: 'Koloni', badge: '12 grup', tone: 'tan' },
    { key: 'ariliklar', label: 'Arılıklar', badge: '3', tone: 'tan' },
    { key: 'gorevler', label: 'Görevler', badge: '5', tone: 'blue' },
    { key: 'uyarilar', label: 'Uyarılar', badge: '2', tone: 'red' },
    { key: 'raporlar', label: 'Raporlar', badge: '—', tone: 'purple' }
  ];

  function hiveHTML(key) {
    var emblem = 'assets/emblems/' + key + '.png';
    return (
      '<div class="hive-area">' +
        '<div class="hive">' +
          '<div class="hive-stack">' +
            '<div class="hive-lid"></div>' +
            '<div class="hive-box top"></div>' +
            '<div class="hive-box bottom"><div class="hive-entrance"></div></div>' +
            '<div class="hive-feet"><span></span><span></span></div>' +
          '</div>' +
          '<div class="hive-shadow"></div>' +
          '<div class="hive-icon" aria-hidden="true">' +
            '<img src="' + emblem + '" alt="" width="32" height="32" />' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  var grid = document.getElementById('grid');
  grid.innerHTML = tiles.map(function (t) {
    return (
      '<article class="tile" data-key="' + t.key + '">' +
        hiveHTML(t.key) +
        '<div class="tile-label">' + t.label + '</div>' +
        '<div class="badge ' + t.tone + '">' + t.badge + '</div>' +
      '</article>'
    );
  }).join('');

  // Announcement → podium → tour tiles → enter one hive
  var beeRoot = document.getElementById('mascotBee');
  var podium = document.getElementById('beePodium');
  var podiumName = document.getElementById('podiumName');
  var screenEl = document.querySelector('.screen');
  var gridEl = document.getElementById('grid');
  if (beeRoot && podium && screenEl && gridEl) {
    var beeImgs = beeRoot.querySelectorAll('img');
    var beeIdx = 0;
    var timers = [];
    var beeParam = (location.search.match(/[?&]bee=([^&]+)/) || [])[1];
    var tileParam = (location.search.match(/[?&]tile=(\d+)/) || [])[1];
    var beeMap = { italyan: 0, karniyol: 1, kafkas: 2 };
    if (beeParam && beeMap[beeParam] != null) beeIdx = beeMap[beeParam];
    var freeze = location.search.indexOf('shot=1') !== -1;

    function clearTimers() {
      timers.forEach(function (t) { clearTimeout(t); });
      timers = [];
    }
    function later(fn, ms) {
      timers.push(setTimeout(fn, ms));
    }

    function setBreed(i) {
      beeIdx = ((i % beeImgs.length) + beeImgs.length) % beeImgs.length;
      beeImgs.forEach(function (img, j) { img.classList.toggle('is-on', j === beeIdx); });
      return beeImgs[beeIdx].getAttribute('data-breed') || '';
    }

    function exitPoint() {
      // Emerge from the right side of “Arılık Kuzey” (not mid-gap center)
      var s = screenEl.getBoundingClientRect();
      var exitEl = document.getElementById('beeExit');
      var loc = document.getElementById('weatherLoc') || document.querySelector('.weather-loc');
      var el = exitEl || loc;
      if (!el) return podiumPoint();
      var b = el.getBoundingClientRect();
      return {
        x: b.left - s.left + b.width / 2,
        y: b.top - s.top + b.height / 2
      };
    }

    function podiumPoint() {
      var s = screenEl.getBoundingClientRect();
      var stage = document.getElementById('podiumStage') || podium;
      var p = stage.getBoundingClientRect();
      return {
        x: p.left - s.left + p.width / 2,
        y: p.top - s.top + p.height / 2
      };
    }

    var beePos = { x: 0, y: 0 };

    function placeAt(pt) {
      beePos.x = pt.x;
      beePos.y = pt.y;
      beeRoot.style.left = pt.x + 'px';
      beeRoot.style.top = pt.y + 'px';
    }

    /** Curved hop: mid waypoint with bob, then destination (bee-like flight path) */
    function flyTo(dest, durationMs) {
      var from = { x: beePos.x, y: beePos.y };
      var bob = 14 + Math.random() * 16;
      var sway = (Math.random() * 36) - 18;
      var mid = {
        x: (from.x + dest.x) / 2 + sway,
        y: Math.min(from.y, dest.y) - bob
      };
      placeAt(mid);
      later(function () { placeAt(dest); }, Math.max(280, Math.floor((durationMs || 1400) * 0.48)));
    }

    function hivePoint(tileIndex, entrance) {
      var tiles = gridEl.querySelectorAll('.tile');
      if (!tiles.length) return exitPoint();
      var i = ((tileIndex % tiles.length) + tiles.length) % tiles.length;
      var tile = tiles[i];
      var el = entrance
        ? (tile.querySelector('.hive-entrance') || tile.querySelector('.hive') || tile)
        : (tile.querySelector('.hive-icon') || tile.querySelector('.hive') || tile);
      var s = screenEl.getBoundingClientRect();
      var b = el.getBoundingClientRect();
      return {
        x: b.left - s.left + b.width / 2,
        y: b.top - s.top + b.height / 2,
        index: i
      };
    }

    function resetVisual() {
      beeRoot.classList.remove('is-shown', 'is-flying', 'is-entering');
      podium.classList.remove('is-ready');
      if (podiumName) {
        podiumName.classList.remove('is-on');
        podiumName.textContent = '';
      }
    }

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function runCycle(startBreed) {
      clearTimers();
      resetVisual();
      var name = setBreed(startBreed == null ? beeIdx : startBreed);

      // visit 4–5 hives while touring, then enter a different one
      var order = shuffle([0,1,2,3,4,5,6,7,8]);
      var tourStops = order.slice(0, 5);
      var enterTile = tileParam != null
        ? (parseInt(tileParam, 10) || 0)
        : order[5];

      var t = 0;
      // 1) announcement (name only)
      later(function () {
        if (podiumName) {
          podiumName.textContent = name;
          podiumName.classList.add('is-on');
        }
        podium.classList.add('is-ready');
      }, t);
      t += 900;

      // 2) bee emerges from the right of “Arılık Kuzey”
      later(function () {
        var pt = exitPoint();
        beeRoot.style.transition = 'none';
        placeAt(pt);
        beeRoot.classList.remove('is-flying', 'is-entering');
        void beeRoot.offsetWidth;
        beeRoot.style.transition = '';
        beeRoot.classList.add('is-shown');
      }, t);
      t += 1100;

      // 3) wander across hive tiles with curved flight hops
      tourStops.forEach(function (tileI, n) {
        var hop = n === 0 ? 1600 : 1400;
        later(function () {
          beeRoot.classList.add('is-flying');
          beeRoot.classList.remove('is-entering');
          flyTo(hivePoint(tileI, false), hop);
        }, t);
        t += hop;
      });

      // 4) fly to chosen hive entrance + shrink in
      later(function () {
        beeRoot.classList.add('is-flying');
        flyTo(hivePoint(enterTile, true), 1300);
      }, t);
      t += 1300;

      later(function () {
        beeRoot.classList.remove('is-flying');
        beeRoot.classList.add('is-entering');
      }, t);
      t += 1100;

      // 5) next breed
      if (!freeze) {
        later(function () {
          runCycle((beeIdx + 1) % beeImgs.length);
        }, t);
      }
    }

    function boot() { runCycle(beeIdx); }
    requestAnimationFrame(function () { requestAnimationFrame(boot); });
    later(boot, 100);

    window.addEventListener('resize', function () {
      if (beeRoot.classList.contains('is-shown') && !beeRoot.classList.contains('is-entering') && !beeRoot.classList.contains('is-flying')) {
        placeAt(exitPoint());
      }
    });
  }

})();
</script>
