<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Ana</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card: #f4f5f7;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --green: #2f9e44;
    --green-bg: #d8f3dc;
    --tan-bg: #efe2cb;
    --tan-fg: #7a5a32;
    --blue: #1c7ed6;
    --blue-bg: #d0ebff;
    --red: #e03131;
    --red-bg: #ffe3e3;
    --purple: #7048e8;
    --purple-bg: #e5dbff;
    --orange: #f08c00;
    /* Restored warmer yakma-era wood (pre-Grok 0a61b12): was --wood-1/#e8c48e + --wood-2/#c99755 */
    --wood: #d9ae6a;
    --wood-hi: #e8c48e;
    --wood-lo: #c99755;
    --wood-edge: #8a6030;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Top-align phone so Hardal brand strip stays on-screen when viewport < 844px
     (center alignment previously clipped the strip to a mustard sliver). */
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0 28px;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .02em; }

  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow: hidden; display: flex; flex-direction: column; background: var(--bg);
    padding: 0 12px 8px;
   position: relative;
  }

  /* Hardal işletme şeridi — 3D bee logo + brand + lock; location lives in weather card below */
  .brand-strip {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 12px 7px 8px;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a;
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
    overflow: visible;
  }
  .brand-logo-btn {
    flex: 0 0 auto;
    width: auto;
    height: auto;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    cursor: default;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overflow: visible;
  }
  .brand-logo-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.45);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .brand-logo-btn .bee-3d,
  .brand-logo-btn .bee-logo-img {
    width: 52px;
    height: auto;
    max-height: 40px;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 1px 2px rgba(61, 38, 22, 0.22));
    transform: none;
  }
  .brand-logo-btn .bee-emoji {
    font-size: 22px;
    line-height: 1;
    display: block;
    transform: perspective(120px) rotateX(8deg) rotateY(-6deg) translateZ(2px);
    filter: drop-shadow(0 2px 2px rgba(61, 38, 22, 0.3));
    user-select: none;
  }
  .brand-strip .brand-name {
    flex: 0 1 auto;
    text-align: left;
    line-height: 1.2;
    color: var(--brown);
    margin-left: 2px;
  }
  .brand-strip .brand-lock-btn {
    margin-left: auto;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 30px;
    padding: 5px 11px;
    border: 1px solid rgba(176, 140, 60, 0.35);
    border-radius: 999px;
    background: rgba(255, 252, 244, 0.72);
    color: var(--brown-mid, #5c3a1f);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .015em;
    line-height: 1.2;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    box-shadow: none;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .brand-strip .brand-lock-btn:hover {
    background: rgba(255, 248, 230, 0.95);
    border-color: rgba(176, 140, 60, 0.55);
  }
  .brand-strip .brand-lock-btn:active {
    background: rgba(244, 227, 176, 0.85);
  }
  .brand-strip .brand-lock-btn:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
  }
  .brand-strip .brand-lock-btn[aria-pressed="true"] {
    background: rgba(240, 196, 58, 0.28);
    border-color: rgba(184, 134, 11, 0.55);
    color: var(--brown, #3d2616);
    font-weight: 600;
  }
  .weather-loc-label.is-fading {
    opacity: 0;
  }
  .weather-loc-label {
    transition: opacity 0.35s ease;
  }

  .weather-loc {
    position: relative;
  }
  /* Invisible exit marker: bees emerge just right of the arılık label (pre-flex stretch) */
  .bee-exit {
    position: absolute;
    left: 100%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin-left: 10px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  /* Breed name on the label ↔ °C row (right of exit marker) */
  .bee-podium {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: 16px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    z-index: 9;
    pointer-events: none;
  }
  .bee-podium.is-hidden { display: none; }
  .bee-podium .podium-stage {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center bottom, rgba(90,60,30,.18) 0%, rgba(90,60,30,.05) 45%, transparent 70%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .bee-podium.is-ready .podium-stage { opacity: 1; }
  .bee-podium .podium-name {
    font-size: 9px; font-weight: 800; color: var(--brown-mid);
    background: rgba(255,248,238,.96); border: 1px solid #e8dcc8;
    border-radius: 999px; padding: 1px 7px; line-height: 1.35;
    opacity: 0; transform: translateX(-4px);
    transition: opacity .35s ease, transform .35s ease;
    margin: 0; white-space: nowrap;
  }
  .bee-podium .podium-name.is-on {
    opacity: 1; transform: translateX(0);
  }

  .weather {
    flex: 0 0 auto; background: #fff; border: 1px solid #e6e8ec; border-radius: 16px;
    padding: 6px 12px 8px; margin-top: 0; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .weather-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; /* dense: header row → weekday strip */
    min-height: 32px;
  }
  .weather-icon { width: 28px; height: 28px; flex: 0 0 auto; }
  /* Content-sized (not flex:1) so #beeExit stays at end of short label — restores d6cf379 exit */
  .weather-loc { font-size: 13px; font-weight: 600; color: var(--text); flex: 0 1 auto; max-width: 52%; }
  .arilik-loc-controls {
    display: inline-flex;
    align-items: center;
    gap: 0;
    max-width: 100%;
    min-width: 0;
  }
  /* Şık kibar prev/next — light tap targets, quiet chevrons, warm ink */
  .arilik-nav {
    flex: 0 0 auto;
    box-sizing: content-box;
    width: 1em;
    height: 1em;
    min-width: 28px;
    min-height: 28px;
    padding: 6px;
    margin: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #8a7358;
    font-size: 15px;
    font-weight: 500;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color .18s ease, background .18s ease;
  }
  .arilik-nav:hover {
    color: var(--brown-mid, #5c3a1f);
    background: rgba(232, 220, 200, 0.45);
  }
  .arilik-nav:active {
    color: var(--brown, #3d2616);
    background: rgba(224, 208, 180, 0.55);
  }
  .arilik-nav:focus-visible {
    outline: 1.5px solid rgba(184, 134, 11, 0.55);
    outline-offset: 1px;
  }
  .arilik-nav:disabled {
    opacity: 0.28;
    cursor: default;
    background: transparent;
  }
  .arilik-nav svg {
    width: 12px;
    height: 12px;
    display: block;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .weather-loc-label {
    display: block;
    max-width: 7.2em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 1px;
    text-align: center;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--text);
  }
  /* Live °C from Open-Meteo (see liveWeather) — far right of weather-top */
  .weather-temp {
    margin-left: 6px; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; flex: 0 0 auto;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .weather-temp:focus-visible {
    outline: 2px solid rgba(212, 160, 23, 0.55);
    outline-offset: 2px;
    border-radius: 6px;
  }
  .bee-toggle {
    flex: 0 0 auto;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border: 1px solid #e0d6c8;
    border-radius: 8px;
    background: #faf7f2;
    color: var(--brown-mid);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 11;
    -webkit-tap-highlight-color: transparent;
  }
  .bee-toggle:hover { background: #f3ebe0; }
  .bee-toggle:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .bee-toggle[aria-pressed="false"] {
    color: var(--muted);
    background: #f3f4f6;
    border-color: #e4e6ea;
  }
  .bee-toggle-ico {
    width: 14px;
    height: 14px;
    display: block;
    flex: 0 0 auto;
  }
  .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .day-name { font-size: 10px; font-weight: 600; color: var(--muted); }
  .day-date { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .day.is-today .day-name,
  .day.is-today .day-date { color: var(--hardal-lo, #b8860b); }
  .day-ico { width: 18px; height: 18px; }
  .day-hi { font-size: 11px; font-weight: 700; color: var(--text); }
  .day-lo { font-size: 10px; color: #8a8278; }
  .muayene-hint {
    margin-top: 8px; padding: 8px 10px; border-radius: 10px;
    background: #fff8df; border: 1px solid #e0c56a;
    color: var(--brown, #4a2f1a); font-size: 11px; font-weight: 650; line-height: 1.35;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint[hidden] { display: none !important; }
  .muayene-hint-text { flex: 1 1 auto; min-width: 0; }
  .muayene-hint-ok {
    flex: 0 0 auto;
    min-height: 28px;
    padding: 4px 11px;
    border: 1px solid rgba(176, 140, 60, 0.45);
    border-radius: 8px;
    background: rgba(255, 252, 244, 0.95);
    color: var(--brown, #4a2f1a);
    font-size: 11px;
    font-weight: 750;
    letter-spacing: .01em;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .muayene-hint-ok:active {
    background: rgba(240, 196, 58, 0.28);
  }

  .grid {
    flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 8px; min-height: 0;
  }
  /* LOCKED: centered hive+text (PR #16) — do not regress */
  .tile {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    position: relative; overflow: hidden; min-height: 0; height: 100%;
    /* Center hive + label + badge as one group in the button */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 4px;
    box-sizing: border-box;
  }
  .hive-area {
    position: relative; flex: 0 0 auto; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-top: 0;
  }

  /* ===== Shared hive: EQUAL tiers, FLUSH sides ===== */
  .hive {
    width: 72px; height: 68px; position: relative; flex: 0 0 auto; margin-top: 0;
  }
  .hive-stack {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    width: 56px; display: flex; flex-direction: column; align-items: stretch;
  }
  .hive-lid {
    width: 64px; height: 8px; margin-left: -4px; margin-bottom: 0;
    /* Brighter lid from pre-Grok ana.css (4994d59) */
    background: linear-gradient(180deg, #f4f5f7 0%, #c8ccd2 48%, #9aa1aa 100%);
    border-radius: 2px 2px 1px 1px;
    box-shadow: 0 1px 0 #7c828a;
    position: relative; z-index: 1;
  }
  .hive-lid::after {
    content: ""; position: absolute; left: 50%; top: 2.5px; transform: translateX(-50%);
    width: 18px; height: 2px; border-radius: 1px; background: rgba(60,60,70,.45);
  }
  /* Two boxes: IDENTICAL height & width → equal + flush */
  .hive-box {
    height: 24px; /* EQUAL */
    width: 100%;
    /* Warmer fill + highlight wash from 4994d59 .hive-box */
    background-color: var(--wood-hi);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(90, 52, 16, 0.07) 0 1px,
        transparent 1px 6px
      ),
      linear-gradient(180deg, rgba(255, 248, 230, 0.35), transparent 42%, rgba(90, 50, 14, 0.16));
    border-left: 1px solid var(--wood-edge);
    border-right: 1px solid var(--wood-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    position: relative;
    box-sizing: border-box;
  }
  .hive-box.top {
    border-top: 1px solid var(--wood-edge);
  }
  .hive-box.bottom {
    border-bottom: 1px solid var(--wood-edge);
    border-top: 1px solid var(--wood-edge); /* seam matches wood edge (a16661d) */
  }
  /* finger joints INSIDE edges — warm #e0b87a accents from 4994d59 */
  .hive-box::before,
  .hive-box::after {
    content: ""; position: absolute; top: 3px; bottom: 3px; width: 5px;
    background: repeating-linear-gradient(
      180deg,
      #7a5224 0 3px,
      #e0b87a 3px 7px
    );
    pointer-events: none;
  }
  .hive-box::before { left: 0; }
  .hive-box::after { right: 0; }
  .hive-entrance {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 12px; height: 3px; background: #2a1a0c; border-radius: 0 0 1px 1px; z-index: 1;
  }
  /* Invisible landing target centered on the entrance slit (kapı) */
  .hive-door {
    position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
    width: 18px; height: 8px; z-index: 2; pointer-events: none;
  }
  .hive-feet {
    display: flex; justify-content: space-between; padding: 0 2px; margin-top: 2px;
  }
  .hive-feet span {
    width: 9px; height: 5px; background: var(--wood-lo); border-radius: 1px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .hive-shadow {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 48px; height: 4px; background: radial-gradient(ellipse, rgba(0,0,0,.12), transparent 70%);
  }

  /* Burned (yakma) emblem — branded into wood, not flat dark disc */
  .hive-icon {
    position: absolute;
    left: 50%;
    top: 34px; /* lid(8)+half of equal boxes(24) from stack top+2 */
    transform: translate(-50%, -50%);
    width: 32px; height: 32px; border-radius: 50%;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    box-shadow: none;
    overflow: hidden; /* clip fringe; PNG stamps are transparent circles */
    z-index: 3;
    pointer-events: none;
  }
  .hive-icon img {
    width: 100%; height: 100%; display: block; border-radius: 50%;
    object-fit: contain; /* keep circular stamp geometry */
    /* multiply so wood grain reads through — burned branding look */
    mix-blend-mode: multiply;
    background: transparent;
  }
  .hive-icon svg { width: 18px; height: 18px; display: block; }
  /* Tartı yakma damga — restored from 17d44cf/4994d59 ana.js + ana.css */
  .hive-icon.hive-icon-burn {
    width: 36px; height: 36px;
    border-radius: 0;
    overflow: visible;
    background: none;
    display: grid;
    place-items: center;
  }
  .hive-icon.hive-icon-burn svg {
    width: 100%; height: 100%;
    display: block;
    fill: none;
    stroke: #1a0c06;
    stroke-width: 1.35;
    stroke-linecap: round;
    stroke-linejoin: round;
    mix-blend-mode: multiply;
    background: none;
  }
  .hive-icon .burn-ring {
    fill: none;
    stroke: #160a05;
    stroke-width: 1.55;
  }

  .tile-label {
    /* Flow under hive; centered with the tile group */
    position: relative; left: auto; right: auto; bottom: auto;
    flex: 0 0 auto; width: 100%; margin-top: 2px;
    font-size: 12px; font-weight: 700; color: var(--brown-mid); line-height: 1.1;
    text-align: center;
  }
  .badge {
    /* Keep prior label↔badge gap (~4px): was bottom 28px vs 5px + badge height */
    position: relative; left: auto; bottom: auto; transform: none;
    flex: 0 0 auto; margin-top: 4px;
    padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; line-height: 1.35; white-space: nowrap;
  }
  .badge.green { background: var(--green-bg); color: var(--green); }
  .badge.tan { background: var(--tan-bg); color: var(--tan-fg); }
  .badge.blue { background: var(--blue-bg); color: var(--blue); }
  .badge.red { background: var(--red-bg); color: var(--red); }
  .badge.purple { background: var(--purple-bg); color: var(--purple); }

  .tile {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:focus-visible {
    outline: 2px solid var(--hardal);
    outline-offset: 2px;
  }
  .tile:active { transform: scale(.985); }

  /* In-phone “yakında” sheet — last resort when no real route */
  .tile-sheet {
    position: absolute; inset: 0; z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(20, 16, 12, .35);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  .tile-sheet.is-open { opacity: 1; pointer-events: auto; }
  .tile-sheet-card {
    width: 100%;
    background: #fff;
    border-radius: 18px 18px 0 0;
    padding: 16px 18px 28px;
    box-shadow: 0 -8px 28px rgba(0,0,0,.12);
    transform: translateY(12px);
    transition: transform .22s ease;
  }
  .tile-sheet.is-open .tile-sheet-card { transform: translateY(0); }
  .tile-sheet-title {
    font-size: 17px; font-weight: 800; color: var(--brown); margin: 0 0 6px;
  }
  .tile-sheet-body {
    font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0 0 14px;
  }
  .tile-sheet-close {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 36px; padding: 0 14px;
    border: 1px solid #e4e6ea; border-radius: 10px;
    background: #f7f8fa; color: var(--text);
    font-size: 13px; font-weight: 700; cursor: pointer;
  }

  .tabbar {
    height: 72px;
    background: #fffdf8;
    border-top: 1px solid #e4d6c2;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-items: center;
    padding: 0 2px 10px;
  }
  /* Restored warm remake nav (4994d59 .nav-btn) — şık kibar, not loud orange chrome */
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 48px;
    padding: 4px 2px;
    border-radius: 10px;
    color: #8a7764;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .01em;
    text-decoration: none;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
    transition: color .18s ease, background .18s ease;
  }
  .tab:hover {
    color: var(--brown-mid, #5c3a1f);
    background: rgba(232, 220, 200, 0.35);
  }
  .tab:active {
    background: rgba(224, 208, 180, 0.45);
  }
  .tab:focus-visible {
    outline: 1.5px solid rgba(184, 134, 11, 0.5);
    outline-offset: 1px;
  }
  .tab.active {
    color: #e56f1c;
    background: transparent;
  }
  .tab svg {
    width: 20px;
    height: 20px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }

  body.shot, html.shot { background: #f7f8fa !important; width: 390px; height: 844px; overflow: hidden; }
  body.shot { display: block; margin: 0; padding: 0; }
  body.shot .phone { box-shadow: none !important; border-radius: 0 !important; width: 390px; height: 844px; }
  body.shot .phone-notch, body.shot .home-indicator { display: none !important; }

  .screen { position: relative; }
  .mascot-bee {
    position: absolute; z-index: 10;
    left: 0; top: 0;
    width: 48px; height: 48px; pointer-events: none;
    transform: translate(-50%, -50%) scale(.55);
    opacity: 0;
    transition:
      left 1.45s cubic-bezier(.45,.05,.25,1),
      top 1.45s cubic-bezier(.35,.8,.25,1),
      transform .55s cubic-bezier(.34,1.4,.64,1),
      opacity .4s ease;
    will-change: left, top, transform, opacity;
  }
  .mascot-bee.is-off {
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none;
  }
  .mascot-bee.is-shown {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .mascot-bee.is-flying {
    transform: translate(-50%, -50%) scale(.85);
  }
  .mascot-bee.is-entering {
    transform: translate(-50%, -50%) scale(.35);
    opacity: 0;
    transition:
      left 1.1s cubic-bezier(.4,.05,.2,1),
      top 1.1s cubic-bezier(.4,.05,.2,1),
      transform .9s ease,
      opacity .7s ease .25s;
  }
  .mascot-bee img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; opacity: 0;
    transition: opacity .35s ease;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
    /* Idle hover: gentle bob + tilt */
    animation: bee-hover 1.6s ease-in-out infinite;
  }
  .mascot-bee img.is-on { opacity: 1; }
  /* In flight: faster buzz + wing-like tilt */
  .mascot-bee.is-flying img.is-on {
    animation: bee-buzz 0.22s ease-in-out infinite;
  }
  .mascot-bee.is-entering img.is-on {
    animation: bee-buzz 0.16s linear infinite;
  }
  @keyframes bee-hover {
    0%, 100% { transform: translate(0, 0) rotate(-5deg); }
    35% { transform: translate(1px, -4px) rotate(4deg); }
    70% { transform: translate(-1px, -2px) rotate(-3deg); }
  }
  @keyframes bee-buzz {
    0%, 100% { transform: translate(0, 0) rotate(-10deg) scale(1); }
    25% { transform: translate(1.5px, -3px) rotate(8deg) scale(1.03); }
    50% { transform: translate(-1px, 1px) rotate(-6deg) scale(0.98); }
    75% { transform: translate(1px, -2px) rotate(9deg) scale(1.02); }
  }
</style>

<script>
(function () {
  if (location.search.indexOf('shot=1') !== -1) {
    document.documentElement.classList.add('shot');
    document.body.classList.add('shot');
  }

  // Status-bar clock: live local HH:MM (updates every second)
  (function liveStatusClock() {
    var el = document.getElementById('statusClock');
    if (!el) return;
    function pad2(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var now = new Date();
      el.textContent = now.getHours() + ':' + pad2(now.getMinutes());
    }
    tick();
    setInterval(tick, 1000);
  })();

  // Weekday strip: live Mon–Sun dates for the current calendar week
  (function fillForecastDates() {
    var root = document.getElementById('forecast');
    if (!root) return;
    var days = root.querySelectorAll('.day');
    if (!days.length) return;
    var labels = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt']; // JS getDay() order
    var trShort = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz']; // Mon→Sun display
    var now = new Date();
    var todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    // Monday of this week (Mon=0 … Sun=6 in trShort)
    var monday = new Date(todayY, todayM, todayD);
    var dow = monday.getDay(); // 0 Sun … 6 Sat
    var offsetToMon = dow === 0 ? -6 : 1 - dow;
    monday.setDate(monday.getDate() + offsetToMon);
    for (var i = 0; i < days.length && i < 7; i++) {
      var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
      var nameEl = days[i].querySelector('.day-name');
      var dateEl = days[i].querySelector('.day-date');
      if (nameEl) nameEl.textContent = trShort[i];
      if (dateEl) dateEl.textContent = String(d.getDate());
      var isToday = d.getFullYear() === todayY && d.getMonth() === todayM && d.getDate() === todayD;
      days[i].classList.toggle('is-today', isToday);
      days[i].setAttribute('aria-label', trShort[i] + ' ' + d.getDate());
    }
    // silence unused (kept for clarity of JS day index)
    void labels;
  })();

  // Weather-card title = active arılık (10s cycle). °C/forecast follow lat/lon.
  // Lock pauses auto-cycle only; prev/next arrows always change location (and update lock target).
  // Hardal band: brand + lock text only (no pin/location).
  (function liveWeather() {
    var DEMO_APIARIES = [
      { id: 'a1', label: 'Kayaköy', lat: 39.92, lon: 41.27 },
      { id: 'a2', label: 'Tortum', lat: 40.61, lon: 41.66 },
      { id: 'a3', label: 'Palandöken', lat: 40.45, lon: 41.4 }
    ];
    var WEATHER_REFRESH_MS = 15 * 60 * 1000;
    var CYCLE_MS = 10000;
    var LOCK_KEY = 'superari.ana.arilikLock';
    var SELECTED_KEY = 'superari.ana.selectedApiary';
    var MUAYENE_DISMISS_KEY = 'superari.ana.muayeneHintDismiss';
    var tempEl = document.getElementById('weatherTemp');
    var weatherLocLabel = document.getElementById('weatherLocLabel');
    var lockBtn = document.getElementById('arilikLockBtn');
    var prevBtn = document.getElementById('arilikPrev');
    var nextBtn = document.getElementById('arilikNext');
    var muayeneEl = document.getElementById('muayeneHint');
    var muayeneText = document.getElementById('muayeneHintText');
    var muayeneOk = document.getElementById('muayeneHintOk');
    var apiaries = DEMO_APIARIES.slice();
    var idx = 0;
    var cycleTimer = null;
    var weatherCache = {};
    var locked = false;
    var activeMuayeneTipDate = null;

    if (tempEl) {
      tempEl.removeAttribute('data-locked');
      tempEl.removeAttribute('data-temp');
    }

    function roundC(v) {
      var n = Math.round(Number(v));
      return isFinite(n) ? n : null;
    }

    function setTemp(c) {
      if (!tempEl) return;
      var n = roundC(c);
      if (n == null) return;
      tempEl.textContent = n + '°';
    }

    function setPlace(name, withFade) {
      if (!name || !weatherLocLabel) return;
      function apply() {
        weatherLocLabel.textContent = name;
        weatherLocLabel.setAttribute('title', name);
        weatherLocLabel.classList.remove('is-fading');
      }
      if (withFade) {
        weatherLocLabel.classList.add('is-fading');
        setTimeout(apply, 320);
      } else {
        apply();
      }
    }

    function updateForecastDaily(daily) {
      if (!daily || !daily.time) return;
      var root = document.getElementById('forecast');
      if (!root) return;
      var days = root.querySelectorAll('.day');
      var now = new Date();
      var monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var dow = monday.getDay();
      monday.setDate(monday.getDate() + (dow === 0 ? -6 : 1 - dow));
      var byDate = {};
      for (var di = 0; di < daily.time.length; di++) {
        byDate[daily.time[di]] = di;
      }
      for (var i = 0; i < days.length && i < 7; i++) {
        var d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        var key =
          d.getFullYear() +
          '-' +
          String(d.getMonth() + 1).padStart(2, '0') +
          '-' +
          String(d.getDate()).padStart(2, '0');
        var mi = byDate[key];
        if (mi == null) continue;
        var hiEl = days[i].querySelector('.day-hi');
        var loEl = days[i].querySelector('.day-lo');
        var hi = roundC(daily.temperature_2m_max && daily.temperature_2m_max[mi]);
        var lo = roundC(daily.temperature_2m_min && daily.temperature_2m_min[mi]);
        if (hiEl && hi != null) hiEl.textContent = hi + '°';
        if (loEl && lo != null) loEl.textContent = lo + '°';
      }
    }

    function fetchMeteo(lat, lon) {
      var url =
        'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
        '&longitude=' + lon +
        '&current=temperature_2m,weather_code' +
        '&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum' +
        '&timezone=auto&forecast_days=7';
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error('meteo_' + r.status);
        return r.json();
      });
    }

    function persistWeatherSnapshot(a, meteo) {
      if (!a || !meteo || !window.SuperAriHava) return;
      try {
        window.SuperAriHava.recordFromMeteo({
          apiaryId: a.id,
          label: a.label,
          lat: a.lat,
          lon: a.lon,
          meteo: meteo
        });
      } catch (e) { /* ignore storage errors */ }
    }

    function readMuayeneDismiss() {
      try {
        var raw = localStorage.getItem(MUAYENE_DISMISS_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function isMuayeneDismissed(tipDate) {
      if (!tipDate) return false;
      var d = readMuayeneDismiss();
      if (!d) return false;
      /* Hide until the tip date changes (next relevant tip) */
      return d.tipDate === tipDate;
    }

    function dismissMuayeneHint() {
      if (!muayeneEl) return;
      muayeneEl.hidden = true;
      if (!activeMuayeneTipDate) return;
      try {
        localStorage.setItem(
          MUAYENE_DISMISS_KEY,
          JSON.stringify({
            tipDate: activeMuayeneTipDate,
            dismissedAt: new Date().toISOString()
          })
        );
      } catch (e) { /* ignore */ }
    }

    function updateMuayeneHint(daily) {
      if (!muayeneEl) return;
      if (!window.SuperAriHava || !daily) {
        muayeneEl.hidden = true;
        activeMuayeneTipDate = null;
        if (muayeneText) muayeneText.textContent = '';
        return;
      }
      var best = window.SuperAriHava.bestInspectionDay(daily);
      if (!best) {
        muayeneEl.hidden = true;
        activeMuayeneTipDate = null;
        if (muayeneText) muayeneText.textContent = '';
        return;
      }
      activeMuayeneTipDate = best.date;
      if (isMuayeneDismissed(best.date)) {
        muayeneEl.hidden = true;
        return;
      }
      muayeneEl.hidden = false;
      if (muayeneText) {
        muayeneText.textContent = 'Uygun muayene: ' + best.dayLabel + ' — ' + best.reason;
      } else {
        muayeneEl.textContent = 'Uygun muayene: ' + best.dayLabel + ' — ' + best.reason;
      }
    }

    if (muayeneOk) {
      muayeneOk.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        dismissMuayeneHint();
      });
    }
    if (muayeneEl) {
      muayeneEl.addEventListener('click', function (e) {
        if (e.target === muayeneOk) return;
        dismissMuayeneHint();
      });
    }

    function writeSelectedApiary() {
      var a = currentApiary();
      if (!a) return;
      try {
        localStorage.setItem(
          SELECTED_KEY,
          JSON.stringify({ id: a.id, label: a.label, at: Date.now() })
        );
      } catch (e) { /* ignore */ }
    }

    function openHavaRaporu() {
      var a = currentApiary();
      writeSelectedApiary();
      var q = a && a.id ? ('?apiary=' + encodeURIComponent(a.id)) : '';
      window.location.href = 'hava-raporu.html' + q;
    }

    if (tempEl) {
      tempEl.addEventListener('click', openHavaRaporu);
      tempEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openHavaRaporu();
        }
      });
    }

    function currentApiary() {
      return apiaries[idx] || apiaries[0] || DEMO_APIARIES[0];
    }

    function readLock() {
      try {
        var raw = localStorage.getItem(LOCK_KEY);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        return parsed && parsed.locked ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function writeLock() {
      try {
        if (!locked) {
          localStorage.removeItem(LOCK_KEY);
          return;
        }
        var a = currentApiary();
        localStorage.setItem(LOCK_KEY, JSON.stringify({
          locked: true,
          id: a && a.id ? a.id : null,
          idx: idx
        }));
      } catch (e) { /* ignore */ }
    }

    function syncLockBtn() {
      if (!lockBtn) return;
      lockBtn.setAttribute('aria-pressed', locked ? 'true' : 'false');
      lockBtn.textContent = locked ? 'Sabitlendi' : 'Konumu sabitle';
      lockBtn.setAttribute(
        'aria-label',
        locked ? 'Sabitlemeyi kaldır — otomatik döngüyü sürdür' : 'Konumu sabitle — otomatik döngüyü durdur'
      );
      lockBtn.setAttribute(
        'title',
        locked

      if (!a) return;

      if (!force && cached && Date.now() - cached.at < WEATHER_REFRESH_MS) {
        if (cached.temp != null) setTemp(cached.temp);
        if (cached.daily) {
          updateForecastDaily(cached.daily);
          updateMuayeneHint(cached.daily);
        }
        if (cached.meteo) persistWeatherSnapshot(a, cached.meteo);
        return;
      }
      var reqId = a.id;
      fetchMeteo(a.lat, a.lon)
        .then(function (meteo) {
          // Ignore stale responses if user rotated / locked onto another arılık
          if (currentApiary() && currentApiary().id !== reqId) return;
          var temp =
            meteo && meteo.current && meteo.current.temperature_2m != null

        var label =
          row.place || row.shortLabel || row.label || row.etiket || row.name || row.konumEtiket || null;
        if (!label) continue;
        var lat = Number(row.lat != null ? row.lat : row.latitude);
        var lon = Number(row.lon != null ? row.lon : row.longitude);

      podium.classList.remove('is-hidden');
      var name = setBreed(startBreed == null ? beeIdx : startBreed);

      var order = shuffle([0,1,2,3,4,5,6,7,8]);
      var tourStops = order.slice(0, 5);
      var enterTile = tileParam != null
        ? (parseInt(tileParam, 10) || 0)
        : order[5];

      var t = 0;
      later(function () {
        if (!beesEnabled) return;
        if (podiumName) {
          podiumName.textContent = name;
          podiumName.classList.add('is-on');
        }
        podium.classList.add('is-ready');
      }, t);
      t += 900;

      // Emerge on Arılık Kuzey / °C row
      later(function () {
        if (!beesEnabled) return;
        var pt = exitPoint();
        beeRoot.style.transition = 'none';
        placeAt(pt);
        beeRoot.classList.remove('is-flying', 'is-entering');
        void beeRoot.offsetWidth;
        beeRoot.style.transition = '';
        beeRoot.classList.add('is-shown');
      }, t);
      t += 1100;

      // Tour: approach doors (not mid-hive emblems)
      tourStops.forEach(function (tileI, n) {
        var hop = n === 0 ? 1600 : 1400;
        later(function () {
          if (!beesEnabled) return;
          beeRoot.classList.add('is-flying');
          beeRoot.classList.remove('is-entering');
          flyTo(hivePoint(tileI, 'hover'), hop);
        }, t);
        t += hop;
      });

      // Final: fly into chosen hive door (kapı)
      later(function () {
        if (!beesEnabled) return;
        beeRoot.classList.add('is-flying');
        flyTo(hivePoint(enterTile, 'door'), 1300, { flat: true });
      }, t);
      t += 1300;

      later(function () {
        if (!beesEnabled) return;
        beeRoot.classList.remove('is-flying');
        beeRoot.classList.add('is-entering');
        // Nudge into the entrance opening while shrinking
        var door = hivePoint(enterTile, 'door');
        placeAt({ x: door.x, y: door.y - 5 });
      }, t);
      t += 1100;

      if (!freeze) {
        later(function () {
          if (!beesEnabled) return;
          runCycle((beeIdx + 1) % beeImgs.length);
        }, t);
      }
    }

    function setBeesEnabled(on) {
      beesEnabled = !!on;
      writeBeesOn(beesEnabled);
      syncToggleUi();
      if (beesEnabled) runCycle(beeIdx);
      else stopBees();
    }

    if (beeToggle) {
      beeToggle.addEventListener('click', function () {
        setBeesEnabled(!beesEnabled);
      });
    }
    syncToggleUi();

    function boot() {
      if (beesEnabled) runCycle(beeIdx);
      else stopBees();
    }
    requestAnimationFrame(function () { requestAnimationFrame(boot); });
    later(boot, 100);

    window.addEventListener('resize', function () {
      if (!beesEnabled) return;
      if (beeRoot.classList.contains('is-shown') && !beeRoot.classList.contains('is-entering') && !beeRoot.classList.contains('is-flying')) {
        placeAt(exitPoint());
      }
    });
  }

})();
</script>
</body>
</html>
