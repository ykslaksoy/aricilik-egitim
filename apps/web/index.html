<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
  <script>
    (function () {
      try {
        var tip = localStorage.getItem('superari.hesapTipi');
        if (tip) {
          var s = String(tip).toLowerCase()
            .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
            .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
          if (/yonetici|admin/.test(s)) { location.replace('yonetici.html'); return; }
          if (/isci|worker/.test(s)) { location.replace('isci.html'); return; }
          location.replace('ana.html');
          return;
        }
      } catch (e) { /* ignore */ }
      location.replace('giris.html');
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="brand-badge">🐝</div>
      <div>
        <h1>SüperArı</h1>
        <p>Panele yönlendiriliyorsunuz…</p>
      </div>
    </div>
    <div class="card"><a class="btn" href="giris.html">Giriş sayfasına git</a></div>
  </main>
</body>
</html>
