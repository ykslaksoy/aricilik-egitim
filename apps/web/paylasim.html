<!DOCTYPE html>
<html lang="tr" class="sa-duz">
<head>
<link rel="stylesheet" href="sa-early.css?v=koloni-297">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>SüperArı · Paylaşılan kovan</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #1f1a16; }
  .wrap { max-width: 430px; margin: 0 auto; padding: 14px 14px calc(24px + env(safe-area-inset-bottom)); }
  .ro-banner { background: #fff4e0; border: 1px solid #ffe0a8; border-radius: 12px; padding: 10px 12px; font-size: .84rem; margin-bottom: 12px; }
  .ro-banner b { display: block; font-size: .9rem; margin-bottom: 2px; }
  .card { background: #fff; border: 1px solid #e6e8ec; border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  h1 { margin: 0 0 4px; font-size: 1.25rem; }
  .sub { color: #6b635a; font-size: .86rem; margin: 0 0 10px; }
  .pill { display: inline-block; padding: 5px 10px; border-radius: 999px; background: #e8f7ec; color: #2f9e44; font-size: .78rem; font-weight: 800; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .cell { background: #f0f2f5; border-radius: 12px; padding: 10px 6px; text-align: center; }
  .cell b { display: block; font-size: 1rem; }
  .cell span { font-size: .72rem; color: #6b635a; font-weight: 600; }
  .err { text-align: center; padding: 40px 12px; color: #c92a2a; font-weight: 700; }
  .wx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .wx div { background: #eef0f3; border-radius: 10px; padding: 6px 4px; text-align: center; font-size: .72rem; font-weight: 700; }
</style>
</head>
<body data-tabbar="fixed">
<main class="wrap" id="main">
  <p class="sub" style="margin:0 0 8px">Yükleniyor…</p>
</main>
<script src="ozellik.js?v=koloni-297"></script>
<script src="paylasim-baglanti.js?v=koloni-297"></script>
<script>
(function () {
  var main = document.getElementById('main');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var tok = null;
  try { tok = new URLSearchParams(location.search).get('t'); } catch (e) { /* ignore */ }
  if (!tok) {
    main.innerHTML = '<p class="err">Bağlantı kodu eksik.</p>';
    return;
  }
  SuperAriPaylasim.oku(tok).then(function (row) {
    if (!row || !row.snapshot) {
      main.innerHTML = '<p class="err">Bağlantı geçersiz, süresi dolmuş veya paylaşım özelliği kapalı.</p>';
      return;
    }
    var s = row.snapshot;
    var bitis = row.bitis ? new Date(row.bitis).toLocaleString('tr-TR') : '—';
    var ok = s.ok || {};
    var wx = s.weather || {};
    var wkg = s.weightKg != null ? (Number(s.weightKg).toFixed(1) + ' kg') : 'Veri yok';
    var dkg = s.weightDelta != null ? ((s.weightDelta >= 0 ? '+' : '') + Number(s.weightDelta).toFixed(2) + ' kg') : '';
    main.innerHTML =
      '<div class="ro-banner"><b>Salt okunur paylaşım</b>Bu sayfada düzenleme yapılamaz. Bitiş: ' + esc(bitis) + '</div>' +
      '<section class="card">' +
      '<h1>' + esc(s.hiveName || row.hiveName || 'Kovan') + '</h1>' +
      '<p class="sub">' + esc(s.apiaryName || row.apiaryName || '') + '</p>' +
      (ok.label ? '<span class="pill">' + esc(ok.label) + '</span>' : '') +
      (s.colonyState === 'sonuk' ? '<p class="sub" style="margin-top:8px;color:#c92a2a;font-weight:700">Sönük kovan</p>' : '') +
      '<div class="grid3">' +
      '<div class="cell"><b>' + esc(wkg) + '</b><span>Tartı</span></div>' +
      '<div class="cell"><b>' + esc(dkg || '—') + '</b><span>Değişim</span></div>' +
      '<div class="cell"><b>' + esc(s.queenYear || '—') + '</b><span>Ana yılı</span></div>' +
      '</div>' +
      '<div class="wx" aria-label="Hava">' +
      '<div>☀️ ' + esc(wx.temp) + '°</div><div>💧 %' + esc(wx.humid) + '</div><div>💨 ' + esc(wx.wind) + '</div><div>🧭 ' + esc(wx.dir) + '</div>' +
      '</div></section>' +
      '<p class="sub" style="text-align:center;margin-top:12px">SüperArı · paylaşım bağlantısı</p>';
  }).catch(function () {
    main.innerHTML = '<p class="err">Bağlantı okunamadı.</p>';
  });
})();
</script>
</body>
</html>
