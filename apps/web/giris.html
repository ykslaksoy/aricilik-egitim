<!DOCTYPE html>
<html lang="tr">
<head>
<link rel="stylesheet" href="sa-early.css?v=koloni-264">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Giriş · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
</head>
<body class="auth-body">
<a href="ana.html" id="saBack" class="sa-back" aria-label="Geri" onclick="if (history.length > 1) { history.back(); return false; }" style="position:absolute;top:12px;left:12px;font-weight:700;color:#5c3a1f;text-decoration:none;padding:6px 10px;border-radius:10px;background:#fff7e0;">&#8249; Geri</a>
  <div class="auth-phone">
    <div class="hardal-rail" aria-hidden="true"></div>
    <div class="brand" style="margin-top:1.35rem;">
      <div class="brand-badge">🐝</div>
      <div>
        <h1>SüperArı</h1>
        <p>Arıcılık yönetim paneli</p>
      </div>
    </div>

    <section class="auth-card">
      <h2>Giriş yap</h2>
      <p class="auth-lead">E-posta ve şifrenizle devam edin. Doğrulanmış hesap varsa ona göre yönlendirilirsiniz.</p>
      <p class="auth-lead muted">Demo: demo@superari.com / demo1234</p>

      <form class="stack" data-login="1" data-demo="ana.html" id="giris-form">
        <label>E-posta
          <input type="email" name="email" autocomplete="username" placeholder="ornek@mail.com" required />
        </label>
        <label>Şifre
          <div class="field-row">
            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="toggle" data-toggle-password="password" aria-label="Şifreyi göster" aria-pressed="false">Göster</button>
          </div>
        </label>
        <button class="btn" type="submit">Giriş Yap</button>
      </form>
      <p style="text-align:center;margin:10px 0 0;"><a href="hesap.html?unuttum=1" id="lnkUnuttum" style="color:#8a5a1f;font-weight:700;">Şifremi unuttum</a></p>
      <div class="auth-footer-links">
        <a href="kayit.html">Hesap oluştur</a>
        <a href="kurulum.html">Kurulum</a>
      </div>
    </section>
  </div>
  <script src="panels.js"></script>
  <script>
    (function () {
      var H = window.SuperAriHesap;
      var M = window.Membership;
      var UNUT = /[?&]unuttum=1/.test(location.search);
      if (M && M.me && !UNUT) {
        M.me().then(function (me) {
          if (me && me.ok) {
            window.location.href = me.panel || (H ? H.homeFor('arici') : 'ana.html');
          }
        });
      }
      if (!H) return;
      var acc = H.getAccount();
      if (acc && acc.email) {
        var em = document.querySelector('input[name="email"]');
        if (em && !em.value) em.value = acc.email;
      }
    })();
  </script>
<script src="pwa.js?v=koloni-264"></script>
<script src="sifre-goz.js?v=koloni-264"></script>
<script src="form-uyari.js?v=koloni-264"></script>
</body>
</html>
