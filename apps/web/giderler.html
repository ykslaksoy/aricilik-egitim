<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Giderler</title>
<style>
  :root {
    --bg: #f0f1f3;
    --card-border: #e4e6ea;
    --brown: #4a2f1a;
    --text: #2c241c;
    --muted: #6b635a;
    --phone-w: 390px;
    --phone-h: 844px;
    --orange: #f08c00;
    --hardal: #d4a017;
    --hardal-hi: #f0c43a;
    --hardal-lo: #b8860b;
    --hardal-soft: #f4e3b0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    min-height: 100vh; padding: 20px 0 28px;
    overflow-x: hidden; overflow-y: auto;
  }
  .phone {
    width: var(--phone-w); height: var(--phone-h);
    background: #f7f8fa; border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 10px #111, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,.55);
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 28px; background: #111; border-radius: 18px; z-index: 50;
  }
  .status-bar {
    height: 48px; padding: 16px 22px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; color: #111; background: #f7f8fa;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  .screen {
    height: calc(var(--phone-h) - 48px - 72px);
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; background: var(--bg);
    padding: 0 14px 88px; position: relative;
  }
  .brand-strip {
    flex: 0 0 auto; min-height: 36px;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 10px; margin-bottom: 10px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid #e0c56a; border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    color: var(--brown); font-size: 13px; font-weight: 800; letter-spacing: .03em;
  }
  .brand-strip::before {
    content: ""; flex: 0 0 4px; align-self: stretch; margin: -2px 0; border-radius: 3px;
    background: linear-gradient(180deg, var(--hardal-hi), var(--hardal) 40%, var(--hardal-lo));
  }
  .page-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .page-head h1 {
    font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em;
  }
  .page-head p { margin-top: 2px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .nav-chips { display: flex; gap: 6px; flex-shrink: 0; }
  .back-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 8px 11px; border-radius: 10px;
    background: #fff; border: 1px solid var(--card-border);
    color: var(--text); font-size: 12px; font-weight: 700; text-decoration: none;
  }
  .total-row {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 14px; padding: 0 2px;
  }
  .total-row .label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .total-row .amount {
    font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -.03em;
  }

  .chart-block {
    background: #fff; border: 1px solid var(--card-border); border-radius: 18px;
    padding: 18px 14px 14px; margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(40, 30, 10, .05);
  }
  .chart-wrap {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .pie-svg { width: 168px; height: 168px; }
  .pie-center-label {
    font-size: 11px; font-weight: 600; fill: var(--muted);
  }
  .pie-center-value {
    font-size: 15px; font-weight: 800; fill: var(--text);
  }
  .legend { display: grid; gap: 8px; }
  .legend-row {
    display: grid; grid-template-columns: 12px 1fr auto auto;
    align-items: center; gap: 8px 10px;
    font-size: 13px;
  }
  .swatch {
    width: 12px; height: 12px; border-radius: 4px;
  }
  .legend-name { font-weight: 700; color: var(--text); }
  .legend-amt { font-weight: 700; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .legend-pct { font-weight: 600; color: var(--muted); text-align: right; min-width: 40px; font-variant-numeric: tabular-nums; }

  .section-title {
    font-size: 14px; font-weight: 800; color: var(--text);
    margin: 4px 2px 10px;
  }
  .exp-list { display: grid; gap: 8px; }
  .exp-item {
    display: grid; grid-template-columns: 10px 1fr auto;
    gap: 10px; align-items: start;
    padding: 12px 12px; border-radius: 14px;
    background: #fff; border: 1px solid var(--card-border);
  }
  .exp-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
  .exp-item h3 { font-size: 13px; font-weight: 750; color: var(--text); line-height: 1.3; }
  .exp-item .meta { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .exp-item .amt {
    font-size: 13px; font-weight: 800; color: var(--text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  .fab {
    position: absolute; right: 18px; bottom: 88px; z-index: 40;
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 48px; padding: 0 18px 0 14px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(145deg, var(--hardal-hi), var(--hardal) 45%, var(--hardal-lo));
    color: #3b2b00; font-size: 14px; font-weight: 800;
    box-shadow: 0 8px 22px rgba(184, 134, 11, .45);
  }
  .fab:active { transform: scale(.97); }
  .fab-plus { font-size: 20px; line-height: 1; font-weight: 700; }

  .sheet {
    position: absolute; inset: 0; z-index: 70;
    background: rgba(20, 16, 10, .45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .sheet.is-open { opacity: 1; pointer-events: auto; }
  .sheet-card {
    width: 100%; background: #fff; border-radius: 22px 22px 0 0;
    padding: 18px 16px 28px;
    transform: translateY(24px); transition: transform .22s ease;
    max-height: 78%; overflow-y: auto;
  }
  .sheet.is-open .sheet-card { transform: translateY(0); }
  .sheet-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 14px; color: var(--text); }
  .sheet-card label {
    display: grid; gap: 5px; margin-bottom: 12px;
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .sheet-card input, .sheet-card select {
    width: 100%; border: 1px solid var(--card-border); border-radius: 12px;
    padding: 11px 12px; font-size: 15px; font-weight: 600; color: var(--text);
    background: #f7f8fa; font-family: inherit;
  }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .btn {
    min-height: 44px; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 14px; font-weight: 800; font-family: inherit;
  }
  .btn.cancel { background: #f0f1f3; color: var(--text); }
  .btn.save {
    background: linear-gradient(145deg, var(--hardal-hi), var(--hardal));
    color: #3b2b00;
  }

  .tabbar {
    height: 72px; background: #fff; border-top: 1px solid #e6e8ec;
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    padding: 0 4px 10px;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #8b8680; font-size: 10px; font-weight: 600;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .tab.active { color: var(--orange); }
  .tab svg { width: 22px; height: 22px; }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: #222; border-radius: 4px; z-index: 60;
  }
  @media (max-width: 420px) {
    body { padding: 0; background: #f7f8fa; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .phone-notch, .home-indicator { display: none; }
    .screen { height: calc(100dvh - 48px - 72px); }
    .fab { bottom: 84px; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Giderler</h1>
        <p>Kategori dağılımı</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>

    <div class="total-row">
      <span class="label">Bu dönem toplam</span>
      <span class="amount" id="totalAmount">₺0</span>
    </div>

    <section class="chart-block" aria-label="Kategori pasta grafiği">
      <div class="chart-wrap">
        <svg class="pie-svg" id="pieSvg" viewBox="0 0 120 120" aria-hidden="true"></svg>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <h2 class="section-title">Kayıtlar</h2>
    <div class="exp-list" id="expList"></div>
  </div>

  <button type="button" class="fab" id="fabAdd" aria-label="Gider ekle">
    <span class="fab-plus">+</span> Gider ekle
  </button>

  <div class="sheet" id="addSheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Yeni gider</h2>
      <form id="addForm">
        <label>Başlık
          <input name="title" required maxlength="80" placeholder="Örn. Şeker şurubu" />
        </label>
        <label>Kategori
          <select name="category" required></select>
        </label>
        <label>Tutar (₺)
          <input name="amount" type="number" inputmode="decimal" min="1" step="1" required placeholder="0" />
        </label>
        <label>Tarih
          <input name="date" type="date" required />
        </label>
        <div class="sheet-actions">
          <button type="button" class="btn cancel" id="sheetCancel">Vazgeç</button>
          <button type="submit" class="btn save">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler
    </a>
    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script>
(function () {
  var STORAGE_KEY = 'superari.giderler.v1';
  var CATEGORIES = [
    { id: 'yem', label: 'Yem', color: '#d4a017' },
    { id: 'ilac', label: 'İlaç', color: '#e03131' },
    { id: 'ekipman', label: 'Ekipman', color: '#1c7ed6' },
    { id: 'nakliye', label: 'Nakliye', color: '#2f9e44' },
    { id: 'diger', label: 'Diğer', color: '#7048e8' }
  ];
  var SEED = [
    { id: 'g1', title: 'Şeker şurubu (25 kg)', category: 'yem', amount: 2800, date: '2026-09-02' },
    { id: 'g2', title: 'Polen ikamesi', category: 'yem', amount: 1400, date: '2026-08-28' },
    { id: 'g3', title: 'Varroa damlatma', category: 'ilac', amount: 1680, date: '2026-09-05' },
    { id: 'g4', title: 'Organik asit seti', category: 'ilac', amount: 1200, date: '2026-08-20' },
    { id: 'g5', title: 'Çerçeve teli + mum', category: 'ekipman', amount: 1450, date: '2026-09-01' },
    { id: 'g6', title: 'Maske / eldiven', category: 'ekipman', amount: 950, date: '2026-08-15' },
    { id: 'g7', title: 'Yayla taşıma', category: 'nakliye', amount: 1560, date: '2026-08-10' },
    { id: 'g8', title: 'Arılık bakım malzemesi', category: 'diger', amount: 960, date: '2026-09-08' }
  ];

  function catById(id) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].id === id) return CATEGORIES[i];
    }
    return CATEGORIES[CATEGORIES.length - 1];
  }

  function loadExpenses() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) { /* ignore */ }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED));
    return SEED.slice();
  }

  function saveExpenses(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function formatTRY(n) {
    var v = Math.round(Number(n) || 0);
    return '₺' + v.toLocaleString('tr-TR');
  }

  function formatDate(iso) {
    if (!iso) return '—';
    var p = iso.split('-');
    if (p.length !== 3) return iso;
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  function polar(cx, cy, r, angleDeg) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function describeArc(cx, cy, r, startAngle, endAngle) {
    if (endAngle - startAngle >= 359.99) {
      return 'M ' + cx + ' ' + (cy - r) +
        ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx - 0.01) + ' ' + (cy - r) +
        ' A ' + r + ' ' + r + ' 0 1 1 ' + cx + ' ' + (cy - r) + ' Z';
    }
    var start = polar(cx, cy, r, endAngle);
    var end = polar(cx, cy, r, startAngle);
    var large = endAngle - startAngle > 180 ? 1 : 0;
    return [
      'M', cx, cy,
      'L', end.x, end.y,
      'A', r, r, 0, large, 1, start.x, start.y,
      'Z'
    ].join(' ');
  }

  var expenses = loadExpenses();
  var pieSvg = document.getElementById('pieSvg');
  var legendEl = document.getElementById('legend');
  var listEl = document.getElementById('expList');
  var totalEl = document.getElementById('totalAmount');
  var sheet = document.getElementById('addSheet');
  var form = document.getElementById('addForm');
  var catSelect = form.elements.category;

  CATEGORIES.forEach(function (c) {
    var opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.label;
    catSelect.appendChild(opt);
  });

  function totalsByCategory(list) {
    var map = {};
    CATEGORIES.forEach(function (c) { map[c.id] = 0; });
    list.forEach(function (e) {
      var id = e.category;
      if (map[id] == null) map[id] = 0;
      map[id] += Number(e.amount) || 0;
    });
    return map;
  }

  function render() {
    var byCat = totalsByCategory(expenses);
    var total = 0;
    CATEGORIES.forEach(function (c) { total += byCat[c.id]; });
    totalEl.textContent = formatTRY(total);

    var cx = 60, cy = 60, r = 48, ir = 28;
    var angle = 0;
    var slices = '';
    CATEGORIES.forEach(function (c) {
      var amt = byCat[c.id];
      if (!amt || total <= 0) return;
      var sweep = (amt / total) * 360;
      var end = angle + sweep;
      slices += '<path d="' + describeArc(cx, cy, r, angle, end) + '" fill="' + c.color + '"/>';
      angle = end;
    });
    if (!slices) {
      slices = '<circle cx="60" cy="60" r="48" fill="#e4e6ea"/>';
    }
    pieSvg.innerHTML =
      slices +
      '<circle cx="60" cy="60" r="' + ir + '" fill="#fff"/>' +
      '<text class="pie-center-label" x="60" y="56" text-anchor="middle">Toplam</text>' +
      '<text class="pie-center-value" x="60" y="72" text-anchor="middle">' + formatTRY(total) + '</text>';

    legendEl.innerHTML = CATEGORIES.map(function (c) {
      var amt = byCat[c.id];
      var pct = total > 0 ? Math.round((amt / total) * 100) : 0;
      return (
        '<div class="legend-row">' +
          '<span class="swatch" style="background:' + c.color + '"></span>' +
          '<span class="legend-name">' + c.label + '</span>' +
          '<span class="legend-amt">' + formatTRY(amt) + '</span>' +
          '<span class="legend-pct">' + pct + '%</span>' +
        '</div>'
      );
    }).join('');

    var sorted = expenses.slice().sort(function (a, b) {
      return String(b.date).localeCompare(String(a.date));
    });
    listEl.innerHTML = sorted.map(function (e) {
      var cat = catById(e.category);
      return (
        '<article class="exp-item">' +
          '<span class="exp-dot" style="background:' + cat.color + '"></span>' +
          '<div>' +
            '<h3>' + e.title + '</h3>' +
            '<div class="meta">' + cat.label + ' · ' + formatDate(e.date) + '</div>' +
          '</div>' +
          '<div class="amt">' + formatTRY(e.amount) + '</div>' +
        '</article>'
      );
    }).join('') || '<p style="color:var(--muted);font-size:13px;padding:8px 2px;">Henüz gider yok.</p>';
  }

  function openSheet() {
    sheet.hidden = false;
    var today = new Date();
    var iso = today.getFullYear() + '-' +
      String(today.getMonth() + 1).padStart(2, '0') + '-' +
      String(today.getDate()).padStart(2, '0');
    form.reset();
    form.elements.date.value = iso;
    form.elements.category.value = 'yem';
    requestAnimationFrame(function () { sheet.classList.add('is-open'); });
    setTimeout(function () { form.elements.title.focus(); }, 220);
  }
  function closeSheet() {
    sheet.classList.remove('is-open');
    setTimeout(function () { sheet.hidden = true; }, 220);
  }

  document.getElementById('fabAdd').addEventListener('click', openSheet);
  document.getElementById('sheetCancel').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) {
    if (e.target === sheet) closeSheet();
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var title = String(form.elements.title.value || '').trim();
    var category = form.elements.category.value;
    var amount = Number(form.elements.amount.value);
    var date = form.elements.date.value;
    if (!title || !(amount > 0) || !date) return;
    expenses.push({
      id: 'g' + Date.now(),
      title: title,
      category: category,
      amount: amount,
      date: date
    });
    saveExpenses(expenses);
    closeSheet();
    render();
  });

  render();

  var clock = document.getElementById('clock');
  function tick() {
    var d = new Date();
    clock.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
