<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Kamera</title>
<link rel="stylesheet" href="rapor-common.css" />
<style>
  .cam-select {
    width: 100%; margin-bottom: 12px; padding: 10px 12px; border-radius: 12px;
    border: 1.5px solid var(--card-border); font: inherit; font-weight: 700;
    color: var(--brown); background: #fff;
  }
  .viewer {
    position: relative; border-radius: 16px; overflow: hidden;
    border: 1.5px solid #e0c56a;
    background: linear-gradient(165deg, #2a2118 0%, #1a140f 55%, #0e0b08 100%);
    aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
  }
  .viewer-frame {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 35%, rgba(255, 214, 120, .18), transparent 45%),
      radial-gradient(ellipse at 70% 70%, rgba(120, 180, 255, .08), transparent 50%),
      repeating-linear-gradient(0deg, transparent 0 18px, rgba(255,255,255,.03) 18px 19px);
  }
  .viewer-placeholder {
    position: relative; z-index: 1; text-align: center; padding: 16px;
    color: #f3e2c8;
  }
  .viewer-placeholder strong {
    display: block; font-size: 16px; font-weight: 800; margin-bottom: 6px;
  }
  .viewer-placeholder span {
    display: block; font-size: 12px; font-weight: 650; opacity: .85; line-height: 1.4;
  }
  .cam-meta {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
  }
  .cam-pill {
    padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 750;
    border: 1px solid var(--card-border); background: #f7f8fa; color: var(--muted);
  }
  .cam-pill.live {
    background: #fff6df; border-color: #e0c56a; color: var(--brown);
  }
  .cam-list { display: grid; gap: 8px; margin-top: 8px; }
  .cam-card {
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
    padding: 12px 12px; border-radius: 12px; border: 1.5px solid var(--card-border);
    background: #fff; text-decoration: none; color: inherit;
  }
  .cam-card strong { font-size: 13px; font-weight: 800; color: var(--brown); }
  .cam-card span { font-size: 11px; font-weight: 650; color: var(--muted); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
  }
  .dot.on { background: #2b8a3e; }
  .dot.off { background: #c92a2a; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Kamera</h1>
        <p id="pageSub">İzleme</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ana.html">← Ana</a>
        <a class="back-chip" href="cihazlar.html">Cihazlar</a>
      </div>
    </div>

    <section class="card-block">
      <h2>Arılık</h2>
      <label class="meta" for="apiarySelect" style="display:block;margin-bottom:6px">Hangi arılığı izlemek istersiniz?</label>
      <select class="cam-select" id="apiarySelect" aria-label="Arılık seç"></select>

      <div class="viewer" id="viewer" aria-label="Kamera görüntüsü">
        <div class="viewer-frame" aria-hidden="true"></div>
        <div class="viewer-placeholder">
          <strong id="frameTitle">Son kare · demo</strong>
          <span id="frameNote">Canlı yakında. Bağlantı durumu için Cihazlar’a bakın.</span>
        </div>
      </div>
      <div class="cam-meta" id="camMeta"></div>
    </section>

    <section class="card-block">
      <h2>Kameralar</h2>
      <p class="meta" id="camSummary" style="margin-bottom:8px"></p>
      <div class="cam-list" id="camList"></div>
      <p class="hint" style="margin-top:12px">Canlı akış henüz yok · son kare yer tutucu</p>
    </section>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>Ana</a>
    <a class="tab" href="kovanlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>Kovanlar</a>
    <a class="tab" href="uyarilar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>Uyarılar</a>
    <a class="tab" href="gorevler.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Görevler</a>
    <a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js"></script>
<script>
(function () {
  var D = window.SuperAriDemo;
  if (!D) return;
  var params = new URLSearchParams(location.search);
  var sel = document.getElementById('apiarySelect');
  var apiaries = D.loadApiaries ? D.loadApiaries() : [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function camsFor(ap, i) {
    var aid = String(ap.id || ('ap-' + i));
    var name = ap.name || ap.place || ('Arılık ' + (i + 1));
    return [
      {
        id: 'cam-m-' + aid,
        label: 'Merkezi kamera',
        apiaryId: aid,
        apiaryName: name,
        online: (i % 3) !== 2,
        lastMins: 1 + ((i * 5) % 40)
      },
      {
        id: 'cam-k-' + aid,
        label: 'Kovan kamerası',
        apiaryId: aid,
        apiaryName: name,
        online: (i % 4) !== 0,
        lastMins: 5 + ((i * 9) % 90)
      }
    ];
  }

  function relAgo(mins) {
    if (mins < 60) return mins + ' dk önce';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return h + ' sa' + (m ? ' ' + m + ' dk' : '') + ' önce';
  }

  if (!apiaries.length) {
    sel.innerHTML = '<option value="">Arılık yok</option>';
  } else {
    sel.innerHTML = apiaries.map(function (ap, i) {
      var id = String(ap.id || ('ap-' + i));
      var name = ap.name || ap.place || ('Arılık ' + (i + 1));
      return '<option value="' + esc(id) + '">' + esc(name) + '</option>';
    }).join('');
    var want = params.get('apiary');
    if (want) {
      for (var o = 0; o < sel.options.length; o++) {
        if (sel.options[o].value === String(want)) { sel.selectedIndex = o; break; }
      }
    }
  }

  function render() {
    var aid = sel.value;
    var idx = Math.max(0, apiaries.findIndex(function (ap, i) {
      return String(ap.id || ('ap-' + i)) === String(aid);
    }));
    var ap = apiaries[idx] || { name: 'Arılık' };
    var name = ap.name || ap.place || 'Arılık';
    var cams = camsFor(ap, idx);
    var onlineN = cams.filter(function (c) { return c.online; }).length;

    document.getElementById('pageSub').textContent = name + ' · izleme';
    document.getElementById('frameTitle').textContent = name + ' · son kare';
    document.getElementById('frameNote').textContent =
      'Canlı yakında. Demo yer tutucu — bağlantı için Cihazlar.';

    document.getElementById('camMeta').innerHTML =
      '<span class="cam-pill live">Son kare · demo</span>' +
      '<span class="cam-pill">Canlı yakında</span>' +
      '<span class="cam-pill">' + onlineN + '/' + cams.length + ' bağlı</span>';

    document.getElementById('camSummary').textContent =
      cams.length + ' kamera · durum Cihazlar’da da görünür';

    document.getElementById('camList').innerHTML = cams.map(function (c) {
      return '<div class="cam-card">' +
        '<div><strong>' + esc(c.label) + '</strong><br>' +
        '<span>' + (c.online ? 'Bağlı' : 'Çevrimdışı') +
        ' · son veri ' + esc(relAgo(c.lastMins)) + '</span></div>' +
        '<span class="dot ' + (c.online ? 'on' : 'off') + '" title="' +
          (c.online ? 'Bağlı' : 'Çevrimdışı') + '"></span>' +
      '</div>';
    }).join('') +
    '<a class="cam-card" href="cihazlar.html" style="border-color:#e0c56a;background:#fff6df">' +
      '<div><strong>Cihaz bağlantı durumu</strong><br>' +
      '<span>Batarya, son veri ve bağlı/çevrimdışı →</span></div>' +
    '</a>';
  }

  sel.addEventListener('change', render);
  render();
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
