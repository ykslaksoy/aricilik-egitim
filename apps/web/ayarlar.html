<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ayarlar · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
</head>
<body class="auth-body">
  <div class="auth-phone">
    <div class="hardal-rail" aria-hidden="true"></div>
    <div class="nav">
      <a class="chip" href="ana.html" id="nav-ana">← Ana</a>
      <a class="chip" href="arici.html">Arıcı</a>
      <a class="chip" href="yonetici.html">Yönetici</a>
      <a class="chip" href="bakici.html">Bakıcı</a>
    </div>
    <div class="brand">
      <div class="brand-badge">🐝</div>
      <div>
        <h1>SüperArı</h1>
        <p>Hesap ayarları</p>
      </div>
    </div>

    <section class="auth-card">
      <div class="settings-head">
        <div>
          <h2>Hesap ayarları</h2>
          <p class="sub" id="account-summary">Profil bilgilerinizi güncelleyin.</p>
        </div>
        <span class="verified-badge wait" id="verify-badge">Doğrulanmadı</span>
      </div>

      <form class="stack" id="ayarlar-form">
        <label>Arıcılık adı
          <input id="aricilik-adi" name="aricilikAdi" placeholder="Örn. Hardal Arıcılık" />
        </label>
        <label>Ad soyadı
          <input id="account-name" name="name" autocomplete="name" placeholder="Adınız Soyadınız" />
        </label>
        <label>Bildirim e-postası
          <input type="email" id="notif-email" name="notifEmail" placeholder="ornek@mail.com" />
        </label>
        <label>Telefon <span class="muted" style="font-weight:500">(isteğe bağlı)</span>
          <input type="tel" id="account-phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="05xx xxx xx xx" />
        </label>
        <label>Dil
          <input value="Türkçe" readonly />
        </label>
        <label>Hesap tipi
          <select id="hesap-tipi" name="hesapTipi">
            <option value="arici">Arıcı</option>
            <option value="yonetici">Yönetici</option>
            <option value="bakici">Bakıcı</option>
          </select>
        </label>
        <p class="hint-inline" id="hesap-hint">
          Uygulama seçilen hesaba göre açılır. Demo: Yönetici seçilebilir; gerçek kimlik doğrulama sonra kilitleyecek.
        </p>
        <button class="btn" type="submit">Kaydet</button>
        <a class="btn secondary" href="giris.html" id="btn-logout">Çıkış yap</a>
      </form>
    </section>
  </div>
  <script src="panels.js"></script>
  <script>
    (function () {
      var H = window.SuperAriHesap;
      if (!H) return;
      var sel = document.getElementById('hesap-tipi');
      var navAna = document.getElementById('nav-ana');
      var notif = document.getElementById('notif-email');
      var arilik = document.getElementById('aricilik-adi');
      var nameEl = document.getElementById('account-name');
      var phoneEl = document.getElementById('account-phone');
      var badge = document.getElementById('verify-badge');
      var summary = document.getElementById('account-summary');
      var form = document.getElementById('ayarlar-form');
      var logout = document.getElementById('btn-logout');

      function refresh() {
        var current = H.get();
        sel.value = current;
        if (navAna) navAna.href = H.homeFor(current);
        var acc = H.getAccount() || {};
        if (notif) notif.value = acc.notifEmail || acc.email || '';
        if (arilik) arilik.value = acc.aricilikAdi || '';
        if (nameEl) nameEl.value = acc.name || '';
        if (phoneEl) phoneEl.value = acc.phone || '';
        if (badge) {
          if (acc.verified) {
            badge.textContent = '✓ Doğrulandı';
            badge.className = 'verified-badge';
          } else {
            badge.textContent = 'Doğrulanmadı';
            badge.className = 'verified-badge wait';
          }
        }
        if (summary) {
          var parts = [];
          if (acc.name) parts.push(acc.name);
          if (acc.email) parts.push(acc.email);
          summary.textContent = parts.length
            ? parts.join(' · ')
            : 'Profil bilgilerinizi güncelleyin.';
        }
      }

      refresh();

      sel.addEventListener('change', function () {
        var next = H.normalize(sel.value);
        var prev = H.get();
        if (next === 'yonetici' && prev !== 'yonetici') {
          var ok = window.confirm(
            'Yönetici hesabı tüm yönetim ekranlarını (Kullanıcılar vb.) açar.\n\n' +
            'Demo amaçlıdır — gerçek kimlik doğrulama sonra bunu kilitleyecek.\n\nDevam edilsin mi?'
          );
          if (!ok) {
            sel.value = prev;
            return;
          }
        }
        H.set(next);
        if (navAna) navAna.href = H.homeFor(next);
        var home = H.homeFor(next);
        var label = H.labelFor(next);
        var reopen = window.confirm(
          'Hesap tipi «' + label + '» olarak kaydedildi.\n\n' +
          'Eşleşen ana sayfayı şimdi açmak ister misiniz?\n(' + home + ')'
        );
        if (reopen) H.goHome(next);
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        H.updateAccount({
          name: (nameEl && nameEl.value) || '',
          phone: (phoneEl && phoneEl.value) || '',
          notifEmail: (notif && notif.value) || '',
          aricilikAdi: (arilik && arilik.value) || '',
          hesapTipi: sel.value
        });
        refresh();
        try {
          var tip = document.createElement('p');
          tip.className = 'form-alert';
          tip.textContent = 'Ayarlar kaydedildi.';
          tip.setAttribute('data-form-error', '1');
          var old = form.querySelector('[data-form-error]');
          if (old) old.remove();
          form.insertBefore(tip, form.firstChild);
          setTimeout(function () { if (tip.parentNode) tip.remove(); }, 2200);
        } catch (err) { /* ignore */ }
      });

      if (logout) {
        logout.addEventListener('click', function () {
          H.logout();
        });
      }
    })();
  </script>
</body>
</html>
