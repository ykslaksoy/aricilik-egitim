<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SüperArı — Çalışan</title>
  <link rel="stylesheet" href="/panels.css?v=4" />
</head>
<body class="panel-body" data-role="isci">
  <header class="panel-header">
    <div>
      <h1><span class="brand-mark">SüperArı</span> <span class="role-chip role-isci">Çalışan</span></h1>
      <p class="sub" id="hdr-sub">Görevler · saha kaydı · basit durum</p>
    </div>
    <div class="panel-actions" id="nav-actions">
      <a class="btn-p" href="/giris.html">← Ana ekran</a>
      <a class="btn-p" href="/yonetici.html?org=koloni-demo">Yönetici</a>
      <a class="btn-p" href="/arici.html?org=koloni-demo">Patron</a>
      <button type="button" class="btn-p" id="btn-back-panel">← Panele dön</button>
      <button type="button" class="btn-p primary" id="btn-new-session">+ Yeni çalışan</button>
      <button type="button" class="btn-p" id="btn-logout">Çıkış</button>
    </div>
  </header>

  <div id="login-view" class="login-card">
    <h2>Çalışan girişi</h2>
    <p class="hint">Demo: Hasan PIN <strong>3333</strong> · yeni çalışan için adını yaz</p>
    <label>İşletme
      <select id="org-select"></select>
    </label>
    <label>Adın
      <input id="ad" type="text" placeholder="Çalışan Hasan" value="Çalışan Hasan" />
    </label>
    <label>PIN
      <input id="pin" type="password" value="3333" />
    </label>
    <div class="row-btns">
      <button type="button" class="btn-p" id="btn-login-back">← Geri</button>
      <button type="button" class="btn-p primary" id="btn-login">Giriş</button>
      <a class="btn-p" href="/giris.html">Ana ekran</a>
    </div>
    <p id="login-err" class="warn-text muted"></p>
  </div>

  <main id="app-view" class="panel-main hidden">
    <p class="session-bar" id="session-bar"></p>
    <section class="card">
      <h2>Bugünkü görevler</h2>
      <ul class="list-plain" id="tasks">—</ul>
    </section>
    <section class="card">
      <h2>Hızlı saha kaydı</h2>
      <p class="muted">Muayene / besleme / ilaç notu</p>
      <label class="muted">Kovan
        <select id="hive-select"></select>
      </label>
      <label class="muted">Tip
        <select id="tip">
          <option value="muayene">Muayene</option>
          <option value="besleme">Besleme</option>
          <option value="ilac">İlaç</option>
        </select>
      </label>
      <label class="muted">Not
        <input id="not" type="text" maxlength="200" placeholder="Kısa not" style="width:100%;padding:0.4rem;margin-top:0.2rem;border:1px solid #d9d2c5;border-radius:5px" />
      </label>
      <div class="row-btns" style="margin-top:0.75rem">
        <button type="button" class="btn-p primary" id="btn-save">Kaydet</button>
      </div>
      <p id="save-status" class="muted"></p>
    </section>
    <section class="card">
      <h2>Kritik kovanlar</h2>
      <ul class="list-plain" id="critical">—</ul>
    </section>
  </main>

  <script src="/panels.js"></script>
  <script>
    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    let prevSession = null;
    let onLoginScreen = false;

    async function fillOrgs() {
      const { orgs } = await PanelAuth.loadOrgs();
      const sel = document.getElementById("org-select");
      sel.innerHTML = orgs.map((o) => `<option value="${o.id}">${o.ad}</option>`).join("");
      sel.value = PanelAuth.orgFromUrl;
    }

    function showLogin({ keepPrev } = {}) {
      if (keepPrev) prevSession = PanelAuth.getSession();
      onLoginScreen = true;
      loginView.classList.remove("hidden");
      appView.classList.add("hidden");
    }

    function showApp() {
      onLoginScreen = false;
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
    }

    async function render() {
      const sess = PanelAuth.requireSession();
      if (!sess || sess.rol !== "isci") {
        showLogin();
        return;
      }
      showApp();
      document.getElementById("session-bar").textContent =
        `${sess.ad} · ${sess.orgAd} · işçi`;
      document.getElementById("hdr-sub").textContent = `${sess.orgAd} · saha görevleri`;

      const [{ hives }, { tasks }] = await Promise.all([
        fetch("/api/hives").then((r) => r.json()),
        fetch("/api/tasks").then((r) => r.json()),
      ]);
      document.getElementById("hive-select").innerHTML = hives
        .map((h) => `<option value="${h.hiveId}">Kovan ${h.hiveId}</option>`)
        .join("");
      const p1 = (tasks || []).filter((t) => t.priority <= 2);
      document.getElementById("tasks").innerHTML = (p1.length ? p1 : tasks || [])
        .slice(0, 15)
        .map((t) => `<li><span class="pill">Ö${t.priority ?? "-"}</span> #${t.hiveId ?? "—"} — ${PanelLabels.cleanMessage(t.title || PanelLabels.alertType(t.type))}</li>`)
        .join("") || "<li class='muted'>Görev yok</li>";
      document.getElementById("critical").innerHTML = hives
        .filter((h) => ["alert", "fault", "weak", "offline"].includes(h.status))
        .slice(0, 10)
        .map((h) => `<li><span class="pill warn">${PanelLabels.hiveStatus(h.status)}</span> Kovan ${h.hiveId} · ${h.weightKg ?? "—"} kg</li>`)
        .join("") || "<li class='muted'>Kritik yok</li>";
    }

    function goBackFromLogin() {
      if (prevSession && prevSession.rol === "isci") {
        PanelAuth.setSession(prevSession);
        prevSession = null;
        render();
        return;
      }
      const cur = PanelAuth.getSession();
      if (cur && cur.rol === "isci" && onLoginScreen) {
        render();
        return;
      }
      location.href = "/giris.html";
    }

    document.getElementById("btn-login").onclick = async () => {
      try {
        await PanelAuth.login({
          orgId: document.getElementById("org-select").value,
          ad: document.getElementById("ad").value,
          pin: document.getElementById("pin").value,
        });
        prevSession = null;
        history.replaceState({}, "", `/isci.html?org=${document.getElementById("org-select").value}`);
        await render();
      } catch (e) {
        document.getElementById("login-err").textContent = e.message;
      }
    };
    document.getElementById("btn-login-back").onclick = () => goBackFromLogin();
    document.getElementById("btn-back-panel").onclick = () => goBackFromLogin();
    document.getElementById("btn-logout").onclick = () => {
      PanelAuth.logout();
      location.href = "/giris.html";
    };
    document.getElementById("btn-new-session").onclick = () => {
      showLogin({ keepPrev: true });
      document.getElementById("ad").value = "";
      document.getElementById("pin").value = "";
      document.getElementById("login-err").textContent = "";
    };
    document.getElementById("btn-save").onclick = async () => {
      const hiveId = document.getElementById("hive-select").value;
      const tip = document.getElementById("tip").value;
      const not = document.getElementById("not").value;
      const sess = PanelAuth.getSession();
      const res = await fetch(`/api/hives/${hiveId}/journal`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tip, not: `${not} · ${sess?.ad || "işçi"}` }),
      });
      const st = document.getElementById("save-status");
      st.textContent = res.ok ? "Kaydedildi" : "Kayıt hatası";
      if (res.ok) document.getElementById("not").value = "";
    };

    fillOrgs().then(render);
  </script>
</body>
</html>
