<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Muayene · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
  <link rel="stylesheet" href="kapsam.css?v=koloni-57" />
  <style>
    .ak-note{font-size:.88rem;color:#5b4631;margin:12px 2px 0;line-height:1.35;}
    #akStart[disabled]{opacity:.55;cursor:default;}
    .ak-row .ks-badge.go{background:#1b5e20;color:#fff;}
    .ak-row.done .ks-badge.go{background:#e9ecef;color:#495057;}
  </style>
</head>
<body class="ks-body ks-page" data-tabbar="fixed">
  <main class="wrap">
    <div class="nav">
      <a class="chip" href="bakim.html">← Bakım</a>
    </div>
    <section id="akScope" aria-label="Muayene kapsamı"></section>
    <div class="ks-grid" id="akTools">
      <button type="button" class="ks-tile wide pri" id="akStart"><span id="akStartHive"></span><span style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;"><span class="ks-tl">▶ Bakım akışı başlat</span><span class="ks-sub" id="akStartSub"></span></span></button>
      <button type="button" class="ks-tile" id="akVoice" aria-pressed="false"><span id="akVoiceHive"></span><span class="ks-tl">Sesli mod</span><span class="ks-badge gray" id="akVoiceBadge">Kapalı</span></button>
      <a class="ks-tile" id="akGuc" href="kovanlar.html?view=koloni&amp;topic=guc&amp;mode=all"><span id="akGucHive"></span><span class="ks-tl">Koloni gücü</span><span class="ks-badge tan">Kayıtlar</span></a>
      <a class="ks-tile" id="akPlan" href="bakim-plan.html"><span id="akPlanHive"></span><span class="ks-tl">Bakım planı</span><span class="ks-badge tan" id="akPlanBadge">Plan</span></a>
    </div>
    <div class="ks-sec"><h3>Sıra</h3><small>önce kritik / uyarı, sonra geciken</small></div>
    <div class="ks-grid" id="akList" aria-label="Muayene sırası"></div>
    <p class="ak-note" id="akNote"></p>
  </main>
  <script src="demo-data.js?v=koloni-57"></script>
  <script src="sensor-health.js?v=koloni-57"></script>
  <script src="saglik-canli.js?v=koloni-57"></script>
  <script src="koloni.js?v=koloni-57"></script>
  <script src="ilac-katalog.js?v=koloni-57"></script>
  <script src="bakim-plan.js?v=koloni-57"></script>
  <script src="kolay-muayene.js?v=koloni-57"></script>
  <script src="bakim-akis.js?v=koloni-57"></script>
  <script src="kapsam.js?v=koloni-57"></script>
  <script>
  (function () {
    var D = window.SuperAriDemo, A = window.SuperAriBakimAkis, KS = window.SuperAriKapsam;
    if (!D || !A || !KS) return;
    function $(id) { return document.getElementById(id); }
    var esc = KS.esc, live = KS.live();
    var q = new URLSearchParams(location.search);
    var hh0 = q.get('id') ? D.hiveById(q.get('id')) : null;
    var ctl = null;
    function ap() { return ctl ? ctl.scope() : 'all'; }
    function apQ(name) { return ap() !== 'all' ? (name || '?apiary=') + encodeURIComponent(ap()) : ''; }
    function kolHref(topic) { return 'kovanlar.html?view=koloni&topic=' + topic + (ap() !== 'all' ? '&mode=apiary&apiary=' + encodeURIComponent(ap()) : '&mode=all'); }
    $('akStartHive').innerHTML = KS.hiveHtml({ burn: 'muayene' });
    $('akVoiceHive').innerHTML = KS.hiveHtml({ burn: 'ses' });
    $('akGucHive').innerHTML = KS.hiveHtml({ burn: 'guc' });
    $('akPlanHive').innerHTML = KS.hiveHtml({ burn: 'plan' });
    function voiceBtn() { var on = A.voicePref(), b = $('akVoice'); b.classList.toggle('on', on); $('akVoiceBadge').textContent = on ? 'Açık' : 'Kapalı'; $('akVoiceBadge').className = 'ks-badge ' + (on ? 'green' : 'gray'); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.setAttribute('aria-label', 'Sesli mod: ' + (on ? 'Açık' : 'Kapalı')); }
    function renderList(hs, sum) {
      $('akGuc').href = kolHref('guc');
      $('akPlan').href = 'bakim-plan.html' + apQ();
      var rows = A.order(hs);
      var open = rows.filter(function (r) { return !A.isDone(r.hive.id); });
      $('akStartSub').textContent = open.length ? 'İlk kovan: ' + open[0].hive.name + ' · ' + open.length + ' kovan sırada' : (rows.length ? 'Bugün hepsi tamam — yine de kovan seçebilirsiniz' : 'Kovan yok');
      $('akStart').disabled = !rows.length;
      $('akList').innerHTML = rows.length ? rows.map(function (r) {
        var dn = A.isDone(r.hive.id);
        var why = dn ? '✓ Bugün yapıldı' : (r.why.slice(0, 2).join(' · ') || 'Rutin bakım');
        return '<button type="button" class="ks-tile ak-row' + (dn ? ' done' : (r.pri <= 1 ? ' p' + r.pri : '')) + '" data-id="' + esc(r.hive.id) + '" aria-label="' + esc(r.hive.name + ': ' + why) + '">' +
          KS.hiveHtml({ num: KS.hiveNum(r.hive) }) + '<span class="ks-tl">' + esc(r.hive.name) + '</span>' +
          '<span class="ks-sub">' + esc(why) + (!live ? ' · Demo' : '') + '</span>' +
          '<span class="ks-badge go">' + (dn ? 'Tekrar' : 'Başla →') + '</span></button>';
      }).join('') : '<p class="ks-empty">Bu kapsamda kovan yok. Önce kovan ekleyin.</p>';
      $('akNote').textContent = 'Muayene her kovanda normal muayene kaydı olarak saklanır; önerileri kabul etmeniz veya değiştirmeniz kayda işlenir. Sensör gerekmez.';
    }
    ctl = KS.mount($('akScope'), {
      title: 'Muayene', icon: KS.ICON_MUAYENE, page: 'bakim-akis.html',
      initial: q.get('apiary') || (hh0 ? String(hh0.apiaryId) : ''),
      stats: function (hs, scope, s) {
        return [
          { k: 'kovan', v: s.hives, l: 'Kovan', href: 'kovanlar.html' + (scope !== 'all' ? '?mode=apiary&apiary=' + encodeURIComponent(scope) : '') },
          { k: 'muayene', v: s.hives ? s.overdue : '—', l: 'Geciken muayene', href: kolHref('guc'), tone: s.overdue ? 'hot' : '' },
          { k: 'hafta', v: s.week, l: 'Bu hafta', href: kolHref('guc'), tone: s.week ? 'gold' : '' },
          { k: 'uyari', v: s.critical, l: 'Kritik uyarı', href: 'uyarilar.html' + (scope !== 'all' ? '?apiary=' + encodeURIComponent(scope) : ''), tone: s.critical ? 'hot' : '' },
          { k: 'saat', v: s.lastTxt, l: 'Son muayene', href: kolHref('guc') }
        ];
      },
      note: function (hs, scope, s) {
        if (!s.hives) return { t: 'Bu kapsamda kovan yok — Kovanlar’dan ekleyin', b: 'Kovanlar', href: 'kovanlar.html', k: 'bos' };
        if (s.critical) return { t: '⚠️ ' + s.critical + ' kritik uyarı — sıra bu kovanlarla başlar', b: 'Başlat', href: '#akStart', k: 'start' };
        if (s.overdue) return { t: '🔍 ' + s.overdue + ' kovanın muayenesi 21 günü geçti', b: 'Başlat', href: '#akStart', k: 'start' };
        return { t: '✓ Muayeneler güncel' + (s.last ? ' · son muayene ' + s.lastTxt.toLocaleLowerCase('tr') : ''), b: 'Başlat', href: '#akStart', k: 'start' };
      },
      onChange: function (scope, hs, s) { renderList(hs, s); }
    });
    function render() { ctl.render(); }
    function start(id) { A.open(id, { apiary: ap(), onClose: render }); }
    function startFirst() { var rows = A.order(ctl.hives()), open = rows.filter(function (r) { return !A.isDone(r.hive.id); }); var h = (open[0] || rows[0] || {}).hive; if (h) start(h.id); }
    $('akScope').addEventListener('click', function (e) { var n = e.target.closest && e.target.closest('[data-ks-note]'); if (n && n.getAttribute('data-note') === 'start') { e.preventDefault(); startFirst(); } });
    $('akVoice').addEventListener('click', function () { A.setVoicePref(!A.voicePref()); voiceBtn(); });
    $('akStart').addEventListener('click', startFirst);
    $('akList').addEventListener('click', function (e) { var b = e.target.closest('[data-id]'); if (b) start(b.getAttribute('data-id')); });
    window.addEventListener('superari-records-changed', function () { if (!document.getElementById('baSheet') && !document.getElementById('kmSheet')) render(); });
    voiceBtn();
    if (hh0) setTimeout(function () { start(hh0.id); }, 150);
  })();
  </script>
  <script src="nav.js?v=koloni-57"></script>
  <script src="pwa.js?v=koloni-57"></script>
</body>
</html>
