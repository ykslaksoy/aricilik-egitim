<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Cihazlar</title>
<link rel="stylesheet" href="rapor-common.css" />
<style>
  .mode-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
  }
  .mode-switch a {
    display: flex; align-items: center; justify-content: center;
    padding: 12px 10px; border-radius: 12px; text-decoration: none;
    font-size: 13px; font-weight: 800; border: 1.5px solid var(--card-border);
    background: #fff; color: var(--text);
  }
  .mode-switch a.active {
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 100%);
    border-color: #e0c56a; color: var(--brown);
  }
  .choice-grid { display: grid; gap: 10px; }
  .choice-btn {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    padding: 14px 14px; border-radius: 14px; text-decoration: none;
    border: 1.5px solid #e0c56a;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 100%);
    color: var(--brown); font-family: inherit;
  }
  .choice-btn strong { font-size: 15px; font-weight: 800; color: var(--brown); }
  .choice-btn span { font-size: 12px; font-weight: 650; color: var(--muted); }
  .chan-pill {
    display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 750; border: 1px solid var(--card-border);
    background: #f7f8fa; color: var(--muted);
  }
  .device-link {
    text-decoration: none; color: inherit; display: flex; align-items: flex-start;
  }
  .device-link:active { opacity: .92; }
  .status-pill {
    display: inline-block; margin: 0 0 0 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 750; border: 1px solid var(--card-border);
  }
  .status-pill.online { background: #ebfbee; color: #2b8a3e; border-color: #8ce99a; }
  .status-pill.offline { background: #fff5f5; color: #c92a2a; border-color: #ffa8a8; }
  .type-tag {
    display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 750; border: 1px solid #e0c56a;
    background: #fff6df; color: var(--brown);
  }
  .type-tag.demo {
    border-color: #cfd8e3; background: #f4f6f8; color: #6b635a;
  }
  .disconnect-banner {
    display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
    padding: 14px; border-radius: 14px; margin-bottom: 12px;
    border: 1.5px solid #ffa8a8; background: #fff5f5; color: #862e2e;
  }
  .disconnect-banner strong { font-size: 14px; font-weight: 800; }
  .disconnect-banner p { margin: 0; font-size: 12px; font-weight: 650; line-height: 1.4; color: #a61e4d; }
  .disconnect-banner .add-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 14px; border-radius: 12px; text-decoration: none;
    font-size: 13px; font-weight: 800; border: 1.5px solid #e0c56a;
    background: linear-gradient(180deg, #fff6df 0%, #f5e6b8 100%);
    color: var(--brown);
  }
  .section-label {
    margin: 14px 0 8px; font-size: 11px; font-weight: 800;
    color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Cihazlar</h1>
        <p id="pageSub">Cihazlar</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="ana.html">← Ana</a>
        <a class="back-chip" href="kamera.html">Kamera</a>
        <a class="back-chip" href="ayarlar.html#cihaz">Cihaz ekle</a>
      </div>
    </div>
    <div class="mode-switch" id="modeSwitch"></div>
    <section class="card-block">
      <h2 id="listHeading">Cihazlar</h2>
      <p class="meta" id="summary" style="margin-bottom:10px"></p>
      <div id="deviceBody"></div>
      <p class="hint" id="pageNote" style="margin-top:12px">Kayıtlı cihazlar bu cihazda tutulur · canlı eşleştirme sonra</p>
    </section>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>Ana</a>
    <a class="tab" href="kovanlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>Kovanlar</a>
    <a class="tab" href="uyarilar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>Uyarılar</a>
    <a class="tab" href="gorevler.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Görevler</a>
    <a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js"></script>
<script>
(function () {
  var D = window.SuperAriDemo;
  if (!D) return;
  var DEVICES_KEY = 'superari.devices';
  var tipLabels = {
    tarti: 'Tartı',
    isi_nem: 'Sıcaklık/Nem',
    ir: 'IR',
    ses_titresim: 'Ses/Titreşim',
    gateway: 'Gateway (Wi‑Fi / hücresel)',
    kamera_arilik: 'Arılık kamerası',
    kamera_merkez: 'Arılık kamerası',
    kamera_kovan: 'Kovan kamerası',
    role_hub: 'Wireless röle / hub'
  };
  var params = new URLSearchParams(location.search);
  var hasMode = params.has('mode');
  var mode = params.get('mode') === 'all' ? 'all' : (params.get('mode') === 'apiary' ? 'apiary' : null);
  var apiaryId = params.get('apiary') || '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function pageHref(extra) {
    return 'cihazlar.html' + (extra ? '?' + extra : '');
  }

  function choiceBtn(href, title, meta) {
    return '<a class="choice-btn" href="' + href + '">' +
      '<strong>' + esc(title) + '</strong>' +
      '<span>' + esc(meta) + '</span></a>';
  }

  function loadUserDevices() {
    try {
      var raw = localStorage.getItem(DEVICES_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function isCameraTip(tip) {
    var t = String(tip || '').toLowerCase();
    return t === 'kamera_arilik' || t === 'kamera_merkez' || t === 'kamera_kovan' || t.indexOf('kamera') !== -1;
  }

  function deviceFromUser(d) {
    var tip = d.tip || d.type || '';
    var hiveId = d.hiveId != null ? d.hiveId : null;
    var hive = (hiveId != null && D.hiveById) ? D.hiveById(hiveId) : null;
    var ap = hive && D.apiaryById ? D.apiaryById(hive.apiaryId) : null;
    var kind = isCameraTip(tip) ? 'kamera' : 'paket';
    return {
      source: 'user',
      kind: kind,
      tip: tip,
      typeLabel: tipLabels[tip] || tip || 'Cihaz',
      hiveId: hiveId,
      hiveName: hive
        ? (hive.name || ('Kovan ' + hive.id))
        : (kind === 'kamera' ? (tipLabels[tip] || 'Kamera') : 'Kayıtlı cihaz'),
      apiaryId: hive ? String(hive.apiaryId || 'none') : 'none',
      apiaryName: ap ? (ap.name || ap.place || 'Arılık') : '—',
      battery: null,
      lastMins: null,
      online: false,
      channels: [tipLabels[tip] || tip || 'Cihaz'],
      at: d.at || null
    };
  }

  /** Örnek / demo paketler — canlı değil; yalnızca kullanıcı cihazı yokken isteğe bağlı. */
  function deviceFromHiveDemo(h) {
    var id = Number(h.id) || 0;
    var ap = D.apiaryById(h.apiaryId);
    return {
      source: 'demo',
      kind: 'paket',
      typeLabel: 'Sensör paketi',
      hiveId: h.id,
      hiveName: h.name || ('Kovan ' + h.id),
      apiaryId: String(h.apiaryId || 'none'),
      apiaryName: ap ? (ap.name || ap.place || 'Arılık') : 'Arılık',
      battery: 55 + ((id * 7) % 41),
      lastMins: 2 + ((id * 3) % 118),
      online: false,
      channels: ['Tartı', 'Sıcaklık/Nem', 'IR', 'Ses/Titreşim']
    };
  }

  function relAgo(mins) {
    if (mins == null) return 'bağlı değil';
    if (mins < 60) return mins + ' dk önce';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return h + ' sa' + (m ? ' ' + m + ' dk' : '') + ' önce';
  }

  function groupByApiary(devices) {
    var map = {};
    var order = [];
    devices.forEach(function (d) {
      var aid = String(d.apiaryId || 'none');
      if (!map[aid]) { map[aid] = []; order.push(aid); }
      map[aid].push(d);
    });
    return order.map(function (aid) {
      return {
        apiaryId: aid,
        apiaryName: (map[aid][0] && map[aid][0].apiaryName) || 'Arılık',
        devices: map[aid]
      };
    });
  }

  function disconnectBannerHtml() {
    return '<div class="disconnect-banner" role="status">' +
      '<strong>Canlı cihaz bağlı değil</strong>' +
      '<p>Henüz kayıtlı donanım yok. Sensör veya kamera ekleyince burada listelenir. Kovan kamerası isteğe bağlıdır.</p>' +
      '<a class="add-btn" href="ayarlar.html#cihaz">Cihaz ekle</a>' +
    '</div>';
  }

  function renderDevice(d) {
    var pills = (d.channels || []).map(function (c) {
      return '<span class="chan-pill">' + esc(c) + '</span>';
    }).join('');
    var isDemo = d.source === 'demo';
    var typeTag = '<span class="type-tag' + (isDemo ? ' demo' : '') + '">' +
      esc(isDemo ? ('Örnek / demo · ' + (d.typeLabel || 'Cihaz')) : (d.typeLabel || 'Cihaz')) +
      '</span>';
    var connClass = d.online ? 'online' : 'offline';
    var connText = d.online ? 'Bağlı' : (isDemo ? 'Örnek' : 'Bağlı değil');
    var bat = (d.battery == null)
      ? (isDemo ? 'demo' : 'kayıtlı')
      : ('batarya %' + d.battery);
    var href = d.kind === 'kamera'
      ? 'kamera.html'
      : (d.hiveId != null ? ('kovan.html?id=' + encodeURIComponent(d.hiveId)) : 'cihazlar.html');
    return '<a class="row-item device-link" href="' + href + '">' +
      '<div class="left">' +
        '<div class="title">' + esc(d.hiveName) + ' ' + typeTag + '</div>' +
        '<div class="meta">' + esc(d.apiaryName) +
          ' · ' + bat +
          ' · ' + esc(relAgo(d.lastMins)) + '</div>' +
        '<div style="margin-top:4px">' + pills +
          '<span class="status-pill ' + connClass + '">' + connText + '</span></div>' +
      '</div>' +
      '<div class="right"><span class="badge ' + (d.online ? 'ok' : 'warn') + '">' +
        connText + '</span></div>' +
    '</a>';
  }

  var userRaw = loadUserDevices();
  var userDevices = userRaw.map(deviceFromUser);
  var hives = D.loadHives ? D.loadHives().slice() : [];
  var apiaries = D.loadApiaries ? D.loadApiaries() : [];

  /* Kullanıcı cihazı yoksa canlı liste boş — demo paketleri ayrı etiketle (isteğe bağlı örnek). */
  var demoDevices = [];
  if (!userDevices.length) {
    demoDevices = hives.slice(0, 3).map(deviceFromHiveDemo);
  }

  var devices = userDevices.concat(demoDevices);
  var groups = groupByApiary(userDevices.length ? userDevices : devices);

  var effectiveMode = mode;
  if (!hasMode && apiaryId) effectiveMode = 'apiary';

  function filterByApiary(list) {
    if (effectiveMode === 'apiary' && apiaryId) {
      return list.filter(function (d) { return String(d.apiaryId) === String(apiaryId); });
    }
    return list;
  }

  /* Chooser — canlı cihaz yoksa banner + ekle */
  if (!hasMode && !apiaryId) {
    document.getElementById('pageSub').textContent = userDevices.length
      ? (userDevices.length + ' kayıtlı cihaz · görünüm seçin')
      : 'Canlı cihaz yok';
    document.getElementById('listHeading').textContent = userDevices.length
      ? 'Nasıl görmek istersiniz?'
      : 'Cihazlar';
    document.getElementById('summary').textContent = '';
    document.getElementById('modeSwitch').innerHTML = '';
    var html = '';
    if (!userDevices.length) {
      html += disconnectBannerHtml();
      document.getElementById('pageNote').textContent =
        'Sensör/kamera donanımı gelince burada izlenir · örnek satırlar canlı değildir';
      if (demoDevices.length) {
        html += '<div class="section-label">Örnek / demo (canlı değil)</div>';
        html += demoDevices.map(renderDevice).join('');
      }
    } else {
      html += '<div class="choice-grid">' +
        choiceBtn(pageHref('mode=all'), 'Tüm cihazlar', userDevices.length + ' cihaz tek listede');
      groups.forEach(function (g) {
        html += choiceBtn(
          pageHref('mode=apiary&apiary=' + encodeURIComponent(g.apiaryId)),
          g.apiaryName,
          g.devices.length + ' cihaz'
        );
      });
      html += '</div>';
    }
    document.getElementById('deviceBody').innerHTML = html;
    return;
  }

  var listUser = filterByApiary(userDevices);
  var listDemo = userDevices.length ? [] : filterByApiary(demoDevices);
  var listAll = listUser.concat(listDemo);
  var apName = '';
  if (effectiveMode === 'apiary' && apiaryId) {
    var g0 = groupByApiary(listAll)[0];
    if (g0) apName = g0.apiaryName;
    else {
      var ap = D.apiaryById ? D.apiaryById(apiaryId) : null;
      apName = ap ? (ap.name || ap.place || 'Arılık') : 'Arılık';
    }
  }

  document.getElementById('pageSub').textContent = listUser.length
    ? (listUser.length + ' cihaz · ' + (effectiveMode === 'all' ? 'Tüm cihazlar' : (apName || 'Arılık')))
    : 'Canlı cihaz yok';
  document.getElementById('listHeading').textContent =
    effectiveMode === 'all' ? 'Tüm cihazlar' : (apName || 'Arılık');
  document.getElementById('summary').textContent = listUser.length
    ? (listUser.length + ' kayıtlı cihaz · canlı eşleşme yok')
    : 'Kayıtlı cihaz yok';

  document.getElementById('modeSwitch').innerHTML =
    '<a class="' + (effectiveMode === 'all' ? 'active' : '') + '" href="' + pageHref('mode=all') + '">Tüm cihazlar</a>' +
    '<a class="' + (effectiveMode === 'apiary' ? 'active' : '') + '" href="' + pageHref('') + '">Arılıklar</a>';

  var body = document.getElementById('deviceBody');
  var out = '';
  if (!listUser.length) {
    out += disconnectBannerHtml();
  }
  if (listUser.length) {
    out += listUser.map(renderDevice).join('');
  }
  if (listDemo.length) {
    out += '<div class="section-label">Örnek / demo (canlı değil)</div>';
    out += listDemo.map(renderDevice).join('');
  }
  body.innerHTML = out;
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
