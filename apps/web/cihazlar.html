<style>
  .mode-switch {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
  }
  .mode-switch a {
    display: flex; align-items: center; justify-content: center;
    padding: 12px 10px; border-radius: 12px; text-decoration: none;
    font-size: 13px; font-weight: 800; border: 1.5px solid var(--card-border);
    background: #fff; color: var(--text);
  }
  .mode-switch a.active {
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 100%);
    border-color: #e0c56a; color: var(--brown);
  }
  .choice-grid { display: grid; gap: 10px; }
  .choice-btn {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
    padding: 14px 14px; border-radius: 14px; text-decoration: none;
    border: 1.5px solid #e0c56a;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 100%);
    color: var(--brown); font-family: inherit;
  }
  .choice-btn strong { font-size: 15px; font-weight: 800; color: var(--brown); }
  .choice-btn span { font-size: 12px; font-weight: 650; color: var(--muted); }
  .chan-pill {
    display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 750; border: 1px solid var(--card-border);
    background: #f7f8fa; color: var(--muted);
  }
  .device-link {
    text-decoration: none; color: inherit; display: flex; align-items: flex-start;
  }
  .device-link:active { opacity: .92; }
  .status-pill {
    display: inline-block; margin: 0 0 0 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 750; border: 1px solid var(--card-border);
  }
  .type-tag {
    display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 750; border: 1px solid #e0c56a;
    background: #fff6df; color: var(--brown);
  }
  .type-tag.demo {
    border-color: #cfd8e3; background: #f4f6f8; color: #6b635a;
  }
  .empty-live {
    display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
    padding: 14px; border-radius: 14px; margin-bottom: 12px;
    border: 1.5px solid #cfd8e3; background: #f7f8fa; color: #6b635a;
  }
  .empty-live strong { font-size: 14px; font-weight: 800; color: var(--brown); }
  .empty-live p { margin: 0; font-size: 12px; font-weight: 650; line-height: 1.4; }
  /* Bakım düzeni (k88): Kapsam kartı + cihaz türü döşemeleri + liste; satırlar eldiven boyu */
  .ks-page .device-link { min-height: 64px; align-items: center; }
  .ks-page .device-link .right { flex: none; }
  #devList .card-block, #devList { scroll-margin-top: 12px; }
  .dev-empty { padding: 12px 14px; border-radius: 14px; border: 1.5px dashed #cfd8e3; background: #f7f8fa; color: #4a5562; font-size: 14px; font-weight: 650; line-height: 1.4; margin: 0; }
  .dev-clear { margin-top: 10px; }
  .section-label {
    margin: 14px 0 8px; font-size: 11px; font-weight: 800;
    color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
  }
  .poll-meta {
    display: block; margin-top: 6px; font-size: 11px; font-weight: 700; color: #5c4813;
  }
  .poll-meta select {
    font: inherit; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px;
    border: 1px solid #d8c7aa; background: #fff; max-width: 100%;
  }
  .poll-ret { color: var(--muted); font-weight: 650; }
  .bat-chip {
    display: inline-flex; align-items: center; gap: 3px;
    margin: 0 4px 0 0; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 800; border: 1px solid #b2f2bb;
    background: #ebfbee; color: #2b8a3e;
  }
  .bat-chip.low { border-color: #ffc078; background: #fff4e6; color: #e67700; }
  .bat-chip.crit { border-color: #ffa8a8; background: #fff5f5; color: #c92a2a; }
  .bat-warn-pill {
    display: inline-block; margin: 0 0 0 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 800; border: 1px solid #ffa8a8;
    background: #fff5f5; color: #c92a2a;
  }
  .pil-panel {
    margin: 0 0 14px; padding: 12px 14px; border-radius: 14px;
    border: 1.5px solid #b2f2bb; background: #f1faf2;
  }
  .pil-panel.low { border-color: #ffc078; background: #fff8ef; }
  .pil-spark { width: 100%; height: 40px; margin-top: 8px; }
  .pil-spark path { fill: none; stroke: #2f9e44; stroke-width: 3; stroke-linejoin: round; }
  .pil-panel.low .pil-spark path { stroke: #e67700; }
</style>

<script>
(function () {
  var Dev = window.SuperAriDevices;
  if (!Dev) return;
  var D = window.SuperAriDemo;
  var params = new URLSearchParams(location.search);
  var hasMode = params.has('mode');
  var mode = params.get('mode') === 'all' ? 'all' : (params.get('mode') === 'apiary' ? 'apiary' : null);
  var apiaryId = params.get('apiary') || '';
  var workMode = Dev.getMode();
  var devices = Dev.listDevices();
  var counts = Dev.summarize();
  var P = window.SuperAriKsSayfa, KS = window.SuperAriKapsam;
  if (P && KS) { ksLayout(); return; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function pageHref(extra) {
    return 'cihazlar.html' + (extra ? '?' + extra : '');
  }

  function choiceBtn(href, title, meta) {
    return '<a class="choice-btn" href="' + href + '">' +
      '<strong>' + esc(title) + '</strong>' +
      '<span>' + esc(meta) + '</span></a>';
  }

  function relAgo(mins) {
    if (mins == null) return '—';
    if (mins < 60) return mins + ' dk önce';
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return h + ' sa' + (m ? ' ' + m + ' dk' : '') + ' önce';
  }

  function groupByApiary(list) {
    var map = {};
    var order = [];
    list.forEach(function (d) {
      var aid = String(d.apiaryId || 'none');
      if (!map[aid]) { map[aid] = []; order.push(aid); }
      map[aid].push(d);
    });
    return order.map(function (aid) {
      return {
        apiaryId: aid,
        apiaryName: (map[aid][0] && map[aid][0].apiaryName) || 'Arılık',
        devices: map[aid]
      };
    });
  }

  function emptyLiveHtml() {
    return '<div class="empty-live" role="status">' +
      '<strong>Canlı cihaz yok · takılınca burada görünür</strong>' +
      '<p>Tak–çalıştır: donanım bağlanınca otomatik listelenir. Elle ekleme gerekmez. Kovan kamerası isteğe bağlıdır.</p>' +
    '</div>';
  }

  var POLLABLE = ['tarti', 'isi_nem', 'ses', 'titresim', 'ir'];
  var Poll = window.SuperAriSensorPolling;
  var deviceFocusId = params.get('device') || '';

  function batteryPctOf(d) {
    if (!d) return null;
    if (d.batteryPct != null) return Number(d.batteryPct);
    if (d.battery != null) return Number(d.battery);
    return null;
  }

  function batteryIcon(pct) {
    if (pct == null) return '🔋';
    if (pct <= 10) return '🪫';
    if (pct <= 35) return '🔋';
    return '🔋';
  }

  function batteryChipHtml(d) {
    var pct = batteryPctOf(d);
    if (pct == null) return '<span class="bat-chip" title="Pil verisi yok">🔌 Şebeke / pil yok</span>';
    var low = Dev.isBatteryLow ? Dev.isBatteryLow(d) : pct <= 20;
    var cls = low ? (pct <= 10 ? 'bat-chip crit' : 'bat-chip low') : 'bat-chip';
    var warn = low ? '<span class="bat-warn-pill">Düşük pil</span>' : '';
    return '<span class="' + cls + '" title="Pil durumu">'
      + batteryIcon(pct) + ' %' + esc(pct) + '</span>' + warn;
  }

  function pilSparkSvg(points) {
    if (!points || points.length < 2) return '';
    var vals = points.map(function (p) { return p.pct; });
    var mn = Math.min.apply(null, vals);
    var mx = Math.max.apply(null, vals);
    var rg = mx - mn || 1;
    var W = 220;
    var H = 40;
    var d = points.map(function (p, i) {
      return (i ? 'L' : 'M') + Math.round(i / (points.length - 1) * W) + ' '
        + Math.round(H - 4 - (p.pct - mn) / rg * (H - 8));
    }).join(' ');
    return '<svg class="pil-spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true"><path d="' + d + '"/></svg>';
  }

  function pilHistory(deviceId, limit) {
    if (!Poll || !Poll.readBatteryStore) return [];
    var rows = Poll.readBatteryStore().filter(function (x) {
      return x && String(x.deviceId) === String(deviceId) && x.batteryPct != null;
    });
    rows.sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    if (limit && rows.length > limit) rows = rows.slice(rows.length - limit);
    return rows.map(function (x) { return { at: x.at, pct: Number(x.batteryPct) }; });
  }

  /* k160: batarya planlayıcı — tüketim, kalan gün, arılıkta kalma; öneri yalnız onayla uygulanır */
  function planHtml(d) {
    var P2 = window.SuperAriPlan2; if (!P2 || !d || d.tip === 'gateway' && !d.batteryAt) return '';
    var bp = P2.bataryaPlan(d), k = P2.konGet(d.apiaryId), h = '<div class="bp-plan" style="margin-top:10px;padding:10px;border:1px solid #eadfbe;border-radius:12px;background:#fffdf5;">';
    if (bp.durum !== 'tamam') return h + '<b>Pil planı</b><p class="meta" style="margin:4px 0 0;">' + esc(bp.metin) + '</p></div>';
    h += '<b>Pil planı</b><p style="margin:4px 0 0;font-size:14px;">Tüketim ≈ %' + String(bp.tuketimGun).replace('.', ',') + '/gün · mevcut sıklıkla <b>' + (bp.kalanGun == null ? '—' : bp.kalanGun + ' gün') + '</b> yeter' + (bp.kalmaGun != null ? ' · arılıkta ' + bp.kalmaGun + ' gün kalacaksın' : ' · arılıkta kalma bitişi girilmedi') + '</p>';
    var cmd = P2.komutlar().filter(function (c) { return c.deviceId === d.id; })[0];
    if (cmd) h += '<p class="meta" style="margin:4px 0 0;">Onaylanan ölçüm: ' + esc(P2.ARALIK_AD[cmd.aralikMs] || '') + ' · ' + (cmd.durum === 'beklemede' ? 'gateway yok, beklemede' : 'gateway’e gönderildi') + '</p>';
    if (bp.soru) h += '<div class="bp-card" style="margin-top:8px;padding:10px;border-radius:10px;background:#fff3bf;"><p style="margin:0 0 8px;font-weight:700;">' + esc(bp.soru) + '</p><button type="button" class="ks-btn" data-bp-ok="' + esc(d.id) + '" data-bp-ms="' + bp.oneriMs + '">Onayla</button> <button type="button" class="ks-btn" data-bp-no>Şimdilik hayır</button></div>';
    else if (bp.not) h += '<p style="margin:6px 0 0;color:#c92a2a;font-weight:700;">' + esc(bp.not) + '</p>';
    return h + '</div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-bp-ok],[data-bp-no]'); if (!b) return;
    var card = b.closest('.bp-card');
    if (b.hasAttribute('data-bp-no')) { if (card) card.innerHTML = '<p class="meta" style="margin:0;">Ölçüm sıklığı değiştirilmedi.</p>'; return; }
    var dv = devices.filter(function (x) { return String(x.id) === b.getAttribute('data-bp-ok'); })[0];
    if (dv && window.SuperAriPlan2) { var c = SuperAriPlan2.aralikOnayla(dv, Number(b.getAttribute('data-bp-ms'))); if (card) card.innerHTML = '<p style="margin:0;font-weight:700;">✓ Ölçüm ' + esc(SuperAriPlan2.ARALIK_AD[c.aralikMs]) + ' · ' + (c.durum === 'beklemede' ? 'gateway yok, komut beklemede' : 'gateway’e gönderildi') + '</p>'; }
  });
  function deviceDetailPanel(d) {
    if (!d) return '';
    var pct = batteryPctOf(d);
    var low = Dev.isBatteryLow ? Dev.isBatteryLow(d) : (pct != null && pct <= 20);
    var hist = pilHistory(d.id, 24);
    var v = d.batteryV != null ? (' · ' + esc(d.batteryV) + ' V') : '';
    var at = d.batteryAt ? ('Son okuma: ' + esc(d.batteryAt)) : 'Henüz pil okuması yok';
    return '<section class="pil-panel' + (low ? ' low' : '') + '" id="devDetail">' +
      '<h2 class="section-label" style="margin-top:0">Pil durumu · ' + esc(d.hiveName || d.typeLabel || 'Cihaz') + '</h2>' +
      '<p style="margin:0;font-size:15px;font-weight:800">' + batteryChipHtml(d) + v + '</p>' +
      '<p class="meta" style="margin:6px 0 0">' + esc(at) + (hist.length >= 2 ? ' · trend (son ' + hist.length + ' okuma)' : '') + '</p>' +
      pilSparkSvg(hist) + planHtml(d) +
      '<p style="margin:10px 0 0"><a class="ks-btn" href="' + esc(listBackHref()) + '">← Listeye dön</a></p>' +
    '</section>';
  }

  function devicePageHref(d) {
    var q = new URLSearchParams(location.search);
    q.set('device', d.id);
    return 'cihazlar.html?' + q.toString() + '#devDetail';
  }

  function listBackHref() {
    var q = new URLSearchParams(location.search);
    q.delete('device');
    var s = q.toString();
    return 'cihazlar.html' + (s ? '?' + s : '') + '#devList';
  }

  function pollMetaHtml(d) {
    if (!Poll || !Poll.selectHtml || POLLABLE.indexOf(d.tip) < 0) return '';
    return Poll.selectHtml(d);
  }

  function renderDevice(d) {
    var pills = (d.channels || []).map(function (c) {
      return '<span class="chan-pill">' + esc(c) + '</span>';
    }).join('');
    var isDemoSrc = d.source === 'demo';
    var typeTag = '<span class="type-tag' + (isDemoSrc ? ' demo' : '') + '">' +
      esc(isDemoSrc ? ('Örnek · ' + (d.typeLabel || 'Cihaz')) : (d.typeLabel || 'Cihaz')) +
      '</span>';
    var st = d.status || Dev.STATUS.yok;
    var stLabel = Dev.statusLabel(st);
    var stClass = Dev.statusTone(st);
    var title = d.hiveName || d.typeLabel || 'Cihaz';
    var href = devicePageHref(d);
    return '<a class="row-item device-link" href="' + href + '">' +
      '<div class="left">' +
        '<div class="title">' + esc(title) + ' ' + typeTag + ' ' + batteryChipHtml(d) + '</div>' +
        '<div class="meta">' + esc(d.apiaryName) +
          ' · ' + esc(relAgo(d.lastMins)) + '</div>' +
        '<div style="margin-top:4px">' + pills +
          '<span class="status-pill ' + stClass + '">' + esc(stLabel) + '</span></div>' +
        pollMetaHtml(d) +
      '</div>' +
      '<div class="right"><span class="status-pill ' + stClass + '">' + esc(stLabel) + '</span></div>' +
    '</a>';
  }


  /* ---- Bakım düzeni (k88): Kapsam kartı (arılık + Bağlı / Bağlı değil / Düşük pil / Son veri) → cihaz türü döşemeleri → seçili türün listesi.
     Uydurma veri yok: cihaz yoksa «Yok · bağlı değil»; canlıda yalnız kayıtlı / keşfedilen cihazlar. ---- */
  function ksLayout(again) {
    document.body.classList.add('sa-tile-select');
    var TYPES = [
      { k: 'tarti', l: 'Tartı', tips: ['tarti'], svg: '<path d="M12 6.2v11.4M8.6 17.8h6.8M6.4 8.8h11.2"/><path d="M6.4 8.8 4.6 12.6a1.9 1.9 0 0 0 3.6 0zM17.6 8.8l-1.8 3.8a1.9 1.9 0 0 0 3.6 0z"/>' },
      { k: 'isi_nem', l: 'Sıcaklık / Nem', tips: ['isi_nem'], svg: '<path d="M10 14.6V7.4a1.8 1.8 0 0 1 3.6 0v7.2a3 3 0 1 1-3.6 0z"/><path d="M11.8 10.5v5.2"/><path d="M16.8 9.2c.9 1.2 1.4 2 1.4 2.7a1.4 1.4 0 0 1-2.8 0c0-.7.5-1.5 1.4-2.7z"/>' },
      { k: 'ir', l: 'IR (giriş sayacı)', tips: ['ir'], svg: '<path d="M6.5 12h3M14.5 12h3"/><circle cx="12" cy="12" r="1.6"/><path d="M8.2 8.2l1.8 1.8M15.8 8.2 14 10M8.2 15.8l1.8-1.8M15.8 15.8 14 14"/>' },
      { k: 'ses', l: 'Ses (mikrofon)', tips: ['ses', 'ses_titresim'], svg: '<path d="M6.5 10h2.4l3.3-2.8v9.6L8.9 14H6.5z"/><path d="M14.3 9.6a3.2 3.2 0 0 1 0 4.8M15.9 8a5.4 5.4 0 0 1 0 8"/>' },
      { k: 'titresim', l: 'Titreşim (ivmeölçer)', tips: ['titresim'], svg: '<path d="M4.8 12h2.4M16.8 12h2.4M7.6 8.2l1.7 1.7M14.7 14.1l1.7 1.7M7.6 15.8l1.7-1.7M14.7 9.9l1.7-1.7"/><rect x="10" y="7.2" width="4" height="9.6" rx="1.2"/>' },
      { k: 'kamera_kovan', l: 'Kovan kamerası', tips: ['kamera_kovan', 'kovan_kamerasi'], svg: '<rect x="6.4" y="11.4" width="11.2" height="6.2" rx=".8"/><path d="M6 11.4h12M8.6 8.2h4.6v2.4H8.6z"/><circle cx="10.9" cy="9.4" r=".7"/>' },
      { k: 'role_hub', l: 'Kablosuz röle / hub', tips: ['role_hub'], svg: '<circle cx="12" cy="12" r="1.8"/><circle cx="7" cy="8" r="1.3"/><circle cx="17" cy="8" r="1.3"/><circle cx="12" cy="17.4" r="1.3"/><path d="M10.6 10.9 8 8.9M13.4 10.9 16 8.9M12 13.8v2.3"/>' },

  var gold = 'display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;border:1px solid #e0c56a;background:linear-gradient(180deg,#fff6df 0%,#f4e3b0 55%,#ebd9a0 100%);color:#4a2f1a;font:inherit;font-size:16px;font-weight:800;cursor:pointer;width:100%;';
  var lab = 'display:grid;gap:4px;font-size:13px;font-weight:700;color:#5f6b7a;';
  b.innerHTML = '<div role="dialog" aria-modal="true" aria-label="Cihaz ekle" style="background:#f2f3f5;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 10px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;">' +
    '<section style="background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:12px;display:grid;gap:10px;">' +
    '<div style="display:flex;align-items:center;gap:8px;"><span style="font-size:22px">📡</span><b style="font-size:18px;">Cihaz ekle</b>' + (Dv.isDemo && Dv.isDemo() ? '<span style="font-size:11px;font-weight:800;color:#1864ab;background:#e7f5ff;border:1px solid #a5d8ff;border-radius:999px;padding:1px 8px;">Demo</span>' : '') + '</div>' +
    '<label style="' + lab + '">Cihaz türü<select data-ce="tip" style="' + inp + '">' + TIPS.map(function (t) { return '<option value="' + t[0] + '">' + e(t[1]) + (t[2] ? ' · kovan' : ' · arılık') + '</option>'; }).join('') + '</select></label>' +
    '<label style="' + lab + '">Arılık<select data-ce="ap" style="' + inp + '">' + aps.map(function (a) { return '<option value="' + e(a.id) + '"' + (String(a.id) === ap0 ? ' selected' : '') + '>' + e(a.name) + '</option>'; }).join('') + '</select></label>' +
    '<label style="' + lab + '" data-ce-hivewrap>Kovan<select data-ce="hive" style="' + inp + '">' + hiveOpts(ap0) + '</select></label>' +
    '<label style="' + lab + '" data-ce-yerwrap>Sensör nerede?<select data-ce="yer" style="' + inp + '"><option value="kulucka">Kuluçkalıkta (yavrulu bölüm)</option><option value="ballik">Ballıkta</option><option value="">Bilmiyorum</option></select></label>' +
    '<label style="' + lab + '">Ad / seri no (isteğe bağlı)<input data-ce="name" type="text" maxlength="60" style="' + inp + '"></label>' +
    '<p style="margin:0;font-size:13px;color:#5f6b7a;">Cihaz kaydedilir; ilk okuma gelene kadar durumu «Veri yok» görünür.</p>' +
    '<p data-ce="msg" role="status" style="margin:0;font-size:14px;font-weight:700;color:#c92a2a;"></p>' +
    '<div style="display:grid;grid-template-columns:calc((100% - 10px) / 3) 1fr;column-gap:5px;"><button type="button" data-ce-close style="' + gold + '">◀ Geri</button><button type="button" data-ce-save style="' + gold + '">▶ Kaydet</button></div>' +
    '</section></div>';
  document.body.appendChild(b);
  function q(k) { return b.querySelector('[data-ce="' + k + '"]'); }
  function needHive() { var t = q('tip').value; return TIPS.some(function (x) { return x[0] === t && x[2]; }); }
  function sync() { b.querySelector('[data-ce-hivewrap]').style.display = needHive() ? '' : 'none'; b.querySelector('[data-ce-yerwrap]').style.display = q('tip').value === 'isi_nem' ? '' : 'none'; }
  sync();
  b.addEventListener('change', function (ev) { var k = ev.target.getAttribute('data-ce'); if (k === 'ap') q('hive').innerHTML = hiveOpts(ev.target.value); if (k === 'tip') sync(); });
  b.addEventListener('click', function (ev) {
    if (ev.target === b || ev.target.closest('[data-ce-close]')) { b.remove(); return; }
    if (!ev.target.closest('[data-ce-save]')) return;
    var m = q('msg');
    if (!aps.length) { m.textContent = 'Önce bir arılık ekleyin (Ayarlar › Arılıklar)'; return; }
    if (needHive() && !q('hive').value) { m.textContent = 'Kovan seçin'; return; }
    try {
      Dv.addDevice({ tip: q('tip').value, apiaryId: q('ap').value, hiveId: needHive() ? q('hive').value : null, name: q('name').value, yer: q('tip').value === 'isi_nem' ? q('yer').value : '' });
      b.remove(); location.reload();
    } catch (err) { m.textContent = err.message || 'Kaydedilemedi'; }
  });
};
