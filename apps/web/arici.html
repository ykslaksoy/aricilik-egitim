<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SüperArı — Patron</title>
  <link rel="stylesheet" href="/panels.css?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
</head>
<body class="panel-body" data-role="arici">
  <header class="panel-header">
    <div>
      <h1><span class="brand-mark">SüperArı</span> <span class="role-chip role-arici">Patron</span></h1>
      <p class="sub" id="hdr-sub">Kovan · uyarı · muayene</p>
    </div>
    <div class="panel-actions">
      <a class="btn-p ghost" href="/giris.html">Ana ekran</a>
      <button type="button" class="btn-p" id="btn-new-session">+ Oturum</button>
      <button type="button" class="btn-p" id="btn-logout">Çıkış</button>
    </div>
  </header>

  <div id="login-view" class="login-card">
    <h2>Patron girişi</h2>
    <p class="hint">Demo: Ayşe PIN <strong>1111</strong> · tek kullanıcı PIN yeterli</p>
    <label>İşletme
      <select id="org-select"></select>
    </label>
    <label>Adın
      <input id="ad" type="text" placeholder="Arıcı Ayşe" value="Arıcı Ayşe" />
    </label>
    <label>PIN
      <input id="pin" type="password" inputmode="numeric" maxlength="8" value="1111" />
    </label>
    <div class="row-btns">
      <button type="button" class="btn-p" id="btn-login-back">← Geri</button>
      <button type="button" class="btn-p primary" id="btn-login">Giriş</button>
    </div>
    <p id="login-err" class="warn-text muted"></p>
  </div>

  <main id="app-view" class="panel-main hidden">
    <p class="session-bar" id="session-bar"></p>

    <nav class="screen-tabs" id="tiles" aria-label="Ekranlar">
      <button type="button" class="app-tile wide active" data-panel="hives" id="tile-hives">
        <span class="tile-label">1 · Kovan listesi</span>
        <span class="tile-value" id="n-hives">0</span>
        <span class="tile-hint" id="hives-hint">özet · satıra dokun</span>
      </button>
      <button type="button" class="app-tile warn" data-panel="alerts" id="tile-alerts">
        <span class="tile-label">2 · Uyarılar</span>
        <span class="tile-value" id="n-alerts">0</span>
        <span class="tile-hint">uygulama içi</span>
      </button>
      <button type="button" class="app-tile" data-panel="muayene" id="tile-muayene">
        <span class="tile-label">3 · Muayene</span>
        <span class="tile-value" id="n-muayene">—</span>
        <span class="tile-hint">kayıt ekle</span>
      </button>
    </nav>

    <section class="app-panel open" id="panel-hives">
      <h2 class="app-section-title">Kovan listesi</h2>
      <ul class="hive-list" id="hives"></ul>
    </section>

    <section class="app-panel" id="panel-alerts" aria-live="polite">
      <h2 class="app-section-title">Uyarılar</h2>
      <p class="muted" style="margin:0 0 0.6rem">Hat yoksa SMS/WA şart değil — buradan takip.</p>
      <ul class="list-plain alert-cards" id="alerts"></ul>
    </section>

    <section class="app-panel" id="panel-muayene">
      <h2 class="app-section-title">Muayene kaydı</h2>
      <form class="muayene-form card" id="muayene-form">
        <label>Kovan
          <select id="m-hive" required></select>
        </label>
        <label>Not
          <textarea id="m-not" rows="3" placeholder="Yavru durumu, çerçeve, besleme…" required></textarea>
        </label>
        <label>İlaç (isteğe bağlı)
          <input id="m-ilac" type="text" placeholder="örn. oksalik" />
        </label>
        <label>Besleme (isteğe bağlı)
          <input id="m-besleme" type="text" placeholder="örn. şurup 1:1" />
        </label>
        <div class="row-btns">
          <button type="submit" class="btn-p primary" id="btn-muayene-save">Kaydet</button>
        </div>
        <p id="m-msg" class="muted"></p>
      </form>
      <h3 class="app-section-title" style="margin-top:1rem">Son kayıtlar</h3>
      <ul class="list-plain" id="muayene-list"></ul>
    </section>
  </main>

  <script src="/panels.js?v=4"></script>
  <script>
    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    let prevSession = null;
    let onLoginScreen = false;
    let openPanel = "hives";
    let cache = { hives: [], alerts: [], journalByHive: {} };

    function statusPill(status) {
      const label = PanelLabels.hiveStatus(status);
      const cls =
        status === "alert" || status === "fault" || status === "offline" || status === "weak"
          ? "warn"
          : status === "watch" || status === "degraded"
            ? "watch"
            : "ok";
      return `<span class="pill ${cls}">${label}</span>`;
    }

    function setPanel(name) {
      openPanel = name;
      document.querySelectorAll(".app-tile").forEach((el) => {
        el.classList.toggle("active", el.dataset.panel === openPanel);
      });
      ["hives", "alerts", "muayene"].forEach((p) => {
        document.getElementById(`panel-${p}`).classList.toggle("open", openPanel === p);
      });
      if (name === "muayene") loadJournalPreview();
    }

    async function fillOrgs() {
      const { orgs } = await PanelAuth.loadOrgs();
      const sel = document.getElementById("org-select");
      sel.innerHTML = orgs.map((o) => `<option value="${o.id}">${o.ad}</option>`).join("");
      sel.value = PanelAuth.orgFromUrl;
    }

    function showLogin({ keepPrev } = {}) {
      if (keepPrev) prevSession = PanelAuth.getSession();
      onLoginScreen = true;
      loginView.classList.remove("hidden");
      appView.classList.add("hidden");
    }

    function showApp() {
      onLoginScreen = false;
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
    }

    function renderAlerts(alerts) {
      const unread = (alerts || []).filter((a) => !a.read);
      document.getElementById("n-alerts").textContent = String(unread.length);
      document.getElementById("tile-alerts").classList.toggle("warn", unread.length > 0);
      document.getElementById("alerts").innerHTML = unread.length
        ? unread
            .slice(0, 20)
            .map(
              (a) =>
                `<li class="alert-card">
                  <span class="pill warn">${PanelLabels.alertType(a.type)}</span>
                  <strong>Kovan ${a.hiveId ?? "—"}</strong>
                  <span>${PanelLabels.cleanMessage(a.message || a.title)}</span>
                </li>`
            )
            .join("")
        : `<li class="empty-state">Uyarı yok — filo sakin</li>`;
    }

    function renderHives(hives) {
      const warn = hives.filter((h) =>
        ["alert", "fault", "weak", "watch", "offline", "degraded"].includes(h.status)
      ).length;
      document.getElementById("n-hives").textContent = String(hives.length);
      document.getElementById("hives-hint").textContent =
        warn > 0 ? `${warn} dikkat · satıra dokun` : "hepsi özet · satıra dokun";

      const hiveSel = document.getElementById("m-hive");
      hiveSel.innerHTML = hives
        .map((h) => {
          const loc = h.konumEtiket || h.apiaryLocation?.konumEtiket || "";
          return `<option value="${h.hiveId}">#${h.hiveId}${loc ? " · " + loc : ""}</option>`;
        })
        .join("");

      document.getElementById("hives").innerHTML = hives
        .slice(0, 50)
        .map((h) => {
          const c = h.colony || {};
          const loc = h.konumEtiket || h.apiaryLocation?.konumEtiket || "—";
          return `<li class="hive-item" data-id="${h.hiveId}">
            <button type="button" class="hive-item-btn" aria-expanded="false">
              <span class="hid">#${h.hiveId}</span>
              <span class="meta">
                <strong>${loc} · ${h.weightKg ?? "—"} kg</strong>
                <span>Skor ${c.score ?? "—"} · ${PanelLabels.hiveStatus(h.status)}</span>
              </span>
              ${statusPill(h.status)}
              <span class="chev">›</span>
            </button>
            <div class="hive-detail">
              <dl>
                <dt>Durum</dt><dd>${PanelLabels.hiveStatus(h.status)}</dd>
                <dt>Ağırlık</dt><dd>${h.weightKg ?? "—"} kg</dd>
                <dt>Skor</dt><dd>${c.score ?? "—"}</dd>
                <dt>Konum</dt><dd>${loc}</dd>
              </dl>
              <button type="button" class="btn-p primary btn-to-muayene" data-hive="${h.hiveId}">Muayene kaydı →</button>
            </div>
          </li>`;
        })
        .join("");

      document.querySelectorAll(".hive-item-btn").forEach((btn) => {
        btn.onclick = () => {
          const item = btn.closest(".hive-item");
          const open = item.classList.toggle("open");
          btn.setAttribute("aria-expanded", open ? "true" : "false");
        };
      });
      document.querySelectorAll(".btn-to-muayene").forEach((btn) => {
        btn.onclick = () => {
          document.getElementById("m-hive").value = btn.dataset.hive;
          setPanel("muayene");
        };
      });
    }

    async function loadJournalPreview() {
      const hiveId = Number(document.getElementById("m-hive").value);
      const listEl = document.getElementById("muayene-list");
      if (!hiveId) {
        listEl.innerHTML = `<li class="empty-state">Kovan seç</li>`;
        return;
      }
      try {
        const data = await fetch(`/api/hives/${hiveId}/journal`).then((r) => r.json());
        const entries = data.entries || [];
        cache.journalByHive[hiveId] = entries;
        document.getElementById("n-muayene").textContent = String(entries.length);
        listEl.innerHTML = entries.length
          ? entries
              .slice(0, 12)
              .map((e) => {
                const when = (e.tarih || "").slice(0, 16).replace("T", " ");
                const extra = [e.ilac && `ilaç: ${e.ilac}`, e.besleme && `besleme: ${e.besleme}`]
                  .filter(Boolean)
                  .join(" · ");
                return `<li class="alert-card">
                  <span class="pill ok">${e.tip || "muayene"}</span>
                  <strong>${when}</strong>
                  <span>${PanelLabels.cleanMessage(e.not || "—")}${extra ? " · " + extra : ""}</span>
                </li>`;
              })
              .join("")
          : `<li class="empty-state">Bu kovan için kayıt yok</li>`;
      } catch {
        listEl.innerHTML = `<li class="empty-state">Günlük yüklenemedi</li>`;
      }
    }

    async function render() {
      const sess = PanelAuth.requireSession();
      if (!sess || sess.rol !== "arici") {
        showLogin();
        return;
      }
      showApp();
      document.getElementById("session-bar").textContent = `${sess.ad} · ${sess.orgAd}`;
      document.getElementById("hdr-sub").textContent = sess.orgAd;

      const [{ hives }, { alerts }] = await Promise.all([
        fetch("/api/hives").then((r) => r.json()),
        fetch("/api/alerts").then((r) => r.json()),
      ]);
      cache = { ...cache, hives, alerts };
      renderAlerts(alerts);
      renderHives(hives);
      setPanel(openPanel || "hives");
    }

    function goBackFromLogin() {
      if (prevSession && prevSession.rol === "arici") {
        PanelAuth.setSession(prevSession);
        prevSession = null;
        render();
        return;
      }
      const cur = PanelAuth.getSession();
      if (cur && cur.rol === "arici" && onLoginScreen) {
        render();
        return;
      }
      location.href = "/giris.html";
    }

    document.getElementById("tiles").addEventListener("click", (ev) => {
      const tile = ev.target.closest(".app-tile");
      if (!tile) return;
      setPanel(tile.dataset.panel);
    });

    document.getElementById("m-hive").addEventListener("change", () => loadJournalPreview());

    document.getElementById("muayene-form").onsubmit = async (ev) => {
      ev.preventDefault();
      const hiveId = Number(document.getElementById("m-hive").value);
      const sess = PanelAuth.getSession();
      const body = {
        tip: "muayene",
        not: document.getElementById("m-not").value.trim(),
        ilac: document.getElementById("m-ilac").value.trim() || null,
        besleme: document.getElementById("m-besleme").value.trim() || null,
        arici: sess?.ad || null,
      };
      const msg = document.getElementById("m-msg");
      try {
        const res = await fetch(`/api/hives/${hiveId}/journal`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error("save_failed");
        msg.textContent = "Kayıt alındı";
        document.getElementById("m-not").value = "";
        document.getElementById("m-ilac").value = "";
        document.getElementById("m-besleme").value = "";
        await loadJournalPreview();
      } catch {
        msg.textContent = "Kayıt başarısız";
      }
    };

    document.getElementById("btn-login").onclick = async () => {
      try {
        await PanelAuth.login({
          orgId: document.getElementById("org-select").value,
          ad: document.getElementById("ad").value,
          pin: document.getElementById("pin").value,
        });
        prevSession = null;
        history.replaceState({}, "", `/arici.html?org=${document.getElementById("org-select").value}`);
        await render();
      } catch (e) {
        document.getElementById("login-err").textContent = e.message;
      }
    };
    document.getElementById("btn-login-back").onclick = () => goBackFromLogin();
    document.getElementById("btn-logout").onclick = () => {
      PanelAuth.logout();
      location.href = "/giris.html";
    };
    document.getElementById("btn-new-session").onclick = () => {
      showLogin({ keepPrev: true });
      document.getElementById("ad").value = "";
      document.getElementById("pin").value = "";
      document.getElementById("login-err").textContent = "";
    };

    fillOrgs().then(render);
  </script>
</body>
</html>
