<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Dışa aktarma</title>
<link rel="stylesheet" href="rapor-common.css" />

</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Dışa aktarma</h1>
        <p id="pageSub">CSV indir · PDF için yazdır</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="filters">
      <label>Sezon
        <select id="seasonSel"></select>
      </label>
      <label>Rapor türü
        <select id="kindSel">
          <option value="ozet">Sezon özeti</option>
          <option value="hasat">Hasat</option>
          <option value="gelir">Gelir</option>
          <option value="gider">Gider</option>
          <option value="muayene">Muayene / petek</option>
          <option value="uyari">Uyarı geçmişi</option>
          <option value="gorev">Görev geçmişi</option>
          <option value="karzarar">Kâr-zarar</option>
        </select>
      </label>
    </div>
    <div class="btn-row">
      <button type="button" class="btn" id="btnCsv">CSV indir</button>
      <button type="button" class="btn secondary" id="btnPrint">Yazdır / PDF kaydet</button>
    </div>
    <section class="card-block">
      <h2>Önizleme</h2>
      <div id="previewMeta" class="meta" style="margin-bottom:8px;font-size:12px;color:var(--muted)"></div>
      <div id="preview" style="overflow-x:auto"></div>
    </section>
    <p class="hint">CSV tarayıcıda oluşturulur (UTF-8 BOM). PDF için sistem yazdır diyaloğundan «PDF olarak kaydet» seçin.</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler
    </a>
    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=breed-plan-3"></script>
<script src="gider-store.js"></script>
<script src="rapor-store.js"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  if (!R) return;
  var seasonSel = document.getElementById('seasonSel');
  var kindSel = document.getElementById('kindSel');
  var cur = R.currentSeasonYear();
  [cur, cur - 1].forEach(function (y) {
    var o = document.createElement('option');
    o.value = y; o.textContent = String(y); if (y === cur) o.selected = true;
    seasonSel.appendChild(o);
  });
  function bundle() {
    return R.exportBundle(kindSel.value, Number(seasonSel.value) || cur);
  }
  function render() {
    var b = bundle();
    document.getElementById('previewMeta').textContent = b.filename + ' · ' + b.rows.length + ' satır';
    var html = '<table style="width:100%;border-collapse:collapse;font-size:11px">';
    html += '<thead><tr>' + b.headers.map(function (h) {
      return '<th style="text-align:left;padding:6px 4px;border-bottom:1px solid #e4e6ea;color:var(--muted)">' + h + '</th>';
    }).join('') + '</tr></thead><tbody>';
    b.rows.slice(0, 40).forEach(function (row) {
      html += '<tr>' + row.map(function (c) {
        return '<td style="padding:6px 4px;border-bottom:1px solid #f0f1f3;font-weight:600">' + c + '</td>';
      }).join('') + '</tr>';
    });
    html += '</tbody></table>';
    if (b.rows.length > 40) html += '<p class="meta" style="margin-top:8px;font-size:11px;color:var(--muted)">İlk 40 satır gösteriliyor…</p>';
    document.getElementById('preview').innerHTML = html || '<p class="meta">Veri yok.</p>';
  }
  document.getElementById('btnCsv').addEventListener('click', function () {
    var b = bundle();
    R.downloadCsv(b.filename, b.headers, b.rows);
  });
  document.getElementById('btnPrint').addEventListener('click', function () { window.print(); });
  seasonSel.addEventListener('change', render);
  kindSel.addEventListener('change', render);
  render();
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
