<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo seç · Hardal Arıcılık</title>
<style>
  :root {
    --bg: #1a1a1a;
    --page: #f5f0e6;
    --brown: #4a2f1a;
    --brown-mid: #5c3a1f;
    --hardal: #d4a017;
    --hardal-soft: #f4e3b0;
    --card: #fffdf8;
    --line: #e0c56a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--brown);
  }
  body {
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
    padding: 20px 16px 18px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 8px 28px rgba(0,0,0,.25);
  }
  header h1 {
    font-size: 1.65rem;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--brown);
    margin-bottom: 6px;
  }
  header p {
    font-size: .92rem;
    color: var(--brown-mid);
    line-height: 1.45;
    max-width: 36em;
    margin: 0 auto;
  }
  .grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .logo-option {
    background: var(--card);
    border: 1px solid #e8dcc8;
    border-radius: 14px;
    padding: 14px 14px 12px;
    box-shadow: 0 2px 10px rgba(74,47,26,.08);
    scroll-margin-top: 12px;
  }
  .logo-option:focus-within {
    outline: 2px solid rgba(212,160,23,.55);
    outline-offset: 2px;
  }
  .logo-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    margin-bottom: 10px;
    border-radius: 999px;
    background: linear-gradient(180deg, #f0c43a, var(--hardal));
    color: #fff;
    font-size: .82rem;
    font-weight: 800;
    letter-spacing: .04em;
    box-shadow: 0 1px 3px rgba(74,47,26,.2);
  }
  /* Ana sayfa brand-strip mock — sol çizgi YOK */
  .brand-strip {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 12px 7px 8px;
    background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft) 55%, #ebd9a0 100%);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
    color: var(--brown);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .03em;
  }
  .brand-logo-btn {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid rgba(184,134,11,.35);
    border-radius: 11px;
    background: linear-gradient(165deg, #fffdf6 0%, #fff4cc 48%, #f0d478 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(74,47,26,.16);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .brand-logo-btn .bee-3d {
    width: 30px;
    height: 30px;
    display: block;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.85)) drop-shadow(0 2px 2px rgba(61,38,22,.35));
    transform: perspective(120px) rotateX(6deg) rotateY(-4deg);
  }
  .brand-name {
    flex: 0 1 auto;
    line-height: 1.2;
    color: var(--brown);
    margin-left: 2px;
  }
  .logo-desc {
    margin-top: 10px;
    font-size: .82rem;
    color: #6b5340;
    line-height: 1.4;
  }
  .logo-desc strong {
    color: var(--brown-mid);
    font-weight: 700;
  }
  footer {
    margin-top: 24px;
    text-align: center;
    font-size: .78rem;
    color: #9a8870;
  }
  footer a {
    color: var(--hardal);
    text-decoration: none;
    font-weight: 600;
  }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Logo seç</h1>
    <p>Hardal Arıcılık marka şeridi için 10 arı logosu. Beğendiğiniz numarayı bize yazın — ana ekranda varsayılan logo olarak ayarlanacak.</p>
  </header>
  <div class="grid" id="logoGrid"></div>
  <footer>
    <a href="/ana.html">← Ana ekrana dön</a> · SüperArı
  </footer>
</div>
<script src="logos/hardal-bees.js"></script>
<script>
(function () {
  var LOGOS = window.HARDAL_BEE_LOGOS;
  var META = window.HARDAL_BEE_META;
  var grid = document.getElementById('logoGrid');
  if (!LOGOS || !grid) return;

  META.forEach(function (m, i) {
    var card = document.createElement('article');
    card.className = 'logo-option';
    card.id = 'logo-' + m.id;

    card.innerHTML =
      '<span class="logo-num">' + m.id + '</span>' +
      '<div class="brand-strip">' +
        '<span class="brand-logo-btn" aria-hidden="true">' + LOGOS[i] + '</span>' +
        '<span class="brand-name">Hardal Arıcılık</span>' +
      '</div>' +
      '<p class="logo-desc"><strong>' + m.title + '</strong> — ' + m.desc + '</p>';

    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
