<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Koloni sağlık</title>
<link rel="stylesheet" href="rapor-common.css" />

</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Koloni sağlık</h1>
        <p id="pageSub">Kovan durumu özeti</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2>Sağlık dağılımı</h2>
      <div id="bucketList"></div>
    </section>
    <section class="card-block">
      <h2>Arılık özeti</h2>
      <div id="apiaryList"></div>
    </section>
    <section class="card-block">
      <h2>Düşük skorlu kovanlar</h2>
      <div id="riskList"></div>
    </section>
    <section class="card-block">
      <h2>Ana arı ve ırk</h2>
      <div id="queenApiaryList"></div>
    </section>
    <section class="card-block">
      <h2>Yenilenecek ana arılar</h2>
      <div id="queenRenewList"></div>
      <p class="meta" style="margin-top:6px;">Kaynak: Koloni kayıtları (demo). Düzenleme yalnız <a href="kovanlar.html?view=koloni" style="text-decoration:underline;">Koloni</a> sayfasında.</p>
    </section>
    
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler
    </a>
    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-1"></script>
<script src="sensor-health.js"></script>
<script src="rapor-store.js"></script>
<script src="koloni.js?v=koloni-1"></script>
<script>
(function () {
  var H = window.SuperAriSensorHealth;
  var D = window.SuperAriDemo;
  if (!H || !D) return;
  var hives = D.loadHives ? D.loadHives() : [];
  var all = H.evaluateAll(hives);
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">Ort. sağlık</div><div class="v">' + all.avg + '</div></div>' +
    '<div class="stat"><div class="k">Sağlıklı</div><div class="v">' + all.counts.ok + '</div></div>' +
    '<div class="stat"><div class="k">Müdahale</div><div class="v">' + all.counts.act + '</div></div>' +
    '<div class="stat"><div class="k">Kovan</div><div class="v">' + all.hives.length + '</div></div>';
  document.getElementById('bucketList').innerHTML =
    '<div class="row-item"><div class="left"><div class="title">Sağlıklı</div></div><div class="right"><span class="badge ok">' + all.counts.ok + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">İzle</div></div><div class="right"><span class="badge warn">' + all.counts.watch + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Kontrol</div></div><div class="right"><span class="badge warn">' + all.counts.check + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Müdahale</div></div><div class="right"><span class="badge bad">' + all.counts.act + '</span></div></div>';
  var byAp = {};
  all.hives.forEach(function (x) {
    var hive = hives.filter(function (h) { return String(h.id) === String(x.hiveId); })[0];
    var aid = hive ? String(hive.apiaryId || 'none') : 'none';
    if (!byAp[aid]) byAp[aid] = { name: aid, sum: 0, n: 0 };
    byAp[aid].sum += x.score; byAp[aid].n += 1;
    if (hive && D.apiaryById) {
      var ap = D.apiaryById(hive.apiaryId);
      if (ap) byAp[aid].name = ap.name || ap.place || aid;
    }
  });
  document.getElementById('apiaryList').innerHTML = Object.keys(byAp).map(function (k) {
    var a = byAp[k];
    var avg = Math.round(a.sum / a.n);
    return '<div class="row-item"><div class="left"><div class="title">' + a.name + '</div>' +
      '<div class="meta">' + a.n + ' kovan</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + avg + '%"></div></div></div>' +
      '<div class="right">' + avg + '</div></div>';
  }).join('') || '<p class="meta">Kovan yok.</p>';
  document.getElementById('riskList').innerHTML = all.hives.filter(function (x) { return x.score < 85; }).slice(0, 12).map(function (x) {
    return '<div class="row-item"><div class="left"><div class="title">' + x.name + '</div>' +
      '<div class="meta">' + x.band.label + '</div></div>' +
      '<div class="right"><span class="badge ' + x.band.tone + '">' + x.score + '</span></div></div>';
  }).join('') || '<p class="meta">Tüm kovanlar 85+.</p>';

  /* Ana arı / ırk — Koloni kaydından (tek kaynak) okunur. */
  var C = D.colony, K = window.SuperAriKoloni;
  if (C) {
    var esc = function (t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var aps = D.loadApiaries ? D.loadApiaries() : [];
    document.getElementById('queenApiaryList').innerHTML = aps.map(function (ap) {
      var hs = hives.filter(function (h) { return String(h.apiaryId) === String(ap.id); });
      var sm = C.summary(hs);
      if (!sm.total) return '';
      return '<div class="row-item"><div class="left"><div class="title">' + esc(ap.name) + '</div>' +
        '<div class="meta">' + esc(sm.breeds.map(function (b) { return b.breed + ' ' + b.count; }).join(' · ')) +
        ' · ort. ana yaşı ' + (sm.avgQueenAge != null ? String(sm.avgQueenAge).replace('.', ',') : '—') +
        (sm.unknown ? ' · bilinmeyen ' + sm.unknown : '') + '</div></div>' +
        '<div class="right"><span class="badge ' + (sm.requeen ? 'bad' : 'ok') + '" title="Yenilenecek ana">' + sm.requeen + '</span></div></div>';
    }).join('') || '<p class="meta">Kovan yok.</p>';
    var renew = hives.filter(function (h) { return C.queenStatus(h) === 'Yenile'; })
      .sort(function (a, b) { return (C.queenAge(b) - C.queenAge(a)) || (a.id - b.id); });
    document.getElementById('queenRenewList').innerHTML = renew.slice(0, 20).map(function (h) {
      var ap = D.apiaryById ? D.apiaryById(h.apiaryId) : null;
      return '<div class="row-item"><div class="left"><div class="title">' + (K ? K.dotHtml(h.queenYear) : '') + esc(h.name) + '</div>' +
        '<div class="meta">' + esc((ap ? ap.name + ' · ' : '') + (h.breed || '—') + ' · ' + h.queenYear) +
        ' · <a href="kovanlar.html?view=koloni&hiveId=' + encodeURIComponent(h.id) + '" style="text-decoration:underline;">Düzenle</a></div></div>' +
        '<div class="right"><span class="badge bad">' + C.queenAge(h) + ' yaş</span></div></div>';
    }).join('') + (renew.length > 20 ? '<p class="meta">+' + (renew.length - 20) + ' kovan daha</p>' : '') ||
      '<p class="meta">Yenilenecek ana arı yok.</p>';
  }
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
