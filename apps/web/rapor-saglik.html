<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Koloni sağlık</title>
<link rel="stylesheet" href="rapor-common.css" />

</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Koloni sağlık</h1>
        <p id="pageSub">Tartı, oğul ve skor özeti</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2>Sağlık dağılımı</h2>
      <div id="bucketList"></div>
    </section>
    <section class="card-block">
      <h2>Arılık özeti</h2>
      <div id="apiaryList"></div>
    </section>
    <section class="card-block">
      <h2>Düşük skorlu kovanlar</h2>
      <div id="riskList"></div>
    </section>
    <p class="hint">Skorlar kovan kayıtlardaki healthScore / tartı / oğul riski alanlarından hesaplanır.</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
      Ana
    </a>
    <a class="tab" href="kovanlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="5" rx="1"/><rect x="5" y="10" width="14" height="5" rx="1"/><rect x="5" y="16" width="14" height="4" rx="1"/></svg>
      Kovanlar
    </a>
    <a class="tab" href="uyarilar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 7-6 7-6 12"/><path d="M10 21h4"/></svg>
      Uyarılar
    </a>
    <a class="tab" href="gorevler.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Görevler
    </a>
    <a class="tab" href="ayarlar.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
      Ayarlar
    </a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js"></script>
<script src="rapor-store.js"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  if (!R) return;
  var s = R.healthSummary();
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="k">Ort. sağlık</div><div class="v">' + s.avgHealth + '</div></div>' +
    '<div class="stat"><div class="k">Ort. tartı</div><div class="v">' + s.avgWeight + ' kg</div></div>' +
    '<div class="stat"><div class="k">Δ tartı toplam</div><div class="v ' + (s.deltaSum >= 0 ? 'pos' : 'neg') + '">' +
      (s.deltaSum >= 0 ? '+' : '') + s.deltaSum + ' kg</div></div>' +
    '<div class="stat"><div class="k">Kovan</div><div class="v">' + s.hiveCount + '</div></div>';
  var b = s.buckets; var sw = s.swarm;
  document.getElementById('bucketList').innerHTML =
    '<div class="row-item"><div class="left"><div class="title">İyi</div></div><div class="right"><span class="badge ok">' + b.iyi + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Dikkat</div></div><div class="right"><span class="badge warn">' + b.dikkat + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Kritik</div></div><div class="right"><span class="badge bad">' + b.kritik + '</span></div></div>' +
    '<div class="row-item"><div class="left"><div class="title">Oğul riski (D / O / Y)</div><div class="meta">Düşük / Orta / Yüksek</div></div>' +
    '<div class="right">' + sw.dusuk + ' / ' + sw.orta + ' / ' + sw.yuksek + '</div></div>';
  document.getElementById('apiaryList').innerHTML = s.byApiary.map(function (a) {
    return '<div class="row-item"><div class="left"><div class="title">' + a.apiaryName + '</div>' +
      '<div class="meta">' + a.count + ' kovan · Δ ' + (a.deltaSum >= 0 ? '+' : '') + a.deltaSum +
      ' kg · kritik ' + a.kritik + ' · oğul↑ ' + a.ogulYuksek + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + a.avgHealth + '%"></div></div></div>' +
      '<div class="right">' + a.avgHealth + '</div></div>';
  }).join('') || '<p class="meta">Kovan yok.</p>';
  document.getElementById('riskList').innerHTML = s.topRisk.map(function (h) {
    var cls = h.healthScore < 50 ? 'bad' : (h.healthScore < 70 ? 'warn' : 'ok');
    return '<div class="row-item"><div class="left"><div class="title">' + (h.name || ('Kovan ' + h.id)) + '</div>' +
      '<div class="meta">' + (h.weightKg || '—') + ' kg · Δ ' + (h.deltaKg >= 0 ? '+' : '') + (h.deltaKg || 0) +
      ' · oğul ' + (h.swarmRisk || '—') + '</div></div>' +
      '<div class="right"><span class="badge ' + cls + '">' + h.healthScore + '</span></div></div>';
  }).join('') || '<p class="meta">Veri yok.</p>';
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
