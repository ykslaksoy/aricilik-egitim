<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Muayene / petek</title>
<link rel="stylesheet" href="rapor-common.css" />

</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Muayene / petek</h1>
        <p id="pageSub">Tarama ve saha muayene özeti</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="filters">
      <label>Sezon
        <select id="seasonSel"></select>
      </label>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2>Kayıtlar</h2>
      <div id="list"></div>
    </section>
    <p class="hint">Muayene ve petek tarama demo kayıtları. Petek tarama akışı <a href="petek-tarama.html" style="color:var(--brown);font-weight:700">petek-tarama.html</a> üzerinden de çalışır.</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-6v-5H10v5H4z"/></svg>Ana</a><a class="tab" href="bakim.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="12" height="15.5" rx="2"/><path d="M9.5 4.5V3.6h5v.9"/><path d="M9 11l2 2 4-4.2M9 16.5h6"/></svg>Bakım</a><button type="button" class="tab tab-plus" data-quick-record aria-label="Hızlı kayıt"><span class="plus-c" aria-hidden="true">＋</span><span class="plus-l">Kayıt</span></button><a class="tab" href="bugun.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6" width="15" height="13.5" rx="2"/><path d="M4.5 10h15M9 4v3.5M15 4v3.5"/><circle cx="12" cy="14.6" r="1.8"/></svg>Bugün</a><a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 4.5v2.2M12 17.3V19.5M4.5 12h2.2M17.3 12H19.5M7 7l1.6 1.6M15.4 15.4 17 17M17 7l-1.6 1.6M8.6 15.4 7 17"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-22"></script>
<script src="rapor-store.js?v=koloni-22"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  var D = window.SuperAriDemo;
  if (!R) return;
  var sel = document.getElementById('seasonSel');
  var cur = R.currentSeasonYear();
  [cur, cur - 1].forEach(function (y) {
    var o = document.createElement('option');
    o.value = y; o.textContent = y + ' sezonu'; if (y === cur) o.selected = true;
    sel.appendChild(o);
  });
  function hiveName(id) {
    if (!D) return 'Kovan ' + id;
    var h = D.hiveById(id);
    return h ? h.name : ('Kovan ' + id);
  }
  function apiaryName(id) {
    if (!D) return id;
    var a = D.apiaryById(id);
    return a ? (a.name || a.place) : id;
  }
  function render() {
    var y = Number(sel.value) || cur;
    var rows = R.filterBySeason(R.loadInspections(), y).slice().sort(function (a, b) {
      return String(b.date).localeCompare(String(a.date));
    });
    var muayene = rows.filter(function (r) { return r.type === 'muayene'; }).length;
    var petek = rows.filter(function (r) { return r.type === 'petek'; }).length;
    var avg = rows.length ? Math.round(rows.reduce(function (s, r) { return s + (Number(r.score) || 0); }, 0) / rows.length) : 0;
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="k">Kayıt</div><div class="v">' + rows.length + '</div></div>' +
      '<div class="stat"><div class="k">Muayene</div><div class="v">' + muayene + '</div></div>' +
      '<div class="stat"><div class="k">Petek tarama</div><div class="v">' + petek + '</div></div>' +
      '<div class="stat"><div class="k">Ort. skor</div><div class="v">' + avg + '</div></div>';
    document.getElementById('list').innerHTML = rows.map(function (m) {
      var cls = m.score < 50 ? 'bad' : (m.score < 70 ? 'warn' : 'ok');
      var tip = m.type === 'petek' ? 'Petek' : 'Muayene';
      var detail = m.type === 'petek'
        ? (m.note || 'Petek tarama')
        : ('Yavru ' + m.brood + ' · bal ' + m.honey + ' · ana ' + m.queen + ' · varroa ' + m.varroa);
      return '<div class="row-item"><div class="left"><div class="title">' + hiveName(m.hiveId) +
        ' <span class="badge info">' + tip + '</span></div>' +
        '<div class="meta">' + m.date + ' · ' + apiaryName(m.apiaryId) + '<br>' + detail + '</div></div>' +
        '<div class="right"><span class="badge ' + cls + '">' + m.score + '</span></div></div>';
    }).join('') || '<p class="meta">Bu sezon kayıt yok.</p>';
  }
  sel.addEventListener('change', render);
  render();
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
<script src="nav.js?v=koloni-22"></script>
<script src="pwa.js?v=koloni-22"></script>
</body>
</html>
