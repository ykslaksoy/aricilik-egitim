<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kovanlar · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
  <style>
    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .mode-switch a {
      display: flex; align-items: center; justify-content: center;
      padding: 12px 10px; border-radius: 12px; text-decoration: none;
      font-size: 13px; font-weight: 800; border: 1.5px solid var(--card-border, #e4e6ea);
      background: #fff; color: var(--text, #1a1b1e);
    }
    .mode-switch a.active {
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      border-color: #e0c56a; color: var(--brown, #5c4813);
    }
    .choice-grid { display: grid; gap: 10px; }
    .choice-btn {
      display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
      padding: 14px 14px; border-radius: 14px; text-decoration: none;
      border: 1.5px solid #e0c56a;
      background: linear-gradient(180deg, #fff6df 0%, var(--hardal-soft, #fff3bf) 100%);
      color: var(--brown, #5c4813); font-family: inherit;
    }
    .choice-btn strong { font-size: 15px; font-weight: 800; color: var(--brown, #5c4813); }
    .choice-btn span { font-size: 12px; font-weight: 650; color: var(--muted, #868e96); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="nav">
      <a class="chip" href="ana.html">← Ana</a>
      <a class="chip" href="arici.html">Arıcı</a>
      <a class="chip" href="ayarlar.html">Ayarlar</a>
    </div>
    <div class="brand">
      <div class="brand-badge">🐝</div>
      <div>
        <h1>SüperArı</h1>
        <p id="pageSub">Kovanlar</p>
      </div>
    </div>

    <section class="card stack">
      <h2 style="margin:0;" id="pageTitle">Kovanlar</h2>
      <div id="koloniGrid"></div>
      <p class="muted" id="summary">Demo kovan listesi…</p>
      <div id="tartiTop" hidden></div>
      <div id="kvSearch" class="stack" style="gap:.5rem;" hidden></div>
      <div class="mode-switch" id="modeSwitch"></div>
      <div id="koloniTop"></div>
      <div class="list" id="hive-list"></div>
      <div class="note" id="pageNote">Statik demo. Canlı API bağlandığında burada listelenir.</div>
    </section>
  </main>
  <script src="demo-data.js?v=koloni-38"></script>
  <script src="rapor-store.js?v=koloni-38"></script>
  <script src="sensor-health.js?v=koloni-38"></script>
<script src="saglik-canli.js?v=koloni-38"></script>
  <script src="koloni.js?v=koloni-38"></script>
  <script src="irk-tahmin.js?v=koloni-38"></script>
  <script src="kovan-ara.js?v=koloni-38"></script>
  <script src="tarti-elle.js?v=koloni-38"></script>
  <script>
    (function () {
      var D = window.SuperAriDemo;
      if (!D) return;
      var params = new URLSearchParams(location.search);
      var view = (params.get('view') || '').toLowerCase();
      var focusId = params.get('id');
      var hasMode = params.has('mode');
      var modeParam = params.get('mode');
      var mode = modeParam === 'all' ? 'all' : (modeParam === 'apiary' ? 'apiary' : null);
      var apiaryFilter = params.get('apiary') || '';
      var editHiveId = view === 'koloni' ? params.get('hiveId') : null;
      var K = window.SuperAriKoloni || null;
      var TOPIC_KEYS = ['ana', 'guc', 'yavru', 'hastalik', 'besleme'];
      var topic = view === 'koloni' ? (params.get('topic') || '').toLowerCase() : '';
      if (TOPIC_KEYS.indexOf(topic) < 0) topic = '';
      if (!topic && view === 'koloni' && (params.get('tab') === 'queens' || editHiveId)) topic = 'ana';
      var gridEl = document.getElementById('koloniGrid');
      var sub = (topic === 'guc' || topic === 'besleme') && params.get('sub') === 'kis' ? 'kis' : '';
      function topicHref(t) {
        if (t === 'bolme' || t === 'tasima' || t === 'uretim') {
          return 'koloni-islem.html?islem=' + t + (apiaryFilter ? '&apiary=' + encodeURIComponent(apiaryFilter) : '');
        }
        if (t === 'ogul') {
          var ap = apiaryFilter || '';
          return 'uyarilar.html?view=ogul&' + (ap ? 'mode=apiary&apiary=' + encodeURIComponent(ap) : 'mode=all');
        }
        var q = new URLSearchParams(location.search);
        q.delete('hiveId');
        q.delete('tab');
        q.delete('sub');
        if (hasMode && mode && !q.get('mode')) q.set('mode', mode);
        if (apiaryFilter && !q.get('apiary')) q.set('apiary', apiaryFilter);
        if (t) q.set('topic', t); else q.delete('topic');
        return 'kovanlar.html?' + q.toString();
      }
      function renderGrid(list) {
        if (view !== 'koloni' || !K || !gridEl || !K.gridHtml) return;
        gridEl.innerHTML = K.gridHtml(list, topic, topicHref);
        if (gridEl.__bound) return;
        gridEl.__bound = true;
        gridEl.addEventListener('click', function (e) {
          var soon = e.target.closest ? e.target.closest('[data-soon]') : null;
          if (soon) K.openSoon(soon.getAttribute('data-soon'));
        });
      }
      var koloniTopEl = document.getElementById('koloniTop');
      var BULK_BTN = '<button type="button" class="kol-bulk-btn" id="btnBulkQueen">👑 Toplu ana arı değişimi</button>';
      var bulkCtx = { apiaryId: '', onSaved: null };
      function bindBulk(apiaryId, onSaved) {
        bulkCtx.apiaryId = apiaryId;
        bulkCtx.onSaved = onSaved;
        if (!koloniTopEl || koloniTopEl.__bulkBound) return;
        koloniTopEl.__bulkBound = true;
        koloniTopEl.addEventListener('click', function (e) {
          if (!e.target.closest || !e.target.closest('#btnBulkQueen')) return;
          K.openBulkEditor({ apiaryId: bulkCtx.apiaryId, onSaved: bulkCtx.onSaved });
        });
      }
      /* ?hiveId= (Düzenle bağlantıları): o kovanın arılığını aç + düzenleyiciyi göster. */
      if (editHiveId && !hasMode && !apiaryFilter) {
        var eh = D.hiveById(editHiveId);
        if (eh) {
          hasMode = true;
          mode = 'apiary';
          apiaryFilter = String(eh.apiaryId);
        }
      }
      var listEl = document.getElementById('hive-list');
      var titleEl = document.getElementById('pageTitle');
      var subEl = document.getElementById('pageSub');
      var summaryEl = document.getElementById('summary');
      var noteEl = document.getElementById('pageNote');
      var modeSwitchEl = document.getElementById('modeSwitch');
      /* Tartı görünümü: elle tartım her zaman (cihaz bağlı olsa da) girilebilir. */
      var TE = window.SuperAriTarti;
      function renderTartiTop() {
        var el = document.getElementById('tartiTop');
        if (!el || view !== 'tarti' || !TE) return;
        TE.ensureCss();
        var ap = params.get('apiary') || '';
        var rec = TE.all().filter(function (x) { if (!ap) return true; var hh = D.hiveById(x.hiveId); return hh && String(hh.apiaryId) === String(ap); }).slice(0, 5);
        el.hidden = false;
        el.innerHTML = '<button type="button" class="btn" data-te-open style="width:100%;min-height:50px;font-size:1.02rem;">⚖ Elle tartım gir</button>' +
          (rec.length ? '<div style="margin-top:.6rem;"><b style="font-size:.9rem;">Son elle tartımlar</b>' + rec.map(function (x) { return TE.rowHtml(x, { showHive: true }); }).join('') + '</div>' : '');
        if (!el.__b) { el.__b = true; el.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('[data-te-open]')) TE.open(params.get('hiveId') || '', { apiaryId: ap, onSaved: renderTartiTop }); }); }
      }
      renderTartiTop();

      var titles = {
        tarti: 'Tartı',
        saglik: 'Sağlık',
        koloni: 'Koloni',
        ariliklar: 'Arılıklar',
        '': 'Kovanlar'
      };
      var label = titles[view] != null ? titles[view] : 'Kovanlar';
      titleEl.textContent = label;
      subEl.textContent = label;

      if (view === 'saglik') {
        location.replace('saglik.html');
        return;
      }

      if (view === 'ariliklar') {
        location.replace('ariliklar.html');
        return;
      }

      if (view === 'arilik') {
        var focusApiary = params.get('apiary');
        if (focusApiary) {
          location.replace('arilik.html?id=' + encodeURIComponent(focusApiary));
          return;
        }
        location.replace('ariliklar.html');
        return;
      }

      if (focusId) {
        location.replace('kovan.html?id=' + encodeURIComponent(focusId));
        return;
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function pageHref(extra) {
        var parts = [];
        if (view) parts.push('view=' + encodeURIComponent(view));
        if (topic) parts.push('topic=' + encodeURIComponent(topic));
        if (sub) parts.push('sub=' + sub);
        if (extra) parts.push(extra);
        return 'kovanlar.html' + (parts.length ? '?' + parts.join('&') : '');
      }

      function choiceBtn(href, title, meta) {
        return '<a class="choice-btn" href="' + href + '">' +
          '<strong>' + esc(title) + '</strong>' +
          '<span>' + esc(meta) + '</span></a>';
      }

      function groupByApiary(hives) {
        var map = {};
        var order = [];
        hives.forEach(function (h) {
          var aid = String(h.apiaryId || 'none');
          if (!map[aid]) {
            map[aid] = [];
            order.push(aid);
          }
          map[aid].push(h);
        });
        return order.map(function (aid) {
          var ap = D.apiaryById(aid);
          return {
            apiaryId: aid,
            apiaryName: ap ? (ap.name || ap.place || 'Arılık') : 'Arılık',
            hives: map[aid]
          };
        });
      }

      function renderHiveCard(h) {
        var ap = D.apiaryById(h.apiaryId);
        var place = ap ? ap.name : '—';
        var badge;
        var meta;
        if (view === 'tarti') {
          var sign = h.deltaKg > 0 ? '+' : '';
          badge = sign + h.deltaKg.toFixed(1) + ' kg';
          var le = TE ? TE.latest(h.id) : null;
          meta = h.weightKg.toFixed(1) + ' kg · ' + place + (le ? ' · Elle: ' + String(le.kg).replace('.', ',') + ' kg (' + TE.fmtAt(le.at) + ')' : '');
        } else if (view === 'koloni') {
          badge = String(h.colonyScore);
          meta = 'Koloni · ' + place;
        } else {
          badge = h.weightKg.toFixed(1) + ' kg';
          meta = place + ' · sağlık ' + h.health + ' · oğul ' + h.swarmRisk;
        }
        var hsc = h.healthScore;
        if (window.SuperAriLiveHealth && SuperAriLiveHealth.isLive()) {
          try { var lev = SuperAriLiveHealth.evaluate(h); hsc = lev.score; if (view !== 'tarti' && view !== 'koloni') meta = place + ' · sağlık ' + (lev.score == null ? 'veri az' : lev.band.label + ' ' + lev.score); } catch (e) { hsc = null; }
        }
        var tone = hsc == null ? 'priority-3' : (hsc < 50 ? 'priority-1' : (hsc < 70 ? 'priority-2' : 'priority-3'));
        return (
          '<a class="item-card" id="hive-' + esc(h.id) + '" href="kovan.html?id=' + encodeURIComponent(h.id) + '" style="display:block;text-decoration:none;color:inherit;">' +
            '<div class="row">' +
              '<h3>' + (K && K.dotHtml ? K.dotHtml(h.queenYear) : '') + esc(h.name) + '</h3>' +
              '<span class="badge ' + tone + '">' + esc(badge) + '</span>' +
            '</div>' +
            (K && K.recordChipsHtml ? K.recordChipsHtml(h) : '') +
            '<div class="meta">' + esc(meta) +
              ' · <span onclick="event.preventDefault();event.stopPropagation();location.href=\'petek-tarama.html?hiveId=' + encodeURIComponent(h.id) + '\';" style="color:#2b6cb0;text-decoration:underline;cursor:pointer;">Petek tarama</span></div>' +
          '</a>'
        );
      }

      var hives = D.loadHives ? D.loadHives().slice() : D.hives.slice();
      var groups = groupByApiary(hives);

      /* Legacy apiary= without mode → already chose that apiary (list, not chooser) */
      var effectiveMode = mode;
      if (!hasMode && apiaryFilter) {
        effectiveMode = 'apiary';
      }

      /* Chooser: no mode and no apiary */
      if (!hasMode && !apiaryFilter) {
        if (view === 'koloni' && K && koloniTopEl) {
          renderGrid(hives);
          if (topic === 'ana' || !topic) {
            koloniTopEl.innerHTML = K.summaryHtml(hives, 'Tüm kovanlar · ana arı özeti') + BULK_BTN;
            bindBulk('', function () { renderGrid(D.loadHives()); koloniTopEl.innerHTML = K.summaryHtml(D.loadHives(), 'Tüm kovanlar · ana arı özeti') + BULK_BTN; });
          } else {
            koloniTopEl.innerHTML = '<p class="kol-sub" style="margin:0;font-weight:700;">' + esc(K.TOPIC_LABEL[topic]) + ' · kayıt için tüm kovanları veya bir arılığı seçin.</p>';
          }
        }
        summaryEl.textContent = hives.length + ' kovan · görünüm seçin';
        noteEl.textContent = 'Tüm kovanlar veya bir arılık seçin.';
        modeSwitchEl.innerHTML = '';
        var html = '<div class="choice-grid">' +
          choiceBtn(pageHref('mode=all'), 'Tüm kovanlar', hives.length + ' kovan tek listede');
        groups.forEach(function (g) {
          var cMeta = g.hives.length + ' kovan';
          if (view === 'koloni' && D.colony) {
            var cs = D.colony.summary(g.hives);
            cMeta += ' · ' + cs.breeds.map(function (b) { return b.breed; }).join(', ') +
              ' · yenilenecek ana ' + cs.requeen;
          }
          html += choiceBtn(
            pageHref('mode=apiary&apiary=' + encodeURIComponent(g.apiaryId)),
            g.apiaryName,
            cMeta
          );
        });
        if (!groups.length) {
          html += '<p class="muted">Bu durumda arılık yok.</p>';
        }
        html += '</div>';
        listEl.innerHTML = html;
        if (view === '' && window.SuperAriKovanAra) {
          var chooserHtml = html;
          var kvHost = document.getElementById('kvSearch');
          kvHost.hidden = false;
          window.SuperAriKovanAra.create({
            host: kvHost,
            hives: function () { return hives; },
            allHives: function () { return hives; },
            apiaryId: function () { return K && K.lastApiary ? K.lastApiary() : ''; },
            onChange: function (res, active) {
              listEl.innerHTML = active ? (res.map(renderHiveCard).join('') || '<p class="muted">Eşleşen kovan yok.</p>') : chooserHtml;
              modeSwitchEl.style.display = active ? 'none' : '';
            }
          });
        }
        return;
      }

      /* Filter to one apiary */
      if (effectiveMode === 'apiary' && apiaryFilter) {
        hives = hives.filter(function (h) { return String(h.apiaryId) === String(apiaryFilter); });
      }

      var filterApiary = apiaryFilter ? D.apiaryById(apiaryFilter) : null;
      var apName = filterApiary ? (filterApiary.name || filterApiary.place) : '';

      if (view === 'tarti') {
        summaryEl.textContent = hives.length + ' kovan · ' +
          (effectiveMode === 'all' ? 'Tüm kovanlar · tartı' : ((apName || 'Arılık') + ' · tartı'));
        noteEl.textContent = 'Tartı odaklı görünüm (delta kg).';
      } else if (view === 'koloni') {
        summaryEl.textContent = hives.length + ' kovan · ' +
          (effectiveMode === 'all' ? 'Tüm kovanlar' : (apName || 'Arılık')) + ' · ' +
          (topic && K ? K.TOPIC_LABEL[topic].toLocaleLowerCase('tr') : 'koloni');
        noteEl.textContent = 'Koloni kayıtları.';
      } else if (effectiveMode === 'apiary' && apiaryFilter) {
        summaryEl.textContent = hives.length + ' kovan · ' + (apName || apiaryFilter);
        noteEl.innerHTML = '<a href="arilik.html?id=' + encodeURIComponent(apiaryFilter) + '">← Arılık detayı</a>' +
          ' · <a href="ariliklar.html">Tüm arılıklar</a>';
      } else {
        summaryEl.textContent = hives.length + ' kovan · Tüm kovanlar';
        noteEl.textContent = 'Kayıtlı kovanlar. Arılık detayından süzebilirsiniz.';
      }

      modeSwitchEl.innerHTML =
        '<a class="' + (effectiveMode === 'all' ? 'active' : '') + '" href="' + pageHref('mode=all') + '">Tüm kovanlar</a>' +
        '<a class="' + (effectiveMode === 'apiary' ? 'active' : '') + '" href="' + pageHref('') + '">Arılıklar</a>';

      if (view === 'koloni' && K) {
        var scopeHives = hives;
        var tab = params.get('tab') === 'queens' ? 'queens' : '';
        var tabHref = function (t) {
          var q = new URLSearchParams(location.search);
          q.delete('hiveId');
          if (!q.get('mode')) q.set('mode', effectiveMode || 'all');
          if (effectiveMode === 'apiary' && apiaryFilter) q.set('apiary', apiaryFilter);
          q.set('topic', 'ana');
          if (t) q.set('tab', t); else q.delete('tab');
          return 'kovanlar.html?' + q.toString();
        };
        var recTopic = topic === 'guc' || topic === 'yavru' || topic === 'hastalik' || topic === 'besleme';
        var listTopic = sub === 'kis' ? 'kis' : topic;
        var subHref = function (sb) {
          var q = new URLSearchParams(location.search);
          q.delete('hiveId');
          if (!q.get('mode')) q.set('mode', effectiveMode || 'all');
          if (effectiveMode === 'apiary' && apiaryFilter) q.set('apiary', apiaryFilter);
          if (sb) q.set('sub', sb); else q.delete('sub');
          return 'kovanlar.html?' + q.toString();
        };
        var renderKoloni = function () {
          var fresh = D.loadHives();
          var ids = {};
          scopeHives.forEach(function (h) { ids[h.id] = true; });
          scopeHives = fresh.filter(function (h) { return ids[h.id]; });
          renderGrid(scopeHives);
          var scopeName = effectiveMode === 'all' ? 'Tüm kovanlar' : (apName || 'Arılık');
          if (recTopic) {
            koloniTopEl.innerHTML = (topic === 'guc' || topic === 'besleme')
              ? '<div class="kol-tabs">' +
                '<a class="' + (sub !== 'kis' ? 'on' : '') + '" href="' + subHref('') + '">' + (topic === 'guc' ? 'Güç kayıtları' : 'Besleme kayıtları') + '</a>' +
                '<a class="' + (sub === 'kis' ? 'on' : '') + '" href="' + subHref('kis') + '">Kışlık hazırlık</a></div>'
              : '';
            listEl.innerHTML = K.topicListHtml(listTopic, scopeHives);
            return;
          }
          koloniTopEl.innerHTML = K.summaryHtml(scopeHives, scopeName + ' · ana arı özeti') + BULK_BTN;
          var apNames = {};
          D.loadApiaries().forEach(function (a) { apNames[a.id] = a.name; });
          koloniTopEl.innerHTML += '<div class="kol-tabs">' +
            '<a class="' + (tab !== 'queens' ? 'on' : '') + '" href="' + tabHref('') + '">Kovanlar</a>' +
            '<a class="' + (tab === 'queens' ? 'on' : '') + '" href="' + tabHref('queens') + '">Ana arılar</a></div>';
          if (tab === 'queens') {
            listEl.innerHTML = K.queensListHtml(scopeHives);
            return;
          }
          var allRec = D.records ? D.records.loadAll() : null;
          listEl.innerHTML = scopeHives.map(function (h) {
            return K.hiveCardHtml(h, apNames[h.apiaryId] || '', K.recordChipsHtml ? K.recordChipsHtml(h, allRec) : '');
          }).join('') || '<p class="muted">Kovan bulunamadı.</p>';
        };
        renderKoloni();
        if (!recTopic) bindBulk(effectiveMode === 'apiary' ? apiaryFilter : '', renderKoloni);
        noteEl.textContent = recTopic
          ? (sub === 'kis'
            ? 'Kışlık hazırlık kovan başına tek kayıttır; Koloni gücü ve Besleme aynı kaydı açar. Son güç kaydı Zayıf ise durum «Birleştirilmeli» önerilir; varroa ilacı Hastalık kayıtlarından otomatik okunur, kışlık stok önerisi sonbahar beslemelerinden toplanır.'
            : topic === 'besleme'
            ? 'Her beslemeyi tarih, tür ve miktarla girin; kovan geçmişi ve arılık toplamı burada görünür. Sonbahar beslemeleri kışlık stok önerisine eklenir.'
            : topic === 'guc'
            ? 'Her muayenede arılı, yavrulu, ballı ve polenli çerçeveleri girin; sınıf (Zayıf/Orta/Güçlü) otomatik hesaplanır ve geçmiş kovan bazında saklanır. Kayıtlar kovan detayı, görevler, uyarılar ve sağlık puanında kullanılır.'
            : topic === 'yavru'
              ? 'Anasız işaretlenirse görev ve uyarı otomatik açılır; üşümüş yavru kovanı «zayıf koloni» yapar ve «Birleştir veya çerçeve azalt» görevi önerilir.'
              : 'Her hastalık ayrı kayıttır. İlaç bekleme süresi dolmadan hasat yapmayın; Amerikan yavru çürüğü ihbarı zorunludur. Kayıtlar sağlık puanını ve uyarıları etkiler. Kovanı açınca «🔍 Hastalık tahmini (kesin değil)» ile rehberli fotoğraf ve belirti listesi kullanılabilir.')
          : 'Irk, ana arı yaşı ve koloni özellikleri burada düzenlenir; kovan detayı, arılıklar, görevler ve raporlar bu kaydı okur. Renk: yılın son hanesi 1/6 beyaz, 2/7 sarı, 3/8 kırmızı, 4/9 yeşil, 5/0 mavi.';
        listEl.addEventListener('click', function (e) {
          if (e.target.closest && e.target.closest('a')) return;
          var row = e.target.closest ? e.target.closest('.kr-row') : null;
          if (row) { K.openRecordSheet(row.getAttribute('data-topic'), row.getAttribute('data-hive'), renderKoloni); return; }
          var card = e.target.closest ? e.target.closest('.kol-card') : null;
          if (!card) return;
          K.openEditor(card.getAttribute('data-hive'), renderKoloni);
        });
        if (editHiveId) {
          var target = document.querySelector('.kol-card[data-hive="' + String(editHiveId).replace(/"/g, '') + '"]');
          if (target && target.scrollIntoView) target.scrollIntoView({ block: 'center' });
          if (recTopic) K.openRecordSheet(listTopic, editHiveId, renderKoloni);
          else K.openEditor(editHiveId, renderKoloni);
        }
        return;
      }

      if (view === '' && window.SuperAriKovanAra) {
        var kvHost2 = document.getElementById('kvSearch');
        kvHost2.hidden = false;
        var allH = D.loadHives();
        if (effectiveMode === 'apiary' && apiaryFilter && K && K.setLastApiary) K.setLastApiary(apiaryFilter);
        window.SuperAriKovanAra.create({
          host: kvHost2,
          hives: function () { return hives; },
          allHives: function () { return allH; },
          apiaryId: function () { return effectiveMode === 'apiary' && apiaryFilter ? apiaryFilter : (K && K.lastApiary ? K.lastApiary() : ''); },
          onChange: function (res) {
            listEl.innerHTML = res.map(renderHiveCard).join('') || '<p class="muted">' + (hives.length ? 'Eşleşen kovan yok.' : 'Kovan bulunamadı.') + '</p>';
          }
        });
        return;
      }
      listEl.innerHTML = hives.map(renderHiveCard).join('') || '<p class="muted">Kovan bulunamadı.</p>';
    })();
  </script>
