<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kovanlar · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
</head>
<body>
  <main class="wrap">
    <div class="nav">
      <a class="chip" href="ana.html">← Ana</a>
      <a class="chip" href="arici.html">Arıcı</a>
      <a class="chip" href="ayarlar.html">Ayarlar</a>
    </div>
    <div class="brand">
      <div class="brand-badge">🐝</div>
      <div>
        <h1>SüperArı</h1>
        <p id="pageSub">Kovanlar</p>
      </div>
    </div>

    <section class="card stack">
      <h2 style="margin:0;" id="pageTitle">Kovanlar</h2>
      <p class="muted" id="summary">Demo kovan listesi…</p>
      <div class="list" id="hive-list"></div>
      <div class="note" id="pageNote">Statik demo. Canlı API bağlandığında burada listelenir.</div>
    </section>
  </main>
  <script src="demo-data.js"></script>
  <script src="sensor-health.js"></script>
  <script>
    (function () {
      var D = window.SuperAriDemo;
      if (!D) return;
      var params = new URLSearchParams(location.search);
      var view = (params.get('view') || '').toLowerCase();
      var focusId = params.get('id');
      var listEl = document.getElementById('hive-list');
      var titleEl = document.getElementById('pageTitle');
      var subEl = document.getElementById('pageSub');
      var summaryEl = document.getElementById('summary');
      var noteEl = document.getElementById('pageNote');

      var titles = {
        tarti: 'Tartı',
        saglik: 'Sağlık',
        koloni: 'Koloni',
        ariliklar: 'Arılıklar',
        '': 'Kovanlar'
      };
      var label = titles[view] != null ? titles[view] : 'Kovanlar';
      titleEl.textContent = label;
      subEl.textContent = label;

      if (view === 'saglik') {
        location.replace('saglik.html');
        return;
      }

      if (view === 'ariliklar') {
        /* Ana tile + legacy link → Hardal list (FAB Arılık ekle + detay) */
        location.replace('ariliklar.html');
        return;
      }

      if (view === 'arilik') {
        var focusApiary = params.get('apiary');
        if (focusApiary) {
          location.replace('arilik.html?id=' + encodeURIComponent(focusApiary));
          return;
        }
        location.replace('ariliklar.html');
        return;
      }

      var hives = D.loadHives ? D.loadHives().slice() : D.hives.slice();
      var apiaryFilter = params.get('apiary');
      var filterApiary = null;
      if (apiaryFilter) {
        hives = hives.filter(function (h) { return h.apiaryId === apiaryFilter; });
        filterApiary = D.apiaryById(apiaryFilter);
        titleEl.textContent = filterApiary ? (filterApiary.place || filterApiary.name) : 'Arılık kovanları';
        subEl.textContent = 'Kovanlar';
      }
      if (focusId) {
        /* Deep link → kovan detay sayfası */
        location.replace('kovan.html?id=' + encodeURIComponent(focusId));
        return;
      }

      if (view === 'tarti') {
        summaryEl.textContent = hives.length + ' kovan · tartı / ağırlık değişimi';
        noteEl.textContent = 'Tartı odaklı görünüm (delta kg).';
      } else if (view === 'saglik') {
        summaryEl.textContent = hives.length + ' kovan · sağlık skoru';
        noteEl.textContent = 'Sağlık odaklı görünüm.';
      } else if (view === 'koloni') {
        summaryEl.textContent = hives.length + ' kovan · koloni skoru';
        noteEl.textContent = 'Koloni gücü odaklı görünüm.';
      } else if (apiaryFilter) {
        var apName = filterApiary ? filterApiary.name : apiaryFilter;
        summaryEl.textContent = hives.length + ' kovan · ' + apName;
        noteEl.innerHTML = '<a href="arilik.html?id=' + encodeURIComponent(apiaryFilter) + '">← Arılık detayı</a>' +
          ' · <a href="ariliklar.html">Tüm arılıklar</a>';
      } else {
        summaryEl.textContent = hives.length + ' kovan';
        noteEl.textContent = 'Kayıtlı kovanlar. Arılık detayından süzebilirsiniz.';
      }

      listEl.innerHTML = hives.map(function (h) {
        var ap = D.apiaryById(h.apiaryId);
        var place = ap ? ap.name : '—';
        var badge;
        var meta;
        if (view === 'tarti') {
          var sign = h.deltaKg > 0 ? '+' : '';
          badge = sign + h.deltaKg.toFixed(1) + ' kg';
          meta = h.weightKg.toFixed(1) + ' kg · ' + place;
        } else if (view === 'saglik') {
          badge = h.health;
          meta = 'Skor ' + h.healthScore + ' · ' + place;
        } else if (view === 'koloni') {
          badge = String(h.colonyScore);
          meta = 'Koloni · ' + place;
        } else {
          badge = h.weightKg.toFixed(1) + ' kg';
          meta = place + ' · sağlık ' + h.health + ' · oğul ' + h.swarmRisk;
        }
        var tone = h.healthScore < 50 ? 'priority-1' : (h.healthScore < 70 ? 'priority-2' : 'priority-3');
        return (
          '<a class="item-card" id="hive-' + h.id + '" href="kovan.html?id=' + encodeURIComponent(h.id) + '" style="display:block;text-decoration:none;color:inherit;">' +
            '<div class="row">' +
              '<h3>' + h.name + '</h3>' +
              '<span class="badge ' + tone + '">' + badge + '</span>' +
            '</div>' +
            '<div class="meta">' + meta +
              ' · <span onclick="event.preventDefault();event.stopPropagation();location.href=\'petek-tarama.html?hiveId=' + h.id + '\';" style="color:#2b6cb0;text-decoration:underline;cursor:pointer;">Petek tarama</span></div>' +
          '</a>'
        );
      }).join('') || '<p class="muted">Kovan bulunamadı.</p>';
    })();
  </script>
</body>
</html>
