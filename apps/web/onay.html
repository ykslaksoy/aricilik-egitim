<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onay · SüperArı</title>
  <link rel="stylesheet" href="panels.css" />
</head>
<body>
  <main class="wrap">
    <div class="nav">
      <a class="chip" href="kayit.html">← Geri</a>
      <a class="chip" href="index.html">Ana sayfa</a>
    </div>
    <div class="brand">
      <div class="brand-badge">🐝</div>
      <div><h1>SüperArı</h1><p>E-posta onayı</p></div>
    </div>
    <section class="card stack" style="max-width:520px;">
      <h2 style="margin:0;">Onay kodu</h2>
      <p class="muted">E-postanıza gelen 6 haneli kodu girin.</p>
      <form class="stack" data-demo="kurulum.html">
        <label>Onay kodu
          <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required />
        </label>
        <button class="btn" type="submit">Onayla</button>
        <a class="btn secondary" href="giris.html">Girişe dön</a>
      </form>
    </section>
  </main>
  <script src="panels.js"></script>
</body>
</html>
