<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SüperArı · Kâr / zarar</title>
<link rel="stylesheet" href="rapor-common.css" />

</head>
<body>
<div class="phone" id="phone">
  <div class="phone-notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="status-icons"><span>●●●</span><span>LTE</span><span>🔋</span></div>
  </div>
  <div class="screen">
    <div class="brand-strip">Hardal Arıcılık</div>
    <div class="page-head">
      <div>
        <h1>Kâr / zarar</h1>
        <p id="pageSub">Gelir − gider tek bakışta</p>
      </div>
      <div class="nav-chips">
        <a class="back-chip" href="raporlar.html">← Raporlar</a>
        <a class="back-chip" href="ana.html">Ana</a>
      </div>
    </div>
    <div class="filters">
      <label>Sezon
        <select id="seasonSel"></select>
      </label>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card-block">
      <h2>Arılık bazlı</h2>
      <div id="list"></div>
    </section>
    <div class="btn-row">
      <a class="btn secondary" href="giderler.html?tab=ariliklar" style="text-decoration:none">Gider detayı</a>
      <a class="btn secondary" href="rapor-export.html" style="text-decoration:none">CSV dışa aktar</a>
    </div>
    <p class="hint">Gelir: demo bal/balmumu satışları. Gider: Giderler deposundaki kalemler (sezon filtresi May–Nis).</p>
  </div>
  <nav class="tabbar" aria-label="Alt menü">
    <a class="tab" href="ana.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-6v-5H10v5H4z"/></svg>Ana</a><a class="tab" href="bakim.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="12" height="15.5" rx="2"/><path d="M9.5 4.5V3.6h5v.9"/><path d="M9 11l2 2 4-4.2M9 16.5h6"/></svg>Bakım</a><button type="button" class="tab tab-plus" data-quick-record aria-label="Hızlı kayıt"><span class="plus-c" aria-hidden="true">＋</span><span class="plus-l">Kayıt</span></button><a class="tab" href="bugun.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="6" width="15" height="13.5" rx="2"/><path d="M4.5 10h15M9 4v3.5M15 4v3.5"/><circle cx="12" cy="14.6" r="1.8"/></svg>Bugün</a><a class="tab" href="ayarlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 4.5v2.2M12 17.3V19.5M4.5 12h2.2M17.3 12H19.5M7 7l1.6 1.6M15.4 15.4 17 17M17 7l-1.6 1.6M8.6 15.4 7 17"/></svg>Ayarlar</a>
  </nav>
  <div class="home-indicator"></div>
</div>
<script src="demo-data.js?v=koloni-8"></script>
<script src="gider-store.js"></script>
<script src="rapor-store.js?v=koloni-8"></script>
<script>
(function () {
  var R = window.SuperAriRapor;
  if (!R) return;
  var sel = document.getElementById('seasonSel');
  var cur = R.currentSeasonYear();
  [cur, cur - 1].forEach(function (y) {
    var o = document.createElement('option');
    o.value = y; o.textContent = y + ' sezonu'; if (y === cur) o.selected = true;
    sel.appendChild(o);
  });
  function render() {
    var y = Number(sel.value) || cur;
    var pl = R.profitLoss(y);
    var cls = pl.profit >= 0 ? 'pos' : 'neg';
    document.getElementById('stats').innerHTML =
      '<div class="stat"><div class="k">Gelir</div><div class="v pos">' + R.fmtMoney(pl.income) + '</div></div>' +
      '<div class="stat"><div class="k">Gider</div><div class="v neg">' + R.fmtMoney(pl.expense) + '</div></div>' +
      '<div class="stat"><div class="k">Kâr / zarar</div><div class="v ' + cls + '">' + R.fmtMoney(pl.profit) + '</div></div>' +
      '<div class="stat"><div class="k">Marj</div><div class="v ' + cls + '">' +
        (pl.income ? Math.round((pl.profit / pl.income) * 1000) / 10 : 0) + '%</div></div>';
    var maxAbs = Math.max.apply(null, pl.rows.map(function (r) { return Math.abs(r.profit); }).concat([1]));
    document.getElementById('list').innerHTML = pl.rows.map(function (r) {
      var pcls = r.profit >= 0 ? 'pos' : 'neg';
      var pct = Math.round((Math.abs(r.profit) / maxAbs) * 100);
      return '<div class="row-item"><div class="left"><div class="title">' + r.apiaryName + '</div>' +
        '<div class="meta">Gelir ' + R.fmtMoney(r.income) + ' · Gider ' + R.fmtMoney(r.expense) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' +
          (r.profit >= 0 ? 'linear-gradient(90deg,#8ce99a,#2f9e44)' : 'linear-gradient(90deg,#ffa8a8,#e03131)') +
        '"></div></div></div>' +
        '<div class="right ' + pcls + '">' + R.fmtMoney(r.profit) + '</div></div>';
    }).join('') || '<p class="meta">Veri yok.</p>';
  }
  sel.addEventListener('change', render);
  render();
})();
</script>
<script>
(function () {
  var el = document.getElementById('clock');
  if (!el) return;
  function tick() {
    var d = new Date();
    el.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 30000);
})();
</script>
<script src="nav.js?v=koloni-8"></script>
</body>
</html>
